function renderTasksList() {
    const container = document.getElementById('tasksContainer');
    if (!container) return;

    if (taskViewMode === 'categories') {
        const categoryGroups = {};
        tasks.forEach(t => {
            if (!activeCategories.includes(t.category)) return;
            if (!categoryGroups[t.category]) categoryGroups[t.category] = [];
            categoryGroups[t.category].push(t);
        });

        let html = '';
        Object.keys(categoryGroups).forEach(catKey => {
            const cat = CATEGORIES[catKey];
            if (!cat) return;
            html += `
                <div style="margin-bottom:10px;">
                    <div style="font-weight:600;font-size:14px;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px;">
                        <span style="display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;background:${cat.color};">${cat.emoji}</span>
                        ${cat.label}
                    </div>
            `;
            categoryGroups[catKey].forEach(t => {
                const status = getTaskStatusForDate(t, new Date().toISOString().split('T')[0]);
                let statusIcon = '●';
                let statusClass = '';
                if (status === 'done') { statusIcon = '✅'; statusClass = 'task-card--done'; }
                else if (status === 'missed') { statusIcon = '❌'; statusClass = 'task-card--missed'; }
                else if (status === 'planned') { statusIcon = '⏳'; }
                html += `
                    <div class="task-card ${statusClass}" onclick="openTaskEditorForDate(${t.id}, '${new Date().toISOString().split('T')[0]}')" style="border-left-color:${cat.color};">
                        <div class="task-card__left">
                            <span class="task-card__dot task-card__dot--${t.category}"></span>
                            <span class="task-card__title">${t.title}</span>
                        </div>
                        <div class="task-card__right">
                            <span class="task-card__status">${statusIcon}</span>
                            <button class="task-card__delete" onclick="event.stopPropagation(); deleteTask(${t.id})">✕</button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
        });

        container.innerHTML = html || '<div style="text-align:center;padding:30px 0;color:var(--text-secondary);">Нет задач в выбранных категориях</div>';
    } else {
        const sorted = [...tasks].sort((a, b) => (b.lastEdited || 0) - (a.lastEdited || 0));
        if (sorted.length === 0) {
            container.innerHTML = `<div style="text-align:center;padding:30px 0;color:var(--text-secondary);">Нет задач</div>`;
            return;
        }
        let html = '';
        sorted.forEach(t => {
            const status = getTaskStatusForDate(t, new Date().toISOString().split('T')[0]);
            let statusIcon = '●';
            let statusClass = '';
            if (status === 'done') { statusIcon = '✅'; statusClass = 'task-card--done'; }
            else if (status === 'missed') { statusIcon = '❌'; statusClass = 'task-card--missed'; }
            else if (status === 'planned') { statusIcon = '⏳'; }
            const date = new Date(t.lastEdited || t.id);
            const dateStr = date.toLocaleDateString('ru-RU');
            html += `
                <div class="task-card ${statusClass}" onclick="openTaskEditorForDate(${t.id}, '${new Date().toISOString().split('T')[0]}')">
                    <div class="task-card__left">
                        <span class="task-card__dot task-card__dot--${t.category}"></span>
                        <span class="task-card__title">${t.title} <span style="font-size:10px;color:var(--text-secondary);font-weight:400;">${dateStr}</span></span>
                    </div>
                    <div class="task-card__right">
                        <span class="task-card__status">${statusIcon}</span>
                        <button class="task-card__delete" onclick="event.stopPropagation(); deleteTask(${t.id})">✕</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
}

function openTasks() {
    openModal('📋 Задачи', `
        <div style="display:flex;gap:8px;margin-bottom:12px;border-bottom:2px solid var(--border);">
            <button class="tabs__btn" onclick="setTaskView('categories')" style="padding:8px 16px;background:none;border:none;font-size:14px;font-weight:600;cursor:pointer;color:${taskViewMode === 'categories' ? 'var(--accent)' : 'var(--text-secondary)'};border-bottom:3px solid ${taskViewMode === 'categories' ? 'var(--accent)' : 'transparent'};transition:all 0.2s;">📂 Категории</button>
            <button class="tabs__btn" onclick="setTaskView('recent')" style="padding:8px 16px;background:none;border:none;font-size:14px;font-weight:600;cursor:pointer;color:${taskViewMode === 'recent' ? 'var(--accent)' : 'var(--text-secondary)'};border-bottom:3px solid ${taskViewMode === 'recent' ? 'var(--accent)' : 'transparent'};transition:all 0.2s;">🕐 Последние</button>
        </div>
        <div style="margin-bottom:12px;">
            <button class="btn btn--primary btn--full" onclick="openAddTask(); closeModal();">➕ Добавить задачу</button>
        </div>
        <div id="tasksContainer"></div>
    `);
    renderTasksList();
}

function setTaskView(mode) {
    taskViewMode = mode;
    const btns = document.querySelectorAll('.tabs__btn');
    btns.forEach(b => {
        b.style.color = 'var(--text-secondary)';
        b.style.borderBottomColor = 'transparent';
    });
    const target = document.querySelector(`.tabs__btn[onclick*="${mode}"]`);
    if (target) {
        target.style.color = 'var(--accent)';
        target.style.borderBottomColor = 'var(--accent)';
    }
    renderTasksList();
}

function getBMICategory(bmi) {
    if (!bmi) return { label: 'Нет данных', color: '#888', emoji: '❓' };
    if (bmi < 16) return { label: 'Выраженный дефицит', color: '#e17055', emoji: '⚠️' };
    if (bmi < 18.5) return { label: 'Недостаточный вес', color: '#fdcb6e', emoji: '📉' };
    if (bmi < 25) return { label: 'Нормальный вес', color: '#00b894', emoji: '✅' };
    if (bmi < 30) return { label: 'Избыточный вес', color: '#fdcb6e', emoji: '📈' };
    if (bmi < 35) return { label: 'Ожирение I', color: '#e17055', emoji: '⚠️' };
    return { label: 'Ожирение II+', color: '#d63031', emoji: '🚨' };
}

// ============================================
function openProfile() {
    const bmi = user.weight && user.height ? Math.round((user.weight / ((user.height / 100) ** 2)) * 10) / 10 : null;
    const bmiInfo = bmi ? getBMICategory(bmi) : { label: 'Нет данных', color: '#888', emoji: '❓' };
    const stats = { total: tasks.length, completed: tasks.filter(t => t.done.length > 0).length };

    const categoryStats = { body: { count: 0, done: 0 }, soul: { count: 0, done: 0 }, craft: { count: 0, done: 0 }, deeds: { count: 0, done: 0 }, other: { count: 0, done: 0 } };
    tasks.forEach(task => {
        const cat = task.category || 'other';
        if (categoryStats[cat]) {
            categoryStats[cat].count++;
            if (task.done.length > 0) categoryStats[cat].done++;
        }
    });

    const weightLog = user.weightLog || [];
    const sortedWeightLog = [...weightLog].sort((a, b) => a.date.localeCompare(b.date));

    const totalStreak = user.streak.current || 0;
    const maxStreak = user.streak.max || 0;
    const catStreaks = Object.keys(CATEGORIES).map(key => {
        const cat = user.streak.categories[key];
        return {
            key: key,
            label: CATEGORIES[key].emoji,
            current: cat?.current || 0,
            max: cat?.max || 0
        };

    const bmiInfoContent = bmiInfo.label !== 'Нет данных' ?

                <label class="form-label">🎂 Возраст</label>

            </div>

            <div class="form-group">
                <label class="form-label">📏 Рост (см)</label>
                <input class="form-input" id="profileHeight" type="number" value="${user.height}" onchange="updateProfileField('height', parseInt(this.value) || 0)" style="font-size:13px;padding:8px 12px;">
            </div>

                <label class="form-label">⚖️ Вес (кг)</label>

function renderWeightChart(log) {
    if (log.length === 0) {
        return `<div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">📭 Нет записей веса</div>`;
    }

    const maxWeight = Math.max(...log.map(w => w.weight));
    const minWeight = Math.min(...log.map(w => w.weight));
    const range = maxWeight - minWeight || 1;

    let html = `<div style="display:flex;align-items:end;gap:6px;height:150px;padding:10px 0;overflow-x:auto;min-width:100%;">`;
    log.forEach(entry => {
        const height = ((entry.weight - minWeight) / range) * 100 + 10;
        const dateParts = entry.date.split('-');
        const label = dateParts[2] + '.' + dateParts[1];
        html += `
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:30px;">
                <div style="width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--gradient);min-height:4px;height:${Math.max(height, 10)}%;transition:height 0.5s ease;"></div>
                <div style="font-size:8px;font-weight:600;color:var(--text);">${entry.weight}</div>
                <div style="font-size:8px;color:var(--text-secondary);text-align:center;">${label}</div>
            </div>
        `;
    });
    html += `</div>`;
    return html;
}

function logWeight() {
    const weight = prompt('Введите ваш вес (кг):', user.weight || 70);
    if (weight === null) return;
    const val = parseFloat(weight);
    if (isNaN(val) || val < 20 || val > 300) {
        alert('Пожалуйста, введите корректный вес (20-300 кг)');
        return;
    }
    const today = new Date().toISOString().split('T')[0];
    if (!user.weightLog) user.weightLog = [];

    const existing = user.weightLog.find(w => w.date === today);
    if (existing) {
        existing.weight = val;
    } else {
        user.weightLog.push({ date: today, weight: val });
    }
    user.weight = val;
    saveUser();
    updateUserUI();
    openProfile();
    alert('✅ Вес записан!');
}

function openWeightJournal() {
    const log = user.weightLog || [];
    const sorted = [...log].sort((a, b) => a.date.localeCompare(b.date));

    let content = `
        <div style="margin-bottom:12px;">
            <button class="btn btn--success btn--full" onclick="logWeight(); closeModal();">📝 Записать вес</button>
        </div>
        <div style="font-weight:600;font-size:15px;margin-bottom:8px;">📊 График веса</div>
        ${renderWeightChart(sorted)}
        <div style="margin-top:12px;font-weight:600;font-size:15px;">📋 История записей</div>
    `;

    if (sorted.length === 0) {
        content += `<div style="text-align:center;padding:20px;color:var(--text-secondary);">Нет записей</div>`;
    } else {
        let listHtml = '';
        sorted.forEach(entry => {
            listHtml += `
                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:4px;">
                    <span>${entry.date}</span>
                    <span style="font-weight:600;">${entry.weight} кг</span>
                </div>
            `;
        });
        content += listHtml;
    }

    openModal('⚖️ Журнал веса', content);
}

    let noteBlock = '';

        const attachedNotes = notes.filter(n => task.noteIds.includes(n.id));

                                <button onclick="detachNoteFromTask(${task.id}, ${n.id})" style="background:none;border:none;cursor:pointer;font-size:14px;padding:0 4px;color:var(--text-secondary);">✕</button>
                            </div>
                        `).join('')}

            `;
        } else {
            task.noteIds = [];

    }

    const content = `

            <div style="font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;">

            <div style="color:var(--text-secondary);font-size:12px;margin-top:4px;">
                ${CATEGORIES[task.category]?.emoji || ''} ${CATEGORIES[task.category]?.label || ''} · 📅 ${dateStr} ${override ? '⚡ изменено' : ''}
            </div>

        ${noteBlock}

        <div class="form-group">
            <label class="form-label">📂 Категория</label>
            <select class="form-select" id="editorCategory">
                ${catOptions}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">🕐 Время на этот день</label>
            <input class="form-input" id="editorTime" type="time" value="${currentTime}">
        </div>

        <div class="form-group">
            <label class="form-label">⏱️ Длительность на этот день (мин)</label>
            <input class="form-input" id="editorDuration" type="number" value="${currentDuration}" min="1">
        </div>

        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
            <button class="btn btn--primary" style="flex:1;font-size:13px;padding:8px;" onclick="saveTaskEditor(${task.id}, '${dateStr}')">💾 Сохранить</button>
            ${override ? `
                <button class="btn btn--danger" style="flex:0;font-size:13px;padding:8px 12px;" onclick="clearTaskOverride(${task.id}, '${dateStr}'); closeTaskEditor();">↩️</button>
            ` : ''}

            <button class="btn btn--primary" style="flex:1;font-size:13px;padding:8px;" onclick="createNoteForTask(${task.id})">➕ Создать заметку</button>

            ` : ''}

        <div style="display:flex;gap:6px;">
            <button class="btn btn--success" style="flex:1;font-size:13px;padding:8px;" onclick="completeTask(${task.id}, '${dateStr}'); closeTaskEditor();">✅ Выполнить сегодня</button>

function saveTaskEditor(taskId, dateStr) {
    const category = document.getElementById('editorCategory').value;
    const time = document.getElementById('editorTime').value;
    const duration = document.getElementById('editorDuration').value;

    if (!time) { alert('Пожалуйста, выберите время'); return; }
    if (!duration || duration < 1) { alert('Длительность должна быть больше 0'); return; }

    const task = tasks.find(t => t.id === taskId);
    if (task) {
        task.category = category;
        saveTasks();
    }

    updateTaskOverride(taskId, dateStr, time, parseInt(duration));
    closeTaskEditor();
    alert('✅ Изменения сохранены!');
}

function closeTaskEditor() {
    document.getElementById('taskEditorModal').classList.remove('modal-overlay--open');
}

function saveNoteFromEditor(noteId, taskId) {
    const title = document.getElementById('noteTitleInput').value.trim() || 'Без названия';
    const content = document.getElementById('noteContentInput').value.trim();

    if (!content) {
        alert('Заметка не может быть пустой');
        return;
    }

    if (noteId) {
        updateNote(noteId, title, content);
        if (taskId) {
            const note = notes.find(n => n.id === noteId);
            if (note && (!note.taskIds || !note.taskIds.includes(taskId))) {
                attachNoteToTask(noteId, taskId);
            }
        }
    } else {
        createNote(title, content, taskId || null);
    }

    closeNoteEditor();

    if (document.getElementById('taskEditorModal').classList.contains('modal-overlay--open')) {
        const titleEl = document.getElementById('editorTitle');
        const match = titleEl.textContent.match(/📋 (.+) — (\d{4}-\d{2}-\d{2})/);
        if (match) {
            const taskTitle = match[1];
            const dateStr = match[2];
            const task = tasks.find(t => t.title === taskTitle);
            if (task) {
                openTaskEditorForDate(task.id, dateStr);
            }
        }
    } else if (document.getElementById('notesModal').classList.contains('modal-overlay--open')) {
        openNotes();
    }

    renderAll();
    alert('✅ Заметка сохранена!');
}

function createNoteForTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    openNoteEditor(null, taskId);
}

function attachExistingNote(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;

    const attachedIds = task.noteIds || [];
    const availableNotes = notes.filter(n => !attachedIds.includes(n.id));

    if (availableNotes.length === 0) {
        alert('Нет доступных заметок для прикрепления. Создайте новую заметку.');
        return;
    }

    const options = availableNotes.map((n, idx) => `${idx + 1}. ${n.title}`).join('\n');
    const choice = prompt(`Выберите заметку для прикрепления:\n${options}\n\nВведите номер:`);
    if (!choice) return;
    const idx = parseInt(choice) - 1;
    if (idx >= 0 && idx < availableNotes.length) {
        const selectedNote = availableNotes[idx];
        attachNoteToTask(selectedNote.id, taskId);
        if (document.getElementById('taskEditorModal').classList.contains('modal-overlay--open')) {
            const titleEl = document.getElementById('editorTitle');
            const match = titleEl.textContent.match(/📋 (.+) — (\d{4}-\d{2}-\d{2})/);
            if (match) {
                const taskTitle = match[1];
                const dateStr = match[2];
                const taskFound = tasks.find(t => t.title === taskTitle);
                if (taskFound) {
                    openTaskEditorForDate(taskFound.id, dateStr);
                }
            }
        }
        renderAll();
        alert('✅ Заметка прикреплена!');
    } else {
        alert('❌ Неверный номер');
    }
}

function openNoteViewer(noteId) {
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    alert(`📝 ${note.title}\n\n${note.content}`);
}

function handleAddTask() {
    const title = document.getElementById('taskTitle').value.trim();
    const desc = document.getElementById('taskDesc').value.trim();
    const category = document.getElementById('taskCategory').value;
    const duration = document.getElementById('taskDuration').value;
    const time = document.getElementById('taskTime').value;
    const start = document.getElementById('taskStart').value;
    const end = document.getElementById('taskEnd').value;
    const noteId = document.getElementById('taskNoteSelect').value;

    if (!title) { alert('Введите название'); return; }
    if (!duration || duration < 1) { alert('Длительность должна быть > 0'); return; }

    const checks = document.querySelectorAll('#taskSchedule input[type="checkbox"]');
    const schedule = [];
    checks.forEach(cb => { if (cb.checked) schedule.push(parseInt(cb.value)); });
    if (schedule.length === 0) { alert('Выберите хотя бы один день'); return; }

    addTask(title, desc, category, duration, schedule, time, start, end, noteId ? parseInt(noteId) : null);
    closeAddTask();
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskDesc').value = '';

    if (document.getElementById('modalTitle').textContent.includes('Задачи')) {
        openTasks();
    }
    alert('✅ Задача создана!');
}

function handleAddPhoto() {

    if (!input.files || !input.files[0]) {
        alert('📷 Пожалуйста, выберите фото');

        return;
    }

    const btn = document.querySelector('#addPhotoModal .btn');
    if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Сохранение...';
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imageData = e.target.result;
            addGalleryItem(imageData, comment || 'Без комментария');
            closeAddPhoto();
            if (document.getElementById('modalTitle').textContent.includes('Галерея')) {
                openGallery();
            }
        } catch (err) {
            alert('❌ Ошибка при сохранении фото: ' + err.message);
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.textContent = '✅ Сохранить';
            }
        }
    };
    reader.onerror = function() {
        alert('❌ Ошибка при чтении файла');
        if (btn) {
            btn.disabled = false;
            btn.textContent = '✅ Сохранить';
        }
    };
    reader.readAsDataURL(file);
}

function exportData() {
    try {
        const data = {
            user: user,
            tasks: tasks,
            gallery: gallery,
            notes: notes,
            exportedAt: new Date().toISOString(),
            version: '2.0'
        };
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `skillquest_backup_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('✅ Данные успешно экспортированы!');
    } catch (e) {
        alert('❌ Ошибка при экспорте данных: ' + e.message);
    }
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.style.display = 'none';
    document.body.appendChild(input);

    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) {
            document.body.removeChild(input);
            return;
        }
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = JSON.parse(event.target.result);
                if (!data.user || !data.tasks || !data.gallery) {
                    alert('❌ Неверный формат файла. Убедитесь, что это файл резервной копии SkillQuest.');
                    document.body.removeChild(input);
                    return;
                }
                if (!confirm('⚠️ Импорт данных заменит все текущие данные. Продолжить?')) {
                    document.body.removeChild(input);
                    return;
                }
                Object.assign(user, data.user);
                tasks = data.tasks;
                gallery = data.gallery;
                if (data.notes) notes = data.notes;
                saveUser();
                saveTasks();
                saveGallery();
                saveNotes();
                updateUserUI();
                renderAll();
                alert('✅ Данные успешно импортированы!');
                closeModal();
                document.body.removeChild(input);
            } catch (err) {
                alert('❌ Ошибка при импорте данных: ' + err.message);
                document.body.removeChild(input);
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

    setupModeButtons();

                openAddTask();
                return;
            }
            if (page === 'calendar') {
                goToToday();
                return;
            }

        });
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('mainModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    document.getElementById('themeBtn').addEventListener('click', toggleTheme);

    console.log('🚀 SkillQuest 2.0 запущен!');
    console.log('👤 ' + user.name + ', Уровень: ' + user.level);
    console.log('📋 Задач: ' + tasks.length + ', 📸 Фото: ' + gallery.length);
    console.log('📝 Заметок: ' + notes.length);
    console.log('🔥 Стрик: ' + (user.streak.current || 0) + ' дней');
}

init();
});
</script>
