<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Платформа учёта долгов</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eef2f7;
        }

        .logo h1 {
            font-size: 26px;
            color: #0b1e33;
        }
        .logo span {
            color: #2a7de1;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info .name {
            font-weight: 600;
            color: #1a2b3c;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: #eef2f7;
            color: #1a2b3c;
        }
        .btn-primary {
            background: #2a7de1;
            color: white;
        }
        .btn-primary:hover {
            background: #1b62b5;
        }
        .btn-danger {
            background: #e14a4a;
            color: white;
        }
        .btn-danger:hover {
            background: #b52b2b;
        }
        .btn-success {
            background: #20b87a;
            color: white;
        }
        .btn-success:hover {
            background: #159a64;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #2a7de1;
            color: #2a7de1;
        }
        .btn-outline:hover {
            background: #2a7de1;
            color: white;
        }

        /* ===== СТАТИСТИКА ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #f9faff;
            padding: 18px 16px;
            border-radius: 16px;
            border-left: 5px solid #2a7de1;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .stat-card .label {
            font-size: 13px;
            color: #6f7e91;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #0b1e33;
            margin-top: 4px;
        }
        .stat-card.danger {
            border-left-color: #e14a4a;
        }
        .stat-card.success {
            border-left-color: #20b87a;
        }
        .stat-card.warning {
            border-left-color: #f3a83b;
        }

        /* ===== ФИЛЬТРЫ + ДОБАВЛЕНИЕ ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .toolbar .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar .filter-group .btn {
            padding: 8px 18px;
            font-size: 13px;
            background: #f0f4fa;
            color: #1f3348;
        }
        .toolbar .filter-group .btn.active {
            background: #2a7de1;
            color: white;
        }
        .toolbar .search-box {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .toolbar .search-box input {
            padding: 10px 16px;
            border: 2px solid #e0e7ef;
            border-radius: 40px;
            font-size: 14px;
            width: 200px;
            outline: none;
            transition: 0.2s;
        }
        .toolbar .search-box input:focus {
            border-color: #2a7de1;
        }

        /* ===== ТАБЛИЦА ===== */
        .table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #eaeef4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        th {
            background: #f8fafd;
            text-align: left;
            padding: 14px 16px;
            color: #1f3348;
            font-weight: 600;
            border-bottom: 2px solid #e0e7ef;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #edf2f8;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #f9fcff;
        }

        .status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.active {
            background: #fff1e0;
            color: #c97c1e;
        }
        .status.paid {
            background: #e0f7ec;
            color: #10945f;
        }
        .status.overdue {
            background: #fee6e6;
            color: #c92a2a;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .actions .btn {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 30px;
            background: #eef2f7;
        }
        .actions .btn-edit {
            background: #dbeafe;
            color: #1b62b5;
        }
        .actions .btn-edit:hover {
            background: #b9d6fd;
        }
        .actions .btn-delete {
            background: #fee6e6;
            color: #b52b2b;
        }
        .actions .btn-delete:hover {
            background: #fccccc;
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 28px;
            padding: 36px 40px;
            max-width: 540px;
            width: 95%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #0b1e33;
        }
        .modal label {
            font-weight: 600;
            font-size: 14px;
            color: #1f3348;
            display: block;
            margin: 14px 0 4px;
        }
        .modal input,
        .modal select,
        .modal textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e7ef;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .modal input:focus,
        .modal select:focus,
        .modal textarea:focus {
            border-color: #2a7de1;
        }
        .modal textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal .form-row {
            display: flex;
            gap: 12px;
        }
        .modal .form-row > * {
            flex: 1;
        }
        .modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6f7e91;
        }
        .empty .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 700px) {
            .app {
                padding: 16px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .search-box {
                margin-left: 0;
            }
            .toolbar .search-box input {
                width: 100%;
            }
            .modal {
                padding: 24px 18px;
            }
            .modal .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ===== ШАПКА ===== -->
        <header class="header">
            <div class="logo">
                <h1>💰 <span>Долги</span>.Про</h1>
            </div>
            <div class="user-info">
                <span class="name">👤 Александр</span>
                <button class="btn btn-outline" id="logoutBtn">Выйти</button>
            </div>
        </header>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="label">Всего долгов</div>
                <div class="value" id="totalDebts">0</div>
            </div>
            <div class="stat-card warning">
                <div class="label">Активных</div>
                <div class="value" id="activeDebts">0</div>
            </div>
            <div class="stat-card danger">
                <div class="label">Просрочено</div>
                <div class="value" id="overdueDebts">0</div>
            </div>
            <div class="stat-card success">
                <div class="label">Погашено</div>
                <div class="value" id="paidDebts">0</div>
            </div>
        </div>

        <!-- ===== ИНСТРУМЕНТЫ ===== -->
        <div class="toolbar">
            <div class="filter-group" id="filterGroup">
                <button class="btn active" data-filter="all">Все</button>
                <button class="btn" data-filter="active">Активные</button>
                <button class="btn" data-filter="overdue">Просроченные</button>
                <button class="btn" data-filter="paid">Погашенные</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск по названию..." />
                <button class="btn btn-primary" id="addDebtBtn">+ Добавить</button>
            </div>
        </div>

        <!-- ===== ТАБЛИЦА ===== -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Сумма</th>
                        <th>Тип</th>
                        <th>Контрагент</th>
                        <th>Срок</th>
                        <th>Статус</th>
                        <th style="min-width:120px;">Действия</th>
                    </tr>
                </thead>
                <tbody id="debtTableBody">
                    <!-- строки рендерятся через JS -->
                </tbody>
            </table>
        </div>
        <div class="empty" id="emptyState" style="display:none;">
            <span class="emoji">📭</span>
            <p>Нет долгов. Добавьте первый!</p>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО (ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ) ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Новый долг</h2>
            <form id="debtForm">
                <input type="hidden" id="editId" value="" />

                <label for="debtName">Название *</label>
                <input type="text" id="debtName" placeholder="Например: Долг за аренду" required />

                <label for="debtAmount">Сумма (₽) *</label>
                <input type="number" id="debtAmount" placeholder="5000" required min="0" step="0.01" />

                <div class="form-row">
                    <div>
                        <label for="debtType">Тип</label>
                        <select id="debtType">
                            <option value="owed_to_me">Должен мне</option>
                            <option value="i_owe">Я должен</option>
                        </select>
                    </div>
                    <div>
                        <label for="debtCounterparty">Контрагент *</label>
                        <input type="text" id="debtCounterparty" placeholder="Иван Петров" required />
                    </div>
                </div>

                <label for="debtDueDate">Дата возврата *</label>
                <input type="date" id="debtDueDate" required />

                <label for="debtNote">Примечание (опционально)</label>
                <textarea id="debtNote" placeholder="Ссылка на расписку, фото чека..."></textarea>

                <div class="modal-actions">
                    <button type="button" class="btn" id="cancelModalBtn">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="saveDebtBtn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ================================================================
        //  ГЛАВНЫЙ JS — УПРАВЛЕНИЕ ДОЛГАМИ
        //  Храним всё в localStorage, чтобы данные не терялись
        // ================================================================

        // ---- КЛЮЧИ ДЛЯ ХРАНЕНИЯ ----
        const STORAGE_KEY = 'debts_data';
        const USER_KEY = 'debts_user';

        // ---- СОСТОЯНИЕ ----
        let debts = [];
        let currentFilter = 'all';
        let searchQuery = '';

        // ---- DOM-ЭЛЕМЕНТЫ ----
        const tbody = document.getElementById('debtTableBody');
        const emptyState = document.getElementById('emptyState');
        const totalEl = document.getElementById('totalDebts');
        const activeEl = document.getElementById('activeDebts');
        const overdueEl = document.getElementById('overdueDebts');
        const paidEl = document.getElementById('paidDebts');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const debtForm = document.getElementById('debtForm');
        const editId = document.getElementById('editId');
        const debtName = document.getElementById('debtName');
        const debtAmount = document.getElementById('debtAmount');
        const debtType = document.getElementById('debtType');
        const debtCounterparty = document.getElementById('debtCounterparty');
        const debtDueDate = document.getElementById('debtDueDate');
        const debtNote = document.getElementById('debtNote');

        const filterGroup = document.getElementById('filterGroup');
        const searchInput = document.getElementById('searchInput');
        const addBtn = document.getElementById('addDebtBtn');
        const cancelBtn = document.getElementById('cancelModalBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        // ---- ИНИЦИАЛИЗАЦИЯ ----
        function init() {
            loadData();
            render();
            bindEvents();
        }

        // ---- ЗАГРУЗКА / СОХРАНЕНИЕ ----
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try { debts = JSON.parse(stored); } catch (e) { debts = []; }
            } else {
                // Стартовые демо-данные
                debts = [{
                    id: '1',
                    name: 'Аренда офиса',
                    amount: 15000,
                    type: 'owed_to_me',
                    counterparty: 'ООО "Ромашка"',
                    dueDate: '2026-09-15',
                    note: 'Договор аренды №23',
                    status: 'active',
                    createdAt: new Date().toISOString()
                }, {
                    id: '2',
                    name: 'Заём у друга',
                    amount: 5000,
                    type: 'i_owe',
                    counterparty: 'Сергей',
                    dueDate: '2026-08-10',
                    note: 'Вернуть до зарплаты',
                    status: 'overdue',
                    createdAt: new Date().toISOString()
                }, {
                    id: '3',
                    name: 'Продажа ноутбука',
                    amount: 32000,
                    type: 'owed_to_me',
                    counterparty: 'Анна',
                    dueDate: '2026-07-20',
                    note: 'Оплата частями',
                    status: 'paid',
                    createdAt: new Date().toISOString()
                }];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(debts));
        }

        // ---- ГЕНЕРАТОР ID ----
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        // ---- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----
        function getStatus(debt) {
            // Если уже помечен как paid — не меняем
            if (debt.status === 'paid') return 'paid';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(debt.dueDate + 'T00:00:00');
            if (due < today) return 'overdue';
            return 'active';
        }

        function updateStatuses() {
            debts.forEach(d => {
                if (d.status !== 'paid') {
                    d.status = getStatus(d);
                }
            });
        }

        function getFilteredAndSearched() {
            let result = debts.slice();

            // Фильтр
            if (currentFilter !== 'all') {
                result = result.filter(d => d.status === currentFilter);
            }

            // Поиск
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                result = result.filter(d =>
                    d.name.toLowerCase().includes(q) ||
                    d.counterparty.toLowerCase().includes(q) ||
                    d.note.toLowerCase().includes(q)
                );
            }

            return result;
        }

        // ---- РАСЧЁТ СТАТИСТИКИ ----
        function calcStats() {
            const total = debts.length;
            const active = debts.filter(d => d.status === 'active').length;
            const overdue = debts.filter(d => d.status === 'overdue').length;
            const paid = debts.filter(d => d.status === 'paid').length;
            return { total, active, overdue, paid };
        }

        // ---- ОТРИСОВКА ----
        function render() {
            updateStatuses();
            saveData();

            const filtered = getFilteredAndSearched();
            const stats = calcStats();

            // Статистика
            totalEl.textContent = stats.total;
            activeEl.textContent = stats.active;
            overdueEl.textContent = stats.overdue;
            paidEl.textContent = stats.paid;

            // Таблица
            if (filtered.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            tbody.innerHTML = filtered.map(d => {
                const statusLabel = {
                    active: 'Активный',
                    overdue: 'Просрочен',
                    paid: 'Погашен'
                } [d.status] || d.status;

                const typeLabel = d.type === 'owed_to_me' ? 'Должен мне' : 'Я должен';
                const amountStr = d.type === 'owed_to_me' ? `+${d.amount} ₽` : `-${d.amount} ₽`;
                const amountColor = d.type === 'owed_to_me' ? '#20b87a' : '#e14a4a';

                const dueDateFormatted = new Date(d.dueDate + 'T00:00:00').toLocaleDateString('ru-RU');

                return `
                        <tr>
                            <td><strong>${escapeHtml(d.name)}</strong></td>
                            <td style="font-weight:600;color:${amountColor};">${amountStr}</td>
                            <td>${typeLabel}</td>
                            <td>${escapeHtml(d.counterparty)}</td>
                            <td>${dueDateFormatted}</td>
                            <td><span class="status ${d.status}">${statusLabel}</span></td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-edit" data-id="${d.id}">✎</button>
                                    <button class="btn btn-delete" data-id="${d.id}">✕</button>
                                    ${d.status !== 'paid' ? `<button class="btn btn-success mark-paid" data-id="${d.id}">✅</button>` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
            }).join('');

            // Навешиваем события на кнопки в таблице (делегирование)
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => openEditModal(btn.dataset.id));
            });
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteDebt(btn.dataset.id));
            });
            document.querySelectorAll('.mark-paid').forEach(btn => {
                btn.addEventListener('click', () => markAsPaid(btn.dataset.id));
            });
        }

        // ---- ПРОСТАЯ ЗАЩИТА ОТ XSS ----
        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ---- ДЕЙСТВИЯ С ДОЛГАМИ ----
        function deleteDebt(id) {
            if (!confirm('Удалить эту запись?')) return;
            debts = debts.filter(d => d.id !== id);
            saveData();
            render();
        }

        function markAsPaid(id) {
            const debt = debts.find(d => d.id === id);
            if (!debt) return;
            debt.status = 'paid';
            saveData();
            render();
        }

        function openEditModal(id) {
            const debt = debts.find(d => d.id === id);
            if (!debt) return;
            modalTitle.textContent = 'Редактировать долг';
            editId.value = debt.id;
            debtName.value = debt.name;
            debtAmount.value = debt.amount;
            debtType.value = debt.type;
            debtCounterparty.value = debt.counterparty;
            debtDueDate.value = debt.dueDate;
            debtNote.value = debt.note || '';
            modalOverlay.classList.add('open');
        }

        function openCreateModal() {
            modalTitle.textContent = 'Новый долг';
            editId.value = '';
            debtForm.reset();
            debtDueDate.value = new Date().toISOString().slice(0, 10);
            modalOverlay.classList.add('open');
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
        }

        // ---- ОБРАБОТЧИК ФОРМЫ ----
        function handleFormSubmit(e) {
            e.preventDefault();

            const name = debtName.value.trim();
            const amount = parseFloat(debtAmount.value);
            const type = debtType.value;
            const counterparty = debtCounterparty.value.trim();
            const dueDate = debtDueDate.value;
            const note = debtNote.value.trim();

            if (!name || !amount || !counterparty || !dueDate) {
                alert('Заполните все обязательные поля (*)');
                return;
            }

            const editIdVal = editId.value;

            if (editIdVal) {
                // Редактирование
                const idx = debts.findIndex(d => d.id === editIdVal);
                if (idx === -1) return;
                debts[idx] = {
                    ...debts[idx],
                    name,
                    amount,
                    type,
                    counterparty,
                    dueDate,
                    note,
                    status: getStatus({ ...debts[idx], dueDate }) // пересчитаем статус
                };
            } else {
                // Создание
                const newDebt = {
                    id: generateId(),
                    name,
                    amount,
                    type,
                    counterparty,
                    dueDate,
                    note,
                    status: 'active',
                    createdAt: new Date().toISOString()
                };
                newDebt.status = getStatus(newDebt);
                debts.push(newDebt);
            }

            saveData();
            closeModal();
            render();
        }

        // ---- СОБЫТИЯ ----
        function bindEvents() {
            // Фильтры
            filterGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn');
                if (!btn || !btn.dataset.filter) return;
                filterGroup.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });

            // Поиск
            searchInput.addEventListener('input', () => {
                searchQuery = searchInput.value;
                render();
            });

            // Добавить
            addBtn.addEventListener('click', openCreateModal);

            // Отмена в модалке
            cancelBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // Сабмит формы
            debtForm.addEventListener('submit', handleFormSubmit);

            // Выход (имитация)
            logoutBtn.addEventListener('click', () => {
                if (confirm('Выйти из аккаунта? Данные останутся в браузере.')) {
                    alert('Вы вышли (демо-режим)');
                }
            });
        }

        // ---- СТАРТ ----
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
