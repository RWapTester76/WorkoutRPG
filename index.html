<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LVL UP · RPG Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Press+Start+2P&family=Philosopher&family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    /* === Базовые стили и переменные === */
    :root {
      --bg: #03050a; --surface: #0d111c; --primary: #00ffff; --secondary: #ff00ff;
      --text: #e0f0ff; --text-secondary: #aaa; --border: #00ffff55; --shadow: #00ffff33;
      --font: 'Orbitron', sans-serif; --button-bg: transparent; --button-border: #00ffff; --button-text: #00ffff;
    }

    body.theme-tron { }
    body.theme-cyberpunk {
      --bg: #0a0a0a; --surface: #1a1a1a; --primary: #f0e68c; --secondary: #ff007f;
      --text: #ffe5b4; --text-secondary: #aa9f7a; --border: #f0e68c55; --shadow: #ff007f33;
      --font: 'Press Start 2P', monospace; --button-border: #f0e68c; --button-text: #f0e68c;
    }
    body.theme-fantasy {
      --bg: #1a2f1a; --surface: #2c4a2c; --primary: #a4d160; --secondary: #8b5a2b;
      --text: #e0d7b4; --text-secondary: #b0a080; --border: #a4d16055; --shadow: #a4d16033;
      --font: 'Philosopher', serif; --button-border: #a4d160; --button-text: #a4d160;
    }
    body.theme-minimal {
      --bg: #ffffff; --surface: #f5f5f5; --primary: #333333; --secondary: #666666;
      --text: #1a1a1a; --text-secondary: #888; --border: #cccccc; --shadow: #00000011;
      --font: 'Roboto Mono', monospace; --button-border: #333; --button-text: #333;
    }
    body.theme-retro {
      --bg: #2b2b2b; --surface: #3c3c3c; --primary: #f7d51d; --secondary: #e76e55;
      --text: #ffffff; --text-secondary: #c0c0c0; --border: #f7d51d55; --shadow: #e76e5533;
      --font: 'Press Start 2P', monospace; --button-border: #f7d51d; --button-text: #f7d51d;
    }
    body.theme-horror {
      --bg: #1a0000; --surface: #2d1111; --primary: #ff4444; --secondary: #660000;
      --text: #ffcccc; --text-secondary: #aa8080; --border: #ff444455; --shadow: #ff444433;
      --font: 'Courier New', monospace; --button-border: #ff4444; --button-text: #ff4444;
    }
    body.theme-futurism {
      --bg: #e6f7ff; --surface: #ffffff; --primary: #0066cc; --secondary: #00aaff;
      --text: #001f33; --text-secondary: #4d6b80; --border: #0066cc55; --shadow: #0066cc33;
      --font: 'Roboto Mono', monospace; --button-border: #0066cc; --button-text: #0066cc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font);
      transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 80px; /* под нижний бар */
    }

    #app {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      background: var(--surface);
      box-shadow: 0 0 20px var(--shadow), 0 0 5px var(--secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      background: var(--surface);
      border-bottom: 2px solid var(--primary);
      box-shadow: 0 0 15px var(--primary);
      border-radius: 12px 12px 0 0;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--primary);
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--primary);
      color: var(--primary);
      font-size: 1.8rem;
      cursor: pointer;
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
    }

    .main-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem;
    }

    .main-nav.hidden { display: none; }

    .main-nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .main-nav li {
      background: var(--surface);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid var(--primary);
      color: var(--primary);
      font-size: 0.85rem;
      text-shadow: 0 0 5px var(--primary);
    }

    .main-nav li:hover {
      background: var(--primary)22;
      box-shadow: 0 0 12px var(--primary);
    }

    #screenContainer {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }

    /* Нижний бар */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.5rem;
      box-shadow: 0 -2px 15px var(--shadow);
      z-index: 100;
      border-radius: 0 0 12px 12px;
    }

    .bottom-bar button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bottom-bar button.active {
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
    }

    .bottom-bar .add-btn {
      background: var(--primary);
      color: var(--bg);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 15px var(--primary);
      margin-top: -20px;
    }

    /* Карточки */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 0 10px var(--shadow);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary), var(--secondary));
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .xp-bar {
      background: #000;
      height: 10px;
      border-radius: 5px;
      margin: 1rem 0;
      border: 1px solid var(--primary);
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      box-shadow: 0 0 10px var(--secondary);
      border-radius: 5px;
      width: 0%;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin: 1rem 0;
    }

    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.8rem;
      border-radius: 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
    }

    .btn {
      background: var(--button-bg);
      border: 2px solid var(--button-border);
      color: var(--button-text);
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      text-shadow: 0 0 5px var(--button-text);
      box-shadow: 0 0 10px var(--button-border)44;
      display: inline-block;
      margin: 0.2rem;
    }

    .btn:hover {
      background: var(--button-border)22;
      box-shadow: 0 0 20px var(--button-border);
    }

    .btn.active {
      background: var(--primary)22;
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 15px var(--primary);
    }

    /* Квесты */
    .quest-form {
      display: none;
    }

    .quest-form.active {
      display: block;
    }

    .quest-form input,
    .quest-form select,
    .quest-form textarea {
      width: 100%;
      margin-bottom: 0.8rem;
      padding: 0.7rem;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--primary);
      font-family: var(--font);
    }

    .quest-form label {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    .quest-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-left: 6px solid var(--primary);
      padding: 0.8rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
    }

    .guild-badge {
      background: var(--secondary);
      color: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      margin-right: 0.5rem;
    }

    /* Календарь */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .calendar-header h2 {
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
    }

    .calendar-nav {
      display: flex;
      gap: 0.5rem;
    }

    .calendar-nav button {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .view-switcher {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      justify-content: center;
    }

    .view-switcher button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      cursor: pointer;
    }

    .view-switcher button.active {
      background: var(--primary)22;
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .guild-filter {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
    }

    .guild-filter button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.3rem 0.8rem;
      border-radius: 15px;
      cursor: pointer;
    }

    .guild-filter button.active {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    /* Сетка месяца */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-bottom: 1rem;
    }

    .weekday-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      color: var(--text-secondary);
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .day-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem;
      cursor: pointer;
      border-radius: 8px;
      min-height: 50px;
    }

    .day-cell.today {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .day-cell.other-month {
      opacity: 0.4;
    }

    .marker {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      margin: 1px;
    }

    .marker.completed {
      background: var(--secondary);
      box-shadow: 0 0 6px var(--secondary);
    }

    .marker.overdue {
      background: #ff0055;
      box-shadow: 0 0 6px #ff0055;
    }

    .marker.planned {
      background: var(--primary);
    }

    /* Год */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .month-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .month-stat-card:hover {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    /* День с часами */
    .hour-list {
      list-style: none;
      padding: 0;
    }

    .hour-item {
      display: flex;
      gap: 1rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
    }

    .hour-label {
      width: 50px;
      font-weight: bold;
      color: var(--primary);
    }

    /* Заметки */
    .note-card {
      background: var(--surface);
      border-left: 4px solid var(--primary);
      padding: 1rem;
      margin-bottom: 0.8rem;
      border-radius: 8px;
    }

    /* Настройки */
    .settings-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    /* Инфо */
    .glossary-term {
      color: var(--primary);
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .bottom-bar button {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body class="theme-tron">
  <div id="app">
    <header class="app-header">
      <h1 class="logo">LVL UP</h1>
      <button id="menuToggle" class="btn-icon" aria-label="Меню">☰</button>
    </header>

    <nav id="mainNav" class="main-nav hidden">
      <ul>
        <li data-screen="profile">🧙 Профиль</li>
        <li data-screen="calendar">📅 Календарь</li>
        <li data-screen="tasks">📋 Квесты</li>
        <li data-screen="guilds">🛡️ Гильдии</li>
        <li data-screen="goals">🎯 Эпик-квесты</li>
        <li data-screen="notes">📝 Заметки</li>
        <li data-screen="gallery">🖼️ Галерея</li>
        <li data-screen="stats">📊 Статистика</li>
        <li data-screen="settings">⚙️ Настройки</li>
        <li data-screen="info">ℹ️ Инфо</li>
      </ul>
    </nav>

    <main id="screenContainer"></main>

    <!-- Нижний бар -->
    <div class="bottom-bar">
      <button onclick="renderScreen('profile')">👤</button>
      <button onclick="renderScreen('calendar')">📅</button>
      <button class="add-btn" onclick="quickAddTask()">+</button>
      <button onclick="renderScreen('tasks')">📋</button>
      <button onclick="renderScreen('stats')">📊</button>
    </div>
  </div>

  <script>
    // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ХРАНИЛИЩЕ ===
    const CalendarState = {
      currentDate: new Date(),
      view: 'month', // 'year', 'month', 'week', 'day'
      selectedDay: null,
      guildFilter: null
    };

    const GUILDS = [
      { id: 'body', name: 'Тело', icon: '💪', color: '#ff00ff' },
      { id: 'creativity', name: 'Творчество', icon: '🎨', color: '#ff00ff' },
      { id: 'business', name: 'Бизнес', icon: '💼', color: '#ff00ff' },
      { id: 'habits', name: 'Привычки', icon: '🔄', color: '#ff00ff' },
      { id: 'oneoff', name: 'Одноразки', icon: '🗑️', color: '#ff00ff' },
      { id: 'travel', name: 'Путешествия', icon: '✈️', color: '#ff00ff' },
      { id: 'debts', name: 'Долги', icon: '💰', color: '#ff00ff' },
      { id: 'other', name: 'Другое', icon: '📦', color: '#ff00ff' },
      { id: 'nutrition', name: 'Питание', icon: '🍎', color: '#ff00ff' }
    ];

    const Storage = {
      get(key, defaultValue = null) {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : defaultValue;
      },
      set(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }
    };

    const GameState = {
      player: {
        name: 'Александр',
        lvl: 1,
        xp: 0.5,
        streak: 0,
        lastCompletedDate: null,
        get xpToNext() {
          return this.lvl * (this.lvl + 1) / 2;
        },
        get progress() {
          const currentLvlTotal = (this.lvl - 1) * this.lvl / 2;
          const needed = this.xpToNext - currentLvlTotal;
          const currentXp = this.xp - currentLvlTotal;
          return Math.min((currentXp / needed) * 100, 100).toFixed(0);
        }
      },
      tasks: Storage.get('tasks', []),
      notes: Storage.get('notes', []),
      settings: Storage.get('settings', { theme: 'tron' })
    };

    function savePlayer() { Storage.set('player', GameState.player); }
    function saveTasks() { Storage.set('tasks', GameState.tasks); }
    function saveNotes() { Storage.set('notes', GameState.notes); }
    function saveSettings() { Storage.set('settings', GameState.settings); }

    function applyTheme() {
      document.body.className = 'theme-' + GameState.settings.theme;
    }
    applyTheme();

    // === НАВИГАЦИЯ ===
    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');
    const screenContainer = document.getElementById('screenContainer');

    menuToggle.addEventListener('click', () => mainNav.classList.toggle('hidden'));

    document.querySelectorAll('.main-nav li').forEach(item => {
      item.addEventListener('click', (e) => {
        const screen = e.target.dataset.screen;
        renderScreen(screen);
        mainNav.classList.add('hidden');
      });
    });

    function renderScreen(screen) {
      switch (screen) {
        case 'profile': renderProfile(); break;
        case 'calendar': renderCalendar(); break;
        case 'tasks': renderTasks(); break;
        case 'guilds': renderGuilds(); break;
        case 'goals': renderGoals(); break;
        case 'notes': renderNotes(); break;
        case 'gallery': renderGallery(); break;
        case 'stats': renderStats(); break;
        case 'settings': renderSettings(); break;
        case 'info': renderInfo(); break;
        default: renderProfile();
      }
      // Подсветка активной кнопки в нижнем баре
      document.querySelectorAll('.bottom-bar button').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.querySelector(`.bottom-bar button[onclick*="${screen}"]`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    // === ПРОФИЛЬ ===
    function renderProfile() {
      const p = GameState.player;
      const html = `
        <div class="card">
          <div class="avatar">🧙</div>
          <h2 style="text-align:center; color: var(--primary);">${p.name}</h2>
          <p style="text-align:center;">Ур. ${p.lvl} · ${p.xp.toFixed(1)} XP</p>
          <div class="xp-bar">
            <div class="xp-fill" style="width:${p.progress}%"></div>
          </div>
          <p style="text-align:center; font-size:0.8rem;">До след. уровня: ${p.progress}%</p>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value">${GameState.tasks.filter(t => t.completed).length}</span><br>✅ Выполнено
            </div>
            <div class="stat-item">
              <span class="stat-value">${p.streak}</span><br>🔥 Комбо
            </div>
          </div>
        </div>
      `;
      screenContainer.innerHTML = html;
    }

    // === КВЕСТЫ ===
    function renderTasks() {
      const activeTasks = GameState.tasks
        .filter(t => !t.completed)
        .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

      const guildOptions = GUILDS.map(g => `<option value="${g.id}">${g.icon} ${g.name}</option>`).join('');

      const tasksHtml = activeTasks.length === 0
        ? '<p style="text-align:center; opacity:0.7;">Нет активных квестов</p>'
        : activeTasks.map(task => {
            const guild = GUILDS.find(g => g.id === task.category) || GUILDS[7];
            const today = new Date().toISOString().slice(0, 10);
            const isFuture = task.date > today;
            const disableComplete = isFuture || task.completed;
            return `
              <div class="quest-item" style="border-left-color: ${guild.color};">
                <div>
                  <span class="guild-badge" style="background:${guild.color};">${guild.icon} ${guild.name}</span>
                  <strong>${task.title}</strong>
                  <div style="font-size:0.8rem; color:var(--text-secondary);">
                    📅 ${task.date} 🕒 ${task.time} · ⏱️ ${task.minutes} мин
                    ${task.note ? `<br>📝 ${task.note}` : ''}
                  </div>
                </div>
                <button ${disableComplete ? 'disabled' : ''} onclick="completeQuest('${task.id}')">✔</button>
              </div>
            `;
          }).join('');

      const html = `
        <button class="btn" onclick="toggleQuestForm()" style="width:100%; margin-bottom:1rem;">➕ Новый квест</button>
        <div id="questForm" class="quest-form card">
          <form onsubmit="addQuest(event)">
            <label>Гильдия</label>
            <select id="questCategory" required>${guildOptions}</select>
            <label>Название</label>
            <input type="text" id="questTitle" required placeholder="Что нужно сделать?">
            <label>Продолжительность (мин)</label>
            <input type="number" id="questMinutes" required min="1" value="30">
            <label>Дата</label>
            <input type="date" id="questDate" required>
            <label>Время</label>
            <input type="time" id="questTime" required>
            <label>Заметка</label>
            <textarea id="questNote" rows="2" placeholder="Детали..."></textarea>
            <button type="submit" class="btn" style="width:100%;">Создать квест</button>
          </form>
        </div>
        <button class="btn" onclick="completeAllToday()" style="width:100%; margin-bottom:1rem;">⚡ Выполнить все сегодня</button>
        <div>${tasksHtml}</div>
      `;
      screenContainer.innerHTML = html;

      const dateInput = document.getElementById('questDate');
      if (dateInput) dateInput.value = new Date().toISOString().slice(0, 10);
      const timeInput = document.getElementById('questTime');
      if (timeInput) timeInput.value = new Date().toTimeString().slice(0, 5);
    }

    window.toggleQuestForm = function() {
      const form = document.getElementById('questForm');
      if (form) form.classList.toggle('active');
    };

    window.addQuest = function(event) {
      event.preventDefault();
      const category = document.getElementById('questCategory').value;
      const title = document.getElementById('questTitle').value.trim();
      const minutes = parseInt(document.getElementById('questMinutes').value, 10);
      const date = document.getElementById('questDate').value;
      const time = document.getElementById('questTime').value;
      const note = document.getElementById('questNote').value.trim();

      if (!title || !date || !time || isNaN(minutes) || minutes <= 0) return;

      const newQuest = {
        id: Date.now().toString(36) + Math.random().toString(36).substring(2),
        category,
        title,
        minutes,
        date,
        time,
        note,
        completed: false,
        dateCompleted: null,
        createdAt: new Date().toISOString()
      };

      GameState.tasks.push(newQuest);
      saveTasks();
      renderTasks();
    };

    window.completeQuest = function(id) {
      const task = GameState.tasks.find(t => t.id === id);
      if (!task || task.completed) return;

      const today = new Date().toISOString().slice(0, 10);
      if (task.date > today) {
        alert('Этот квест запланирован на будущее, выполнить нельзя!');
        return;
      }

      task.completed = true;
      task.dateCompleted = today;

      const gainedXp = task.minutes * 0.01;
      GameState.player.xp += gainedXp;
      checkLevelUp();
      updateStreak(today);

      saveTasks();
      savePlayer();
      renderTasks();
    };

    window.completeAllToday = function() {
      const today = new Date().toISOString().slice(0, 10);
      const tasksToday = GameState.tasks.filter(t => !t.completed && t.date === today);

      if (tasksToday.length === 0) {
        alert('Нет задач на сегодня для выполнения.');
        return;
      }

      tasksToday.forEach(task => {
        task.completed = true;
        task.dateCompleted = today;
        GameState.player.xp += task.minutes * 0.01;
      });

      checkLevelUp();
      updateStreak(today);

      saveTasks();
      savePlayer();
      renderTasks();
    };

    window.quickAddTask = function() {
      const title = prompt('Название квеста:');
      if (!title) return;

      const now = new Date();
      const newQuest = {
        id: Date.now().toString(36) + Math.random().toString(36).substring(2),
        category: 'other',
        title,
        minutes: 30,
        date: now.toISOString().slice(0, 10),
        time: now.toTimeString().slice(0, 5),
        note: '',
        completed: false,
        dateCompleted: null,
        createdAt: new Date().toISOString()
      };

      GameState.tasks.push(newQuest);
      saveTasks();
      renderScreen('tasks');
    };

    function updateStreak(today) {
      const p = GameState.player;
      if (p.lastCompletedDate === today) return;

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().slice(0, 10);

      if (p.lastCompletedDate === yesterdayStr) {
        p.streak += 1;
      } else if (p.lastCompletedDate !== today) {
        p.streak = 1;
      }

      p.lastCompletedDate = today;
      savePlayer();
    }

    function checkLevelUp() {
      const p = GameState.player;
      let neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2;
      while (p.xp >= neededForNext) {
        p.lvl++;
        neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2;
      }
      savePlayer();
    }

    function getGuildColor(categoryId) {
      const guild = GUILDS.find(g => g.id === categoryId);
      return guild ? guild.color : '#ff00ff';
    }

    // === КАЛЕНДАРЬ ===
    window.setCalendarView = function(view) {
      CalendarState.view = view;
      if (view === 'day' && !CalendarState.selectedDay) {
        CalendarState.selectedDay = new Date();
      }
      if (view === 'year') CalendarState.selectedDay = null;
      renderCalendar();
    };

    window.setGuildFilter = function(guildId) {
      CalendarState.guildFilter = guildId;
      renderCalendar();
    };

    window.navigateCalendar = function(delta) {
      const { view, currentDate } = CalendarState;
      if (view === 'year') {
        currentDate.setFullYear(currentDate.getFullYear() + delta);
      } else if (view === 'month') {
        currentDate.setMonth(currentDate.getMonth() + delta);
      } else if (view === 'week') {
        currentDate.setDate(currentDate.getDate() + delta * 7);
      } else if (view === 'day') {
        const d = CalendarState.selectedDay || currentDate;
        d.setDate(d.getDate() + delta);
        CalendarState.selectedDay = new Date(d);
        CalendarState.currentDate = new Date(d);
        renderCalendar();
        return;
      }
      CalendarState.currentDate = new Date(currentDate);
      renderCalendar();
    };

    window.resetCalendarToday = function() {
      CalendarState.currentDate = new Date();
      CalendarState.selectedDay = new Date();
      renderCalendar();
    };

    window.goToDay = function(dateStr) {
      CalendarState.selectedDay = new Date(dateStr);
      CalendarState.view = 'day';
      renderCalendar();
    };

    window.goToMonth = function(monthIndex) {
      CalendarState.currentDate.setMonth(monthIndex);
      CalendarState.view = 'month';
      renderCalendar();
    };

    function getStartOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function getFilteredTasks(filter) {
      let tasks = GameState.tasks;
      if (filter) {
        tasks = tasks.filter(t => t.category === filter);
      }
      return tasks;
    }

    function renderCalendar() {
      const { currentDate, view, selectedDay, guildFilter } = CalendarState;
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      let headerHtml = '';
      if (view === 'year') {
        headerHtml = `<h2>${year}</h2>`;
      } else if (view === 'month') {
        headerHtml = `<h2>${currentDate.toLocaleString('ru', { month: 'long' })} ${year}</h2>`;
      } else if (view === 'week') {
        const start = getStartOfWeek(currentDate);
        const end = new Date(start);
        end.setDate(end.getDate() + 6);
        headerHtml = `<h2>${start.getDate()}–${end.getDate()} ${end.toLocaleString('ru', { month: 'long' })} ${end.getFullYear()}</h2>`;
      } else if (view === 'day') {
        const displayDate = selectedDay || currentDate;
        headerHtml = `<h2>${displayDate.toLocaleDateString('ru', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h2>`;
      }

      const viewSwitcher = `
        <div class="view-switcher">
          <button class="${view === 'year' ? 'active' : ''}" onclick="setCalendarView('year')">Год</button>
          <button class="${view === 'month' ? 'active' : ''}" onclick="setCalendarView('month')">Месяц</button>
          <button class="${view === 'week' ? 'active' : ''}" onclick="setCalendarView('week')">Неделя</button>
          <button class="${view === 'day' ? 'active' : ''}" onclick="setCalendarView('day')">День</button>
        </div>
      `;

      let contentHtml = '';
      if (view === 'year') {
        contentHtml = renderYearView(year, guildFilter);
      } else if (view === 'month') {
        contentHtml = renderMonthView(year, month, guildFilter);
      } else if (view === 'week') {
        contentHtml = renderWeekView(currentDate, guildFilter);
      } else if (view === 'day') {
        contentHtml = renderDayView(selectedDay || currentDate, guildFilter);
      }

      const filterHtml = `
        <div class="guild-filter">
          <button class="${guildFilter === null ? 'active' : ''}" onclick="setGuildFilter(null)">Все</button>
          ${GUILDS.map(g => `
            <button class="${guildFilter === g.id ? 'active' : ''}" onclick="setGuildFilter('${g.id}')" style="border-color: ${g.color};">
              ${g.icon} ${g.name}
            </button>
          `).join('')}
        </div>
      `;

      const html = `
        <div class="calendar-header">
          ${headerHtml}
          <div class="calendar-nav">
            <button onclick="navigateCalendar(-1)">◀</button>
            <button onclick="navigateCalendar(1)">▶</button>
            <button onclick="resetCalendarToday()">Сегодня</button>
          </div>
        </div>
        ${viewSwitcher}
        ${contentHtml}
        ${filterHtml}
      `;
      screenContainer.innerHTML = html;
    }

    function renderYearView(year, filter) {
      const tasks = getFilteredTasks(filter);
      const months = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
      let html = '<div class="year-grid">';
      for (let m = 0; m < 12; m++) {
        const monthStr = `${year}-${String(m + 1).padStart(2, '0')}`;
        const monthTasks = tasks.filter(t => t.date && t.date.startsWith(monthStr));
        const completed = monthTasks.filter(t => t.completed).length;
        const total = monthTasks.length;
        html += `
          <div class="month-stat-card" onclick="goToMonth(${m})">
            <strong>${months[m]}</strong><br>
            ${completed}/${total}<br>
            <small>задач</small>
          </div>
        `;
      }
      html += '</div>';
      return html;
    }

    function renderMonthView(year, month, filter) {
      const tasks = getFilteredTasks(filter);
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDay = firstDay === 0 ? 6 : firstDay - 1;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const currentMonth = today.getMonth();
      const currentYear = today.getFullYear();

      const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      let grid = '<div class="weekday-header">' + weekdays.map(d => `<div>${d}</div>`).join('') + '</div>';
      grid += '<div class="month-grid">';

      for (let i = 0; i < startDay; i++) {
        grid += '<div class="day-cell other-month"></div>';
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = date.toISOString().slice(0, 10);
        const isToday = date.getTime() === today.getTime() && month === currentMonth && year === currentYear;
        const cellClass = `day-cell ${isToday ? 'today' : ''}`;

        const dayTasks = tasks.filter(t => t.date === dateStr);
        const markers = dayTasks.map(task => {
          let cls = 'marker planned';
          if (task.completed) cls = 'marker completed';
          else if (task.date < today.toISOString().slice(0, 10) && !task.completed) cls = 'marker overdue';
          const color = getGuildColor(task.category);
          return `<span class="${cls}" style="background: ${color};"></span>`;
        }).join('');

        grid += `
          <div class="${cellClass}" onclick="goToDay('${dateStr}')">
            <div class="day-number">${day}</div>
            <div class="markers">${markers}</div>
          </div>
        `;
      }

      grid += '</div>';
      return grid;
    }

    function renderWeekView(date, filter) {
      const tasks = getFilteredTasks(filter);
      const startOfWeek = getStartOfWeek(date);
      let html = '<div class="week-list">';
      for (let i = 0; i < 7; i++) {
        const d = new Date(startOfWeek);
        d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().slice(0, 10);
        const dayTasks = tasks.filter(t => t.date === dateStr);
        const dayName = d.toLocaleDateString('ru', { weekday: 'short', day: 'numeric', month: 'short' });

        html += `<div class="card" style="margin-bottom:0.5rem;">
          <h3>${dayName}</h3>
          ${dayTasks.length === 0 ? '<p style="opacity:0.7;">Нет задач</p>' : dayTasks.map(task => {
            const guild = GUILDS.find(g => g.id === task.category) || GUILDS[7];
            return `<div style="display:flex; align-items:center; gap:0.5rem; margin:0.3rem 0;">
              <span class="guild-badge" style="background:${guild.color};">${guild.icon}</span>
              ${task.title} ${task.completed ? '✅' : ''}
            </div>`;
          }).join('')}
        </div>`;
      }
      html += '</div>';
      return html;
    }

    function renderDayView(date, filter) {
      const tasks = getFilteredTasks(filter).filter(t => t.date === date.toISOString().slice(0, 10));
      tasks.sort((a, b) => a.time.localeCompare(b.time));

      let html = '<ul class="hour-list">';
      for (let hour = 0; hour < 24; hour++) {
        const hourStr = String(hour).padStart(2, '0');
        const hourTasks = tasks.filter(t => t.time && t.time.startsWith(hourStr + ':'));
        html += `<li class="hour-item">
          <span class="hour-label">${hourStr}:00</span>
          <span class="hour-tasks">
            ${hourTasks.length === 0 ? '—' : hourTasks.map(t => {
              const guild = GUILDS.find(g => g.id === t.category) || GUILDS[7];
              return `<span style="color:${guild.color}; margin-right:1rem;">${t.title} ${t.completed ? '✅' : ''}</span>`;
            }).join('')}
          </span>
        </li>`;
      }
      html += '</ul>';
      return html;
    }

    // === ЗАМЕТКИ ===
    function renderNotes() {
      const notes = GameState.notes.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
      const listHtml = notes.length === 0
        ? '<p style="text-align:center; opacity:0.7;">Нет заметок</p>'
        : notes.map(note => `
          <div class="note-card">
            <div style="font-weight:bold; color:var(--primary);">${note.title}</div>
            <div style="margin:0.5rem 0;">${note.content.replace(/\n/g, '<br>')}</div>
            <div style="display:flex; gap:0.5rem;">
              <button class="btn" onclick="editNote('${note.id}')" style="padding:0.3rem 0.8rem;">✏️</button>
              <button class="btn" onclick="deleteNote('${note.id}')" style="padding:0.3rem 0.8rem; border-color:#ff0055; color:#ff0055;">🗑️</button>
            </div>
          </div>
        `).join('');

      const html = `
        <button class="btn" onclick="showNoteForm()" style="width:100%; margin-bottom:1rem;">➕ Новая заметка</button>
        <div id="noteForm" class="quest-form card" style="display:none;">
          <input type="text" id="noteTitle" placeholder="Заголовок заметки" required>
          <textarea id="noteContent" rows="4" placeholder="Текст заметки..."></textarea>
          <input type="hidden" id="editNoteId">
          <button class="btn" style="width:100%;" onclick="saveNote()">Сохранить</button>
        </div>
        <div class="notes-list">${listHtml}</div>
      `;
      screenContainer.innerHTML = html;
    }

    window.showNoteForm = function(id = null) {
      const form = document.getElementById('noteForm');
      form.style.display = 'block';
      if (id) {
        const note = GameState.notes.find(n => n.id === id);
        document.getElementById('noteTitle').value = note.title;
        document.getElementById('noteContent').value = note.content;
        document.getElementById('editNoteId').value = id;
      } else {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        document.getElementById('editNoteId').value = '';
      }
    };

    window.saveNote = function() {
      const title = document.getElementById('noteTitle').value.trim();
      const content = document.getElementById('noteContent').value.trim();
      const editId = document.getElementById('editNoteId').value;
      if (!title) return;

      if (editId) {
        const note = GameState.notes.find(n => n.id === editId);
        note.title = title;
        note.content = content;
        note.updatedAt = new Date().toISOString();
      } else {
        GameState.notes.push({
          id: Date.now().toString(36) + Math.random().toString(36).substring(2),
          title,
          content,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      saveNotes();
      renderNotes();
    };

    window.editNote = function(id) {
      showNoteForm(id);
    };

    window.deleteNote = function(id) {
      if (confirm('Удалить заметку?')) {
        GameState.notes = GameState.notes.filter(n => n.id !== id);
        saveNotes();
        renderNotes();
      }
    };

    // === НАСТРОЙКИ ===
    function renderSettings() {
      const themes = [
        { id: 'tron', name: 'ТРОН' },
        { id: 'cyberpunk', name: 'Киберпанк' },
        { id: 'fantasy', name: 'Фэнтези' },
        { id: 'minimal', name: 'Минимал' },
        { id: 'retro', name: 'Ретро' },
        { id: 'horror', name: 'Хоррор' },
        { id: 'futurism', name: 'Футуризм' }
      ];

      const themeButtons = themes.map(t => `
        <button class="btn ${GameState.settings.theme === t.id ? 'active' : ''}" onclick="setTheme('${t.id}')">${t.name}</button>
      `).join('');

      const html = `
        <div class="settings-section">
          <h3>🎨 Тема оформления</h3>
          <div>${themeButtons}</div>
        </div>
        <div class="settings-section">
          <h3>💾 Данные</h3>
          <button class="btn" onclick="exportData()" style="width:100%; margin-bottom:0.8rem;">📤 Экспорт данных</button>
          <button class="btn" onclick="importDataPrompt()" style="width:100%; margin-bottom:0.8rem;">📥 Импорт данных</button>
          <button class="btn" onclick="clearAllData()" style="width:100%; border-color:#ff0055; color:#ff0055;">🗑️ Очистить все данные</button>
        </div>
        <div class="settings-section">
          <h3>ℹ️ О приложении</h3>
          <p>LVL UP v1.0 · RPG-планировщик<br>Санька и Дэн AI</p>
        </div>
      `;
      screenContainer.innerHTML = html;
    }

    window.setTheme = function(themeId) {
      GameState.settings.theme = themeId;
      saveSettings();
      applyTheme();
      renderSettings();
    };

    window.exportData = function() {
      const data = {
        player: GameState.player,
        tasks: GameState.tasks,
        notes: GameState.notes,
        settings: GameState.settings
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lvlup_backup.json';
      a.click();
    };

    window.importDataPrompt = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.player) GameState.player = data.player;
            if (data.tasks) GameState.tasks = data.tasks;
            if (data.notes) GameState.notes = data.notes;
            if (data.settings) GameState.settings = data.settings;
            savePlayer();
            saveTasks();
            saveNotes();
            saveSettings();
            applyTheme();
            alert('Данные импортированы!');
            renderScreen('profile');
          } catch (ex) {
            alert('Ошибка импорта файла.');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    };

    window.clearAllData = function() {
      if (confirm('Удалить ВСЕ данные? Это действие необратимо.')) {
        localStorage.clear();
        location.reload();
      }
    };

    // === ИНФО ===
    function renderInfo() {
      const html = `
        <div class="card">
          <h2>📖 Глоссарий</h2>
          <p><span class="glossary-term">Гильдия</span> — категория задач (Тело, Творчество, Бизнес и др.). У каждой гильдии свой цвет и иконка.</p>
          <p><span class="glossary-term">Квест</span> — задача с названием, датой, временем и продолжительностью. Выполнение даёт опыт.</p>
          <p><span class="glossary-term">XP (опыт)</span> — начисляется за выполнение квестов: <em>минуты × 0.01</em>. Накопление XP повышает уровень.</p>
          <p><span class="glossary-term">LVL (уровень)</span> — текущий уровень персонажа. Для достижения уровня N нужно суммарно N*(N+1)/2 XP.</p>
          <p><span class="glossary-term">Комбо (стрик)</span> — количество дней подряд с выполненными задачами. Сбрасывается при пропуске дня.</p>
          <p><span class="glossary-term">Эпик-квест (цель)</span> — долгосрочная цель, за выполнение которой даётся +1 XP и возможность загрузить фото в галерею.</p>
          <p><span class="glossary-term">Календарь</span> — четыре уровня: Год, Месяц, Неделя, День. На каждом уровне видны маркеры задач (цвета гильдий).</p>
          <p><span class="glossary-term">Фильтр гильдий</span> — в календаре можно выбрать одну гильдию, чтобы видеть задачи только этой категории.</p>
          <p><span class="glossary-term">Нижний бар</span> — быстрый доступ: Профиль, Календарь, быстрое создание квеста (+), Квесты, Статистика.</p>
        </div>
      `;
      screenContainer.innerHTML = html;
    }

    // === ЗАГЛУШКИ ===
    function renderGuilds() {
      screenContainer.innerHTML = `<h2>🛡️ Гильдии</h2>${GUILDS.map(g => `<p>${g.icon} ${g.name}</p>`).join('')}<p>Кастомизация в разработке.</p>`;
    }
    function renderGoals() {
      screenContainer.innerHTML = '<h2>🎯 Эпик-квесты</h2><p>Функционал целей скоро появится.</p>';
    }
    function renderGallery() {
      screenContainer.innerHTML = '<h2>🖼️ Галерея</h2><p>Загрузка фото будет позже.</p>';
    }
    function renderStats() {
      screenContainer.innerHTML = '<h2>📊 Статистика</h2><p>Графики и аналитика в разработке.</p>';
    }

    // === ИНИЦИАЛИЗАЦИЯ ===
    const savedPlayer = Storage.get('player');
    if (savedPlayer) {
      GameState.player = { ...GameState.player, ...savedPlayer };
    }
    renderScreen('profile');
  </script>
</body>
</html>
