<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LVL UP · RPG Planner</title>
<style>
  /* === Сброс и базовые стили === */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  #app {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #16213e;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    background: #0f3460;
    border-bottom: 2px solid #e94560;
  }

  .logo {
    font-size: 1.8rem;
    color: #e94560;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(233,69,96,0.6);
  }

  .btn-icon {
    background: none;
    border: none;
    color: #e0e0e0;
    font-size: 1.8rem;
    cursor: pointer;
  }

  /* Навигация */
  .main-nav {
    background: #0f3460;
    border-bottom: 2px solid #e94560;
    padding: 0.5rem;
  }

  .main-nav.hidden {
    display: none;
  }

  .main-nav ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }

  .main-nav li {
    background: #16213e;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid transparent;
    font-size: 0.9rem;
  }

  .main-nav li:hover {
    border-color: #e94560;
    color: #e94560;
    box-shadow: 0 0 10px rgba(233,69,96,0.4);
  }

  /* Контент */
  #screenContainer {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
  }

  /* Экран профиля (пример) */
  .profile-card {
    background: #0f3460;
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1rem;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #e94560;
    margin: 0 auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
  }

  .xp-bar {
    background: #1a1a2e;
    height: 10px;
    border-radius: 5px;
    margin: 0.5rem 0;
    overflow: hidden;
  }

  .xp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e94560, #ff6b6b);
    border-radius: 5px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin: 1rem 0;
  }

  .stat-item {
    background: #16213e;
    padding: 0.8rem;
    border-radius: 10px;
    text-align: center;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: bold;
    color: #e94560;
  }

  .btn {
    background: #e94560;
    border: none;
    color: white;
    padding: 0.8rem 1.5rem;
    border-radius: 25px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    background: #c23152;
    box-shadow: 0 0 15px rgba(233,69,96,0.5);
  }

  .hidden {
    display: none;
  }

  /* Адаптив для телефона */
  @media (max-width: 480px) {
    .main-nav li {
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
    }
  }
</style>
</head>
<body>
  <div id="app">
    <!-- Шапка -->
    <header class="app-header">
      <h1 class="logo">⚔️ LVL UP</h1>
      <button id="menuToggle" class="btn-icon" aria-label="Меню">☰</button>
    </header>

    <!-- Навигация (боковая панель, скрыта по умолчанию) -->
    <nav id="mainNav" class="main-nav hidden">
      <ul>
        <li data-screen="profile">🧙 Профиль</li>
        <li data-screen="calendar">📅 Календарь</li>
        <li data-screen="tasks">📋 Квесты</li>
        <li data-screen="guilds">🛡️ Гильдии</li>
        <li data-screen="goals">🎯 Эпик-квесты</li>
        <li data-screen="notes">📝 Заметки</li>
        <li data-screen="gallery">🖼️ Галерея</li>
        <li data-screen="stats">📊 Статистика</li>
        <li data-screen="settings">⚙️ Настройки</li>
        <li data-screen="info">ℹ️ Инфо</li>
      </ul>
    </nav>

    <!-- Основной контент -->
    <main id="screenContainer">
      <!-- Контент экранов будет рендериться динамически -->
    </main>
  </div>

<script>
  // === Хранилище (localStorage) ===
  const Storage = {
    get(key, defaultValue = null) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : defaultValue;
    },
    set(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
  };

  // === Игровые данные ===
  const GameState = {
    player: {
      name: 'Александр',
      lvl: 1,
      xp: 0.5,  // текущий XP
      // Суммарный XP для текущего уровня: lvl*(lvl+1)/2
      get xpToNext() {
        const currentTotal = this.lvl * (this.lvl + 1) / 2;
        return currentTotal;
      },
      get progress() {
        const current = this.xp; // уже накоплено на этом уровне
        const needed = this.xpToNext - (this.lvl - 1) * this.lvl / 2; // сколько нужно для этого уровня
        return Math.min((current / needed) * 100, 100).toFixed(0);
      }
    },
    tasks: Storage.get('tasks', []),
    notes: Storage.get('notes', []),
    gallery: Storage.get('gallery', [])
  };

  // === Навигация ===
  const menuToggle = document.getElementById('menuToggle');
  const mainNav = document.getElementById('mainNav');
  const screenContainer = document.getElementById('screenContainer');

  menuToggle.addEventListener('click', () => {
    mainNav.classList.toggle('hidden');
  });

  // Обработчики для пунктов меню
  document.querySelectorAll('.main-nav li').forEach(item => {
    item.addEventListener('click', (e) => {
      const screen = e.target.dataset.screen;
      renderScreen(screen);
      mainNav.classList.add('hidden'); // сворачиваем меню на мобильных
    });
  });

  // === Рендер экранов ===
  function renderScreen(screen) {
    switch (screen) {
      case 'profile': renderProfile(); break;
      case 'calendar': renderCalendar(); break;
      case 'tasks': renderTasks(); break;
      case 'guilds': renderGuilds(); break;
      case 'goals': renderGoals(); break;
      case 'notes': renderNotes(); break;
      case 'gallery': renderGallery(); break;
      case 'stats': renderStats(); break;
      case 'settings': renderSettings(); break;
      case 'info': renderInfo(); break;
      default: renderProfile();
    }
  }

  // Профиль
  function renderProfile() {
    const p = GameState.player;
    const html = `
      <div class="profile-card">
        <div class="avatar">🧙</div>
        <h2>${p.name}</h2>
        <p>Уровень ${p.lvl} · ${p.xp.toFixed(1)} XP</p>
        <div class="xp-bar">
          <div class="xp-fill" style="width: ${p.progress}%;"></div>
        </div>
        <p style="font-size:0.8rem;">До следующего уровня: ${p.progress}%</p>
        <div class="stats-grid">
          <div class="stat-item"><span class="stat-value">${GameState.tasks.length}</span><br>Квестов</div>
          <div class="stat-item"><span class="stat-value">0</span><br>Комбо (дней)</div>
        </div>
        <button class="btn" onclick="completeDemoQuest()">Выполнить тестовый квест</button>
      </div>
    `;
    screenContainer.innerHTML = html;
  }

  // Заглушки для остальных экранов
  function renderCalendar() { screenContainer.innerHTML = '<h2>📅 Календарь</h2><p>Год/Месяц/Неделя/День (в разработке)</p>'; }
  function renderTasks() { screenContainer.innerHTML = '<h2>📋 Квесты</h2><p>Список задач по гильдиям и дате.</p>'; }
  function renderGuilds() { screenContainer.innerHTML = '<h2>🛡️ Гильдии</h2><p>Тело, Творчество, Бизнес и др.</p>'; }
  function renderGoals() { screenContainer.innerHTML = '<h2>🎯 Эпик-квесты</h2><p>Цели с наградой +1 XP</p>'; }
  function renderNotes() { screenContainer.innerHTML = '<h2>📝 Заметки</h2><p>Заметки, можно прикрепить к квесту.</p>'; }
  function renderGallery() { screenContainer.innerHTML = '<h2>🖼️ Галерея</h2><p>Фото успехов после завершения целей.</p>'; }
  function renderStats() { screenContainer.innerHTML = '<h2>📊 Статистика</h2><p>Графики и дашборды (в разработке).</p>'; }
  function renderSettings() { screenContainer.innerHTML = '<h2>⚙️ Настройки</h2><p>Темы, экспорт/импорт, о приложении.</p>'; }
  function renderInfo() { screenContainer.innerHTML = '<h2>ℹ️ Инфо</h2><p>Описание РПГ-системы, стриков, меню.</p>'; }

  // Демо-функция: добавление XP и проверка левелапа
  window.completeDemoQuest = function() {
    const p = GameState.player;
    p.xp += 0.3; // предположим, задача на 30 минут
    Storage.set('player', p);
    checkLevelUp();
    renderScreen('profile');
  };

  function checkLevelUp() {
    const p = GameState.player;
    let neededForCurrent = p.lvl * (p.lvl + 1) / 2; // сумма XP до текущего уровня
    let neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2; // сумма XP до следующего уровня
    // пока суммарный XP >= neededForNext -> левел up
    while (p.xp >= neededForNext) {
      p.lvl++;
      neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2;
    }
    Storage.set('player', p);
  }

  // === Инициализация ===
  // Загружаем сохранённого игрока, если есть
  const savedPlayer = Storage.get('player');
  if (savedPlayer) {
    GameState.player = { ...GameState.player, ...savedPlayer };
  }
  renderScreen('profile');
</script>
</body>
</html>
