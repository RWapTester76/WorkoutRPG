<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал Героя</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            padding-bottom: 70px;
        }
        /* ШАПКА */
        header {
            background: #1a1f2b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d3548;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        header h1 i {
            color: #6c5ce7;
        }
        .badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }
        .xpbar {
            width: 100px;
            height: 6px;
            background: #262d3d;
            border-radius: 20px;
            overflow: hidden;
        }
        .xpbar .fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #a29bfe, #6c5ce7);
            border-radius: 20px;
            transition: width 0.6s;
        }
        .theme-btn {
            background: transparent;
            color: #8892a8;
            border: none;
            padding: 4px 8px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .theme-btn:hover {
            color: #e8edf5;
        }

        /* НАВИГАЦИЯ */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1f2b;
            border-top: 1px solid #2d3548;
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
            z-index: 200;
        }
        nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.55rem;
            color: #8892a8;
            padding: 4px 8px;
            text-decoration: none;
            min-height: 40px;
            justify-content: center;
        }
        nav a i {
            font-size: 1.2rem;
        }
        nav a.active {
            color: #6c5ce7;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 12px 80px;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        .title {
            font-size: 1.2rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title i {
            color: #6c5ce7;
        }

        /* КАЛЕНДАРЬ */
        .cal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cal-head h2 {
            font-weight: 400;
            font-size: 1.1rem;
            min-width: 120px;
            text-align: center;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            background: #1a1f2b;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .cal-grid .wd {
            text-align: center;
            font-weight: 600;
            color: #8892a8;
            padding: 4px 0;
            font-size: 0.7rem;
        }
        .cal-grid .day {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: 500;
            background: #262d3d;
            cursor: pointer;
            font-size: 0.85rem;
            min-height: 28px;
            transition: 0.2s;
        }
        .cal-grid .day:hover {
            background: #313a4f;
        }
        .cal-grid .day.empty {
            background: transparent;
            cursor: default;
        }
        .cal-grid .day.has {
            background: #6c5ce7;
            color: #fff;
        }
        .cal-grid .day.today {
            border: 2px solid #a29bfe;
        }
        .cal-grid .day.sel {
            outline: 3px solid #a29bfe;
            outline-offset: 2px;
        }

        /* КНОПКИ */
        button {
            cursor: pointer;
            border: none;
            background: #6c5ce7;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            min-width: 40px;
            justify-content: center;
        }
        button:hover {
            transform: scale(1.05);
        }
        button.sec {
            background: #262d3d;
            color: #e8edf5;
        }
        button.sec:hover {
            background: #313a4f;
        }
        button.danger {
            background: #e17055;
        }
        button.green {
            background: #00b894;
        }

        /* ЗАПИСИ */
        .records {
            margin-top: 12px;
            background: #1a1f2b;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .records .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .records .head h4 {
            font-weight: 400;
            font-size: 0.95rem;
        }
        .rec {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #2d3548;
            padding: 8px 0;
            gap: 8px;
        }
        .rec:last-child {
            border-bottom: none;
        }
        .rec .c {
            flex: 1;
            min-width: 0;
        }
        .rec .c .t {
            word-break: break-word;
            margin-bottom: 4px;
        }
        .rec .c .m {
            font-size: 0.7rem;
            color: #8892a8;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .rec .c .m .xp {
            color: #a29bfe;
        }
        .rec .acts {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .rec .acts button {
            background: transparent;
            color: #8892a8;
            padding: 2px 6px;
            box-shadow: none;
            font-size: 0.8rem;
            min-height: 28px;
            min-width: 28px;
            border-radius: 6px;
        }
        .rec .acts button:hover {
            background: #262d3d;
            color: #e8edf5;
            transform: none;
        }
        .rec .acts .done {
            color: #00b894;
        }
        .rec .acts .done.active {
            color: #fdcb6e;
        }
        .rec .acts .del {
            color: #e17055;
        }

        /* ЖУРНАЛЫ */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
        }
        .tabs .tab {
            background: #262d3d;
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 2px solid transparent;
        }
        .tabs .tab i {
            font-size: 0.8rem;
        }
        .tabs .tab.active {
            background: #6c5ce7;
            color: #fff;
        }
        .tabs .tab:hover:not(.active) {
            background: #313a4f;
        }

        .jacts {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        /* ПРОФИЛЬ */
        .prof-avatar {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #262d3d;
            background-size: cover;
            background-position: center;
            border: 4px solid #6c5ce7;
            position: relative;
            flex-shrink: 0;
        }
        .avatar .lvl {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #6c5ce7;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            border: 3px solid #0b0e14;
        }

        .prof-info {
            flex: 1;
            min-width: 150px;
        }
        .prof-info h2 {
            font-size: 1.2rem;
        }
        .prof-info .sub {
            color: #8892a8;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }
        .stats .s {
            background: #262d3d;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
        }
        .stats .s .num {
            font-size: 1.2rem;
            font-weight: 700;
            color: #6c5ce7;
        }
        .stats .s .lbl {
            font-size: 0.6rem;
            color: #8892a8;
        }

        .pacts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        /* ЦЕЛИ */
        .goal {
            background: #1a1f2b;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            gap: 8px;
        }
        .goal.done {
            border-left: 4px solid #00b894;
        }
        .goal .info {
            flex: 1;
            min-width: 120px;
        }
        .goal .info .title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .goal .info .meta {
            font-size: 0.75rem;
            color: #8892a8;
        }
        .goal .info .prog {
            margin-top: 4px;
            height: 5px;
            background: #262d3d;
            border-radius: 20px;
            overflow: hidden;
            max-width: 200px;
        }
        .goal .info .prog .fill {
            height: 100%;
            background: linear-gradient(90deg, #a29bfe, #6c5ce7);
            border-radius: 20px;
            transition: width 0.5s;
        }
        .goal .acts {
            display: flex;
            gap: 4px;
        }

        /* ГАЛЕРЕЯ */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        .gallery .item {
            border-radius: 10px;
            overflow: hidden;
            background: #262d3d;
            aspect-ratio: 1/1;
        }
        .gallery .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ГРАФИКИ */
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .chart-box {
            background: #1a1f2b;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .chart-box h4 {
            font-weight: 400;
            margin-bottom: 8px;
            color: #8892a8;
            font-size: 0.9rem;
        }
        .chart-box canvas {
            max-height: 160px;
            width: 100% !important;
        }

        /* МОДАЛКИ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #1a1f2b;
            max-width: 480px;
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }
        .modal .g {
            margin-bottom: 12px;
        }
        .modal .g label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #8892a8;
        }
        .modal .g input,
        .modal .g textarea,
        .modal .g select {
            background: #262d3d;
            border: 2px solid #2d3548;
            color: #e8edf5;
            padding: 10px 14px;
            border-radius: 10px;
            width: 100%;
            font-size: 1rem;
            font-family: inherit;
        }
        .modal .g input:focus,
        .modal .g textarea:focus,
        .modal .g select:focus {
            outline: none;
            border-color: #6c5ce7;
        }
        .modal .g textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal .acts {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal .acts button {
            flex: 1;
            min-width: 80px;
        }

        @media (max-width: 768px) {
            .charts {
                grid-template-columns: 1fr;
            }
            .prof-avatar {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .cal-grid {
                padding: 6px;
                gap: 2px;
            }
            .cal-grid .day {
                font-size: 0.7rem;
                min-height: 24px;
            }
            nav a .lbl {
                display: none;
            }
            nav a i {
                font-size: 1.3rem;
            }
            header h1 span {
                display: none;
            }
            .xpbar {
                width: 70px;
            }
        }

        @media (max-width: 480px) {
            .cal-grid {
                gap: 1px;
                padding: 4px;
            }
            .cal-grid .day {
                font-size: 0.6rem;
                min-height: 20px;
                border-radius: 4px;
            }
            .cal-grid .wd {
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-dragon"></i> <span>Журнал Героя</span></h1>
        <div class="badge">
            <span id="lvlDisplay">Ур. 1</span>
            <div class="xpbar"><div class="fill" id="xpFill"></div></div>
            <button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <main>

        <!-- КАЛЕНДАРЬ -->
        <section class="page active" id="page-calendar">
            <div class="title"><i class="fas fa-calendar-alt"></i> Календарь</div>
            <div class="cal-head">
                <button class="sec" id="prevM"><i class="fas fa-chevron-left"></i></button>
                <h2 id="monthYear">Январь 2024</h2>
                <button class="sec" id="nextM"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="records">
                <div class="head">
                    <h4><i class="fas fa-list-ul"></i> Записи за день</h4>
                    <button id="addDayRec"><i class="fas fa-plus"></i> Добавить</button>
                </div>
                <div id="dayRecs"><p style="color:#8892a8;text-align:center;padding:12px;">Выберите день</p></div>
            </div>
        </section>

        <!-- ЖУРНАЛЫ -->
        <section class="page" id="page-journals">
            <div class="title"><i class="fas fa-book-open"></i> Журналы</div>
            <div class="tabs" id="journalTabs"></div>
            <div class="jacts">
                <button id="addRec"><i class="fas fa-plus"></i> Добавить запись</button>
                <button class="sec" id="refreshJ"><i class="fas fa-sync"></i></button>
            </div>
            <div class="records" id="journalRecs"></div>
        </section>

        <!-- ЦЕЛИ -->
        <section class="page" id="page-goals">
            <div class="title">
                <i class="fas fa-bullseye"></i> Цели
                <button id="addGoal" style="margin-left:auto;"><i class="fas fa-plus"></i> Новая</button>
            </div>
            <div id="goalsList"></div>
        </section>

        <!-- ГРАФИКИ -->
        <section class="page" id="page-charts">
            <div class="title"><i class="fas fa-chart-pie"></i> Графики</div>
            <div class="charts">
                <div class="chart-box"><h4>📈 Активность за месяц</h4><canvas id="lineChart"></canvas></div>
                <div class="chart-box"><h4>📊 Распределение</h4><canvas id="pieChart"></canvas></div>
            </div>
        </section>

        <!-- ГАЛЕРЕЯ -->
        <section class="page" id="page-gallery">
            <div class="title"><i class="fas fa-images"></i> Фотогалерея</div>
            <div class="gallery" id="galleryGrid"></div>
        </section>

        <!-- ПРОФИЛЬ -->
        <section class="page" id="page-profile">
            <div class="title"><i class="fas fa-user-astronaut"></i> Профиль</div>
            <div class="prof-avatar">
                <div class="avatar" id="avatarBox"><div class="lvl" id="avatarLvl">1</div></div>
                <div class="prof-info">
                    <h2 id="profName">Герой</h2>
                    <div class="sub">
                        Уровень <span id="pLvl">1</span> ·
                        XP: <span id="pXp">0</span>/<span id="pXpMax">100</span>
                    </div>
                    <div class="stats">
                        <div class="s"><div class="num" id="sRecs">0</div><div class="lbl">Записей</div></div>
                        <div class="s"><div class="num" id="sGoals">0</div><div class="lbl">Целей</div></div>
                        <div class="s"><div class="num" id="sPhotos">0</div><div class="lbl">Фото</div></div>
                    </div>
                    <div class="pacts">
                        <button id="editProf"><i class="fas fa-pen"></i> Редакт.</button>
                        <button class="sec" id="exportBtn"><i class="fas fa-download"></i> Экспорт</button>
                        <button class="sec" id="importBtn"><i class="fas fa-upload"></i> Импорт</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- НАВИГАЦИЯ -->
    <nav id="mainNav">
        <a href="#calendar" data-page="calendar" class="active"><i class="fas fa-calendar"></i><span class="lbl">Календарь</span></a>
        <a href="#journals" data-page="journals"><i class="fas fa-book"></i><span class="lbl">Журналы</span></a>
        <a href="#goals" data-page="goals"><i class="fas fa-bullseye"></i><span class="lbl">Цели</span></a>
        <a href="#charts" data-page="charts"><i class="fas fa-chart-line"></i><span class="lbl">Графики</span></a>
        <a href="#gallery" data-page="gallery"><i class="fas fa-images"></i><span class="lbl">Галерея</span></a>
        <a href="#profile" data-page="profile"><i class="fas fa-user"></i><span class="lbl">Профиль</span></a>
    </nav>

    <!-- МОДАЛКА ЗАПИСЬ -->
    <div class="modal-overlay" id="recModal">
        <div class="modal">
            <h3><i class="fas fa-pen"></i> Новая запись</h3>
            <div class="g"><label>Текст</label><textarea id="recText" placeholder="Что вы сделали?"></textarea></div>
            <div class="g"><label>Журнал</label><select id="recJournal"></select></div>
            <div class="g"><label>Дата</label><input type="date" id="recDate" /></div>
            <div class="g"><label>Фото</label><input type="file" id="recPhotos" accept="image/*" multiple /></div>
            <div class="acts">
                <button class="sec" id="recCancel">Отмена</button>
                <button id="recSave"><i class="fas fa-save"></i> Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ЦЕЛЬ -->
    <div class="modal-overlay" id="goalModal">
        <div class="modal">
            <h3><i class="fas fa-bullseye"></i> Новая цель</h3>
            <div class="g"><label>Название</label><input type="text" id="goalTitle" placeholder="Например: бегать 3 раза в неделю" /></div>
            <div class="g"><label>Журнал</label><select id="goalJournal"></select></div>
            <div class="g"><label>Целевое значение</label><input type="number" id="goalTarget" min="1" value="3" /></div>
            <div class="g"><label>Срок</label><input type="date" id="goalDeadline" /></div>
            <div class="acts">
                <button class="sec" id="goalCancel">Отмена</button>
                <button id="goalSave"><i class="fas fa-save"></i> Сохранить</button>
            </div>
        </div>
    </div>

    <input type="file" id="importFile" accept=".json" style="display:none" />

    <script>
        // ============================================================
        // ПРОСТЕЙШАЯ РАБОЧАЯ ВЕРСИЯ
        // ============================================================

        // ---------- ДАННЫЕ ----------
        let data = {
            user: { name: 'Герой', level: 1, xp: 0, xpToNext: 100 },
            journals: {
                sport: { id: 'sport', label: 'Спорт', icon: 'fa-dumbbell', records: [] },
                food: { id: 'food', label: 'Питание', icon: 'fa-utensils', records: [] },
                tasks: { id: 'tasks', label: 'Дела', icon: 'fa-check-double', records: [] },
                hobby: { id: 'hobby', label: 'Хобби', icon: 'fa-paint-brush', records: [] },
                travel: { id: 'travel', label: 'Путешествия', icon: 'fa-plane', records: [] },
                debts: { id: 'debts', label: 'Долги', icon: 'fa-hand-holding-usd', records: [] },
                misc: { id: 'misc', label: 'Всякое', icon: 'fa-ellipsis-h', records: [] }
            },
            goals: [],
            gallery: []
        };

        let currentJournal = 'sport';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selectedDate = new Date().toISOString().split('T')[0];

        // ---------- СОХРАНЕНИЕ ----------
        function saveData() {
            localStorage.setItem('heroData', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('heroData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Сохраняем структуру
                    for (let j in data.journals) {
                        if (!parsed.journals[j]) parsed.journals[j] = { ...data.journals[j], records: [] };
                    }
                    data = parsed;
                } catch (e) {}
            }
            // Если нет тестовых данных — добавим
            if (data.journals.sport.records.length === 0) {
                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                data.journals.sport.records.push({
                    id: 'r1',
                    date: today,
                    text: '🏃 Пробежка 5 км',
                    photos: [],
                    done: true,
                    xp: 18
                });
                data.journals.tasks.records.push({
                    id: 'r2',
                    date: yesterday,
                    text: '✅ Сделал отчёт',
                    photos: [],
                    done: true,
                    xp: 15
                });
                data.journals.hobby.records.push({
                    id: 'r3',
                    date: today,
                    text: '🎨 Рисовал скетч',
                    photos: [],
                    done: false,
                    xp: 12
                });
                saveData();
            }
        }

        // ---------- УТИЛИТЫ ----------
        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4); }

        function getAllRecords() {
            let all = [];
            for (let j in data.journals) {
                all = all.concat(data.journals[j].records.map(r => ({ ...r, journalId: j })));
            }
            return all;
        }

        function getRecordsForDate(date) {
            return getAllRecords().filter(r => r.date === date);
        }

        function getRecordsForJournal(jid) {
            return data.journals[jid] ? data.journals[jid].records.slice() : [];
        }

        function totalRecords() { return getAllRecords().length; }

        function totalPhotos() { return data.gallery.length; }

        function calcXP(text) {
            let base = 10 + Math.min(20, Math.floor(text.length / 8));
            if (text.length > 50) base += 5;
            return Math.min(50, base);
        }

        function addXP(amount) {
            data.user.xp += amount;
            while (data.user.xp >= data.user.xpToNext) {
                data.user.xp -= data.user.xpToNext;
                data.user.level++;
                data.user.xpToNext = Math.floor(80 * Math.pow(data.user.level, 1.5));
            }
            saveData();
            updateUI();
        }

        // ---------- ОБНОВЛЕНИЕ UI ----------
        function updateUI() {
            // XP
            const pct = Math.min(100, (data.user.xp / data.user.xpToNext) * 100);
            document.getElementById('xpFill').style.width = pct + '%';
            document.getElementById('lvlDisplay').textContent = 'Ур. ' + data.user.level;

            // Профиль
            document.getElementById('profName').textContent = data.user.name;
            document.getElementById('pLvl').textContent = data.user.level;
            document.getElementById('pXp').textContent = data.user.xp;
            document.getElementById('pXpMax').textContent = data.user.xpToNext;
            document.getElementById('sRecs').textContent = totalRecords();
            document.getElementById('sGoals').textContent = data.goals.length;
            document.getElementById('sPhotos').textContent = totalPhotos();
            document.getElementById('avatarLvl').textContent = data.user.level;

            // Аватар
            document.getElementById('avatarBox').style.backgroundImage =
                `url(https://api.dicebear.com/7.x/avataaars/svg?seed=${data.user.name}&backgroundColor=6c5ce7)`;

            // Календарь, журналы, цели, галерея, графики
            renderCalendar();
            renderJournalTabs();
            renderJournalRecords();
            renderGoals();
            renderGallery();
            renderCharts();
        }

        // ---------- КАЛЕНДАРЬ ----------
        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const firstDayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            grid.innerHTML = '';
            const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            weekdays.forEach(w => {
                const d = document.createElement('div');
                d.className = 'wd';
                d.textContent = w;
                grid.appendChild(d);
            });

            for (let i = 0; i < firstDayOfWeek; i++) {
                const d = document.createElement('div');
                d.className = 'day empty';
                grid.appendChild(d);
            }

            for (let d = 1; d <= lastDay.getDate(); d++) {
                const dateObj = new Date(currentYear, currentMonth, d);
                const dateStr = dateObj.toISOString().split('T')[0];
                const div = document.createElement('div');
                div.className = 'day';
                if (dateStr === new Date().toISOString().split('T')[0]) div.classList.add('today');
                if (dateStr === selectedDate) div.classList.add('sel');
                if (getRecordsForDate(dateStr).length > 0) div.classList.add('has');
                div.textContent = d;
                div.dataset.date = dateStr;
                div.addEventListener('click', function() {
                    selectedDate = this.dataset.date;
                    renderCalendar();
                    renderDayRecords();
                });
                grid.appendChild(div);
            }

            document.getElementById('monthYear').textContent =
                firstDay.toLocaleString('ru', { month: 'long', year: 'numeric' });
            renderDayRecords();
        }

        function renderDayRecords() {
            const container = document.getElementById('dayRecs');
            const records = getRecordsForDate(selectedDate);
            if (!records.length) {
                container.innerHTML = '<p style="color:#8892a8;text-align:center;padding:10px;">Нет записей</p>';
                return;
            }
            container.innerHTML = records.map(r => {
                const j = data.journals[r.journalId];
                return `
              <div class="rec">
                <div class="c">
                  <div class="t">${r.text}</div>
                  <div class="m">
                    <span><i class="fas ${j ? j.icon : 'fa-book'}"></i> ${j ? j.label : '?'}</span>
                    <span class="xp">${r.xp || 0} XP</span>
                    <span>${r.done ? '✅ Выполнено' : '⏳ В процессе'}</span>
                  </div>
                </div>
                <div class="acts">
                  <button class="done ${r.done ? 'active' : ''}" data-id="${r.id}" data-journal="${r.journalId}"><i class="fas ${r.done ? 'fa-undo' : 'fa-check'}"></i></button>
                  <button class="del" data-id="${r.id}" data-journal="${r.journalId}"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            `;
            }).join('');

            container.querySelectorAll('.done').forEach(b => {
                b.addEventListener('click', function() {
                    toggleDone(this.dataset.id, this.dataset.journal);
                });
            });
            container.querySelectorAll('.del').forEach(b => {
                b.addEventListener('click', function() {
                    if (confirm('Удалить?')) deleteRecord(this.dataset.id, this.dataset.journal);
                });
            });
        }

        // ---------- ЖУРНАЛЫ ----------
        function renderJournalTabs() {
            const container = document.getElementById('journalTabs');
            container.innerHTML = '';
            for (let jid in data.journals) {
                const j = data.journals[jid];
                const tab = document.createElement('div');
                tab.className = 'tab' + (jid === currentJournal ? ' active' : '');
                tab.innerHTML = `<i class="fas ${j.icon}"></i> ${j.label}`;
                tab.addEventListener('click', function() {
                    currentJournal = this.dataset.jid;
                    renderJournalTabs();
                    renderJournalRecords();
                });
                tab.dataset.jid = jid;
                container.appendChild(tab);
            }
        }

        function renderJournalRecords() {
            const container = document.getElementById('journalRecs');
            const records = getRecordsForJournal(currentJournal);
            if (!records.length) {
                container.innerHTML = '<p style="color:#8892a8;text-align:center;padding:20px;">Нет записей</p>';
                return;
            }
            records.sort((a, b) => b.date.localeCompare(a.date));
            container.innerHTML = records.map(r => {
                return `
              <div class="rec">
                <div class="c">
                  <div class="t">${r.text}</div>
                  <div class="m">
                    <span><i class="far fa-calendar-alt"></i> ${r.date}</span>
                    <span class="xp">${r.xp || 0} XP</span>
                    <span>${r.done ? '✅ Выполнено' : '⏳ В процессе'}</span>
                  </div>
                </div>
                <div class="acts">
                  <button class="done ${r.done ? 'active' : ''}" data-id="${r.id}" data-journal="${currentJournal}"><i class="fas ${r.done ? 'fa-undo' : 'fa-check'}"></i></button>
                  <button class="del" data-id="${r.id}" data-journal="${currentJournal}"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            `;
            }).join('');

            container.querySelectorAll('.done').forEach(b => {
                b.addEventListener('click', function() {
                    toggleDone(this.dataset.id, this.dataset.journal);
                });
            });
            container.querySelectorAll('.del').forEach(b => {
                b.addEventListener('click', function() {
                    if (confirm('Удалить?')) deleteRecord(this.dataset.id, this.dataset.journal);
                });
            });
        }

        // ---------- ОПЕРАЦИИ С ЗАПИСЯМИ ----------
        function addRecord(jid, text, date, photos, done = false) {
            const xp = calcXP(text);
            const rec = {
                id: genId(),
                date: date || new Date().toISOString().split('T')[0],
                text: text.trim(),
                photos: photos || [],
                done: done,
                xp: xp
            };
            data.journals[jid].records.push(rec);
            (photos || []).forEach(url => {
                data.gallery.push({ id: genId(), url: url });
            });
            addXP(xp);
            saveData();
            updateUI();
        }

        function deleteRecord(id, jid) {
            const j = data.journals[jid];
            if (!j) return;
            const idx = j.records.findIndex(r => r.id === id);
            if (idx === -1) return;
            const rec = j.records[idx];
            if (rec.photos) {
                rec.photos.forEach(url => {
                    const pi = data.gallery.findIndex(p => p.url === url);
                    if (pi !== -1) data.gallery.splice(pi, 1);
                });
            }
            j.records.splice(idx, 1);
            saveData();
            updateUI();
        }

        function toggleDone(id, jid) {
            const j = data.journals[jid];
            if (!j) return;
            const rec = j.records.find(r => r.id === id);
            if (!rec) return;
            rec.done = !rec.done;
            if (rec.done) addXP(5);
            saveData();
            updateUI();
        }

        // ---------- ЦЕЛИ ----------
        function renderGoals() {
            const container = document.getElementById('goalsList');
            if (!data.goals.length) {
                container.innerHTML = '<p style="color:#8892a8;text-align:center;padding:16px;">Нет целей</p>';
                return;
            }
            container.innerHTML = data.goals.map((g, idx) => {
                const prog = Math.min(100, (g.current / g.target) * 100);
                return `
              <div class="goal ${g.done ? 'done' : ''}">
                <div class="info">
                  <div class="title">${g.done ? '✅ ' : '🎯 '}${g.title}</div>
                  <div class="meta">${data.journals[g.journal]?.label || '?'} · ${g.done ? 'Выполнена!' : `${g.current}/${g.target}`}</div>
                  <div class="prog"><div class="fill" style="width:${prog}%"></div></div>
                </div>
                <div class="acts">
                  ${!g.done ? `<button class="sec" data-idx="${idx}" onclick="completeGoal(${idx})"><i class="fas fa-check"></i></button>` : ''}
                  <button class="sec danger" data-idx="${idx}" onclick="deleteGoal(${idx})"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            `;
            }).join('');
        }

        function completeGoal(idx) {
            const g = data.goals[idx];
            if (g && !g.done) {
                g.done = true;
                addXP(50);
                saveData();
                updateUI();
            }
        }

        function deleteGoal(idx) {
            if (confirm('Удалить цель?')) {
                data.goals.splice(idx, 1);
                saveData();
                updateUI();
            }
        }

        function addGoal(title, journal, target, deadline) {
            const current = getRecordsForJournal(journal).length;
            const done = current >= target;
            const goal = {
                id: genId(),
                title: title.trim(),
                journal: journal,
                target: parseInt(target) || 1,
                current: current,
                deadline: deadline || '',
                done: done
            };
            if (done) addXP(50);
            data.goals.push(goal);
            saveData();
            updateUI();
        }

        function updateGoalsProgress() {
            data.goals.forEach(g => {
                const cur = getRecordsForJournal(g.journal).length;
                g.current = cur;
                if (!g.done && cur >= g.target) {
                    g.done = true;
                    addXP(50);
                }
            });
            saveData();
        }

        // ---------- ГАЛЕРЕЯ ----------
        function renderGallery() {
            const container = document.getElementById('galleryGrid');
            if (!data.gallery.length) {
                container.innerHTML = '<p style="color:#8892a8;text-align:center;padding:16px;">Нет фото</p>';
                return;
            }
            container.innerHTML = data.gallery.map(p =>
                `<div class="item"><img src="${p.url}" alt="photo" loading="lazy" /></div>`
            ).join('');
        }

        // ---------- ГРАФИКИ ----------
        let lineChart = null;
        let pieChart = null;

        function renderCharts() {
            const now = new Date();
            const month = now.getMonth();
            const year = now.getFullYear();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const labels = [];
            const counts = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const dateStr = dateObj.toISOString().split('T')[0];
                labels.push(d);
                counts.push(getRecordsForDate(dateStr).length);
            }

            const ctx1 = document.getElementById('lineChart').getContext('2d');
            if (lineChart) lineChart.destroy();
            lineChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Записей',
                        data: counts,
                        borderColor: '#6c5ce7',
                        backgroundColor: '#6c5ce733',
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#6c5ce7',
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1, color: '#8892a8' } },
                        x: { ticks: { color: '#8892a8', maxTicksLimit: 15 } }
                    }
                }
            });

            const jLabels = [];
            const jCounts = [];
            const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#e17055', '#0984e3', '#fd79a8', '#00cec9'];
            for (let j in data.journals) {
                const cnt = data.journals[j].records.length;
                if (cnt > 0) {
                    jLabels.push(data.journals[j].label);
                    jCounts.push(cnt);
                }
            }
            const ctx2 = document.getElementById('pieChart').getContext('2d');
            if (pieChart) pieChart.destroy();
            if (!jLabels.length) {
                pieChart = new Chart(ctx2, {
                    type: 'pie',
                    data: { labels: ['Нет данных'], datasets: [{ data: [1], backgroundColor: ['#444'] }] },
                    options: { plugins: { legend: { display: true, labels: { color: '#8892a8' } } } }
                });
            } else {
                pieChart = new Chart(ctx2, {
                    type: 'pie',
                    data: {
                        labels: jLabels,
                        datasets: [{ data: jCounts, backgroundColor: colors.slice(0, jLabels.length), borderWidth: 2,
                            borderColor: '#0b0e14' }]
                    },
                    options: {
                        plugins: { legend: { position: 'bottom', labels: { color: '#8892a8', padding: 8 } } }
                    }
                });
            }
        }

        // ---------- ЭКСПОРТ / ИМПОРТ ----------
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `journal_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert('Экспорт выполнен!');
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imp = JSON.parse(e.target.result);
                    if (imp.user && imp.journals) {
                        data = imp;
                        for (let j in data.journals) {
                            if (!data.journals[j]) data.journals[j] = { records: [] };
                        }
                        saveData();
                        updateUI();
                        alert('Импорт выполнен!');
                    } else {
                        alert('Неверный формат файла');
                    }
                } catch (err) { alert('Ошибка чтения файла'); }
            };
            reader.readAsText(file);
        }

        // ---------- НАВИГАЦИЯ ----------
        function navigate(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page-' + page);
            if (target) target.classList.add('active');
            document.querySelectorAll('nav a').forEach(a => {
                a.classList.toggle('active', a.dataset.page === page);
            });
            if (page === 'calendar') renderCalendar();
            else if (page === 'journals') { renderJournalTabs();
                renderJournalRecords(); } else if (page === 'goals') renderGoals();
            else if (page === 'charts') renderCharts();
            else if (page === 'gallery') renderGallery();
            else if (page === 'profile') updateUI();
            window.location.hash = page;
        }

        // ---------- МОДАЛКИ ----------
        function openRecordModal(jid, date) {
            document.getElementById('recText').value = '';
            document.getElementById('recDate').value = date || new Date().toISOString().split('T')[0];
            document.getElementById('recPhotos').value = '';
            const sel = document.getElementById('recJournal');
            sel.innerHTML = '';
            for (let j in data.journals) {
                const opt = document.createElement('option');
                opt.value = j;
                opt.textContent = data.journals[j].label;
                if (j === jid) opt.selected = true;
                sel.appendChild(opt);
            }
            document.getElementById('recModal').classList.add('open');
        }

        function closeRecordModal() {
            document.getElementById('recModal').classList.remove('open');
        }

        function openGoalModal() {
            document.getElementById('goalTitle').value = '';
            document.getElementById('goalTarget').value = '3';
            document.getElementById('goalDeadline').value = '';
            const sel = document.getElementById('goalJournal');
            sel.innerHTML = '';
            for (let j in data.journals) {
                const opt = document.createElement('option');
                opt.value = j;
                opt.textContent = data.journals[j].label;
                if (j === currentJournal) opt.selected = true;
                sel.appendChild(opt);
            }
            document.getElementById('goalModal').classList.add('open');
        }

        function closeGoalModal() {
            document.getElementById('goalModal').classList.remove('open');
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            loadData();

            // Навигация
            document.querySelectorAll('nav a').forEach(a => {
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    navigate(this.dataset.page);
                });
            });

            // Календарь
            document.getElementById('prevM').addEventListener('click', function() {
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11;
                    currentYear--; }
                renderCalendar();
            });
            document.getElementById('nextM').addEventListener('click', function() {
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0;
                    currentYear++; }
                renderCalendar();
            });

            // Добавление записи
            document.getElementById('addRec').addEventListener('click', function() {
                openRecordModal(currentJournal, new Date().toISOString().split('T')[0]);
            });
            document.getElementById('addDayRec').addEventListener('click', function() {
                openRecordModal(currentJournal, selectedDate);
            });

            // Сохранение записи
            document.getElementById('recSave').addEventListener('click', function() {
                const text = document.getElementById('recText').value.trim();
                if (!text) { alert('Введите текст'); return; }
                const jid = document.getElementById('recJournal').value;
                const date = document.getElementById('recDate').value;
                const files = document.getElementById('recPhotos').files;
                const urls = [];
                if (files.length) {
                    let loaded = 0;
                    for (let f of files) {
                        const r = new FileReader();
                        r.onload = function(e) {
                            urls.push(e.target.result);
                            loaded++;
                            if (loaded === files.length) {
                                addRecord(jid, text, date, urls);
                                closeRecordModal();
                            }
                        };
                        r.readAsDataURL(f);
                    }
                } else {
                    addRecord(jid, text, date, []);
                    closeRecordModal();
                }
            });
            document.getElementById('recCancel').addEventListener('click', closeRecordModal);

            // Цели
            document.getElementById('addGoal').addEventListener('click', openGoalModal);
            document.getElementById('goalSave').addEventListener('click', function() {
                const title = document.getElementById('goalTitle').value.trim();
                if (!title) { alert('Введите название'); return; }
                const journal = document.getElementById('goalJournal').value;
                const target = parseInt(document.getElementById('goalTarget').value) || 1;
                const deadline = document.getElementById('goalDeadline').value;
                addGoal(title, journal, target, deadline);
                closeGoalModal();
            });
            document.getElementById('goalCancel').addEventListener('click', closeGoalModal);

            // Тема (простая)
            document.getElementById('themeBtn').addEventListener('click', function() {
                document.body.style.background = document.body.style.background === '#0b0e14' ? '#f0f2f5' : '#0b0e14';
                document.body.style.color = document.body.style.color === '#e8edf5' ? '#1a1f2b' : '#e8edf5';
                this.querySelector('i').className = document.body.style.background === '#0b0e14' ? 'fas fa-moon' :
                    'fas fa-sun';
            });

            // Профиль
            document.getElementById('editProf').addEventListener('click', function() {
                const name = prompt('Имя:', data.user.name);
                if (name && name.trim()) {
                    data.user.name = name.trim();
                    saveData();
                    updateUI();
                }
            });

            // Экспорт/Импорт
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', function() {
                document.getElementById('importFile').click();
            });
            document.getElementById('importFile').addEventListener('change', function(e) {
                if (this.files.length) {
                    importData(this.files[0]);
                    this.value = '';
                }
            });

            // Обновление журнала
            document.getElementById('refreshJ').addEventListener('click', function() {
                renderJournalRecords();
            });

            // Закрытие модалок
            document.getElementById('recModal').addEventListener('click', function(e) {
                if (e.target === this) closeRecordModal();
            });
            document.getElementById('goalModal').addEventListener('click', function(e) {
                if (e.target === this) closeGoalModal();
            });

            // Хеш-навигация
            window.addEventListener('hashchange', function() {
                const hash = window.location.hash.replace('#', '') || 'calendar';
                navigate(hash);
            });

            // СТАРТ
            updateGoalsProgress();
            updateUI();
            const initial = window.location.hash.replace('#', '') || 'calendar';
            navigate(initial);

            alert('⚔️ Добро пожаловать, Герой!');
        }

        // Запуск
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
