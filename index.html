
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlowPlan</title>
    <style>
        /* =============================================================
           БАЗА
           ============================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #5B6AF0;
            --primary-light: rgba(91, 106, 240, 0.08);
            --primary-dark: #4A56D4;
            --bg: #F5F6FA;
            --card-bg: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7280;
            --text-light: #9CA3AF;
            --border: #EDEDF0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            --gradient: linear-gradient(135deg, #5B6AF0, #8B9CF7);
        }

        [data-theme="dark"] {
            --bg: #11111D;
            --card-bg: #1A1A2E;
            --text: #EAEAEA;
            --text-secondary: #9CA3AF;
            --text-light: #6B7280;
            --border: rgba(255, 255, 255, 0.06);
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* =============================================================
           ПРИЛОЖЕНИЕ
           ============================================================= */
        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 0 16px 90px;
            background: var(--bg);
            transition: background var(--transition);
        }

        /* =============================================================
           ВКЛАДКИ
           ============================================================= */
        .view {
            display: none;
            animation: fadeIn 0.2s ease;
            padding-top: 12px;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =============================================================
           ШАПКА
           ============================================================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .greeting {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .header-actions button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .header-actions button:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .header-actions button:active {
            transform: scale(0.94);
        }

        /* =============================================================
           НАВИГАЦИЯ (МИНИМАЛИСТИЧНАЯ)
           ============================================================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 6px 0 var(--safe-bottom);
            z-index: 100;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 6px 12px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 0.55rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            min-width: 44px;
        }

        .bottom-nav .nav-item .nav-icon {
            font-size: 1.3rem;
            transition: transform var(--transition);
            line-height: 1;
        }

        .bottom-nav .nav-item .nav-label {
            opacity: 0.7;
            font-size: 0.5rem;
        }

        .bottom-nav .nav-item.active {
            color: var(--primary);
        }

        .bottom-nav .nav-item.active .nav-icon {
            transform: scale(1.05);
        }

        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 2.5px;
            border-radius: 2px;
            background: var(--gradient);
        }

        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            background: #EF4444;
            color: #fff;
            font-size: 0.5rem;
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            line-height: 1.4;
        }

        /* =============================================================
           КАРТОЧКИ
           ============================================================= */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }

        .card-sm {
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        /* =============================================================
           КНОПКИ
           ============================================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 2px 12px rgba(91, 106, 240, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(91, 106, 240, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: var(--primary-light);
            color: var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: #fff;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.06);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.1);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.12);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 6px 10px;
            font-size: 0.75rem;
        }

        .btn-ghost:hover {
            background: var(--border);
        }

        .fab {
            position: fixed;
            bottom: 88px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--gradient);
            color: #fff;
            border: none;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(91, 106, 240, 0.25);
            cursor: pointer;
            transition: all var(--transition);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 28px rgba(91, 106, 240, 0.35);
        }

        .fab:active {
            transform: scale(0.93);
        }

        /* =============================================================
           ЗАДАЧИ
           ============================================================= */
        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }

        .quest-item:active {
            transform: scale(0.98);
        }

        .quest-item.done {
            opacity: 0.45;
        }

        .quest-item.done .quest-title {
            text-decoration: line-through;
        }

        .quest-item .checkbox {
            width: 20px;
            height: 20px;
            min-width: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            background: var(--bg);
        }

        .quest-item .checkbox.checked {
            background: var(--gradient);
            border-color: var(--primary);
        }

        .quest-item .checkbox.checked::after {
            content: '✓';
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .quest-item .quest-content {
            flex: 1;
            min-width: 0;
        }

        .quest-item .quest-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .quest-item .quest-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 3px;
        }

        .quest-item .quest-meta .tag {
            font-size: 0.55rem;
            font-weight: 500;
            padding: 1px 8px;
            border-radius: 20px;
            background: var(--border);
            color: var(--text-secondary);
        }

        .quest-item .quest-meta .tag-guild {
            background: var(--primary-light);
            color: var(--primary);
        }

        .quest-item .quest-actions {
            display: flex;
            gap: 2px;
        }

        .quest-item .quest-actions button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quest-item .quest-actions button:hover {
            background: var(--border);
        }

        .quest-item .quest-actions button.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        /* =============================================================
           МОДАЛКА
           ============================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius) var(--radius) 0 0;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 18px 28px;
            animation: slideUp 0.25s ease;
            border: 1px solid var(--border);
            border-bottom: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--border);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--text-secondary);
            color: #fff;
        }

        .modal form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .modal .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .modal input,
        .modal select,
        .modal textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            transition: all var(--transition);
            width: 100%;
        }

        .modal input:focus,
        .modal select:focus,
        .modal textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 106, 240, 0.08);
        }

        .modal textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 0;
        }

        .modal .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .modal .form-check label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .modal .form-hint {
            font-size: 0.65rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .modal .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .modal .btn-row button {
            flex: 1;
        }

        .modal .btn-row button[type="button"] {
            background: var(--border);
            color: var(--text-secondary);
        }

        .modal .btn-row button[type="button"]:hover {
            background: var(--text-secondary);
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        /* =============================================================
           КАЛЕНДАРЬ
           ============================================================= */
        .calendar-modes {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 4px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .calendar-modes .mode-btn {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .calendar-modes .mode-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 2px 10px rgba(91, 106, 240, 0.2);
        }

        .calendar-modes .mode-btn:hover:not(.active) {
            background: var(--primary-light);
            color: var(--primary);
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.55rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.3px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.8rem;
            font-weight: 500;
            position: relative;
            background: transparent;
        }

        .calendar-day:hover {
            background: var(--primary-light);
        }

        .calendar-day.other-month {
            opacity: 0.2;
        }

        .calendar-day.today {
            background: var(--gradient);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 2px 12px rgba(91, 106, 240, 0.2);
        }

        .calendar-day .day-dots {
            display: flex;
            gap: 2px;
            margin-top: 1px;
        }

        .calendar-day .day-dots .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        .calendar-day .day-photo {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 0.5rem;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .month-nav button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .month-nav button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .month-nav span {
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* =============================================================
           ПРОФИЛЬ
           ============================================================= */
        .profile-cover {
            width: 100%;
            height: 110px;
            border-radius: var(--radius) var(--radius) 0 0;
            background: var(--gradient);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.6;
        }

        .profile-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-cover .cover-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .profile-cover .cover-upload {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .profile-avatar-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            padding: 0 18px;
            margin-top: -36px;
        }

        .profile-avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 3px solid var(--card-bg);
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar .avatar-upload {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            padding: 2px;
            font-size: 0.5rem;
            cursor: pointer;
            display: none;
        }

        .profile-avatar:hover .avatar-upload {
            display: block;
        }

        .profile-name-wrap {
            flex: 1;
            min-width: 0;
            padding-bottom: 4px;
        }

        .profile-name-wrap .name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .profile-name-wrap .title {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .profile-name-wrap .level {
            display: inline-block;
            background: var(--gradient);
            color: #fff;
            padding: 1px 12px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .profile-body {
            padding: 16px 18px 18px;
        }

        .profile-body .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .profile-body .info-grid .item label {
            font-size: 0.55rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-weight: 600;
        }

        .profile-body .info-grid .item input,
        .profile-body .info-grid .item select {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            width: 100%;
            margin-top: 1px;
        }

        .profile-body .info-grid .item input:focus,
        .profile-body .info-grid .item select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .profile-body .bmi-box {
            background: var(--primary-light);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-body .bmi-box .value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
        }

        .profile-body .bmi-box .status {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 50px;
        }

        .status.normal {
            background: #D1FAE5;
            color: #059669;
        }
        .status.underweight {
            background: #FEF3C7;
            color: #D97706;
        }
        .status.overweight {

        .profile-body .weight-add button {

        .profile-body .measure-grid .m-item label {

        .profile-body .measure-grid .m-item input {
            padding: 6px 10px;

            border-radius: var(--radius-sm);

            background: var(--bg);
            color: var(--text);

        /* =============================================================

        .gallery-grid {

        }

        .gallery-item {

        /* =============================================================

            transform: scale(1.04);

        /* =============================================================
           НАСТРОЙКИ
           ============================================================= */
        .settings-group {
            margin-bottom: 16px;
        }

        .settings-group h4 {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }

        .settings-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .settings-options .opt {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all var(--transition);

            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: var(--card-bg);

        .settings-options .opt:hover {

        }

        .settings-options .opt.active {

            box-shadow: 0 0 0 3px rgba(91, 106, 240, 0.1);
        }

        .settings-options .opt .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .settings-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .settings-actions button {
            flex: 1;
            min-width: 80px;
        }

        /* =============================================================
           ГИЛЬДИИ
           ============================================================= */
        .guild-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }

        .guild-card {
            text-align: center;
            padding: 12px;
            transition: all var(--transition);
        }

        .guild-card:active {
            transform: scale(0.96);
        }

        .guild-card .icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin: 0 auto 4px;
        }

        .guild-card .name {
            font-size: 0.7rem;
            font-weight: 600;
        }

        .guild-card .count {
            font-size: 0.55rem;
            color: var(--text-secondary);
        }

        .guild-card .color-picker {
            margin-top: 4px;
        }

        .guild-card .color-picker input {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        /* =============================================================
           УВЕДОМЛЕНИЯ
           ============================================================= */
        .notification {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 400px;
            width: 90%;
            padding: 10px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            z-index: 300;
            text-align: center;
            font-weight: 500;
            display: none;
            animation: notifIn 0.25s ease;
            border-left: 3px solid var(--primary);
            color: var(--text);
            font-size: 0.9rem;
        }

        @keyframes notifIn {
            from {
                opacity: 0;
                transform: translate(-50%, -12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
        }

        .notification.show {
            display: block;
        }

        /* =============================================================
           АДАПТИВ
           ============================================================= */
        @media (min-width: 768px) {
            .app {
                max-width: 600px;
                padding: 0 24px 100px;
            }
            .bottom-nav {
                max-width: 600px;
                border-radius: 16px 16px 0 0;
                padding: 8px 0 var(--safe-bottom);
            }
            .fab {
                right: calc(50% - 300px + 24px);
            }
        }

        @media (min-width: 1024px) {
            .app {
                max-width: 800px;
            }
            .bottom-nav {
                max-width: 800px;
            }
            .fab {
                right: calc(50% - 400px + 24px);
            }
        }

        .badge-count {
            font-size: 0.55rem;
            color: var(--text-secondary);
            background: var(--border);
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* =============================================================
           КАЛЕНДАРЬ: ДЕНЬ
           ============================================================= */
        .day-schedule .hour-block {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .day-schedule .hour-block .hour-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 36px;
            padding-top: 2px;
        }

        .day-schedule .hour-block .hour-events {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .day-schedule .hour-block .hour-events .event {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            background: var(--primary-light);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition);
        }

        .day-schedule .hour-block .hour-events .event:hover {
            transform: translateX(3px);
        }

        .day-schedule .hour-block .hour-events .event.done {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .day-schedule .hour-block .hour-events .event .time {
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        .day-schedule .hour-block .hour-events .event .guild {
            font-size: 0.55rem;
            padding: 1px 6px;
            border-radius: 20px;
            background: var(--card-bg);
            margin-left: auto;
        }

        /* =============================================================
           КАЛЕНДАРЬ: НЕДЕЛЯ
           ============================================================= */
        .week-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .week-grid .week-day {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            cursor: pointer;
        }

        .week-grid .week-day:hover {
            box-shadow: var(--shadow-hover);
            transform: translateX(3px);
        }

        .week-grid .week-day .label {
            min-width: 60px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .week-grid .week-day .label .date {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.6rem;
        }

        .week-grid .week-day .tasks {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .week-grid .week-day .tasks .tag {
            font-size: 0.55rem;
            padding: 1px 6px;
            border-radius: 20px;
            background: var(--primary-light);
            color: var(--primary);
        }

        .week-grid .week-day .tasks .tag.done {
            opacity: 0.3;
            text-decoration: line-through;
        }

        .week-grid .week-day .count {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        /* =============================================================
           КАЛЕНДАРЬ: ГОД
           ============================================================= */
        .year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .year-grid .month-card {
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .year-grid .month-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .year-grid .month-card .name {
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 4px;
        }

        .year-grid .month-card .stats {
            display: flex;
            justify-content: center;
            gap: 6px;
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        .year-grid .month-card .xp {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--primary);
            margin-top: 3px;
        }

        .year-grid .month-card .bar {
            height: 3px;
            border-radius: 2px;
            background: var(--border);
            margin-top: 4px;
            overflow: hidden;
        }

        .year-grid .month-card .bar .fill {
            height: 100%;
            border-radius: 2px;
            background: var(--gradient);
            transition: width 0.4s ease;
        }

        .year-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .year-nav button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .year-nav button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .year-nav span {
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- ===== УВЕДОМЛЕНИЕ ===== -->
        <div id="notification" class="notification"></div>

        <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
        <div class="app" id="appContainer">

            <!-- ===== ВКЛАДКА: ДЕНЬ ===== -->
            <div id="view-day" class="view active">
                <div class="header">
                    <div class="header-left">
                        <div>
                            <div class="greeting" id="greeting">Доброе утро 👋</div>
                            <h1>Сегодня</h1>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button id="themeToggle" onclick="toggleTheme()" title="Тема">🌙</button>
                    </div>
                </div>

                <div id="todayQuests" class="quest-list">
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <p>Нет задач на сегодня</p>
                        <button class="btn btn-primary" onclick="openModal()">+ Создать</button>
                    </div>
                </div>

                <button class="fab" onclick="openModal()">+</button>
            </div>

            <!-- ===== ВКЛАДКА: КАЛЕНДАРЬ ===== -->
            <div id="view-calendar" class="view">
                <div class="header">
                    <div class="header-left">
                        <h1>Календарь</h1>
                    </div>
                    <div class="header-actions">
                        <button onclick="calendarGoToday()" title="Сегодня">📌</button>
                    </div>
                </div>

                <div class="calendar-modes">
                    <button class="mode-btn active" data-mode="day" onclick="setCalendarMode('day')">День</button>
                    <button class="mode-btn" data-mode="week" onclick="setCalendarMode('week')">Неделя</button>
                    <button class="mode-btn" data-mode="month" onclick="setCalendarMode('month')">Месяц</button>
                    <button class="mode-btn" data-mode="year" onclick="setCalendarMode('year')">Год</button>
                </div>

                <div id="calendarContent"></div>
            </div>

            <!-- ===== ВКЛАДКА: ЗАДАЧИ ===== -->
            <div id="view-quests" class="view">
                <div class="header">
                    <div class="header-left">
                        <h1>Задачи</h1>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick="openModal()" style="padding:6px 14px;font-size:0.75rem;border-radius:50px;">+</button>
                    </div>
                </div>

                <div class="filter-bar" id="questFilters"></div>
                <div id="allQuests" class="quest-list"></div>
            </div>

            <!-- ===== ВКЛАДКА: ГАЛЕРЕЯ ===== -->
            <div id="view-gallery" class="view">

                    <div class="header-left">
                        <h1>Галерея</h1>
                    </div>
                    <span class="badge-count" id="galleryCount">0</span>
                </div>
                <div id="galleryGrid" class="gallery-grid"></div>
            </div>

            <!-- ===== ВКЛАДКА: ПРОФИЛЬ ===== -->
            <div id="view-profile" class="view">
                <div class="card" style="padding:0;overflow:hidden;">
                    <!-- Обложка -->
                    <div class="profile-cover" id="profileCover" onclick="document.getElementById('coverInput').click()">
                        <img id="coverPreview" src="" style="display:none;" />
                        <div class="cover-placeholder" id="coverPlaceholder">📷 Обложка</div>
                        <button class="cover-upload">📷</button>
                        <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="uploadCover(event)" />
                    </div>

                    <!-- Аватар + имя -->
                    <div class="profile-avatar-wrapper">
                        <div class="profile-avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()">
                            <span id="avatarEmoji">🧑</span>
                            <img id="avatarPreview" src="" style="display:none;width:100%;height:100%;object-fit:cover;" />
                            <button class="avatar-upload">📷</button>
                            <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(event)" />
                        </div>
                        <div class="profile-name-wrap">
                            <div class="name" id="profileName">Игрок</div>
                            <div class="title" id="profileTitle">⭐ Начинающий</div>
                            <span class="level">Уровень <span id="profileLevelBig">1</span></span>
                        </div>
                    </div>

                    <!-- Тело профиля -->
                    <div class="profile-body">

                                <label>Имя</label>
                                <input id="profileNameInput" placeholder="Имя" />

                            <div class="item">
                                <label>Возраст</label>
                                <input id="profileAge" type="number" placeholder="25" />
                            </div>
                            <div class="item">
                                <label>Пол</label>
                                <select id="profileGender">
                                    <option value="male">Мужской</option>
                                    <option value="female">Женский</option>
                                </select>

                                <label>Рост (см)</label>
                                <input id="profileHeight" type="number" placeholder="175" />

                            <div class="item">
                                <label>Вес (кг)</label>
                                <input id="profileWeight" type="number" placeholder="70" />
                            </div>
                            <div class="item" style="display:flex;align-items:flex-end;">
                                <button class="btn btn-primary" onclick="saveProfileInfo()" style="width:100%;padding:6px;font-size:0.75rem;">Сохранить</button>
                            </div>
                        </div>

                        <!-- BMI -->
                        <div class="bmi-box">
                            <div>
                                <div style="font-size:0.6rem;color:var(--text-secondary);">ИМТ</div>
                                <div class="value" id="bmiValue">—</div>

                            <div class="status" id="bmiStatus">—</div>

                        </div>
                        <div class="weight-add">

                                <input id="measBiceps" type="number" placeholder="см" step="0.5" />

                            <div class="m-item">
                                <label>Грудь</label>
                                <input id="measChest" type="number" placeholder="см" step="0.5" />
                            </div>
                            <div class="m-item">
                                <label>Бедро</label>
                                <input id="measThigh" type="number" placeholder="см" step="0.5" />
                            </div>
                            <div class="m-item">
                                <label>Талия</label>
                                <input id="measWaist" type="number" placeholder="см" step="0.5" />
                            </div>
                            <div style="grid-column:1/-1;">
                                <button class="btn btn-secondary" onclick="saveMeasurements()" style="width:100%;padding:6px;font-size:0.75rem;">Сохранить мерки</button>

                        </div>

                        <button class="btn btn-danger" onclick="resetData()" style="width:100%;margin-top:12px;padding:8px;font-size:0.8rem;">🗑️ Сбросить</button>

                </div>

            <!-- ===== ВКЛАДКА: НАСТРОЙКИ ===== -->

                </div>

                        <button class="opt" data-profile="ocean" onclick="setProfile('ocean')" style="background:linear-gradient(135deg,#0EA5E9,#38BDF8);border-color:#0EA5E9;"></button>
                        <button class="opt" data-profile="sunset" onclick="setProfile('sunset')" style="background:linear-gradient(135deg,#F43F5E,#FB7185);border-color:#F43F5E;"></button>
                        <button class="opt" data-profile="emerald" onclick="setProfile('emerald')" style="background:linear-gradient(135deg,#10B981,#34D399);border-color:#10B981;"></button>
                        <button class="opt" data-profile="purple" onclick="setProfile('purple')" style="background:linear-gradient(135deg,#8B5CF6,#A78BFA);border-color:#8B5CF6;"></button>
                        <button class="opt" data-profile="charcoal" onclick="setProfile('charcoal')" style="background:linear-gradient(135deg,#4B5563,#6B7280);border-color:#4B5563;"></button>
                    </div>
                </div>

                <div class="settings-group">
                    <h4>🌓 Режим</h4>
                    <div class="settings-options">
                        <button class="opt active" data-theme="light" onclick="setTheme('light')">☀️</button>
                        <button class="opt" data-theme="dark" onclick="setTheme('dark')">🌙</button>
                    </div>
                </div>

                <div class="settings-group">
