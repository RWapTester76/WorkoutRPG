<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SkillQuest — Журнал прогресса</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="header-greeting body-2 text-secondary" id="greetingText">Доброе утро 👋</span>
                <h1 class="title-1" id="userName">Герой</h1>
            </div>
            <div class="avatar avatar-lg" id="avatarPreview" style="cursor:pointer;">
                <span id="avatarInitials">Г</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Сюда рендерится активная страница -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="bottom-nav-item active" data-page="home">
                <span class="icon">🏠</span>
                <span class="label">Главная</span>
            </div>
            <div class="bottom-nav-item" data-page="calendar">
                <span class="icon">📅</span>
                <span class="label">Календарь</span>
            </div>
            <div class="bottom-nav-item" data-page="journals">
                <span class="icon">📚</span>
                <span class="label">Журналы</span>
            </div>
            <div class="bottom-nav-item" data-page="goals">
                <span class="icon">🎯</span>
                <span class="label">Цели</span>
                <span class="badge" id="goalsBadge">0</span>
            </div>
            <div class="bottom-nav-item" data-page="profile">
                <span class="icon">👤</span>
                <span class="label">Профиль</span>
            </div>
        </nav>

        <!-- FAB -->
        <button class="fab" id="fabAddTask" aria-label="Создать задачу">
            <span>+</span>
        </button>
    </div>

    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
