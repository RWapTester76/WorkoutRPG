<script>
(function(){
  const $=s=>document.querySelector(s);
  const $$=s=>document.querySelectorAll(s);

  // Touch-friendly "More" screen launcher: no horizontal scrolling on iPhone.
  function openMore(){
    let sheet=$("#screenSheet");
    if(!sheet){
      sheet=document.createElement("div");
      sheet.id="screenSheet"; sheet.className="screen-sheet";
      sheet.innerHTML=`<div class="screen-sheet-panel" role="dialog" aria-modal="true" aria-label="Экраны">
        <div class="screen-sheet-head"><div><h2 style="margin:0;font-size:20px">Все экраны</h2><p class="subtle" style="margin:3px 0 0">Выбери раздел одним касанием</p></div><button class="icon-btn" id="closeScreenSheet">×</button></div>
        <div class="screen-sheet-grid">
          <button class="screen-link" data-screen="goals"><b>◇</b><span>Цели<small>Планы и достижения</small></span></button>
          <button class="screen-link" data-screen="notes"><b>✎</b><span>Заметки<small>Тексты и материалы</small></span></button>
          <button class="screen-link" data-screen="settings"><b>⚙</b><span>Профиль<small>Настройки и данные</small></span></button>
          <button class="screen-link" data-screen="weight"><b>⚖</b><span>Вес<small>Журнал измерений</small></span></button>
        </div>
      </div>`;
      document.body.appendChild(sheet);
      sheet.addEventListener("click",e=>{
        if(e.target===sheet) sheet.classList.remove("open");
        const b=e.target.closest("[data-screen]");
        if(b){sheet.classList.remove("open");App.go(b.dataset.screen)}
      });
      $("#closeScreenSheet").onclick=()=>sheet.classList.remove("open");
    }
    sheet.classList.add("open");
  }

  const more=$("#navMore"); if(more) more.onclick=openMore;

  // Add a persistent, thumb-friendly task action.
  if(!$("#sqFabTask")){
    const fab=document.createElement("button");fab.id="sqFabTask";fab.className="fab-task";fab.title="Добавить задачу";fab.setAttribute("aria-label","Добавить задачу");fab.textContent="+";
    fab.onclick=()=>App.openTask();document.body.appendChild(fab);
  }

  // Move weight into Profile: settings gets a dedicated, prominent entry point.
  const oldSettings=App.settings;
  App.settings=function(){
    oldSettings.call(this);
    const box=$("#settings"); if(!box || box.querySelector(".weight-profile-card")) return;
    const w=Data.weightLog.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const stats=Data.weightStats?Data.weightStats():null;
    const val=w?`${SQ.safeNum(w.value,0).toFixed(1)} кг`:"Нет измерений";
    const change=stats&&stats.change!=null?`${stats.change>0?"+":""}${stats.change.toFixed(1)} кг`:"—";
    const card=document.createElement("div");card.className="card";card.style.marginTop="16px";
    card.innerHTML=`<div class="section-head" style="margin-bottom:12px"><div><h2 style="font-size:18px">Журнал веса</h2><p>История, график и динамика — теперь внутри профиля</p></div><span style="font-size:26px">⚖️</span></div>
      <div class="weight-profile-card"><div><div class="subtle">Последнее измерение</div><strong style="font-size:25px">${val}</strong><div class="subtle">Изменение: ${change}</div></div>
      <button class="btn" onclick="App.go('weight')">Открыть журнал</button></div>`;
    box.appendChild(card);
  };

  // Ensure all seven schemes are always presented as real touch controls in Settings.
  const oldSet=window.setScheme;
  window.setScheme=function(name){ oldSet(name); $$(".scheme-btn").forEach(b=>b.classList.toggle("active",b.dataset.scheme===name)); };
  function refreshSchemes(){
    $$(".scheme-btn").forEach(b=>b.classList.toggle("active",b.dataset.scheme===document.documentElement.dataset.scheme));
  }

  // Improve profile/avatar visibility in the header.
  function refreshAvatar(){
    const a=$("#avatarBtn"),p=Data.profile&&Data.profile();
    if(a&&p){
      a.innerHTML=p.avatar?`<img src="${SQ.escapeAttr(p.avatar)}" alt="Аватар">`:`<span>${esc((p.name||"Г").charAt(0).toUpperCase())}</span>`;
      a.title="Изменить аватар";
    }
  }

  // Rebind navigation after the original app boot and keep More as a launcher.
  setTimeout(()=>{
    refreshAvatar(); refreshSchemes();
    $$(".nav button[data-page]").forEach(b=>b.onclick=()=>App.go(b.dataset.page));
    const theme=$("#themeBtn"); if(theme) theme.setAttribute("aria-label","Переключить светлую/тёмную тему");
  },0);
})();
</script>

<script id="skillquest-compact-behavior">
(() => {
  // Keep long content readable while avoiding unnecessary full-page scrolling.
  const compactSections = ['analytics','calendar','journals','goals','notes','weight','profile','settings'];
  const applyCompact = () => {
    compactSections.forEach(id => {
      const el=document.getElementById(id);
      if(el) el.classList.add('sq-compact-screen');
    });
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',applyCompact);
  else applyCompact();
})();
</script>

        </div>
        <div class="card"><div class="section-head" style="margin-top:0"><div><h2>Вес</h2><p>Журнал измерений находится в профиле</p></div><span style="font-size:24px">⚖️</span></div>
          <div class="weight-profile-card"><div><div class="subtle">Последнее значение</div><strong style="font-size:24px">${last?last.weight.toFixed(1)+" кг":"Нет измерений"}</strong><div class="subtle">Изменение: ${change==null?"—":(change>0?"+":"")+change.toFixed(1)+" кг"}</div></div><button class="btn" onclick="App.go('weight')">Открыть журнал веса</button></div>
        </div>
      </div>
      <div class="section-head"><div><h2>Быстрый доступ</h2><p>Все ключевые разделы без скрытой навигации</p></div></div>
      <div class="card"><div class="profile-launcher">
        <button onclick="App.go('goals')"><b>🎯</b>Цели<small>${goalCount} целей</small></button>
        <button onclick="App.go('analytics')"><b>📊</b>Аналитика<small>XP и статистика</small></button>
        <button onclick="App.go('home')"><b>🏠</b>Главная<small>Сегодня и задачи</small></button>
        <button onclick="App.go('weight')"><b>⚖️</b>Вес<small>График и история</small></button>
        <button onclick="App.openTask()"><b>➕</b>Задача<small>Создать быстро</small></button>
        <button onclick="App.go('settings')"><b>⚙️</b>Настройки<small>Данные и темы</small></button>
      </div></div>`;
  };

  /* Goal overview: all requested metadata + reader on tap. */
  App.goals=function(){
    const gs=Data.goals.filter(g=>!this.goalJournalFilter||g.journal===this.goalJournalFilter);
    document.getElementById("goals").innerHTML=`<div class="section-head"><div><h2>Цели</h2><p>Открывай цель для полного просмотра</p></div><button class="btn" onclick="App.openGoal()">+ Цель</button></div>
      <div class="card goal-filter-row"><span class="subtle">Фильтр журнала</span><select class="input" onchange="App.goalJournalFilter=this.value;App.goals()"><option value="">Все журналы</option>${Data.journals.map(j=>`<option value="${escSafe(j.name)}" ${this.goalJournalFilter===j.name?"selected":""}>${j.icon} ${escSafe(j.name)}</option>`).join("")}</select></div>
      <div class="list" style="margin-top:10px">${gs.length?gs.map(g=>{const x=Data.goalProgress(g),j=g.journal?Data.journal(g.journal):null,c=journalColor(g.journal||"другое"),deadline=g.deadline?Dates.label(g.deadline,{day:"numeric",month:"short",year:"numeric"}):"Без дедлайна";return `<div class="goal goal-card card" style="--jcolor:${c};border-left:5px solid ${c}" onclick="App.openGoalReader('${escSafe(g.id)}')"><div class="goal-top"><div><h3>${g.achieved?"🏆 ":"🎯 "}${escSafe(g.title)}</h3><p>${escSafe(g.desc||"Описание отсутствует")}</p><div class="goal-meta"><span>${j?j.icon+" "+escSafe(j.name):"Без журнала"}</span><span>📅 ${escSafe(deadline)}</span><span>⚡ ${SQ.safeNum(g.rewardXP,1)} XP</span><span>🧩 ${x.tasks.length} задач</span><span>${g.achieved?"✓ Достигнута":"◷ В процессе"}</span></div></div><b style="font-size:18px">${x.rate}%</b></div><div class="progress"><i style="width:${x.rate}%;background:${c}"></i></div><div class="goal-foot"><span>${x.done} / ${x.required} дней</span><span>Нажми для просмотра →</span></div><div class="data-actions" style="margin-top:10px" onclick="event.stopPropagation()"><button class="btn secondary sm" onclick="App.openGoal('${escSafe(g.id)}')">Изменить</button><button class="btn danger sm" onclick="App.deleteGoal('${escSafe(g.id)}')">Удалить</button></div></div>`}).join(""):`<div class="card empty"><strong>Целей не найдено</strong>Создай цель или измени фильтр.</div>`}</div>`;
  };

  /* Notes: compact list, search, journal filter, full reader, edit/delete. */
  App.notes=function(){
    document.getElementById("notes").innerHTML=`<div class="section-head"><div><h2>Заметки</h2><p>Длинные тексты читаются целиком в reader view</p></div><button class="btn" onclick="App.openNote()">+ Заметка</button></div>
      <div class="card"><div class="note-toolbar"><input class="input" id="noteSearch" placeholder="Поиск по заметкам…" oninput="App.filterNotes()"><select class="input" id="noteJournal" onchange="App.notesJournalFilter=this.value;App.filterNotes()"><option value="">Все журналы</option>${Data.journals.map(j=>`<option value="${escSafe(j.name)}" ${this.notesJournalFilter===j.name?"selected":""}>${j.icon} ${escSafe(j.name)}</option>`).join("")}</select></div></div><div class="list" id="noteResults" style="margin-top:10px"></div>`;
    this.filterNotes();
  };
  App.filterNotes=function(){
    const q=(document.getElementById("noteSearch")?.value||"").trim().toLowerCase(),j=App.notesJournalFilter||"",box=document.getElementById("noteResults");if(!box)return;
    const ns=Data.state.notes.slice().sort((a,b)=>(b.date||b.createdAt||"").localeCompare(a.date||a.createdAt||"")).filter(n=>(!j||n.journal===j)&&(!q||(`${n.text} ${n.journal||""}`).toLowerCase().includes(q)));
    box.innerHTML=ns.length?ns.map(n=>{const jj=n.journal?Data.journal(n.journal):null,title=(n.text.split(/\r?\n/)[0]||"Заметка").slice(0,90);return `<article class="note card note-list-item" style="border-left:4px solid ${journalColor(n.journal||"другое")}" onclick="App.openNoteReader('${escSafe(n.id)}')"><div style="display:flex;justify-content:space-between;gap:9px;align-items:flex-start"><div style="min-width:0"><h3>${escSafe(title)}</h3><div class="note-meta">${escSafe(n.date||"")} · ${jj?jj.icon+" "+escSafe(jj.name):"Без журнала"}</div></div><div class="data-actions" onclick="event.stopPropagation()"><button class="btn secondary sm" onclick="App.editNote('${escSafe(n.id)}')">Изм.</button><button class="btn danger sm" onclick="Data.deleteNote('${escSafe(n.id)}')">Удал.</button></div></div><div class="note-excerpt">${escSafe(n.text)}</div></article>`}).join(""):`<div class="card empty"><strong>Заметок не найдено</strong>Попробуй другой запрос или журнал.</div>`;
  };
  App.openNoteReader=function(nid){
    const n=Data.state.notes.find(x=>x.id===nid);if(!n)return;const j=n.journal?Data.journal(n.journal):null;
    $("#noteReaderTitle").textContent=(n.text.split(/\r?\n/)[0]||"Заметка").slice(0,100);
    $("#noteReaderBody").innerHTML=`<div class="reader-meta">${escSafe(n.date||"")} · ${j?j.icon+" "+escSafe(j.name):"Без журнала"}</div><div class="note-body">${escSafe(n.text)}</div><div class="reader-actions"><button class="btn" onclick="App.close('noteReaderModal');App.editNote('${escSafe(n.id)}')">Редактировать</button><button class="btn danger" onclick="App.close('noteReaderModal');Data.deleteNote('${escSafe(n.id)}')">Удалить</button></div>`;
    App.open("noteReaderModal");
  };

  /* Settings: seven themes + dark mode + data actions. */
  App.settings=function(){
    const p=Data.profile();
    document.getElementById("settings").innerHTML=`<div class="section-head"><div><h2>Настройки</h2><p>Внешний вид, профиль и резервные копии</p></div></div>
      <div class="grid g2">
        <div class="card"><h2 style="font-size:17px;margin-bottom:10px">Профиль</h2><div class="form-grid"><div class="field"><label>Имя</label><input class="input" id="pName" value="${escSafe(p.name)}"></div><div class="field"><label>Возраст</label><input class="input" id="pAge" type="number" min="0" value="${p.age||0}"></div><div class="field"><label>Вес, кг</label><input class="input" id="pWeight" type="number" min="0" step=".1" value="${p.weight||0}"></div><div class="field"><label>Рост, см</label><input class="input" id="pHeight" type="number" min="0" value="${p.height||0}"></div><div class="field full"><button class="btn" onclick="App.saveProfile()">Сохранить профиль</button></div></div></div>
        <div class="card"><h2 style="font-size:17px;margin-bottom:10px">Данные</h2><div class="settings-row"><span>Экспорт</span><button class="btn secondary sm" onclick="App.export()">Скачать JSON</button></div><div class="settings-row"><span>Импорт</span><button class="btn secondary sm" onclick="document.getElementById('importFile').click()">Загрузить JSON</button></div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="App.import(this.files[0])"><div class="settings-row"><span>Dark Mode</span><button class="btn secondary sm" onclick="App.toggleTheme()">${document.documentElement.classList.contains("dark")?"Выключить":"Включить"}</button></div><div class="settings-row"><span>Версия данных</span><span class="subtle">${Data.state.version} · миграция включена</span></div><div class="settings-row"><span>Сброс</span><button class="btn danger sm" onclick="App.reset()">Удалить всё</button></div></div>
      </div>
      <div class="card" style="margin-top:12px"><h2 style="font-size:17px">Цветовая схема</h2><p class="subtle" style="margin-top:3px">Применяется сразу и сохраняется в localStorage.</p><div class="scheme-grid">${SQ_SCHEMES.map(x=>`<button class="scheme-btn ${document.documentElement.dataset.scheme===x[0]?"active":""}" data-scheme="${x[0]}" onclick="App.setScheme('${x[0]}')"><span class="scheme-dot" style="background:linear-gradient(135deg,${x[2]},${x[3]})"></span><span>${x[1]}</span></button>`).join("")}</div></div>`;
  };
  App.setScheme=function(name){
    const allowed=SQ_SCHEMES.map(x=>x[0]);if(!allowed.includes(name))name="violet";document.documentElement.dataset.scheme=name;localStorage.setItem("skillquest_scheme",name);this.renderPage();Toast(`${name.charAt(0).toUpperCase()+name.slice(1)} · тема применена`,"success");
  };

  /* Calendar: fix the existing week view so it never needs horizontal swiping. */
  App.calendarViewHTML=function(){
    if(this.calendarView==="day"){
      const ts=Data.tasksForDate(this.calDate,this.calendarJournal);return `<div class="card"><div class="cal-day-list">${this.taskList(ts,this.calDate)}</div></div>`;
    }
    if(this.calendarView==="week"){
      const start=this.weekStart(this.calDate);return `<div class="card"><div class="cal-week">${Array.from({length:7},(_,i)=>{const date=Dates.add(start,i),ts=Data.tasksForDate(date,this.calendarJournal);return `<div class="cal-week-day ${date===SQ.today()?"today":""}" onclick="App.day('${date}')"><b>${headsLabel(date)}</b>${ts.length?ts.slice(0,4).map(t=>`<div class="cal-task-mini" style="--jcolor:${journalColor(t.journal)}">${(Data.journal(t.journal)||{}).icon||"📌"} ${escSafe(t.title)}</div>`).join(""):`<div class="subtle" style="margin-top:8px">—</div>`}${ts.length>4?`<div class="subtle" style="margin-top:4px">+${ts.length-4}</div>`:""}</div>`}).join("")}</div></div>`;
    }
    if(this.calendarView==="year"){
      const y=this.calMonth.getFullYear();return `<div class="card"><div class="year-grid">${Array.from({length:12},(_,m)=>{const total=new Date(y,m+1,0).getDate();let active=0;for(let d=1;d<=total;d++){const date=`${y}-${Dates.pad(m+1)}-${Dates.pad(d)}`;if(Data.tasksForDate(date,this.calendarJournal).length)active++}return `<div class="year-month" onclick="App.openMonth(${y},${m})"><div class="year-month-head"><span>${new Date(y,m,1).toLocaleDateString("ru-RU",{month:"long"})}</span><span>${active}</span></div><div class="mini-month">${Array.from({length:total},(_,d)=>{const date=`${y}-${Dates.pad(m+1)}-${Dates.pad(d+1)}`;return `<i class="${Data.tasksForDate(date,this.calendarJournal).length?"has":""}"></i>`}).join("")}</div></div>`}).join("")}</div></div>`;
    }
    const y=this.calMonth.getFullYear(),m=this.calMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let cells=[];
    for(let i=first-1;i>=0;i--)cells.push({day:prev-i,other:1,date:Dates.localDate(new Date(y,m-1,prev-i))});
    for(let x=1;x<=days;x++)cells.push({day:x,other:0,date:`${y}-${Dates.pad(m+1)}-${Dates.pad(x)}`});
    while(cells.length%7){const n=cells.length-days-first+1;cells.push({day:n,other:1,date:`${y}-${Dates.pad(m+2)}-${Dates.pad(n)}`})}
    return `<div class="card"><div class="cal-grid">${["Вс","Пн","Вт","Ср","Чт","Пт","Сб"].map(h=>`<div class="cal-head">${h}</div>`).join("")}${cells.map(c=>{const ts=Data.tasksForDate(c.date,this.calendarJournal),today=c.date===SQ.today();return `<div class="cal-cell ${c.other?"other":""} ${today?"today":""}" onclick="App.day('${c.date}')"><div class="day">${c.day}</div><div class="cal-dots">${ts.slice(0,8).map(t=>`<i class="cal-dot ${Data.status(t,c.date)}" style="background:${journalColor(t.journal)}" title="${escSafe(t.title)}"></i>`).join("")}</div></div>`}).join("")}</div><div id="dayDetail"></div></div>`;
  };

  /* Add visual journal identity to filters without changing their data semantics. */
  const baseCalendar=App.calendar.bind(App);
  App.calendar=function(){
    baseCalendar();
    const select=document.querySelector('#calendar .toolbar select.input');
    if(select){const c=this.calendarJournal?journalColor(this.calendarJournal):'var(--border)';select.style.borderColor=c;select.style.boxShadow=this.calendarJournal?`0 0 0 2px color-mix(in srgb,${c} 12%,transparent)`:'';}
  };
  const baseNotes=this.notes.bind(this);
  App.notes=function(){baseNotes();const select=document.getElementById('noteJournal');if(select){const c=this.notesJournalFilter?journalColor(this.notesJournalFilter):'var(--border)';select.style.borderColor=c;}};

  /* Keep profile as the active page after initial boot and preserve current page on data changes. */
  const oldInit=App.init.bind(App);
  App.init=function(){oldInit();installBottomNav();this.page=this.page||"profile";this.go(this.page);};
  installBottomNav();
  setTimeout(()=>{installBottomNav();if(App.page==="home"||!App.page)App.go("profile");},0);
})();
</script>

<!-- SkillQuest Pro — restoration / access / QA hardening layer -->
<style id="sq-restoration-ui">
  .access-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .access-card{min-height:92px;border:1px solid var(--border);border-radius:17px;background:var(--surface2);color:var(--text);padding:12px;text-align:left;cursor:pointer;font-weight:800;transition:.16s;touch-action:manipulation}
  .access-card:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
  .access-card:active{transform:scale(.985)}
  .access-card b{display:block;font-size:24px;margin-bottom:5px}.access-card small{display:block;color:var(--muted);font-weight:500;font-size:11px;line-height:1.25}
  .gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .gallery-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface2);cursor:pointer}
  .gallery-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  .gallery-card figcaption{padding:9px;font-size:11px;color:var(--muted)}
  .task-manager-list{display:grid;gap:6px}
  .qa-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:800}
  @media(max-width:900px){.access-grid{grid-template-columns:repeat(3,1fr)}.gallery-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:600px){.access-grid{grid-template-columns:repeat(2,1fr)}.gallery-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script id="sq-restoration-behavior">
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const safe=s=>esc(String(s??""));

  // Restore every secondary screen without touching the existing five-item bottom nav.
  ["tasks","statistics","gallery"].forEach(id=>{
    if(!document.getElementById(id)){
      const sec=document.createElement("section");sec.id=id;sec.className="page";document.querySelector(".app").appendChild(sec);
    }
  });

  // Gallery aggregates all achievement photos stored inside goals. Nothing is copied or replaced.
  App.gallery=function(){
    const items=[];
    Data.goals.forEach(g=>(g.photos||[]).forEach(ph=>items.push({ph,g})));
    items.sort((a,b)=>String(b.ph.createdAt||"").localeCompare(String(a.ph.createdAt||"")));
    document.getElementById("gallery").innerHTML=`
      <div class="section-head"><div><h2>Галерея достижений</h2><p>Все фотографии из целей и прогресса</p></div><span class="qa-badge">📷 ${items.length} фото</span></div>
      <div class="card" style="margin-bottom:12px"><div class="toolbar"><select class="input" id="galleryGoalFilter" onchange="App.renderGalleryFiltered()"><option value="">Все цели</option>${Data.goals.map(g=>`<option value="${safe(g.id)}">🎯 ${safe(g.title)}</option>`).join("")}</select><select class="input" id="galleryJournalFilter" onchange="App.renderGalleryFiltered()"><option value="">Все журналы</option>${Data.journals.map(j=>`<option value="${safe(j.name)}">${j.icon} ${safe(j.name)}</option>`).join("")}</select></div></div>
      <div id="galleryResults"></div>`;
    this.renderGalleryFiltered();
  };
  App.renderGalleryFiltered=function(){
    const box=$("#galleryResults");if(!box)return;
    const gid=$("#galleryGoalFilter")?.value||"",jn=$("#galleryJournalFilter")?.value||"";
    const items=[];Data.goals.forEach(g=>(g.photos||[]).forEach(ph=>{if((!gid||g.id===gid)&&(!jn||g.journal===jn))items.push({ph,g})}));
    items.sort((a,b)=>String(b.ph.createdAt||"").localeCompare(String(a.ph.createdAt||"")));
    box.innerHTML=items.length?`<div class="gallery-grid">${items.map(({ph,g})=>{const j=g.journal?Data.journal(g.journal):null;return `<figure class="gallery-card" onclick="App.openGoalReader('${safe(g.id)}')"><img src="${safe(ph.data)}" alt="${safe(ph.caption||g.title)}"><figcaption><b>${safe(g.title)}</b><br>${j?j.icon+" "+safe(j.name):"Без журнала"}${ph.caption?`<br>${safe(ph.caption)}`:""}</figcaption></figure>`}).join("")}</div>`:`<div class="card empty"><strong>Галерея пока пуста</strong>Добавь фото в разделе «Цели» — они автоматически появятся здесь.</div>`;
  };

  // Restore a dedicated task manager with the existing CRUD/filter logic.
  App.tasks=function(){
    document.getElementById("tasks").innerHTML=`<div class="section-head"><div><h2>Задачи</h2><p>Поиск, фильтры, recurring, выполнение и редактирование</p></div><button class="btn" onclick="App.openTask()">+ Задача</button></div>${this.taskFiltersHTML()}<div class="card" id="taskFilterResults"></div>`;
    this.renderTaskFiltered();
  };

  // Statistics is a stable access alias to the existing full analytics engine.
  App.statistics=function(){this.analytics();document.getElementById("statistics").innerHTML=document.getElementById("analytics").innerHTML};

  // Make navigation routes know about restored screens.
  const oldRenderPage=App.renderPage;
  App.renderPage=function(){
    const fn={home:this.home,analytics:this.analytics,statistics:this.statistics,calendar:this.calendar,journals:this.journals,goals:this.goals,notes:this.notes,settings:this.settings,weight:this.weight,profile:this.profile,tasks:this.tasks,gallery:this.gallery}[this.page];
    if(fn)fn.call(this);
    this.bindDynamic();
    if(typeof installBottomNav==="function")installBottomNav();
  };

  // Profile is the central launcher so no existing function becomes hidden again.
  const oldProfile=App.profile;
  App.profile=function(){
    oldProfile.call(this);
    const box=$("#profile");if(!box)return;
    const old=box.querySelector(".sq-access-panel");if(old)old.remove();
    const panel=document.createElement("div");panel.className="card sq-access-panel";panel.style.marginTop="12px";
    panel.innerHTML=`<div class="section-head" style="margin-top:0"><div><h2>Все функции</h2><p>Все разделы SkillQuest доступны одним касанием</p></div></div><div class="access-grid">
      <button class="access-card" onclick="App.go('tasks')"><b>✅</b>Задачи<small>CRUD, recurring, фильтры</small></button>
      <button class="access-card" onclick="App.go('statistics')"><b>📊</b>Статистика<small>Аналитика и графики</small></button>
      <button class="access-card" onclick="App.go('goals')"><b>🎯</b>Цели<small>Прогресс и достижения</small></button>
      <button class="access-card" onclick="App.go('gallery')"><b>🖼️</b>Галерея<small>Фото достижений</small></button>
      <button class="access-card" onclick="App.go('weight')"><b>⚖️</b>Вес<small>Журнал и график</small></button>
      <button class="access-card" onclick="App.go('home')"><b>🏠</b>Главная<small>Сегодня и XP</small></button>
      <button class="access-card" onclick="App.go('journals')"><b>📚</b>Журналы<small>Сферы и цвета</small></button>
      <button class="access-card" onclick="App.go('notes')"><b>📝</b>Заметки<small>Поиск и reader</small></button>
      <button class="access-card" onclick="App.go('calendar')"><b>📅</b>Календарь<small>День / Неделя / Месяц / Год</small></button>
      <button class="access-card" onclick="App.go('settings')"><b>⚙️</b>Настройки<small>Темы, dark mode, данные</small></button>
    </div>`;
    box.appendChild(panel);
  };

  // The original goal form currently requires an already-created goal before adding a photo.
  // Keep that behavior safe, but make the requirement explicit in the UI and preserve every photo.
  const oldOpenGoal=App.openGoal;
  App.openGoal=function(gid=null){
    oldOpenGoal.call(this,gid);
    const form=$("#goalForm");if(!form)return;
    const hint=form.querySelector(".sq-photo-hint");if(hint)hint.remove();
    const ph=form.querySelector("#gPhotoFile");
    if(ph){
      const h=document.createElement("div");h.className="subtle sq-photo-hint";h.textContent=gid?"Можно добавить несколько фото; подписи сохраняются вместе с целью.":"Сначала сохрани цель, затем открой её снова для добавления фотографий.";
      ph.closest(".field")?.appendChild(h);
      if(!gid)ph.disabled=true;
    }
  };

  // Recalculate and validate legacy data once after all restoration hooks are installed.
  try{
    Data.migrate();
    Data.recalcLevel();
    Data.save();
  }catch(e){console.warn("SkillQuest restoration migration skipped",e)}

  // Keep the requested exact five bottom buttons and expose all secondary areas from Profile.
  setTimeout(()=>{
    if(typeof installBottomNav==="function")installBottomNav();
    App.go(App.page||"profile");
  },0);
})();
</script>
