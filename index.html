<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Планировщик задач</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ========================================
           БАЗОВЫЙ СБРОС И ПЕРЕМЕННЫЕ
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            transition: background 0.4s ease;
            padding: 12px;
        }

        /* ========================================
           КОНТЕЙНЕР
           ======================================== */
        .app-container {
            width: 100%;
            max-width: 1200px;
            border-radius: 28px;
            padding: 20px;
            transition: background 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            background: #ffffff;
        }

        /* ========================================
           ХЕДЕР
           ======================================== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-bottom: 24px;
        }

        .app-header h1 {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 700;
            letter-spacing: -0.4px;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1 i {
            font-size: clamp(18px, 3vw, 24px);
        }

        .theme-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .theme-btn {
            width: clamp(38px, 7vw, 48px);
            height: clamp(38px, 7vw, 48px);
            border-radius: 14px;
            border: 2.5px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #1e1e2a;
            background: #f0f0f5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            padding: 0 4px;
            gap: 4px;
            flex-shrink: 0;
        }

        .theme-btn:active {
            transform: scale(0.92);
        }

        .theme-btn.active {
            border-color: currentColor;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.10);
        }

        .theme-btn .color-dots {
            display: flex;
            gap: 3px;
        }

        .theme-btn .color-dots span {
            display: block;
            width: clamp(8px, 1.5vw, 12px);
            height: clamp(8px, 1.5vw, 12px);
            border-radius: 4px;
        }

        .theme-btn .theme-label {
            display: none;
        }

        @media (min-width: 600px) {
            .theme-btn .theme-label {
                display: inline;
                font-size: 10px;
                margin-left: 2px;
            }
        }

        /* ========================================
           ОСНОВНАЯ СЕТКА
           ======================================== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            margin-bottom: 24px;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1.8fr 1fr;
                gap: 24px;
            }
        }

        @media (min-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 2fr 1.1fr;
                gap: 28px;
            }
        }

        /* ========================================
           КАРТОЧКИ
           ======================================== */
        .card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 18px 16px;
            transition: background 0.35s ease, box-shadow 0.35s ease;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
        }

        @media (min-width: 480px) {
            .card {
                padding: 22px 24px;
                border-radius: 24px;
            }
        }

        .card-title {
            font-size: clamp(12px, 1.8vw, 15px);
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ========================================
           ЗАДАЧИ
           ======================================== */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: background 0.25s ease;
            border: 1px solid rgba(0,0,0,0.02);
            touch-action: manipulation;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-name {
            text-decoration: line-through;
        }

        @media (min-width: 480px) {
            .task-item {
                padding: 12px 16px;
                gap: 14px;
            }
        }

        .task-check {
            width: clamp(20px, 4vw, 26px);
            height: clamp(20px, 4vw, 26px);
            border-radius: 8px;
            border: 2px solid rgba(0,0,0,0.15);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .task-check:active {
            transform: scale(0.85);
        }

        .task-check.done {
            background: currentColor;
            border-color: currentColor;
            color: #fff;
        }

        .task-check.done i {
            font-size: clamp(10px, 1.8vw, 14px);
        }

        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .task-name {
            font-weight: 500;
            font-size: clamp(14px, 2.2vw, 16px);
            word-break: break-word;
        }

        .task-meta {
            font-size: clamp(11px, 1.6vw, 13px);
            opacity: 0.5;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: center;
        }

        .task-tag {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: clamp(10px, 1.4vw, 12px);
            font-weight: 500;
            background: rgba(0,0,0,0.05);
            color: inherit;
            white-space: nowrap;
        }

        .habit-badge {
            font-size: 11px;
            opacity: 0.7;
        }

        .task-delete {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.2;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .task-delete:hover {
            opacity: 0.8;
            background: rgba(231, 76, 60, 0.1);
        }

        .task-delete:active {
            transform: scale(0.9);
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            opacity: 0.4;
        }

        .empty-state i {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        /* ========================================
           ПРОГРЕСС
           ======================================== */
        .progress-block {
            margin-top: 4px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: clamp(13px, 2vw, 15px);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .progress-track {
            width: 100%;
            height: clamp(6px, 1vw, 10px);
            border-radius: 20px;
            background: rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 20px;
            background: currentColor;
            transition: width 0.6s ease;
        }

        /* ========================================
           СТАТИСТИКА
           ======================================== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        @media (min-width: 480px) {
            .stats-row {
                gap: 12px;
            }
        }

        .stat-item {
            text-align: center;
            padding: 8px 4px;
            border-radius: 14px;
            background: rgba(255,255,255,0.3);
        }

        @media (min-width: 480px) {
            .stat-item {
                padding: 12px 8px;
                border-radius: 16px;
            }
        }

        .stat-number {
            font-size: clamp(22px, 4.5vw, 30px);
            font-weight: 700;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .stat-label {
            font-size: clamp(10px, 1.4vw, 13px);
            opacity: 0.5;
            margin-top: 2px;
        }

        /* ========================================
           КАЛЕНДАРЬ
           ======================================== */
        .mini-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 8px 0 4px;
        }

        @media (min-width: 480px) {
            .mini-calendar {
                gap: 6px;
            }
        }

        .mini-calendar .day {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: clamp(8px, 1.5vw, 14px);
            font-size: clamp(12px, 2vw, 16px);
            font-weight: 500;
            background: rgba(255,255,255,0.2);
            transition: background 0.2s ease;
            cursor: default;
            -webkit-user-select: none;
            user-select: none;
        }

        .mini-calendar .day.has-task {
            background: currentColor;
            color: #fff;
            opacity: 0.7;
        }

        .mini-calendar .day.today {
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
        }

        .mini-calendar .day.weekend {
            opacity: 0.4;
        }

        .mini-calendar .day-header {
            font-size: clamp(10px, 1.4vw, 12px);
            font-weight: 600;
            opacity: 0.4;
        }

        /* ========================================
           ЦЕЛИ
           ======================================== */
        .goal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            gap: 12px;
        }

        .goal-item:last-child {
            border-bottom: none;
        }

        .goal-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .goal-name {
            font-weight: 500;
            font-size: clamp(14px, 2.2vw, 16px);
            word-break: break-word;
        }

        .goal-sub {
            font-size: clamp(12px, 1.6vw, 14px);
            opacity: 0.5;
        }

        .goal-badge {
            font-size: clamp(11px, 1.5vw, 13px);
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(0,0,0,0.04);
            white-space: nowrap;
        }

        /* ========================================
           НИЖНЯЯ ПАНЕЛЬ
           ======================================== */
        .bottom-bar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.04);
        }

        @media (min-width: 600px) {
            .bottom-bar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .tag-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag-group .tag {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: clamp(12px, 1.6vw, 14px);
            font-weight: 500;
            background: rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            border: none;
            color: inherit;
        }

        .tag-group .tag:active {
            transform: scale(0.92);
        }

        .tag-group .tag.active-tag {
            background: var(--accent, #4a6fa5);
            color: #fff;
        }

        .bottom-stats {
            display: flex;
            gap: 16px;
            font-size: clamp(13px, 1.8vw, 15px);
            opacity: 0.5;
            flex-wrap: wrap;
        }

        .bottom-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ========================================
           КНОПКИ ДЕЙСТВИЙ
           ======================================== */
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: clamp(13px, 1.8vw, 15px);
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 100px;
        }

        .action-btn:active {
            transform: scale(0.94);
        }

        .action-btn.primary {
            background: var(--accent, #4a6fa5);
        }

        .action-btn.success {
            background: #2ecc71;
        }

        .action-btn.danger {
            background: #e74c3c;
        }

        .action-btn.warning {
            background: #f39c12;
        }

        /* ========================================
           МОДАЛКА
           ======================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--surface, #fff);
            border-radius: 24px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.4;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .modal-close:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.04);
        }

        /* ========================================
           ФОРМА
           ======================================== */
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.8;
        }

        .form-group label.checkbox-label {
            flex-direction: row;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-input {
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid rgba(0,0,0,0.06);
            font-size: 14px;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.5);
            color: inherit;
            width: 100%;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(74, 111, 165, 0.1);
        }

        .form-input.error {
            border-color: #e74c3c;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }

        .error-text {
            color: #e74c3c;
            font-size: 12px;
        }

        .habit-days {
            margin-top: 8px;
        }

        .habit-presets {
            display: flex;
            gap: 8px;
            margin: 8px 0;
        }

        .preset-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid rgba(0,0,0,0.06);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .preset-btn:active {
            transform: scale(0.92);
        }

        .preset-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .toggle-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid rgba(0,0,0,0.06);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .toggle-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .toggle-btn:active {
            transform: scale(0.92);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(0,0,0,0.04);
            color: inherit;
        }

        small {
            display: block;
            margin-top: 4px;
            opacity: 0.6;
            font-size: 12px;
        }

        /* ========================================
           TOAST
           ======================================== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e1e2a;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========================================
           ТЕМЫ
           ======================================== */
        [data-theme="nordic"] {
            --bg: #eef2f5;
            --surface: #ffffff;
            --text: #1e2a3a;
            --accent: #4a6fa5;
            --accent-light: #d4e0f0;
            --border: rgba(30,42,58,0.06);
        }
        [data-theme="nordic"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        [data-theme="nordic"] .card {
            background: rgba(255,255,255,0.7);
            border-color: var(--border);
        }

        [data-theme="amber"] {
            --bg: #fbf3e8;
            --surface: #fff9f0;
            --text: #3d2c1b;
            --accent: #d48c4b;
            --accent-light: #f0dec8;
            --border: rgba(61,44,27,0.07);
        }
        [data-theme="amber"] .app-container {
            background: var(--surface);
            color: var(--text);
        }
        [data-theme="amber"] .card {
            background: rgba(255,248,235,0.7);
        }

        [data-theme="forest"] {
            --bg: #eaf0e6;
            --surface: #f4f9f0;
            --text: #1f3327;
            --accent: #4a7c59;
            --accent-light: #cde0d4;
            --border: rgba(31,51,39,0.06);
        }
        [data-theme="forest"] .app-container {
            background: var(--surface);
            color: var(--text);
        }
        [data-theme="forest"] .card {
            background: rgba(255,255,255,0.65);
        }

        [data-theme="indigo"] {
            --bg: #131b2b;
            --surface: #1a2538;
            --text: #e8edf5;
            --accent: #7a9bcb;
            --accent-light: #2a3a55;
            --border: rgba(255,255,255,0.05);
        }
        [data-theme="indigo"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        [data-theme="indigo"] .card {
            background: rgba(255,255,255,0.04);
            border-color: var(--border);
        }
        [data-theme="indigo"] .task-item {
            background: rgba(255,255,255,0.04);
        }
        [data-theme="indigo"] .task-check {
            border-color: rgba(255,255,255,0.2);
        }
        [data-theme="indigo"] .stat-item {
            background: rgba(255,255,255,0.03);
        }
        [data-theme="indigo"] .bottom-bar {
            border-color: var(--border);
        }
        [data-theme="indigo"] .goal-item {
            border-color: var(--border);
        }

        [data-theme="rose"] {
            --bg: #f9f0f2;
            --surface: #fff7f9;
            --text: #3d2a33;
            --accent: #d4899e;
            --accent-light: #f2d9e0;
            --border: rgba(61,42,51,0.06);
        }
        [data-theme="rose"] .app-container {
            background: var(--surface);
            color: var(--text);
        }
        [data-theme="rose"] .card {
            background: rgba(255,245,247,0.7);
        }

        [data-theme="technoir"] {
            --bg: #0b0d14;
            --surface: #131721;
            --text: #eef2ff;
            --accent: #00d4b6;
            --accent-light: #1a2a2f;
            --border: rgba(0,212,182,0.12);
            --glow: 0 0 18px rgba(0,212,182,0.08);
        }
        [data-theme="technoir"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--glow);
        }
        [data-theme="technoir"] .card {
            background: rgba(255,255,255,0.02);
            border-color: var(--border);
            box-shadow: var(--glow);
        }
        [data-theme="technoir"] .task-item {
            background: rgba(255,255,255,0.02);
            border-color: var(--border);
        }
        [data-theme="technoir"] .task-check {
            border-color: rgba(255,255,255,0.15);
        }
        [data-theme="technoir"] .stat-item {
            background: rgba(255,255,255,0.02);
        }
        [data-theme="technoir"] .bottom-bar {
            border-color: var(--border);
        }
        [data-theme="technoir"] .goal-item {
            border-color: var(--border);
        }

        [data-theme="paper"] {
            --bg: #f6f4ef;
            --surface: #ffffff;
            --text: #1f1d1b;
            --accent: #b8a99a;
            --accent-light: #e8e1d8;
            --border: rgba(31,29,27,0.05);
        }
        [data-theme="paper"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }
        [data-theme="paper"] .card {
            background: rgba(255,252,248,0.7);
            border-color: var(--border);
        }
        [data-theme="paper"] .task-item {
            background: rgba(255,252,248,0.5);
        }

        /* ========================================
           ОБЩИЕ СТИЛИ ДЛЯ ВСЕХ ТЕМ
           ======================================== */
        .theme-btn {
            color: var(--text, #1e1e2a);
            background: var(--surface, #f0f0f5);
        }
        .theme-btn.active {
            border-color: var(--accent, #4a6fa5);
            color: var(--accent, #4a6fa5);
        }

        body {
            background: var(--bg, #f3f4f6);
        }

        /* ========================================
           IPHONE SAFE AREA
           ======================================== */
        @supports (padding: max(0px)) {
            .app-container {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
            }
        }

        /* ========================================
           АДАПТИВ ДЛЯ МАЛЕНЬКИХ ЭКРАНОВ
           ======================================== */
        @media (max-width: 380px) {
            .app-container {
                padding: 12px 10px;
                border-radius: 20px;
            }
            .card {
                padding: 14px 12px;
                border-radius: 16px;
            }
            .task-item {
                padding: 8px 10px;
                gap: 10px;
            }
            .theme-btn {
                width: 34px;
                height: 34px;
                border-radius: 10px;
            }
            .theme-btn .color-dots span {
                width: 6px;
                height: 6px;
            }
            .stats-row {
                gap: 4px;
            }
            .stat-item {
                padding: 6px 2px;
            }
            .stat-number {
                font-size: 18px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                padding: 20px;
                border-radius: 20px;
                max-height: 95vh;
            }
        }

        /* ========================================
           АНИМАЦИИ
           ======================================== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app" data-theme="nordic">
    <!-- ===== ХЕДЕР ===== -->
    <header class="app-header">
        <h1><i class="far fa-calendar-alt"></i> Планировщик</h1>
        <div class="theme-picker" id="themePicker"></div>
    </header>

    <!-- ===== ОСНОВНАЯ СЕТКА ===== -->
    <div class="dashboard-grid">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <div>
            <div class="card" style="margin-bottom: 18px;">
                <div class="card-title">
                    <i class="far fa-check-circle"></i> Сегодня
                    <span class="task-count" id="taskCount" style="margin-left:auto;background:rgba(0,0,0,0.05);padding:2px 10px;border-radius:20px;font-size:12px;">0</span>
                </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-chart-line"></i> Прогресс недели</div>
                <div class="progress-block">

                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-item">

                        <div class="stat-label">Запланировано</div>

                    <div class="stat-item">
                        <div class="stat-number" id="statDone">0</div>
                        <div class="stat-label">Выполнено</div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div>
            <div class="card" style="margin-bottom: 18px;">

                    <span class="card-title" style="margin-bottom:0;">

                    <span><span style="display:inline-block; width:10px; height:10px; border-radius:4px; border:2px solid currentColor; margin-right:6px;"></span> сегодня</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-bullseye"></i> Цели</div>
                <div id="goalList"></div>

    </div>

    <!-- ===== НИЖНЯЯ ПАНЕЛЬ ===== -->
    <div class="bottom-bar">
        <div class="tag-group" id="tagGroup">
            <button class="tag active-tag" data-tag="all">Все</button>
            <button class="tag" data-tag="Тело">Тело</button>
            <button class="tag" data-tag="Творчество">Творчество</button>
            <button class="tag" data-tag="Бизнес">Бизнес</button>
            <button class="tag" data-tag="Привычки">Привычки</button>
            <button class="tag" data-tag="Путешествия">Путешествия</button>
            <button class="tag" data-tag="Долги">Долги</button>
            <button class="tag" data-tag="Питание">Питание</button>
            <button class="tag" data-tag="Другое">Другое</button>
        </div>
        <div class="bottom-stats">
            <span><i class="far fa-star"></i> <span id="xpDisplay">0</span> XP</span>
            <span><i class="fas fa-fire"></i> <span id="streakDisplay">0</span> дн.</span>
        </div>
    </div>

    <!-- ===== КНОПКИ ДЕЙСТВИЙ ===== -->
    <div class="action-buttons">
        <button class="action-btn primary" id="btnAddTask"><i class="fas fa-plus"></i> Новая задача</button>
        <button class="action-btn success" id="btnCompleteAll"><i class="fas fa-check-double"></i> Все готово</button>
        <button class="action-btn warning" id="btnResetStats"><i class="fas fa-undo"></i> Сброс</button>

</div>

<!-- ===== МОДАЛКА ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">

            <form id="taskForm" class="task-form">

                <div class="form-group">
                    <label>Категория</label>
                    <select id="taskCategory" class="form-input">
                        <option value="Тело">Тело</option>
                        <option value="Творчество">Творчество</option>

                        <option value="Путешествия">Путешествия</option>

                    </select>

                <div class="form-row">
                    <div class="form-group">
                        <label>Дата *</label>
                        <input type="date" id="taskDate" class="form-input" required />

                        <label>Время</label>
                        <input type="time" id="taskTime" class="form-input" />
                    </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Длительность (минуты)</label>
                        <input type="number" id="taskDuration" class="form-input" min="1" max="1440" value="30" />

                        <button type="button" id="taskReminder" class="toggle-btn">Выкл</button>

                <div class="form-group">
                    <label class="checkbox-label">

                        Это привычка (повторяется каждый день)

                                <button type="button" class="preset-btn active" data-days="21">21</button>

                                <button type="button" class="preset-btn" data-days="60">60</button>

                </div>

                <div class="form-group">
                    <label>Заметка</label>

</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ============================================================
     JAVASCRIPT — ВЕСЬ КОД В ОДНОМ МЕСТЕ
     ============================================================ -->
<script>
    (function() {
        'use strict';

        // ========================================
        // 1. ДАННЫЕ
        // ========================================
        let taskData = [];
        let goalsData = [];
        let currentFilter = 'all';
        let currentTheme = 'nordic';
        let nextId = 1;

        // ========================================
        // 2. DOM-ЭЛЕМЕНТЫ
        // ========================================
        const app = document.getElementById('app');
        const themePicker = document.getElementById('themePicker');
        const taskList = document.getElementById('taskList');
        const goalList = document.getElementById('goalList');
        const miniCalendar = document.getElementById('miniCalendar');
        const toast = document.getElementById('toast');
        const modalOverlay = document.getElementById('modalOverlay');
        const taskForm = document.getElementById('taskForm');
        const modalClose = document.getElementById('modalClose');
        const modalCancel = document.getElementById('modalCancel');
        const modalSubmit = document.getElementById('modalSubmit');
        const modalTitle = document.getElementById('modalTitle');

        // Поля формы
        const taskName = document.getElementById('taskName');
        const taskCategory = document.getElementById('taskCategory');
        const taskDate = document.getElementById('taskDate');
        const taskTime = document.getElementById('taskTime');
        const taskDuration = document.getElementById('taskDuration');
        const taskReminder = document.getElementById('taskReminder');
        const taskIsHabit = document.getElementById('taskIsHabit');
        const habitDaysContainer = document.getElementById('habitDaysContainer');
        const taskNotes = document.getElementById('taskNotes');
        const taskNameError = document.getElementById('taskNameError');

        let toastTimer = null;
        let reminderOn = false;
        let habitDays = 21;
        let editingTaskId = null;

        // ========================================
        // 3. ЦВЕТА КАТЕГОРИЙ
        // ========================================
        const categoryColors = {
            'Тело': '#4a7c59',
            'Творчество': '#d4899e',
            'Бизнес': '#4a6fa5',
            'Привычки': '#f39c12',
            'Одноразки': '#8e44ad',
            'Путешествия': '#00d4b6',
            'Долги': '#e74c3c',
            'Питание': '#27ae60',
            'Другое': '#95a5a6'
        };

        // ========================================
        // 4. ТЕМЫ
        // ========================================
        const themes = [
            { id: 'nordic', label: 'Нордик', colors: ['#4a6fa5', '#d4e0f0', '#eef2f5'] },
            { id: 'amber', label: 'Янтарь', colors: ['#d48c4b', '#f0dec8', '#fbf3e8'] },
            { id: 'forest', label: 'Лесной', colors: ['#4a7c59', '#cde0d4', '#eaf0e6'] },
            { id: 'indigo', label: 'Индиго', colors: ['#7a9bcb', '#2a3a55', '#131b2b'] },
            { id: 'rose', label: 'Розовый', colors: ['#d4899e', '#f2d9e0', '#f9f0f2'] },
            { id: 'technoir', label: 'Техно', colors: ['#00d4b6', '#1a2a2f', '#0b0d14'] },
            { id: 'paper', label: 'Бумага', colors: ['#b8a99a', '#e8e1d8', '#f6f4ef'] }
        ];

        // ========================================
        // 5. ФУНКЦИИ XP И УРОВНЕЙ
        // ========================================
        function calculateLevel(totalXP) {
            if (totalXP < 1) return 1;
            let level = 1;
            while (true) {
                const xpForLevel = (level * (level + 1)) / 2;
                if (totalXP < xpForLevel) {
                    return level - 1 || 1;
                }
                level++;
            }
        }

        function calculateTaskXP(minutes) {
            return Math.round(minutes * 0.01);
        }

        // ========================================
        // 6. ИНИЦИАЛИЗАЦИЯ ДАННЫХ
        // ========================================
        function initData() {
            // Начальные задачи
            taskData = [
                { id: nextId++, name: 'Создать макет дашборда', category: 'Творчество', date: getToday(), time: '10:30', duration: 90, done: false, isHabit: false, notes: '', reminder: false },
                { id: nextId++, name: 'Написать документацию', category: 'Бизнес', date: getToday(), time: '14:00', duration: 60, done: false, isHabit: false, notes: '', reminder: false },
                { id: nextId++, name: 'Обзор кода команды', category: 'Бизнес', date: getToday(), time: '16:00', duration: 45, done: false, isHabit: false, notes: '', reminder: false },
                { id: nextId++, name: 'Утренняя зарядка', category: 'Тело', date: getToday(), time: '07:00', duration: 15, done: false, isHabit: true, habitDays: 21, habitCurrentDay: 1, notes: '', reminder: true },
            ];

            // Начальные цели
            goalsData = [
                { id: 1, name: 'Запустить MVP', done: 3, total: 5 },
                { id: 2, name: 'Изучить Vue 3', done: 2, total: 4 },
                { id: 3, name: 'Дизайн-система', done: 1, total: 3 }
            ];

            saveToLocalStorage();
        }

        // ========================================
        // 7. LOCAL STORAGE
        // ========================================
        function saveToLocalStorage() {
            try {
                localStorage.setItem('planner_tasks', JSON.stringify(taskData));
                localStorage.setItem('planner_goals', JSON.stringify(goalsData));
                localStorage.setItem('planner_nextId', String(nextId));
                localStorage.setItem('planner_theme', currentTheme);
            } catch(e) { /* ignore */ }
        }

        function loadFromLocalStorage() {
            try {
                const tasks = localStorage.getItem('planner_tasks');
                const goals = localStorage.getItem('planner_goals');
                const savedId = localStorage.getItem('planner_nextId');
                const theme = localStorage.getItem('planner_theme');

                if (tasks) taskData = JSON.parse(tasks);
                if (goals) goalsData = JSON.parse(goals);
                if (savedId) nextId = parseInt(savedId);
                if (theme && themes.some(t => t.id === theme)) {
                    currentTheme = theme;
                }
                return true;
            } catch(e) {
                return false;
            }
        }

        // ========================================
        // 8. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ========================================
        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('ru', { day: 'numeric', month: 'long' });
        }

        function getCategoryColor(category) {
            return categoryColors[category] || '#95a5a6';
        }

        function generateId() {
            return nextId++;
        }

        // ========================================
        // 9. TOAST
        // ========================================
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ========================================
        // 10. РЕНДЕР ТЕМ
        // ========================================
        function renderThemeButtons() {
            themePicker.innerHTML = '';
            themes.forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'theme-btn' + (t.id === currentTheme ? ' active' : '');
                btn.dataset.theme = t.id;
                btn.title = t.label;

                const dots = document.createElement('span');
                dots.className = 'color-dots';
                t.colors.forEach(c => {
                    const dot = document.createElement('span');
                    dot.style.background = c;
                    dots.appendChild(dot);
                });
                btn.appendChild(dots);

                const label = document.createElement('span');
                label.className = 'theme-label';
                label.textContent = t.label;
                btn.appendChild(label);

                btn.addEventListener('click', () => {
                    setTheme(t.id);
                });
                themePicker.appendChild(btn);
            });
        }

        function setTheme(themeId) {
            currentTheme = themeId;
            app.dataset.theme = themeId;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === themeId);
            });
            saveToLocalStorage();
            showToast('Тема: ' + themes.find(t => t.id === themeId)?.label);
        }

        // ========================================
        // 11. РЕНДЕР ЗАДАЧ
        // ========================================
        function renderTasks(filter) {
            const f = filter || currentFilter;
            const filtered = f === 'all' 
                ? taskData 
                : taskData.filter(t => t.category === f);

            // Сортируем по времени
            filtered.sort((a, b) => {
                if (a.time && b.time) return a.time.localeCompare(b.time);
                if (a.time) return -1;
                if (b.time) return 1;
                return 0;
            });

            taskList.innerHTML = '';

            if (filtered.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <p>Нет задач</p>
                    </div>
                `;
                document.getElementById('taskCount').textContent = '0';
                updateStats();
                return;
            }

            document.getElementById('taskCount').textContent = filtered.length;

            filtered.forEach(task => {
                const item = document.createElement('div');
                item.className = 'task-item' + (task.done ? ' completed' : '');

                const check = document.createElement('div');
                check.className = 'task-check' + (task.done ? ' done' : '');
                check.innerHTML = task.done ? '<i class="fas fa-check"></i>' : '';
                check.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleTask(task.id);
                });

                const content = document.createElement('div');
                content.className = 'task-content';

                const name = document.createElement('span');
                name.className = 'task-name';
                name.textContent = task.name;

                const meta = document.createElement('div');
                meta.className = 'task-meta';

                const tag = document.createElement('span');
                tag.className = 'task-tag';
                tag.style.background = getCategoryColor(task.category) + '22';
                tag.style.color = getCategoryColor(task.category);
                tag.textContent = task.category;

                meta.appendChild(tag);

                if (task.time) {
                    const timeSpan = document.createElement('span');
                    timeSpan.textContent = task.time;
                    meta.appendChild(timeSpan);
                }

                if (task.duration) {
                    const durSpan = document.createElement('span');
                    durSpan.textContent = '⏱ ' + task.duration + ' мин';
                    meta.appendChild(durSpan);
                }

                if (task.isHabit) {
                    const habitSpan = document.createElement('span');
                    habitSpan.className = 'habit-badge';
                    habitSpan.textContent = '🔄 ' + (task.habitCurrentDay || '?') + '/' + task.habitDays;
                    meta.appendChild(habitSpan);
                }

                if (task.reminder) {
                    const remSpan = document.createElement('span');
                    remSpan.textContent = '🔔';
                    remSpan.style.fontSize = '12px';
                    meta.appendChild(remSpan);
                }

                content.appendChild(name);
                content.appendChild(meta);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'task-delete';
                deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('Удалить задачу "' + task.name + '"?')) {
                        deleteTask(task.id);
                    }
                });

                item.appendChild(check);
                item.appendChild(content);
                item.appendChild(deleteBtn);
                taskList.appendChild(item);
            });

            updateStats();
        }

        // ========================================
        // 12. УПРАВЛЕНИЕ ЗАДАЧАМИ
        // ========================================
        function toggleTask(id) {
            const task = taskData.find(t => t.id === id);
            if (!task) return;

            const today = getToday();
            if (task.date > today && !task.done) {
                showToast('❌ Нельзя выполнить задачу раньше срока');
                return;
            }

            task.done = !task.done;
            if (task.done) {
                const xp = calculateTaskXP(task.duration || 0);
                showToast('✅ Выполнено! +' + xp + ' XP');
            } else {
                showToast('↩️ Задача возвращена');
            }

            saveToLocalStorage();
            renderTasks(currentFilter);
        }

        function deleteTask(id) {
            taskData = taskData.filter(t => t.id !== id);
            saveToLocalStorage();
            renderTasks(currentFilter);
            showToast('🗑️ Задача удалена');
        }

        function addTask(task) {
            taskData.push(task);
            saveToLocalStorage();
            renderTasks(currentFilter);
        }

        // ========================================
        // 13. ГЕНЕРАЦИЯ ПРИВЫЧЕК
        // ========================================
        function generateHabitTasks(baseTask) {
            const tasks = [];
            const today = new Date();
            const days = baseTask.habitDays || 21;

            for (let i = 0; i < days; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() + i);
                const dateStr = date.toISOString().split('T')[0];

                tasks.push({
                    id: generateId(),
                    name: baseTask.name,
                    category: baseTask.category,
                    date: dateStr,
                    time: baseTask.time || '',
                    duration: baseTask.duration || 0,
                    done: false,
                    isHabit: true,
                    habitDays: days,
                    habitCurrentDay: i + 1,
                    notes: baseTask.notes || '',
                    reminder: baseTask.reminder || false,
                });
            }

            taskData.push(...tasks);
            saveToLocalStorage();
            renderTasks(currentFilter);
            showToast('🔄 Создано ' + days + ' привычек!');
        }

        // ========================================
        // 14. РЕНДЕР ЦЕЛЕЙ
        // ========================================
        function renderGoals() {
            goalList.innerHTML = '';
            if (goalsData.length === 0) {
                goalList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bullseye"></i>
                        <p>Нет целей</p>
                    </div>
                `;
                return;
            }

            goalsData.forEach(g => {
                const pct = Math.round((g.done / g.total) * 100);
                const item = document.createElement('div');
                item.className = 'goal-item';
                item.innerHTML = `
                    <div class="goal-info">
                        <span class="goal-name">${g.name}</span>
                        <span class="goal-sub">${g.done} из ${g.total} задач выполнено</span>
                    </div>
                    <span class="goal-badge" style="color:var(--accent);">${pct}%</span>
                `;
                goalList.appendChild(item);
            });
        }

        // ========================================
        // 15. РЕНДЕР КАЛЕНДАРЯ
        // ========================================
        function renderCalendar() {
            const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            miniCalendar.innerHTML = '';

            daysOfWeek.forEach(d => {
                const el = document.createElement('span');
                el.className = 'day day-header';
                el.textContent = d;
                miniCalendar.appendChild(el);
            });

            const startDay = 3;
            const daysInMonth = 31;
            const today = new Date().getDate();

            // Собираем даты с задачами
            const taskDates = new Set();
            taskData.forEach(t => {
                if (t.date) taskDates.add(t.date);
            });

            for (let i = 1; i <= daysInMonth; i++) {
                const dayEl = document.createElement('span');
                dayEl.className = 'day';
                dayEl.textContent = i;

                const dateStr = '2026-07-' + String(i).padStart(2, '0');
                const dayOfWeek = (startDay + i - 1) % 7;

                if (dayOfWeek === 5 || dayOfWeek === 6) {
                    dayEl.classList.add('weekend');
                }

                if (taskDates.has(dateStr)) {
                    dayEl.classList.add('has-task');
                }

                if (i === today) {
                    dayEl.classList.add('today');
                }

                miniCalendar.appendChild(dayEl);
            }

            document.getElementById('monthLabel').textContent = 'Июль 2026';
        }

        // ========================================
        // 16. ОБНОВЛЕНИЕ СТАТИСТИКИ
        // ========================================
        function updateStats() {
            const total = taskData.length;
            const done = taskData.filter(t => t.done).length;
            const remaining = total - done;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('progressText').textContent = done + ' / ' + total;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('statPlanned').textContent = total;
            document.getElementById('statDone').textContent = done;
            document.getElementById('statRemaining').textContent = remaining;

            // XP: база + 2 за каждую выполненную
            const xp = 18 + done * 2;
            document.getElementById('xpDisplay').textContent = xp;

            // Стрик: база + бонус
            const streak = 5 + (done > 2 ? 1 : 0);
            document.getElementById('streakDisplay').textContent = streak;
        }

        // ========================================
        // 17. МОДАЛКА
        // ========================================
        function openModal(title, taskData) {
            modalTitle.textContent = title;
            modalOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';

            if (taskData) {
                taskName.value = taskData.name || '';
                taskCategory.value = taskData.category || 'Другое';
                taskDate.value = taskData.date || getToday();
                taskTime.value = taskData.time || '';
                taskDuration.value = taskData.duration || 30;
                taskNotes.value = taskData.notes || '';
                reminderOn = taskData.reminder || false;
                taskReminder.textContent = reminderOn ? 'Вкл' : 'Выкл';
                taskReminder.classList.toggle('active', reminderOn);
                taskIsHabit.checked = taskData.isHabit || false;
                habitDaysContainer.style.display = taskIsHabit.checked ? 'block' : 'none';
                editingTaskId = taskData.id || null;
            } else {
                taskName.value = '';
                taskCategory.value = 'Другое';
                taskDate.value = getToday();
                taskTime.value = '';
                taskDuration.value = 30;
                taskNotes.value = '';
                reminderOn = false;
                taskReminder.textContent = 'Выкл';
                taskReminder.classList.remove('active');
                taskIsHabit.checked = false;
                habitDaysContainer.style.display = 'none';
                editingTaskId = null;
            }

            taskNameError.style.display = 'none';
            taskName.focus();

            // Обновляем кнопку
            modalSubmit.textContent = editingTaskId ? 'Сохранить' : 'Создать задачу';
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            document.body.style.overflow = '';
            editingTaskId = null;
        }

        // ========================================
        // 18. ОБРАБОТКА ФОРМЫ
        // ========================================
        function handleFormSubmit(e) {
            e.preventDefault();

            const name = taskName.value.trim();
            if (!name) {
                taskNameError.style.display = 'block';
                taskName.focus();
                return;
            }
            taskNameError.style.display = 'none';

            const task = {
                id: editingTaskId || generateId(),
                name: name,
                category: taskCategory.value,
                date: taskDate.value,
                time: taskTime.value || '',
                duration: parseInt(taskDuration.value) || 0,
                done: false,
                isHabit: taskIsHabit.checked,
                habitDays: taskIsHabit.checked ? habitDays : undefined,
                habitCurrentDay: taskIsHabit.checked ? 1 : undefined,
                notes: taskNotes.value.trim() || '',
                reminder: reminderOn,
            };

            if (editingTaskId) {
                // Редактирование
                const index = taskData.findIndex(t => t.id === editingTaskId);
                if (index !== -1) {
                    taskData[index] = { ...taskData[index], ...task };
                    showToast('✏️ Задача обновлена');
                }
            } else {
                // Новая задача
                if (task.isHabit) {
                    generateHabitTasks(task);
                } else {
                    addTask(task);
                    showToast('✅ Задача создана!');
                }
            }

            saveToLocalStorage();
            renderTasks(currentFilter);
            closeModal();
        }

        // ========================================
        // 19. ИНИЦИАЛИЗАЦИЯ
        // ========================================
        function init() {
            // Загрузка данных
            const hasData = loadFromLocalStorage();
            if (!hasData || taskData.length === 0) {
                initData();
            }

            // Применяем тему
            app.dataset.theme = currentTheme;

            // Рендер
            renderThemeButtons();
            renderTasks('all');
            renderGoals();
            renderCalendar();

            // ===== СОБЫТИЯ =====

            // Фильтры
            document.querySelectorAll('.tag-group .tag').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tag-group .tag').forEach(b => b.classList.remove('active-tag'));
                    this.classList.add('active-tag');
                    currentFilter = this.dataset.tag;
                    renderTasks(currentFilter);
                    showToast('Фильтр: ' + (currentFilter === 'all' ? 'Все' : this.textContent));
                });
            });

            // Кнопка "Новая задача"
            document.getElementById('btnAddTask').addEventListener('click', () => {
                openModal('Новая задача');
            });

            // Кнопка "Все готово"
            document.getElementById('btnCompleteAll').addEventListener('click', () => {
                const pending = taskData.filter(t => !t.done);
                if (pending.length === 0) {
                    showToast('🎉 Все уже выполнено!');
                    return;
                }
                if (confirm('Отметить все задачи как выполненные?')) {
                    const today = getToday();
                    let xpGain = 0;
                    pending.forEach(t => {
                        if (t.date <= today) {
                            t.done = true;
                            xpGain += calculateTaskXP(t.duration || 0);
                        }
                    });
                    saveToLocalStorage();
                    renderTasks(currentFilter);
                    showToast('✅ Все задачи выполнены! +' + xpGain + ' XP');
                }
            });

            // Кнопка "Сброс"
            document.getElementById('btnResetStats').addEventListener('click', () => {
                if (confirm('Сбросить все задачи?')) {
                    taskData = taskData.map(t => ({ ...t, done: false }));
                    saveToLocalStorage();
                    renderTasks('all');
                    // Сброс фильтра
                    document.querySelectorAll('.tag-group .tag').forEach(b => b.classList.remove('active-tag'));
                    document.querySelector('[data-tag="all"]').classList.add('active-tag');
                    currentFilter = 'all';
                    showToast('🔄 Статистика сброшена');
                }
            });

            // Модалка
            modalClose.addEventListener('click', closeModal);
            modalCancel.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // Форма
            taskForm.addEventListener('submit', handleFormSubmit);

            // Чекбокс привычки
            taskIsHabit.addEventListener('change', function() {
                habitDaysContainer.style.display = this.checked ? 'block' : 'none';
            });

            // Кнопки дней привычки
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    habitDays = parseInt(this.dataset.days);
                });
            });

            // Кнопка напоминания
            taskReminder.addEventListener('click', function() {
                reminderOn = !reminderOn;
                this.textContent = reminderOn ? 'Вкл' : 'Выкл';
                this.classList.toggle('active', reminderOn);
            });

            // Закрытие по Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            // Обновление при фокусе
            taskName.addEventListener('input', () => {
                if (taskName.value.trim()) {
                    taskNameError.style.display = 'none';
                }
            });

            console.log('🚀 Планировщик загружен!');
            console.log('📊 Задач:', taskData.length);
            console.log('🎯 Целей:', goalsData.length);
        }

        // ========================================
        // 20. ЗАПУСК
        // ========================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>

</body>
</html>
