<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал-календарь с RPG элементами</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ===== Глобальные переменные (будут переопределяться темами) ===== */
        :root {
            --bg: #f8f6f0;
            --card: #ffffff;
            --text: #2d2a24;
            --text-secondary: #5a5548;
            --border: #e0dbd0;
            --accent: #b8a48c;
            --accent-light: #d4c9b8;
            --shadow: rgba(0,0,0,0.08);
            --radius: 16px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --transition: 0.25s ease;
        }
        /* ===== Тёмный режим ===== */
        body.dark {
            --bg: #1a1a1a;
            --card: #2a2a2a;
            --text: #e8e4de;
            --text-secondary: #b0aaa0;
            --border: #3d3d3d;
            --accent: #8f7a64;
            --accent-light: #4d3f33;
            --shadow: rgba(0,0,0,0.4);
        }
        /* ===== Цветовые схемы (меняем акцент) ===== */
        body.theme-green {
            --accent: #4a8c6b;
            --accent-light: #a8d0b0;
        }
        body.theme-red {
            --accent: #b34a4a;
            --accent-light: #e0a0a0;
        }
        body.theme-blue {
            --accent: #4a7bb3;
            --accent-light: #a0c0e0;
        }
        body.theme-yellow {
            --accent: #b3a34a;
            --accent-light: #e0d0a0;
        }
        body.theme-orange {
            --accent: #b3804a;
            --accent-light: #e0c0a0;
        }
        body.theme-cyan {
            --accent: #4a9eb3;
            --accent-light: #a0d4e0;
        }
        body.theme-purple {
            --accent: #8a4ab3;
            --accent-light: #d0a0e0;
        }
        /* ===== Сброс и общие стили ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .app {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* ===== Навигация ===== */
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--card);
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: 0 2px 12px var(--shadow);
            border: 1px solid var(--border);
            align-items: center;
        }
        nav button {
            background: transparent;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        nav button:hover {
            background: var(--accent-light);
            color: var(--text);
        }
        nav button.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .nav-right {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .theme-toggle, .dark-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text);
        }
        .theme-toggle select {
            background: transparent;
            border: none;
            color: var(--text);
            font-weight: 600;
            outline: none;
        }
        /* ===== Панели (страницы) ===== */
        .page {
            display: none;
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 12px var(--shadow);
            transition: background var(--transition), border var(--transition);
        }
        .page.active {
            display: block;
        }
        h2 {
            font-weight: 500;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: var(--text);
            border-bottom: 2px solid var(--accent-light);
            padding-bottom: 8px;
        }
        /* ===== Персонаж ===== */
        .profile-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 24px;
            align-items: start;
        }
        .avatar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 600;
            color: var(--text);
            border: 3px solid var(--accent);
            overflow: hidden;
            cursor: pointer;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-input {
            display: none;
        }
        .profile-fields {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .profile-fields label {
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .profile-fields input {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
        }
        .exp-bar {
            margin-top: 16px;
            background: var(--bg);
            border-radius: 30px;
            height: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
        }
        .exp-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }
        .exp-label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text);
        }
        /* ===== Журналы ===== */
        .journals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .journal-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 16px;
            border-left: 4px solid var(--accent);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .journal-card:hover {
            transform: translateY(-2px);
        }
        .journal-card h3 {
            font-weight: 600;
            font-size: 1rem;
        }
        .journal-card .exp {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .journal-card .tasks-count {
            font-size: 0.75rem;
            background: var(--accent-light);
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 6px;
        }
        /* ===== Модальное окно ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px var(--shadow);
        }
        .modal h3 {
            margin-bottom: 16px;
            font-weight: 500;
        }
        .modal label {
            display: block;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .modal .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .modal .row > * {
            flex: 1;
            min-width: 120px;
        }
        .modal .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 30px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        /* ===== Календарь ===== */
        .cal-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }
        .cal-controls button {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 4px 16px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text);
        }
        .cal-controls button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .cal-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-left: auto;
        }
        .cal-filters label {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg);
            padding: 2px 10px;
            border-radius: 20px;
            cursor: pointer;
        }
        .cal-filters input[type="checkbox"] {
            accent-color: var(--accent);
        }
        .cal-grid {
            display: grid;
            gap: 4px;
            margin-top: 12px;
        }
        .cal-grid.week {
            grid-template-columns: repeat(7, 1fr);
        }
        .cal-grid.month {
            grid-template-columns: repeat(7, 1fr);
        }
        .cal-day {
            background: var(--bg);
            border-radius: 8px;
            padding: 6px 4px;
            text-align: center;
            font-size: 0.8rem;
            min-height: 60px;
            position: relative;
            border: 1px solid transparent;
            cursor: pointer;
            transition: border 0.15s;
        }
        .cal-day:hover {
            border-color: var(--accent);
        }
        .cal-day .date {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .cal-day .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            justify-content: center;
            margin-top: 4px;
        }
        .cal-day .badge {
            font-size: 0.6rem;
            background: var(--accent-light);
            color: var(--text);
            border-radius: 10px;
            padding: 0 6px;
            line-height: 1.4;
        }
        .cal-day .badge.empty {
            background: transparent;
        }
        .cal-day.today {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .cal-day.other-month {
            opacity: 0.4;
        }
        /* ===== Списки задач в календаре ===== */
        .day-tasks {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            background: var(--bg);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            font-size: 0.9rem;
        }
        .task-item .done {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .task-item .missed {
            opacity: 0.4;
        }
        .task-item button {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }
        /* ===== Цели ===== */
        .goal-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent);
        }
        .goal-card .progress {
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .goal-card .progress .fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }
        /* ===== Вес ===== */
        .weight-chart-wrap {
            max-width: 100%;
            height: 250px;
            margin: 16px 0;
        }
        /* ===== Статистика ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 14px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent);
        }
        /* ===== Галерея ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .gallery-item {
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--bg);
            border: 1px solid var(--border);
            position: relative;
        }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }
        .gallery-item .meta {
            padding: 6px 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        /* ===== Адаптив ===== */
        @media (max-width: 700px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
            .nav-right {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
            }
        }
        /* ===== Скролл ===== */
        .modal::-webkit-scrollbar {
            width: 6px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: var(--accent-light);
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Навигация -->
    <nav>
        <button class="active" data-page="profile">👤 Профиль</button>
        <button data-page="journals">📚 Журналы</button>
        <button data-page="calendar">📅 Календарь</button>
        <button data-page="goals">🎯 Цели</button>
        <button data-page="gallery">🖼 Галерея</button>
        <button data-page="weight">⚖️ Вес</button>
        <button data-page="stats">📊 Статистика</button>
        <div class="nav-right">
            <span class="theme-toggle">
                Тема: <select id="themeSelect">
                    <option value="default">Мрамор</option>
                    <option value="green">Зелёный</option>
                    <option value="red">Красный</option>
                    <option value="blue">Синий</option>
                    <option value="yellow">Жёлтый</option>
                    <option value="orange">Оранжевый</option>
                    <option value="cyan">Голубой</option>
                    <option value="purple">Фиолетовый</option>
                </select>
            </span>
            <button class="dark-toggle" id="darkToggle">🌙 Тёмный</button>
        </div>
    </nav>

    <!-- Страницы -->
    <!-- Профиль -->
    <div class="page active" id="page-profile">
        <h2>Персонаж</h2>
        <div class="profile-grid">
            <div class="avatar-wrap">
                <div class="avatar" id="avatarPreview">👤</div>
                <input type="file" accept="image/*" class="avatar-input" id="avatarInput">
                <button class="btn" id="uploadAvatarBtn">Загрузить фото</button>
                <span style="font-size:0.75rem; color:var(--text-secondary);">Нажмите на аватар или кнопку</span>
            </div>
            <div>
                <div class="profile-fields">
                    <label>Имя <input id="pName" value="Герой"></label>
                    <label>Возраст <input id="pAge" type="number" value="25"></label>
                    <label>Вес (кг) <input id="pWeight" type="number" step="0.1" value="70"></label>
                    <label>Рост (см) <input id="pHeight" type="number" step="0.1" value="175"></label>
                    <label>Грудь <input id="pChest" type="number" step="0.5" value="100"></label>
                    <label>Талия <input id="pWaist" type="number" step="0.5" value="80"></label>
                    <label>Бёдра <input id="pHips" type="number" step="0.5" value="100"></label>
                    <label>Бицепс <input id="pBiceps" type="number" step="0.5" value="35"></label>
                </div>
                <div class="exp-bar">
                    <div class="exp-fill" id="expFill" style="width:0%"></div>
                    <div class="exp-label" id="expLabel">Уровень 1 (0 опыта)</div>
                </div>
                <button class="btn" id="saveProfileBtn" style="margin-top:16px;">Сохранить профиль</button>
            </div>
        </div>
    </div>

    <!-- Журналы -->
    <div class="page" id="page-journals">
        <h2>Журналы</h2>
        <div class="journals-grid" id="journalsGrid"></div>
        <button class="btn" id="addTaskBtn" style="margin-top:16px;">+ Новая задача</button>
    </div>

    <!-- Календарь -->
    <div class="page" id="page-calendar">
        <h2>Календарь</h2>
        <div class="cal-controls">
            <button data-view="day">День</button>
            <button data-view="week" class="active">Неделя</button>
            <button data-view="month">Месяц</button>
            <button data-view="year">Год</button>
            <span style="margin-left:12px;">
                <button id="calPrev">◀</button>
                <span id="calTitle" style="font-weight:500; margin:0 10px;">Неделя</span>
                <button id="calNext">▶</button>
            </span>
            <div class="cal-filters" id="calFilters"></div>
        </div>
        <div id="calContainer"></div>
        <div id="dayTasksContainer" class="day-tasks" style="margin-top:16px;"></div>
    </div>

    <!-- Цели -->
    <div class="page" id="page-goals">
        <h2>Цели</h2>
        <button class="btn" id="addGoalBtn">+ Новая цель</button>
        <div id="goalsList" style="margin-top:16px;"></div>
    </div>

    <!-- Галерея -->
    <div class="page" id="page-gallery">
        <h2>Галерея</h2>
        <button class="btn" id="addPhotoBtn">+ Добавить фото</button>
        <div class="gallery-grid" id="galleryGrid" style="margin-top:16px;"></div>
    </div>

    <!-- Вес -->
    <div class="page" id="page-weight">
        <h2>Журнал веса</h2>
        <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:end;">
            <label>Дата <input type="date" id="weightDate"></label>
            <label>Вес (кг) <input type="number" step="0.1" id="weightValue"></label>
            <button class="btn" id="addWeightBtn">Добавить</button>
        </div>
        <div class="weight-chart-wrap">
            <canvas id="weightChart"></canvas>
        </div>
        <div id="weightList" style="margin-top:12px;"></div>
    </div>

    <!-- Статистика -->
    <div class="page" id="page-stats">
        <h2>Статистика</h2>
        <div class="stats-grid" id="statsCards"></div>
        <div style="max-width:500px; margin:20px 0;">
            <canvas id="statsChart"></canvas>
        </div>
        <div id="statsDetails" style="font-size:0.9rem;"></div>
    </div>
</div>

<!-- Модальное окно (универсальное) -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent">
        <h3 id="modalTitle">Заголовок</h3>
        <div id="modalBody"></div>
        <div class="btn-group">
            <button class="btn-secondary" id="modalCancel">Отмена</button>
            <button class="btn" id="modalConfirm">ОК</button>
        </div>
    </div>
</div>

<script>
    // =====================================================================
    //  1.  Работа с IndexedDB (для фото)
    // =====================================================================
    const DB_NAME = 'RPGJournalDB';
    const STORE_NAME = 'photos';
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                }
            };
            request.onsuccess = (e) => { db = e.target.result; resolve(db); };
            request.onerror = (e) => reject(e.target.error);
        });
    }

    function savePhotoToDB(photoData) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.add(photoData);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    function getAllPhotos() {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    function deletePhotoFromDB(id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.delete(id);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    }

    // =====================================================================
    //  2.  Основные данные (localStorage)
    // =====================================================================
    const STORAGE_KEY = 'rpg_journal_data';
    let data = {};

    function loadData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try { data = JSON.parse(raw); } catch(e) { data = getDefaultData(); }
        } else {
            data = getDefaultData();
        }
        // миграции
        if (!data.tasks) data.tasks = [];
        if (!data.goals) data.goals = [];
        if (!data.weightLog) data.weightLog = [];
        if (!data.journals) data.journals = getDefaultJournals();
        if (!data.profile) data.profile = getDefaultProfile();
        // Конвертируем старые форматы, если нужно
        data.tasks.forEach(t => {
            if (!t.completedDates) t.completedDates = [];
            if (!t.missedDates) t.missedDates = [];
        });
        saveData();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // =====================================================================
    //  3.  Вспомогательные функции
    // =====================================================================
    function getJournalByName(name) {
        return data.journals.find(j => j.name === name);
    }

    function getTaskById(id) {
        return data.tasks.find(t => t.id === id);
    }

    function formatDate(d) {
        const dt = new Date(d);
        return dt.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function dateToStr(date) {
        const d = new Date(date);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function parseDate(str) {
        const parts = str.split('-');
        return new Date(parts[0], parts[1]-1, parts[2]);
    }

    function isSameDay(d1, d2) {
        return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
    }

    function getDaysInMonth(year, month) {
        return new Date(year, month, 0).getDate();
    }

    function getWeekNumber(d) {
        const temp = new Date(d);
        temp.setHours(0,0,0,0);
        const startOfYear = new Date(temp.getFullYear(), 0, 1);
        const diff = (temp - startOfYear + (startOfYear.getTimezoneOffset()-temp.getTimezoneOffset())*60000) / 86400000;
        return Math.ceil((diff + startOfYear.getDay() + 1) / 7);
    }

    // =====================================================================
    //  4.  Управление задачами и опытом
    // =====================================================================
    function createTask(taskData) {
        const newTask = {
            id: Date.now() + Math.random()*1000,
            title: taskData.title,
            journal: taskData.journal,
            startDate: taskData.startDate, // 'YYYY-MM-DD'
            endDate: taskData.endDate || taskData.startDate,
            daysOfWeek: taskData.daysOfWeek || [], // [0-6] 0=воскресенье
            time: taskData.time || '09:00',
            duration: taskData.duration || 30, // minutes
            note: taskData.note || '',
            reminderMinutes: taskData.reminderMinutes || 0,
            goalId: taskData.goalId || null,
            completedDates: [], // array of 'YYYY-MM-DD'
            missedDates: [],
        };
        data.tasks.push(newTask);
        saveData();
        return newTask;
    }

    // Получить все даты (вхождения) для задачи в заданном периоде
    function getTaskOccurrences(task, fromDate, toDate) {
        const start = parseDate(task.startDate);
        const end = parseDate(task.endDate);
        const from = new Date(fromDate);
        const to = new Date(toDate);
        const result = [];
        let current = new Date(Math.max(start, from));
        while (current <= Math.min(end, to)) {
            const dayOfWeek = current.getDay(); // 0=воскр
            if (task.daysOfWeek.length === 0 || task.daysOfWeek.includes(dayOfWeek)) {
                result.push(dateToStr(current));
            }
            current.setDate(current.getDate() + 1);
        }
        return result;
    }

    // Отметить выполнение задачи для конкретной даты
    function completeTaskInstance(taskId, dateStr) {
        const task = getTaskById(taskId);
        if (!task) return false;
        if (task.completedDates.includes(dateStr)) return false; // уже выполнено
        const now = new Date();
        const taskDate = parseDate(dateStr);
        const isLate = now > taskDate && !isSameDay(now, taskDate);
        // начисляем опыт
        const expJournal = task.duration * 0.01;
        const expTotal = task.duration * 0.005;
        if (isLate) {
            // половина
            const journal = getJournalByName(task.journal);
            if (journal) journal.exp += expJournal * 0.5;
            data.profile.totalExp += expTotal * 0.5;
        } else {
            const journal = getJournalByName(task.journal);
            if (journal) journal.exp += expJournal;
            data.profile.totalExp += expTotal;
        }
        // обновляем уровень
        recalcLevel();
        task.completedDates.push(dateStr);
        saveData();
        return true;
    }

    // Автоматически пометить пропущенные даты (для всех задач)
    function autoMissTasks() {
        const now = new Date();
        const todayStr = dateToStr(now);
        data.tasks.forEach(task => {
            const allDates = getTaskOccurrences(task, task.startDate, task.endDate);
            allDates.forEach(d => {
                const dObj = parseDate(d);
                if (dObj < now && !isSameDay(dObj, now) && !task.completedDates.includes(d) && !task.missedDates.includes(d)) {
                    task.missedDates.push(d);
                }
            });
        });
        saveData();
    }

    function recalcLevel() {
        const exp = data.profile.totalExp;
        let level = 1;
        let needed = 100; // пример: 1 ур = 100 опыта, 2 = 200, 3 = 300 ...
        while (exp >= needed) {
            level++;
            needed = level * 100;
        }
        data.profile.level = level;
        saveData();
    }

    function renderProfile() {
        const p = data.profile;
        document.getElementById('pName').value = p.name;

        document.getElementById('pWeight').value = p.weight;
        document.getElementById('pHeight').value = p.height;
        document.getElementById('pChest').value = p.chest;
        document.getElementById('pWaist').value = p.waist;
        document.getElementById('pHips').value = p.hips;
        document.getElementById('pBiceps').value = p.biceps;
        // Аватар
        const avatarEl = document.getElementById('avatarPreview');
        if (p.avatar) {
            avatarEl.innerHTML = `<img src="${p.avatar}" alt="avatar">`;
        } else {
            avatarEl.innerHTML = p.name.charAt(0).toUpperCase();
        }
        // Опыт и уровень
        const exp = p.totalExp;
        const level = p.level;
        const needed = level * 100;
        const percent = Math.min(100, (exp / needed) * 100);
        document.getElementById('expFill').style.width = percent + '%';
        document.getElementById('expLabel').textContent = `Уровень ${level} (${Math.floor(exp)} / ${needed} опыта)`;
    }

        const d = new Date(date);

                    renderAll();

    function renderWeekView(container, baseDate, tasks) {
        const start = new Date(baseDate);
        start.setDate(start.getDate() - start.getDay()); // воскресенье
        const grid = document.createElement('div');
        grid.className = 'cal-grid week';
        for (let i = 0; i < 7; i++) {
            const day = new Date(start);
            day.setDate(day.getDate() + i);
            const dateStr = dateToStr(day);
            const dayTasks = tasks.filter(t => getTaskOccurrences(t, t.startDate, t.endDate).includes(dateStr));
            const badgeCounts = {};
            dayTasks.forEach(t => {
                badgeCounts[t.journal] = (badgeCounts[t.journal] || 0) + 1;
            });
            const div = document.createElement('div');
            div.className = 'cal-day';
            if (isSameDay(day, new Date())) div.classList.add('today');
            div.innerHTML = `
                <div class="date">${day.getDate()}</div>
                <div class="badges">
                    ${Object.entries(badgeCounts).map(([j, cnt]) => `<span class="badge">${j}:${cnt}</span>`).join('')}
                    ${Object.keys(badgeCounts).length === 0 ? '<span class="badge empty">—</span>' : ''}
                </div>
            `;
            div.addEventListener('click', () => {
                // переключиться на день
                const view = 'day';
                const base = new Date(day);
                setCalView(view, base);
            });
            grid.appendChild(div);
        }
        container.appendChild(grid);
    }

        const year = baseDate.getFullYear();

        const daysNames = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        daysNames.forEach(d => {
            const header = document.createElement('div');
            header.style.fontWeight='600'; header.style.fontSize='0.7rem'; header.style.textAlign='center';
            header.textContent = d;
            grid.appendChild(header);
        });
        // Пустые ячейки до первого дня
        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'cal-day other-month';
            empty.innerHTML = '<div class="date"></div>';
            grid.appendChild(empty);
        }
        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, month, d);
            const dateStr = dateToStr(dateObj);
            const dayTasks = tasks.filter(t => getTaskOccurrences(t, t.startDate, t.endDate).includes(dateStr));
            const badgeCounts = {};
            dayTasks.forEach(t => {
                badgeCounts[t.journal] = (badgeCounts[t.journal] || 0) + 1;
            });
            const div = document.createElement('div');
            div.className = 'cal-day';
            if (isSameDay(dateObj, new Date())) div.classList.add('today');
            div.innerHTML = `
                <div class="date">${d}</div>
                <div class="badges">
                    ${Object.entries(badgeCounts).map(([j, cnt]) => `<span class="badge">${j}:${cnt}</span>`).join('')}
                    ${Object.keys(badgeCounts).length === 0 ? '<span class="badge empty">—</span>' : ''}
                </div>
            `;
            div.addEventListener('click', () => {
                setCalView('day', dateObj);
            });
            grid.appendChild(div);
        }
        container.appendChild(grid);
    }

    function renderYearView(container, baseDate, tasks) {
        const year = baseDate.getFullYear();
        const grid = document.createElement('div');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
        grid.style.gap = '12px';
        for (let m = 0; m < 12; m++) {
            const monthDiv = document.createElement('div');
            monthDiv.style.background = 'var(--bg)';
            monthDiv.style.borderRadius = 'var(--radius)';
            monthDiv.style.padding = '8px';
            monthDiv.style.cursor = 'pointer';
            const monthName = new Date(year, m, 1).toLocaleString('ru-RU', { month:'long' });
            let hasTasks = false;
            for (let d = 1; d <= getDaysInMonth(year, m+1); d++) {
                const dateStr = dateToStr(new Date(year, m, d));
                if (tasks.some(t => getTaskOccurrences(t, t.startDate, t.endDate).includes(dateStr))) {
                    hasTasks = true;
                    break;
                }
            }
            monthDiv.innerHTML = `
                <div style="font-weight:500;">${monthName}</div>
                <div style="font-size:0.8rem; color:var(--text-secondary);">${hasTasks ? '📌 есть задачи' : '—'}</div>
            `;
            monthDiv.addEventListener('click', () => {
                setCalView('month', new Date(year, m, 1));

            grid.appendChild(monthDiv);

    function renderGoals() {
        const container = document.getElementById('goalsList');
        container.innerHTML = '';
        data.goals.forEach(goal => {
            const card = document.createElement('div');
            card.className = 'goal-card';
            // Прогресс: процент выполненных задач (всех вхождений) относительно запланированных до сегодня
            const now = new Date();
            let totalPlanned = 0;
            let totalDone = 0;
            data.tasks.filter(t => t.goalId === goal.id).forEach(task => {
                const occ = getTaskOccurrences(task, task.startDate, task.endDate);
                occ.forEach(d => {
                    const dObj = parseDate(d);
                    if (dObj <= now) {
                        totalPlanned++;
                        if (task.completedDates.includes(d)) totalDone++;
                    }
                });
            });
            const percent = totalPlanned === 0 ? 0 : (totalDone / totalPlanned) * 100;
            const isAchieved = goal.achieved || false;
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <strong>${goal.title}</strong>
                    <span style="font-size:0.8rem; color:var(--text-secondary);">Дедлайн: ${formatDate(goal.deadline)}</span>
                </div>
                <div style="font-size:0.85rem; margin-top:4px;">${goal.description || ''}</div>
                <div class="progress">
                    <div class="fill" style="width:${Math.min(100, percent)}%;"></div>
                </div>
                <div style="font-size:0.75rem; margin-top:4px; display:flex; justify-content:space-between;">
                    <span>${Math.floor(percent)}% выполнено</span>
                    <span>${isAchieved ? '✅ Достигнута!' : 'В процессе'}</span>
                </div>
                <div style="margin-top:8px; display:flex; gap:6px;">
                    <button class="btn" style="padding:2px 12px; font-size:0.7rem;" data-goal="${goal.id}" data-action="edit">Редактировать</button>
                    <button class="btn-secondary" style="padding:2px 12px; font-size:0.7rem;" data-goal="${goal.id}" data-action="delete">Удалить</button>
                </div>
            `;
            container.appendChild(card);
        });
        // Обработчики
        container.querySelectorAll('[data-goal]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = Number(btn.dataset.goal);
                const action = btn.dataset.action;
                if (action === 'delete') {
                    if (confirm('Удалить цель?')) {
                        data.goals = data.goals.filter(g => g.id !== id);
                        saveData();
                        renderGoals();
                    }
                } else if (action === 'edit') {
                    editGoal(id);
                }
            });
        });
    }

        const cancelBtn = document.getElementById('modalCancel');
        const newConfirm = confirmBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
        const newCancel = cancelBtn.cloneNode(true);
        cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

        newCancel.addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('open');
        });
        newConfirm.addEventListener('click', () => {
            const title = document.getElementById('goalTitle').value.trim();
            const desc = document.getElementById('goalDesc').value.trim();
            const deadline = document.getElementById('goalDeadline').value;
            const checkpointsRaw = document.getElementById('goalCheckpoints').value;
            const checkpoints = checkpointsRaw.split(',').map(s => s.trim()).filter(s => s);
            const taskSelect = document.getElementById('goalTasks');
            const taskIds = Array.from(taskSelect.selectedOptions).map(opt => Number(opt.value));
            if (!title || !deadline) {
                alert('Заполните название и дату');
                return;
            }
            if (isEdit) {
                const goal = data.goals.find(g => g.id === goalData.id);
                if (goal) {
                    goal.title = title;
                    goal.description = desc;
                    goal.deadline = deadline;
                    goal.checkpoints = checkpoints;
                    goal.taskIds = taskIds;
                }
            } else {
                data.goals.push({
                    id: Date.now() + Math.random()*1000,
                    title,
                    description: desc,
                    deadline,
                    checkpoints,
                    taskIds,
                    achieved: false,
                });
            }
            saveData();
            document.getElementById('modalOverlay').classList.remove('open');
            renderGoals();
            // Проверить автоматическое достижение целей
            checkGoalsAchievement();
        });
    }

    function editGoal(id) {
        const goal = data.goals.find(g => g.id === id);
        if (goal) openGoalModal(goal);
    }

    function checkGoalsAchievement() {
        data.goals.forEach(goal => {
            if (goal.achieved) return;
            const now = new Date();
            // Если все задачи выполнены до дедлайна
            const taskIds = goal.taskIds || [];
            let allDone = true;
            taskIds.forEach(tid => {
                const task = getTaskById(tid);
                if (!task) return;
                const occ = getTaskOccurrences(task, task.startDate, task.endDate);
                const deadlineDate = parseDate(goal.deadline);
                occ.forEach(d => {
                    const dObj = parseDate(d);
                    if (dObj <= deadlineDate && !task.completedDates.includes(d) && !task.missedDates.includes(d)) {
                        allDone = false;
                    }
                });
            });
            if (allDone && taskIds.length > 0) {
                goal.achieved = true;
                // Бонус 0.05 к общему опыту
                data.profile.totalExp += 0.05;
                recalcLevel();
                saveData();
                alert(`Цель "${goal.title}" достигнута! +0.05 опыта`);
                renderAll();
            }
        });
    }

    // =====================================================================
    //  7.  Вес
    // =====================================================================
    let weightChartInstance = null;

    function renderWeight() {
        const list = document.getElementById('weightList');
        list.innerHTML = '';
        data.weightLog.sort((a,b) => a.date.localeCompare(b.date));
        data.weightLog.forEach(w => {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.padding = '4px 0';
            div.style.borderBottom = '1px solid var(--border)';
            div.innerHTML = `
                <span>${formatDate(w.date)}</span>
                <span>${w.value} кг</span>
                <button class="btn-secondary" style="padding:0 12px; font-size:0.7rem;" data-date="${w.date}">Удалить</button>
            `;
            list.appendChild(div);
        });
        // Обработчики удаления
        list.querySelectorAll('[data-date]').forEach(btn => {
            btn.addEventListener('click', () => {
                const date = btn.dataset.date;
                data.weightLog = data.weightLog.filter(w => w.date !== date);
                saveData();
                renderWeight();
                updateWeightChart();
            });
        });
        updateWeightChart();
    }

    function updateWeightChart() {
        const ctx = document.getElementById('weightChart').getContext('2d');
        if (weightChartInstance) weightChartInstance.destroy();
        if (data.weightLog.length < 2) {
            weightChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: ['Нет данных'], datasets: [{ label: 'Вес', data: [0] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
            return;
        }
        const sorted = [...data.weightLog].sort((a,b) => a.date.localeCompare(b.date));
        const labels = sorted.map(w => formatDate(w.date));
        const values = sorted.map(w => w.value);
        weightChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: 'Вес (кг)',
                    data: values,
                    borderColor: 'var(--accent)',
                    backgroundColor: 'var(--accent-light)',
                    fill: true,
                    tension: 0.2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: 'var(--text)' } } },
                scales: {
                    y: { ticks: { color: 'var(--text-secondary)' } },
                    x: { ticks: { color: 'var(--text-secondary)' } }
                }
            }
        });
    }

    // =====================================================================
    //  8.  Галерея (IndexedDB)
    // =====================================================================
    async function renderGallery() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '';
        const photos = await getAllPhotos();
        photos.forEach(photo => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${photo.data}" alt="Фото">
                <div class="meta">${photo.date ? formatDate(photo.date) : ''} ${photo.note ? photo.note : ''}</div>
                <button class="btn-secondary" style="position:absolute; top:4px; right:4px; padding:2px 8px; font-size:0.7rem;" data-id="${photo.id}">✕</button>
            `;
            grid.appendChild(item);
        });
        // Удаление фото
        grid.querySelectorAll('[data-id]').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = Number(btn.dataset.id);
                if (confirm('Удалить фото?')) {
                    await deletePhotoFromDB(id);
                    renderGallery();
                }
            });

    // =====================================================================
    //  9.  Статистика
    // =====================================================================
    let statsChartInstance = null;

    function renderStats() {
        const cards = document.getElementById('statsCards');
        const totalTasks = data.tasks.length;
        let totalCompleted = 0;
        let totalMissed = 0;
        data.tasks.forEach(t => {
            totalCompleted += t.completedDates.length;
            totalMissed += t.missedDates.length;
        });
        const totalAll = totalCompleted + totalMissed;
        cards.innerHTML = `
            <div class="stat-card"><div class="number">${totalTasks}</div><div>Всего задач</div></div>
            <div class="stat-card"><div class="number">${totalCompleted}</div><div>Выполнено</div></div>
            <div class="stat-card"><div class="number">${totalMissed}</div><div>Пропущено</div></div>
            <div class="stat-card"><div class="number">${totalAll > 0 ? Math.round(totalCompleted/totalAll*100) : 0}%</div><div>Продуктивность</div></div>
        `;
        // Статистика по журналам
        const details = document.getElementById('statsDetails');
        details.innerHTML = '<h4 style="margin-top:12px;">По журналам:</h4>';
        data.journals.forEach(j => {
            const tasks = data.tasks.filter(t => t.journal === j.name);
            const done = tasks.reduce((acc, t) => acc + t.completedDates.length, 0);
            const missed = tasks.reduce((acc, t) => acc + t.missedDates.length, 0);
            const total = done + missed;
            const pct = total > 0 ? Math.round(done/total*100) : 0;
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.padding = '4px 0';
            div.style.borderBottom = '1px solid var(--border)';
            div.innerHTML = `<span>${j.name}</span><span>${done}/${total} (${pct}%)</span>`;
            details.appendChild(div);
        });
        // График продуктивности по дням (последние 7 дней)
        updateStatsChart();
    }

    function updateStatsChart() {
        const ctx = document.getElementById('statsChart').getContext('2d');
        if (statsChartInstance) statsChartInstance.destroy();
        // Соберём данные за последние 7 дней
        const now = new Date();
        const labels = [];
        const doneData = [];
        const missedData = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i);
            const dateStr = dateToStr(d);
            labels.push(d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' }));
            let done = 0, missed = 0;
            data.tasks.forEach(t => {
                const occ = getTaskOccurrences(t, t.startDate, t.endDate);
                if (occ.includes(dateStr)) {
                    if (t.completedDates.includes(dateStr)) done++;
                    else if (t.missedDates.includes(dateStr)) missed++;
                }
            });
            doneData.push(done);
            missedData.push(missed);
        }
        statsChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'Выполнено', data: doneData, backgroundColor: 'var(--accent)' },
                    { label: 'Пропущено', data: missedData, backgroundColor: 'var(--text-secondary)' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: 'var(--text)' } } },
                scales: {
                    y: { beginAtZero: true, ticks: { color: 'var(--text-secondary)' } },
                    x: { ticks: { color: 'var(--text-secondary)' } }
                }
            }
        });
    }

    // =====================================================================
    //  10.  Навигация
    // =====================================================================
    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        document.querySelectorAll('nav button[data-page]').forEach(b => {
            b.classList.toggle('active', b.dataset.page === pageId);
        });
        // Обновляем контент при переключении
        if (pageId === 'profile') renderProfile();
        else if (pageId === 'journals') renderJournals();
        else if (pageId === 'calendar') { renderFilters(); applyFiltersAndRender(); }
        else if (pageId === 'goals') renderGoals();
        else if (pageId === 'gallery') renderGallery();
        else if (pageId === 'weight') { renderWeight(); }
        else if (pageId === 'stats') renderStats();
    }

    // =====================================================================
    //  11.  Общий рендер
    // =====================================================================
    function renderAll() {
        renderProfile();
        renderJournals();
        renderFilters();
        applyFiltersAndRender();
        renderGoals();
        renderGallery();
        renderWeight();
        renderStats();
    }

    // =====================================================================
    //  12.  Инициализация и события
    // =====================================================================
    document.addEventListener('DOMContentLoaded', async () => {
        // Открыть IndexedDB
        await openDB();

        // Загрузить данные
        loadData();
        autoMissTasks(); // проставить пропущенные

        // Навигация
        document.querySelectorAll('nav button[data-page]').forEach(btn => {
            btn.addEventListener('click', () => {
                switchPage(btn.dataset.page);
            });
        });

        // Календарь: кнопки вида
        document.querySelectorAll('.cal-controls [data-view]').forEach(btn => {
            btn.addEventListener('click', () => {
                setCalView(btn.dataset.view, calBaseDate);
            });
        });
        document.getElementById('calPrev').addEventListener('click', () => {
            const base = new Date(calBaseDate);
            if (calView === 'day') base.setDate(base.getDate() - 1);
            else if (calView === 'week') base.setDate(base.getDate() - 7);
            else if (calView === 'month') base.setMonth(base.getMonth() - 1);
            else if (calView === 'year') base.setFullYear(base.getFullYear() - 1);
            setCalView(calView, base);
        });
        document.getElementById('calNext').addEventListener('click', () => {
            const base = new Date(calBaseDate);
            if (calView === 'day') base.setDate(base.getDate() + 1);
            else if (calView === 'week') base.setDate(base.getDate() + 7);
            else if (calView === 'month') base.setMonth(base.getMonth() + 1);
            else if (calView === 'year') base.setFullYear(base.getFullYear() + 1);
            setCalView(calView, base);
        });

        // Кнопка "Новая задача"
        document.getElementById('addTaskBtn').addEventListener('click', () => {
            openTaskModal(null);
        });

        // Кнопка "Новая цель"
        document.getElementById('addGoalBtn').addEventListener('click', () => {
            openGoalModal(null);
        });

        // Кнопка "Добавить фото"
        document.getElementById('addPhotoBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const dataUrl = ev.target.result;
                    const photoData = {
                        data: dataUrl,
                        date: dateToStr(new Date()),
                        note: prompt('Введите описание (необязательно):') || '',
                    };
                    await savePhotoToDB(photoData);
                    renderGallery();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        });

        // Вес: добавить
        document.getElementById('addWeightBtn').addEventListener('click', () => {
            const date = document.getElementById('weightDate').value;
            const value = parseFloat(document.getElementById('weightValue').value);
            if (!date || isNaN(value)) {
                alert('Введите дату и вес');
                return;
            }
            // Проверим, есть ли уже запись на эту дату
            const existing = data.weightLog.find(w => w.date === date);
            if (existing) {
                if (!confirm('Запись на эту дату уже существует. Обновить?')) return;
                existing.value = value;
            } else {
                data.weightLog.push({ date, value });
            }
            saveData();
            renderWeight();
            document.getElementById('weightDate').value = '';
            document.getElementById('weightValue').value = '';
        });

        // Профиль: сохранить
        document.getElementById('saveProfileBtn').addEventListener('click', () => {
            const p = data.profile;
            p.name = document.getElementById('pName').value;
            p.age = Number(document.getElementById('pAge').value);
            p.weight = Number(document.getElementById('pWeight').value);
            p.height = Number(document.getElementById('pHeight').value);
            p.chest = Number(document.getElementById('pChest').value);
            p.waist = Number(document.getElementById('pWaist').value);
            p.hips = Number(document.getElementById('pHips').value);
            p.biceps = Number(document.getElementById('pBiceps').value);
            saveData();
            renderProfile();
            alert('Профиль сохранён');
        });

        // Аватар: загрузка
        document.getElementById('avatarPreview').addEventListener('click', () => {
            document.getElementById('avatarInput').click();
        });
        document.getElementById('uploadAvatarBtn').addEventListener('click', () => {
            document.getElementById('avatarInput').click();
        });
        document.getElementById('avatarInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                data.profile.avatar = ev.target.result;
                saveData();
                renderProfile();
            };
            reader.readAsDataURL(file);
        });

        // Тёмный режим
        document.getElementById('darkToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('darkToggle').textContent = isDark ? '☀️ Светлый' : '🌙 Тёмный';
            // Перерисовываем графики
            updateWeightChart();
            updateStatsChart();
        });

        // Тема
        document.getElementById('themeSelect').addEventListener('change', (e) => {
            const val = e.target.value;
            document.body.classList.remove('theme-green','theme-red','theme-blue','theme-yellow','theme-orange','theme-cyan','theme-purple');
            if (val !== 'default') {
                document.body.classList.add('theme-' + val);
            }
            // Перерисовываем графики
            updateWeightChart();
            updateStatsChart();
        });

        // Загружаем начальную страницу
        switchPage('profile');

        // Периодическая проверка пропусков и достижения целей
        setInterval(() => {
            autoMissTasks();
            checkGoalsAchievement();
            // Обновим календарь если он активен
            if (document.getElementById('page-calendar').classList.contains('active')) {
                applyFiltersAndRender();
            }
            renderAll(); // обновим всё
        }, 60000); // раз в минуту

        // Модальное окно: закрытие по клику вне
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('modalOverlay').classList.remove('open');
            }
        });

        // При первом запуске установим сегодняшнюю дату для веса
        const nowStr = dateToStr(new Date());
        document.getElementById('weightDate').value = nowStr;
    });

    // =====================================================================
    //  13.  Модалка для задачи
    // =====================================================================
    function openTaskModal(taskData) {
        const isEdit = !!taskData;
        const title = isEdit ? 'Редактировать задачу' : 'Новая задача';
        const modal = document.getElementById('modalContent');
        document.getElementById('modalTitle').textContent = title;
        const body = document.getElementById('modalBody');
        const journals = data.journals.map(j => j.name);
        const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        body.innerHTML = `
            <label>Название <input id="taskTitle" value="${isEdit ? taskData.title : ''}"></label>
            <label>Журнал <select id="taskJournal">
                ${journals.map(j => `<option value="${j}" ${isEdit && taskData.journal===j ? 'selected' : ''}>${j}</option>`).join('')}
            </select></label>
            <div class="row">
                <label>Дата начала <input type="date" id="taskStart" value="${isEdit ? taskData.startDate : dateToStr(new Date())}"></label>
                <label>Дата окончания <input type="date" id="taskEnd" value="${isEdit ? taskData.endDate : dateToStr(new Date())}"></label>
            </div>
            <label>Дни недели (зажмите Ctrl для множественного выбора)</label>
            <select id="taskDays" multiple style="height:60px;">
                ${days.map((d, idx) => `<option value="${idx}" ${isEdit && taskData.daysOfWeek && taskData.daysOfWeek.includes(idx) ? 'selected' : ''}>${d}</option>`).join('')}
            </select>
            <div class="row">
                <label>Время <input type="time" id="taskTime" value="${isEdit ? taskData.time : '09:00'}"></label>
                <label>Длительность (мин) <input type="number" id="taskDuration" value="${isEdit ? taskData.duration : 30}"></label>
            </div>
            <label>Заметка <textarea id="taskNote" rows="2">${isEdit ? taskData.note : ''}</textarea></label>
            <label>Напоминание за (мин) <input type="number" id="taskReminder" value="${isEdit ? taskData.reminderMinutes : 0}"></label>
            <label>Привязать к цели (необязательно)
                <select id="taskGoal">
                    <option value="">— нет —</option>
                    ${data.goals.map(g => `<option value="${g.id}" ${isEdit && taskData.goalId === g.id ? 'selected' : ''}>${g.title}</option>`).join('')}
                </select>
            </label>
        `;
        document.getElementById('modalOverlay').classList.add('open');

        const confirmBtn = document.getElementById('modalConfirm');
        const cancelBtn = document.getElementById('modalCancel');
        const newConfirm = confirmBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
        const newCancel = cancelBtn.cloneNode(true);
        cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

        newCancel.addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('open');
        });
        newConfirm.addEventListener('click', () => {
            const title = document.getElementById('taskTitle').value.trim();
            const journal = document.getElementById('taskJournal').value;
            const startDate = document.getElementById('taskStart').value;
            const endDate = document.getElementById('taskEnd').value;
            const daysSelect = document.getElementById('taskDays');
            const daysOfWeek = Array.from(daysSelect.selectedOptions).map(opt => Number(opt.value));
            const time = document.getElementById('taskTime').value;
            const duration = Number(document.getElementById('taskDuration').value);
            const note = document.getElementById('taskNote').value;
            const reminder = Number(document.getElementById('taskReminder').value);
            const goalId = document.getElementById('taskGoal').value ? Number(document.getElementById('taskGoal').value) : null;
            if (!title || !startDate || !endDate || !time || duration <= 0) {
                alert('Заполните все обязательные поля');
                return;
            }
            if (isEdit) {
                const task = getTaskById(taskData.id);
                if (task) {
                    task.title = title;
                    task.journal = journal;
                    task.startDate = startDate;
                    task.endDate = endDate;
                    task.daysOfWeek = daysOfWeek;
                    task.time = time;
                    task.duration = duration;
                    task.note = note;
                    task.reminderMinutes = reminder;
                    task.goalId = goalId;
                }
            } else {
                createTask({
                    title,
                    journal,
                    startDate,
                    endDate,
                    daysOfWeek,
                    time,
                    duration,
                    note,
                    reminderMinutes: reminder,
                    goalId,
                });
            }
            saveData();
            document.getElementById('modalOverlay').classList.remove('open');
            renderAll();
        });
    }
