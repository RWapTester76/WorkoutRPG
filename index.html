<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LVL UP · TRON EDITION</title>
  <!-- TRON-шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #03050a;
      color: #e0f0ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      letter-spacing: 0.5px;
    }

    #app {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      background: #0b0e17;
      box-shadow: 0 0 30px #00ffff33, 0 0 10px #ff00ff33;
      position: relative;
      border: 1px solid #00ffff55;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: #0d111c;
      border-bottom: 2px solid #00ffff;
      box-shadow: 0 0 20px #00ffffaa;
      border-radius: 8px 8px 0 0;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      color: #00ffff;
      text-transform: uppercase;
      text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
      background: linear-gradient(180deg, #00ffff 0%, #ff00ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-icon {
      background: none;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-size: 1.8rem;
      cursor: pointer;
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      transition: 0.3s;
      text-shadow: 0 0 10px #00ffff;
    }

    .btn-icon:hover {
      background: #00ffff22;
      box-shadow: 0 0 15px #00ffff;
    }

    .main-nav {
      background: #0d111c;
      border-bottom: 1px solid #00ffff55;
      padding: 0.8rem;
    }

    .main-nav.hidden {
      display: none;
    }

    .main-nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .main-nav li {
      background: transparent;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid #00ffff;
      font-size: 0.85rem;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff;
      letter-spacing: 1px;
      background: #0b0e17;
    }

    .main-nav li:hover {
      background: #00ffff22;
      box-shadow: 0 0 20px #00ffff, 0 0 10px #ff00ff;
      color: #ffffff;
      text-shadow: 0 0 12px #ffffff;
    }

    #screenContainer {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background: #0b0e17;
      border-radius: 0 0 8px 8px;
    }

    /* TRON-карточки */
    .profile-card, .quest-item, .note-card, .settings-section, .day-cell, .week-day-block, .quest-form {
      background: #0d111c;
      border: 1px solid #00ffff44;
      box-shadow: 0 0 15px #00ffff22, 0 0 5px #ff00ff11;
      border-radius: 12px;
      transition: 0.3s;
    }

    .profile-card {
      padding: 2rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #00ffff, #0066ff);
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      border: 2px solid #00ffff;
      box-shadow: 0 0 25px #00ffff;
    }

    .xp-bar {
      background: #000;
      height: 14px;
      border-radius: 10px;
      margin: 1rem 0;
      overflow: hidden;
      border: 1px solid #00ffff;
      box-shadow: inset 0 0 10px #00ffff33;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff00ff, #00ffff);
      box-shadow: 0 0 15px #ff00ff;
      border-radius: 10px;
      width: 0%;
      transition: width 0.4s;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin: 1.5rem 0;
    }

    .stat-item {
      background: #0d111c;
      border: 1px solid #00ffff44;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 10px #00ffff22;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 0.7rem 1.8rem;
      border-radius: 30px;
      font-weight: 600;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      text-shadow: 0 0 8px #00ffff;
      box-shadow: 0 0 10px #00ffff44;
    }

    .btn:hover {
      background: #00ffff22;
      box-shadow: 0 0 25px #00ffff, 0 0 15px #ff00ff;
      color: #fff;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Форма квеста */
    .quest-form-toggle {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      width: 100%;
      margin-bottom: 1.5rem;
      font-family: 'Orbitron', sans-serif;
    }

    .quest-form-toggle:hover {
      background: #00ffff22;
      box-shadow: 0 0 20px #00ffff;
    }

    .quest-form {
      display: none;
      padding: 1.5rem;
    }

    .quest-form.active {
      display: block;
    }

    .quest-form input,
    .quest-form select,
    .quest-form textarea {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.7rem;
      background: #000;
      border: 1px solid #00ffff55;
      border-radius: 8px;
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .quest-form input:focus,
    .quest-form select:focus,
    .quest-form textarea:focus {
      border-color: #ff00ff;
      box-shadow: 0 0 15px #ff00ff;
      outline: none;
    }

    .quest-form label {
      display: block;
      margin-bottom: 0.3rem;
      color: #00ffff;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .quest-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .quest-item {
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-left: 6px solid #00ffff;
    }

    .quest-item.completed {
      opacity: 0.5;
      border-left-color: #ff00ff;
      text-decoration: line-through;
    }

    .quest-info {
      flex: 1;
    }

    .quest-title {
      font-weight: 700;
      font-size: 1rem;
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff;
    }

    .quest-meta {
      font-size: 0.8rem;
      color: #aaa;
    }

    .quest-actions button {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 5px #00ffff;
      box-shadow: 0 0 10px #00ffff44;
      transition: 0.3s;
    }

    .quest-actions button:hover {
      background: #00ffff22;
      box-shadow: 0 0 20px #00ffff;
    }

    .quest-actions button:disabled {
      border-color: #555;
      color: #555;
      box-shadow: none;
      cursor: not-allowed;
    }

    .guild-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-right: 0.5rem;
      background: #ff00ff;
      color: #000;
      box-shadow: 0 0 10px #ff00ff;
    }

    /* Календарь */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .calendar-header h2 {
      font-size: 1.5rem;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
    }

    .calendar-nav {
      display: flex;
      gap: 0.5rem;
    }

    .calendar-nav button {
      background: transparent;
      border: 1px solid #00ffff;
      color: #00ffff;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      transition: 0.3s;
    }

    .calendar-nav button:hover {
      background: #00ffff22;
      box-shadow: 0 0 12px #00ffff;
    }

    .view-switcher {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      justify-content: center;
    }

    .view-switcher button {
      background: transparent;
      border: 1px solid #00ffff55;
      color: #aaa;
      padding: 0.5rem 1.2rem;
      border-radius: 25px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .view-switcher button.active {
      background: #00ffff22;
      border-color: #00ffff;
      color: #00ffff;
      box-shadow: 0 0 15px #00ffff;
      text-shadow: 0 0 8px #00ffff;
    }

    /* Фильтр гильдий (теперь под календарём) */
    .guild-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.5rem;
      justify-content: center;
    }

    .guild-filter-btn {
      background: transparent;
      border: 1px solid #ff00ff44;
      color: #aaa;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .guild-filter-btn.active {
      background: #ff00ff22;
      border-color: #ff00ff;
      color: #ff00ff;
      box-shadow: 0 0 15px #ff00ff;
      text-shadow: 0 0 8px #ff00ff;
    }

    /* Сетка месяца */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-bottom: 1rem;
    }

    .weekday-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      color: #00ffff;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 5px #00ffff;
    }

    .day-cell {
      padding: 0.6rem 0.2rem;
      min-height: 55px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #00ffff33;
      background: #0d111c;
    }

    .day-cell.today {
      border-color: #00ffff;
      box-shadow: 0 0 15px #00ffff;
    }

    .day-cell.other-month {
      opacity: 0.4;
    }

    .day-number {
      font-size: 0.9rem;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff;
    }

    .markers {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
      justify-content: center;
    }

    .marker {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ffff;
    }

    .marker.completed {
      background: #ff00ff;
      box-shadow: 0 0 6px #ff00ff;
    }

    .marker.overdue {
      background: #ff0055;
      box-shadow: 0 0 8px #ff0055;
    }

    .marker.planned {
      background: #00ffff;
      box-shadow: 0 0 6px #00ffff;
    }

    /* Заметки */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-card {
      padding: 1rem;
      border-left: 4px solid #00ffff;
    }

    .note-title {
      font-weight: bold;
      color: #ff00ff;
      text-shadow: 0 0 6px #ff00ff;
      margin-bottom: 0.5rem;
    }

    /* Настройки */
    .settings-section {
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .settings-section h3 {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      margin-bottom: 1rem;
    }

    .toggle-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ccc;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #000;
      border: 1px solid #00ffff;
      transition: 0.4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background-color: #00ffff;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffff;
    }

    input:checked + .slider {
      background-color: #ff00ff;
      border-color: #ff00ff;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: #fff;
    }

    .danger-btn {
      border-color: #ff0055;
      color: #ff0055;
      text-shadow: 0 0 8px #ff0055;
    }

    .danger-btn:hover {
      background: #ff005522;
      box-shadow: 0 0 20px #ff0055;
    }

    @media (max-width: 480px) {
      .main-nav li {
        font-size: 0.7rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="logo">LVL UP</h1>
      <button id="menuToggle" class="btn-icon" aria-label="Меню">☰</button>
    </header>

    <nav id="mainNav" class="main-nav hidden">
      <ul>
        <li data-screen="profile">🧙 Профиль</li>
        <li data-screen="calendar">📅 Календарь</li>
        <li data-screen="tasks">📋 Квесты</li>
        <li data-screen="guilds">🛡️ Гильдии</li>
        <li data-screen="goals">🎯 Эпик-квесты</li>
        <li data-screen="notes">📝 Заметки</li>
        <li data-screen="gallery">🖼️ Галерея</li>
        <li data-screen="stats">📊 Статистика</li>
        <li data-screen="settings">⚙️ Настройки</li>
        <li data-screen="info">ℹ️ Инфо</li>
      </ul>
    </nav>

    <main id="screenContainer"></main>
  </div>

  <script>
    const CalendarState = {
      currentDate: new Date(),
      view: 'month',
      selectedDay: null,
      guildFilter: null
    };

    const GUILDS = [
      { id: 'body', name: 'Тело', icon: '💪', color: '#ff00ff' },
      { id: 'creativity', name: 'Творчество', icon: '🎨', color: '#ff00ff' },
      { id: 'business', name: 'Бизнес', icon: '💼', color: '#ff00ff' },
      { id: 'habits', name: 'Привычки', icon: '🔄', color: '#ff00ff' },
      { id: 'oneoff', name: 'Одноразки', icon: '🗑️', color: '#ff00ff' },
      { id: 'travel', name: 'Путешествия', icon: '✈️', color: '#ff00ff' },
      { id: 'debts', name: 'Долги', icon: '💰', color: '#ff00ff' },
      { id: 'other', name: 'Другое', icon: '📦', color: '#ff00ff' },
      { id: 'nutrition', name: 'Питание', icon: '🍎', color: '#ff00ff' }
    ];

    const Storage = {
      get(key, def) {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : def;
      },
      set(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
      }
    };

    const GameState = {
      player: {
        name: 'Александр',
        lvl: 1,
        xp: 0.5,
        streak: 0,
        lastCompletedDate: null,
        get xpToNext() { return this.lvl * (this.lvl + 1) / 2; },
        get progress() {
          const currentLvlTotal = (this.lvl - 1) * this.lvl / 2;
          const needed = this.xpToNext - currentLvlTotal;
          const currentXp = this.xp - currentLvlTotal;
          return Math.min((currentXp / needed) * 100, 100).toFixed(0);
        }
      },
      tasks: Storage.get('tasks', []),
      notes: Storage.get('notes', []),
      settings: Storage.get('settings', { theme: 'tron' }) // только трон
    };

    function savePlayer() { Storage.set('player', GameState.player); }
    function saveTasks() { Storage.set('tasks', GameState.tasks); }
    function saveNotes() { Storage.set('notes', GameState.notes); }
    function saveSettings() { Storage.set('settings', GameState.settings); }

    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');
    const screenContainer = document.getElementById('screenContainer');

    menuToggle.addEventListener('click', () => mainNav.classList.toggle('hidden'));

    document.querySelectorAll('.main-nav li').forEach(item => {
      item.addEventListener('click', (e) => {
        renderScreen(e.target.dataset.screen);
        mainNav.classList.add('hidden');
      });
    });

    function renderScreen(screen) {
      switch (screen) {
        case 'profile': renderProfile(); break;
        case 'calendar': renderCalendar(); break;
        case 'tasks': renderTasks(); break;
        case 'guilds': renderGuilds(); break;
        case 'goals': renderGoals(); break;
        case 'notes': renderNotes(); break;
        case 'gallery': renderGallery(); break;
        case 'stats': renderStats(); break;
        case 'settings': renderSettings(); break;
        case 'info': renderInfo(); break;
        default: renderProfile();
      }
    }

    function renderProfile() {
      const p = GameState.player;
      screenContainer.innerHTML = `
        <div class="profile-card">
          <div class="avatar">🧙</div>
          <h2 style="color:#00ffff; text-shadow:0 0 10px #00ffff;">${p.name}</h2>
          <p style="color:#ccc;">Ур. ${p.lvl} · ${p.xp.toFixed(1)} XP</p>
          <div class="xp-bar"><div class="xp-fill" style="width:${p.progress}%"></div></div>
          <p style="font-size:0.8rem; color:#aaa;">До след. уровня: ${p.progress}%</p>
          <div class="stats-grid">
            <div class="stat-item"><span class="stat-value">${GameState.tasks.filter(t=>t.completed).length}</span><br>✅</div>
            <div class="stat-item"><span class="stat-value">${p.streak}</span><br>🔥 Комбо</div>
          </div>
        </div>`;
    }

    // Квесты
    function renderTasks() {
      const activeTasks = GameState.tasks.filter(t => !t.completed).sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
      const guildOptions = GUILDS.map(g => `<option value="${g.id}">${g.icon} ${g.name}</option>`).join('');
      const tasksHtml = activeTasks.length === 0
        ? '<p style="text-align:center; opacity:0.7;">Нет активных квестов</p>'
        : activeTasks.map(task => {
            const guild = GUILDS.find(g => g.id === task.category) || GUILDS[7];
            const today = new Date().toISOString().slice(0,10);
            const isFuture = task.date > today;
            return `<div class="quest-item ${task.completed?'completed':''}" style="border-left-color:${guild.color}">
              <div class="quest-info">
                <div class="quest-title"><span class="guild-badge" style="background:${guild.color}">${guild.icon} ${guild.name}</span> ${task.title}</div>
                <div class="quest-meta">📅 ${task.date} 🕒 ${task.time} · ⏱️ ${task.minutes} мин ${task.note ? '<br>📝 '+task.note : ''}</div>
              </div>
              <div class="quest-actions"><button ${isFuture?'disabled':''} onclick="completeQuest('${task.id}')">✔ Выполнить</button></div>
            </div>`;
          }).join('');

      screenContainer.innerHTML = `
        <button class="quest-form-toggle" onclick="toggleQuestForm()">➕ Новый квест</button>
        <div id="questForm" class="quest-form">
          <form onsubmit="addQuest(event)">
            <label>Гильдия</label><select id="questCategory" required>${guildOptions}</select>
            <label>Название</label><input type="text" id="questTitle" required placeholder="Что нужно сделать?">
            <label>Продолжительность (мин)</label><input type="number" id="questMinutes" required min="1" value="30">
            <label>Дата</label><input type="date" id="questDate" required>
            <label>Время</label><input type="time" id="questTime" required>
            <label>Заметка</label><textarea id="questNote" rows="2" placeholder="Детали..."></textarea>
            <button type="submit" class="btn" style="width:100%;">Создать квест</button>
          </form>
        </div>
        <div class="quest-list">${tasksHtml}</div>`;
      document.getElementById('questDate').value = new Date().toISOString().slice(0,10);
      document.getElementById('questTime').value = new Date().toTimeString().slice(0,5);
    }

    window.toggleQuestForm = () => document.getElementById('questForm')?.classList.toggle('active');
    window.addQuest = (event) => {
      event.preventDefault();
      const q = {
        id: Date.now().toString(36)+Math.random().toString(36).substring(2),
        category: document.getElementById('questCategory').value,
        title: document.getElementById('questTitle').value.trim(),
        minutes: parseInt(document.getElementById('questMinutes').value,10),
        date: document.getElementById('questDate').value,
        time: document.getElementById('questTime').value,
        note: document.getElementById('questNote').value.trim(),
        completed: false,
        dateCompleted: null,
        createdAt: new Date().toISOString()
      };
      if(!q.title || !q.date || !q.time || isNaN(q.minutes)) return;
      GameState.tasks.push(q);
      saveTasks();
      renderTasks();
    };

    window.completeQuest = (id) => {
      const task = GameState.tasks.find(t=>t.id===id);
      if(!task || task.completed) return;
      const today = new Date().toISOString().slice(0,10);
      if(task.date > today) { alert('Будущий квест нельзя выполнить!'); return; }
      task.completed = true;
      task.dateCompleted = today;
      GameState.player.xp += task.minutes * 0.01;
      checkLevelUp();
      updateStreak(today);
      saveTasks(); savePlayer();
      renderTasks();
    };

    function updateStreak(today) {
      const p = GameState.player;
      if(p.lastCompletedDate === today) return;
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
      const yesterdayStr = yesterday.toISOString().slice(0,10);
      p.streak = (p.lastCompletedDate === yesterdayStr) ? p.streak+1 : 1;
      p.lastCompletedDate = today;
      savePlayer();
    }

    function checkLevelUp() {
      const p = GameState.player;
      let needed = (p.lvl+1)*(p.lvl+2)/2;
      while(p.xp >= needed){ p.lvl++; needed = (p.lvl+1)*(p.lvl+2)/2; }
      savePlayer();
    }

    function getGuildColor(id) { return (GUILDS.find(g=>g.id===id)||{}).color || '#ff00ff'; }

    // Календарь (фильтр перемещён вниз)
    window.setCalendarView = (view) => {
      CalendarState.view = view;
      if(view==='day' && !CalendarState.selectedDay) CalendarState.selectedDay = new Date();
      renderCalendar();
    };
    window.setGuildFilter = (id) => {
      CalendarState.guildFilter = id;
      renderCalendar();
    };
    window.navigateCalendar = (delta) => {
      const {view, currentDate} = CalendarState;
      if(view==='month') currentDate.setMonth(currentDate.getMonth()+delta);
      else if(view==='week') currentDate.setDate(currentDate.getDate()+delta*7);
      else {
        const d = CalendarState.selectedDay || currentDate;
        d.setDate(d.getDate()+delta);
        CalendarState.selectedDay = new Date(d);
        CalendarState.currentDate = new Date(d);
        renderCalendar();
        return;
      }
      CalendarState.currentDate = new Date(currentDate);
      renderCalendar();
    };
    window.resetCalendarToday = () => {
      CalendarState.currentDate = new Date();
      CalendarState.selectedDay = new Date();
      renderCalendar();
    };
    window.goToDay = (dateStr) => {
      CalendarState.selectedDay = new Date(dateStr);
      CalendarState.view = 'day';
      renderCalendar();
    };

    function getStartOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay();
      d.setDate(d.getDate() - (day===0?6:day-1));
      return d;
    }

    function getFilteredTasks(filter) {
      let tasks = GameState.tasks;
      if(filter) tasks = tasks.filter(t=>t.category===filter);
      return tasks;
    }

    function renderCalendar() {
      const { currentDate, view, selectedDay, guildFilter } = CalendarState;
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      let headerHtml = '';
      if (view === 'month') headerHtml = `<h2>${currentDate.toLocaleString('ru',{month:'long'})} ${year}</h2>`;
      else if (view === 'week') {
        const start = getStartOfWeek(currentDate);
        const end = new Date(start); end.setDate(end.getDate()+6);
        headerHtml = `<h2>${start.getDate()}–${end.getDate()} ${end.toLocaleString('ru',{month:'long'})} ${end.getFullYear()}</h2>`;
      } else {
        const d = selectedDay || currentDate;
        headerHtml = `<h2>${d.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>`;
      }

      const viewSwitcher = `
        <div class="view-switcher">
          <button class="${view==='month'?'active':''}" onclick="setCalendarView('month')">Месяц</button>
          <button class="${view==='week'?'active':''}" onclick="setCalendarView('week')">Неделя</button>
          <button class="${view==='day'?'active':''}" onclick="setCalendarView('day')">День</button>
        </div>`;

      let content = '';
      if (view === 'month') content = renderMonthView(year, month, guildFilter);
      else if (view === 'week') content = renderWeekView(currentDate, guildFilter);
      else content = renderDayView(selectedDay || currentDate, guildFilter);

      // Фильтр гильдий теперь после контента
      const filterHtml = `
        <div class="guild-filter">
          <button class="guild-filter-btn ${guildFilter===null?'active':''}" onclick="setGuildFilter(null)">Все</button>
          ${GUILDS.map(g => `<button class="guild-filter-btn ${guildFilter===g.id?'active':''}" onclick="setGuildFilter('${g.id}')">${g.icon} ${g.name}</button>`).join('')}
        </div>`;

      screenContainer.innerHTML = `
        <div class="calendar-header">${headerHtml}
          <div class="calendar-nav">
            <button onclick="navigateCalendar(-1)">◀</button>
            <button onclick="navigateCalendar(1)">▶</button>
            <button onclick="resetCalendarToday()">Сегодня</button>
          </div>
        </div>
        ${viewSwitcher}
        ${content}
        ${filterHtml}`;
    }

    function renderMonthView(year, month, filter) {
      const tasks = getFilteredTasks(filter);
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const startDay = firstDay === 0 ? 6 : firstDay-1;
      const today = new Date(); today.setHours(0,0,0,0);
      const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
      let grid = `<div class="weekday-header">${weekdays.map(d=>`<div>${d}</div>`).join('')}</div><div class="month-grid">`;
      for (let i=0; i<startDay; i++) grid += '<div class="day-cell other-month"></div>';
      for (let day=1; day<=daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = date.toISOString().slice(0,10);
        const isToday = date.getTime()===today.getTime() && month===today.getMonth() && year===today.getFullYear();
        const dayTasks = tasks.filter(t=>t.date===dateStr);
        const markers = dayTasks.map(task=>{
          let cls = 'marker';
          if(task.completed) cls += ' completed';
          else if(task.date < today.toISOString().slice(0,10)) cls += ' overdue';
          else cls += ' planned';
          return `<span class="${cls}" style="background:${getGuildColor(task.category)}"></span>`;
        }).join('');
        grid += `<div class="day-cell ${isToday?'today':''}" onclick="goToDay('${dateStr}')"><div class="day-number">${day}</div><div class="markers">${markers}</div></div>`;
      }
      return grid + '</div>';
    }

    function renderWeekView(date, filter) {
      const tasks = getFilteredTasks(filter);
      const start = getStartOfWeek(date);
      let html = '<div class="week-list">';
      for (let i=0; i<7; i++) {
        const d = new Date(start); d.setDate(d.getDate()+i);
        const dateStr = d.toISOString().slice(0,10);
        const dayTasks = tasks.filter(t=>t.date===dateStr);
        html += `<div class="week-day-block" style="background:#0d111c; border:1px solid #00ffff44; border-radius:12px; padding:1rem; margin-bottom:0.5rem;"><h3 style="color:#00ffff;">${d.toLocaleDateString('ru',{weekday:'short',day:'numeric',month:'short'})}</h3>`;
        html += dayTasks.length ? dayTasks.map(task => `
          <div class="quest-item mini" style="border-left:4px solid ${getGuildColor(task.category)}; background:#0b0e17; margin:0.3rem 0; padding:0.5rem; display:flex;">
            <span class="guild-badge" style="background:${getGuildColor(task.category)}">${(GUILDS.find(g=>g.id===task.category)||{}).icon}</span>
            ${task.title} ${task.completed?'✅':''}
          </div>`).join('') : '<p style="opacity:0.6;">Нет задач</p>';
        html += '</div>';
      }
      return html + '</div>';
    }

    function renderDayView(date, filter) {
      const tasks = getFilteredTasks(filter).filter(t=>t.date===date.toISOString().slice(0,10)).sort((a,b)=>a.time.localeCompare(b.time));
      let html = '<div class="day-list">';
      if(!tasks.length) html += '<p style="text-align:center; opacity:0.6;">Нет задач</p>';
      else tasks.forEach(task => {
        html += `<div class="quest-item mini" style="border-left:4px solid ${getGuildColor(task.category)}; background:#0b0e17; margin-bottom:0.5rem; padding:0.8rem; display:flex;">
          <span class="guild-badge" style="background:${getGuildColor(task.category)}">${(GUILDS.find(g=>g.id===task.category)||{}).icon}</span>
          <div style="flex:1"><strong>${task.time}</strong> — ${task.title} ${task.completed?'✅':''}<div style="font-size:0.7rem; opacity:0.7;">${task.minutes} мин</div></div>
        </div>`;
      });
      return html + '</div>';
    }

    // Заметки
    function renderNotes() {
      const notes = GameState.notes.sort((a,b)=> new Date(b.updatedAt||b.createdAt) - new Date(a.updatedAt||a.createdAt));
      const list = notes.length ? notes.map(note => `
        <div class="note-card">
          <div class="note-title">${note.title}</div>
          <div class="note-content">${note.content.replace(/\n/g,'<br>')}</div>
          <div style="margin-top:0.8rem; display:flex; gap:0.5rem;">
            <button class="btn" onclick="editNote('${note.id}')" style="padding:0.4rem 1rem;">✏️</button>
            <button class="btn danger-btn" onclick="deleteNote('${note.id}')" style="padding:0.4rem 1rem;">🗑️</button>
          </div>
        </div>`).join('') : '<p style="text-align:center; opacity:0.7;">Нет заметок</p>';
      screenContainer.innerHTML = `
        <button class="btn quest-form-toggle" onclick="showNoteForm()">➕ Новая заметка</button>
        <div id="noteForm" class="quest-form" style="display:none;">
          <input type="text" id="noteTitle" placeholder="Заголовок" required>
          <textarea id="noteContent" rows="4" placeholder="Текст..."></textarea>
          <input type="hidden" id="editNoteId">
          <button class="btn" style="width:100%;" onclick="saveNote()">Сохранить</button>
        </div>
        <div class="notes-list">${list}</div>`;
    }

    window.showNoteForm = (id) => {
      const form = document.getElementById('noteForm');
      form.style.display = 'block';
      if (id) {
        const note = GameState.notes.find(n=>n.id===id);
        document.getElementById('noteTitle').value = note.title;
        document.getElementById('noteContent').value = note.content;
        document.getElementById('editNoteId').value = id;
      } else {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        document.getElementById('editNoteId').value = '';
      }
    };

    window.saveNote = () => {
      const title = document.getElementById('noteTitle').value.trim();
      const content = document.getElementById('noteContent').value.trim();
      const editId = document.getElementById('editNoteId').value;
      if (!title) return;
      if (editId) {
        const note = GameState.notes.find(n=>n.id===editId);
        note.title = title; note.content = content; note.updatedAt = new Date().toISOString();
      } else {
        GameState.notes.push({
          id: Date.now().toString(36)+Math.random().toString(36).substring(2),
          title, content,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }
      saveNotes();
      renderNotes();
    };

    window.editNote = (id) => showNoteForm(id);
    window.deleteNote = (id) => {
      GameState.notes = GameState.notes.filter(n=>n.id!==id);
      saveNotes();
      renderNotes();
    };

    // Настройки (только трон-стиль)
    function renderSettings() {
      screenContainer.innerHTML = `
        <div class="settings-section">
          <h3>⚙️ Интерфейс</h3>
          <p style="color:#aaa;">Тема TRON активна. Изменение темы отключено.</p>
        </div>
        <div class="settings-section">
          <h3>💾 Данные</h3>
          <button class="btn" style="width:100%; margin-bottom:0.8rem;" onclick="exportData()">📤 Экспорт</button>
          <button class="btn" style="width:100%; margin-bottom:0.8rem;" onclick="importDataPrompt()">📥 Импорт</button>
          <button class="btn danger-btn" style="width:100%;" onclick="clearAllData()">🗑️ Очистить всё</button>
        </div>
        <div class="settings-section">
          <h3>ℹ️ О приложении</h3>
          <p style="color:#aaa;">LVL UP TRON EDITION<br>Саша и Дэн AI</p>
        </div>`;
    }

    window.exportData = () => {
      const data = { player: GameState.player, tasks: GameState.tasks, notes: GameState.notes, settings: GameState.settings };
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lvlup_backup.json';
      a.click();
    };

    window.importDataPrompt = () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            if(data.player) GameState.player = data.player;
            if(data.tasks) GameState.tasks = data.tasks;
            if(data.notes) GameState.notes = data.notes;
            if(data.settings) GameState.settings = data.settings;
            savePlayer(); saveTasks(); saveNotes(); saveSettings();
            alert('Данные импортированы!');
            renderScreen('profile');
          } catch(ex) { alert('Ошибка импорта'); }
        };
        reader.readAsText(file);
      };
      input.click();
    };

    window.clearAllData = () => {
      if(confirm('Удалить ВСЕ данные?')) {
        localStorage.clear();
        location.reload();
      }
    };

    // Заглушки
    function renderGuilds() {
      screenContainer.innerHTML = `<h2 style="color:#00ffff; text-shadow:0 0 10px #00ffff;">🛡️ Гильдии</h2>${GUILDS.map(g=>`<p style="color:${g.color}; text-shadow:0 0 5px ${g.color};">${g.icon} ${g.name}</p>`).join('')}<p style="opacity:0.7;">Кастомизация позже</p>`;
    }
    function renderGoals() { screenContainer.innerHTML = '<h2 style="color:#00ffff;">🎯 Эпик-квесты</h2><p style="color:#aaa;">Цели с наградой +1 XP</p>'; }
    function renderGallery() { screenContainer.innerHTML = '<h2 style="color:#00ffff;">🖼️ Галерея</h2><p style="color:#aaa;">Фото успехов</p>'; }
    function renderStats() { screenContainer.innerHTML = '<h2 style="color:#00ffff;">📊 Статистика</h2><p style="color:#aaa;">Графики позже</p>'; }
    function renderInfo() { screenContainer.innerHTML = '<h2 style="color:#00ffff;">ℹ️ Инфо</h2><p style="color:#aaa;">РПГ-система LVL UP. Стрики, комбо, гильдии.</p>'; }

    // Старт
    const savedPlayer = Storage.get('player');
    if (savedPlayer) GameState.player = { ...GameState.player, ...savedPlayer };
    renderScreen('profile');
  </script>
</body>
</html>
