<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>RPG Планировщик v7</title>
    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface2: #f0f1f5;
            --text: #1a1a2e;
            --text2: #445566;
            --text3: #8899bb;
            --border: rgba(0,0,0,0.06);
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 24px;
            --radius-sm: 16px;
            --accent: #6C5CE7;
            --accent-light: #A29BFE;
            --accent-gradient: linear-gradient(135deg, var(--accent), var(--accent-light));
            --accent-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
            --transition: 0.25s ease;
        }

        [data-theme="dark"] {
            --bg: #0e0e1a;
            --surface: rgba(22, 22, 44, 0.85);
            --surface2: rgba(30, 30, 58, 0.7);
            --text: #eef0f8;
            --text2: #8899bb;
            --text3: #667799;
            --border: rgba(255,255,255,0.06);
            --shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
            transition: background 0.3s;
        }
        #app {
            max-width: 440px;
            width: 100%;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 20px 16px 80px;
            position: relative;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        /* ===== ВЕРХНИЙ БАР ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .top-bar .logo {
            font-weight: 700;
            font-size: 20px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-bar .actions {
            display: flex;
            gap: 8px;
        }
        .top-bar .actions button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text2);
            transition: 0.2s;
            padding: 4px;
            border-radius: 30px;
        }
        .top-bar .actions button:active {
            transform: scale(0.9);
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: var(--surface2);
            padding: 4px;
            border-radius: 40px;
            border: 1px solid var(--border);
        }
        .tabs button {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text3);
            cursor: pointer;
            transition: 0.3s;
        }
        .tabs button.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: var(--accent-shadow);
        }
        .tabs button .tab-icon {
            display: block;
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* ===== КОНТЕЙНЕРЫ ВКЛАДОК ===== */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== КАРТОЧКИ ЖУРНАЛОВ ===== */
        .journal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .journal-card {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--border);
        }
        .journal-card:active {
            transform: scale(0.96);
        }
        .journal-card .icon {
            font-size: 32px;
        }
        .journal-card .name {
            font-weight: 600;
            margin-top: 4px;
        }
        .journal-card .count {
            font-size: 13px;
            color: var(--text3);
        }

        /* ===== ЭКРАН ЖУРНАЛА (список задач) ===== */
        .journal-screen {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .journal-screen.active {
            display: flex;
        }
        .journal-screen .back {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text2);
            cursor: pointer;
            align-self: flex-start;
            padding: 4px 8px;
        }
        .journal-screen .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .journal-screen .header h2 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .journal-screen .header .color-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .journal-screen .filter-tabs {
            display: flex;
            gap: 6px;
        }
        .journal-screen .filter-tabs button {
            flex: 1;
            padding: 4px 0;
            border: none;
            border-radius: 30px;
            background: var(--surface2);
            color: var(--text3);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .journal-screen .filter-tabs button.active {
            background: var(--accent-gradient);
            color: #fff;
        }

        /* ===== ЗАДАЧИ ===== */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .task-list::-webkit-scrollbar {
            width: 3px;
        }
        .task-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        .task-item {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border-left: 5px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: 0.2s;
            border: 1px solid var(--border);
        }
        .task-item.done { opacity: 0.6; }
        .task-item.skipped { opacity: 0.4; }
        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-title {
            font-weight: 600;
            font-size: 15px;
        }
        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 12px;
            color: var(--text2);
        }
        .task-meta span {
            background: var(--surface);
            padding: 0 10px;
            border-radius: 30px;
        }
        .task-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .task-actions button {
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-actions button:active { transform: scale(0.92); }
        .btn-done { background: #2e7d32; color: #fff; }
        .btn-skip { background: #7d2e2e; color: #fff; }
        .btn-del { background: rgba(60,30,40,0.8); color: #ccb; }

        /* ===== КАЛЕНДАРЬ (внутри журнала) ===== */
        #calendar-wrap {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 8px;
        }
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .cal-header button {
            background: var(--surface);
            border: none;
            color: var(--text);
            font-size: 16px;
            padding: 0 12px;
            border-radius: 30px;
            cursor: pointer;
            line-height: 30px;
        }
        .cal-header .month-year { font-weight: 700; }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 3px;
            text-align: center;
        }
        .cal-grid .weekday {
            font-weight: 600;
            color: var(--text3);
            font-size: 11px;
            padding: 4px 0;
        }
        .cal-grid .day {
            padding: 6px 0;
            border-radius: 30px;
            background: var(--surface);
            font-size: 13px;
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .cal-grid .day.today {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: var(--accent-shadow);
        }
        .cal-grid .day.other-month { opacity: 0.2; }
        .cal-grid .day .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ===== ПРОФИЛЬ ===== */
        .profile-card {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .profile-card .avatar {
            font-size: 56px;
            margin-bottom: 4px;
        }
        .profile-card .name {
            font-size: 22px;
            font-weight: 700;
        }
        .profile-card .gender {
            color: var(--text3);
        }
        .profile-card .level {
            background: var(--accent-gradient);
            color: #fff;
            padding: 2px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 4px;
            font-weight: 700;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .profile-stats .stat {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 10px;
            border: 1px solid var(--border);
        }
        .profile-stats .stat .num {
            font-size: 20px;
            font-weight: 700;
        }
        .profile-stats .stat .label {
            font-size: 11px;
            color: var(--text3);
        }
        .journal-stats {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
        }
        .journal-stats .row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .journal-stats .row .icon { font-size: 20px; }
        .journal-stats .row .info { flex: 1; font-size: 14px; }
        .journal-stats .row .info small { color: var(--text3); display: block; font-size: 12px; }
        .journal-stats .row .bar {
            width: 60px;
            height: 6px;
            background: var(--surface2);
            border-radius: 10px;
            overflow: hidden;
        }
        .journal-stats .row .bar .fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.5s;
        }

        /* ===== ЗАМЕТКИ ===== */
        .note-item {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-item .text { flex: 1; }
        .note-item .date { font-size: 12px; color: var(--text3); margin-left: 8px; }
        .note-item .del {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 18px;
            cursor: pointer;
        }
        .note-input {
            display: flex;
            gap: 8px;
        }
        .note-input input {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            outline: none;
        }
        .note-input button {
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== ГАЛЕРЕЯ ===== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 8px;
        }
        .photo-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .photo-upload {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .photo-upload input[type="file"] {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
        }
        .photo-upload button {
            padding: 8px 18px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== СТАТИСТИКА ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stats-grid .stat-card {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stats-grid .stat-card .num {
            font-size: 28px;
            font-weight: 700;
        }
        .stats-grid .stat-card .label {
            font-size: 13px;
            color: var(--text3);
        }
        .stats-chart {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid var(--border);
        }
        .stats-chart .chart-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }
        .stats-chart .chart-bar .label {
            width: 60px;
            font-size: 13px;
        }
        .stats-chart .chart-bar .track {
            flex: 1;
            height: 8px;
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
        }
        .stats-chart .chart-bar .track .fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.8s;
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .modal h3 {
            font-size: 20px;
            margin-bottom: 16px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal label {
            display: block;
            font-size: 13px;
            color: var(--text2);
            margin-top: 10px;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 15px;
            margin-top: 4px;
            outline: none;
            transition: 0.2s;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.2);
        }
        .modal .days-check {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .modal .days-check label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            background: var(--surface);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 0;
        }
        .modal .days-check input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: var(--accent);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-actions button:active { transform: scale(0.94); }
        .btn-save-task {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: var(--accent-shadow);
        }
        .btn-cancel {
            background: var(--surface2);
            color: var(--text2);
        }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
        #bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            border-radius: 0 0 36px 36px;
            padding: 6px 4px 10px;
            display: flex;
            justify-content: space-around;
            transition: 0.3s;
        }
        #bottom-nav button {
            background: transparent;
            border: none;
            color: var(--text3);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 6px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            border-radius: 16px;
        }
        #bottom-nav button .icon { font-size: 22px; line-height: 1; }
        #bottom-nav button .label { font-size: 9px; font-weight: 500; }
        #bottom-nav button.active {
            color: var(--accent);
            background: rgba(108,92,231,0.12);
        }
        #bottom-nav button:active { transform: scale(0.9); }

        /* ===== АДАПТИВ ===== */
        @media (max-width:400px) {
            #app { padding: 16px 12px 70px; }
            .journal-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .journal-card { padding: 12px 8px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ===== ВЕРХНИЙ БАР ===== -->
    <div class="top-bar">
        <span class="logo">📋 RPG Planner</span>
        <div class="actions">
            <button id="settingsToggle" title="Настройки">⚙️</button>
        </div>
    </div>

    <!-- ===== ВКЛАДКИ ===== -->
    <div class="tabs" id="mainTabs">
        <button class="active" data-tab="journals"><span class="tab-icon">📚</span>Журналы</button>
        <button data-tab="profile"><span class="tab-icon">👤</span>Профиль</button>
        <button data-tab="notes"><span class="tab-icon">📝</span>Заметки</button>
        <button data-tab="gallery"><span class="tab-icon">🖼️</span>Галерея</button>
        <button data-tab="stats"><span class="tab-icon">📊</span>Статистика</button>
    </div>

    <!-- ===== КОНТЕНТ ===== -->

    <!-- Вкладка: Журналы -->
    <div class="tab-content active" id="tab-journals">
        <div class="journal-grid" id="journalGrid"></div>
        <div id="journalScreen" class="journal-screen">
            <button class="back" id="journalBack">← Назад</button>
            <div class="header">
                <h2><span class="color-badge" id="journalColor" style="background:var(--accent);"></span> <span id="journalTitle">Журнал</span></h2>
                <button class="btn-new" id="journalAddBtn" style="background:var(--accent-gradient); color:#fff; border:none; font-size:24px; width:44px; height:44px; border-radius:40px; cursor:pointer; box-shadow:var(--accent-shadow);">➕</button>
            </div>
            <div class="filter-tabs" id="journalFilters">
                <button class="active" data-filter="all">Все</button>
                <button data-filter="active">Активные</button>
                <button data-filter="done">Выполненные</button>
            </div>
            <!-- Календарь внутри журнала -->
            <div id="calendar-wrap">
                <div class="cal-header">
                    <button id="calPrev">◀</button>
                    <span class="month-year" id="calTitle">Январь 2026</span>
                    <button id="calNext">▶</button>
                </div>
                <div id="calendarContent"></div>
            </div>
            <div class="task-list" id="journalTaskList"></div>
        </div>
    </div>

    <!-- Вкладка: Профиль -->
    <div class="tab-content" id="tab-profile">
        <div class="profile-card" id="profileCard">
            <div class="avatar" id="profileAvatar">🧙</div>
            <div class="name" id="profileName">Герой</div>
            <div class="gender" id="profileGender">М</div>
            <div class="level">Уровень <span id="profileLevel">1</span></div>
            <div class="xp-bar" style="width:100%; height:6px; background:var(--surface); border-radius:10px; margin-top:10px; overflow:hidden;">
                <div class="xp-fill" id="profileXpFill" style="width:0%; height:100%; background:var(--accent-gradient); border-radius:10px; transition:width 0.6s;"></div>
            </div>
            <div style="font-size:13px; color:var(--text3); margin-top:4px;">Опыт: <span id="profileXp">0</span></div>
        </div>
        <div class="profile-stats" id="profileStats">
            <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Всего задач</div></div>
            <div class="stat"><div class="num" id="statDone">0</div><div class="label">Выполнено</div></div>
            <div class="stat"><div class="num" id="statActive">0</div><div class="label">Активно</div></div>
        </div>
        <div class="journal-stats" id="journalStats"></div>
    </div>

    <!-- Вкладка: Заметки -->
    <div class="tab-content" id="tab-notes">
        <div class="note-input">
            <input type="text" id="noteInput" placeholder="Текст заметки..." />
            <button id="noteAddBtn">➕</button>
        </div>
        <div id="noteList"></div>
    </div>

    <!-- Вкладка: Галерея -->
    <div class="tab-content" id="tab-gallery">
        <div class="photo-upload">
            <input type="file" id="galleryFileInput" accept="image/*" multiple />
            <button id="galleryUploadBtn">Загрузить</button>
        </div>
        <div class="photo-grid" id="galleryGrid"></div>
    </div>

    <!-- Вкладка: Статистика -->
    <div class="tab-content" id="tab-stats">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="num" id="statsTotal">0</div><div class="label">Всего задач</div></div>
            <div class="stat-card"><div class="num" id="statsDone">0</div><div class="label">Выполнено</div></div>
            <div class="stat-card"><div class="num" id="statsActive">0</div><div class="label">Активно</div></div>
            <div class="stat-card"><div class="num" id="statsProductivity">0%</div><div class="label">Продуктивность</div></div>
        </div>
        <div class="stats-chart" id="statsChart">
            <div style="font-weight:600; margin-bottom:8px;">Прогресс по журналам</div>
            <div id="chartBars"></div>
        </div>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <div id="bottom-nav">
        <button class="active" data-tab="journals"><span class="icon">📚</span><span class="label">Журналы</span></button>
        <button data-tab="profile"><span class="icon">👤</span><span class="label">Профиль</span></button>
        <button data-tab="notes"><span class="icon">📝</span><span class="label">Заметки</span></button>
        <button data-tab="gallery"><span class="icon">🖼️</span><span class="label">Галерея</span></button>
        <button data-tab="stats"><span class="icon">📊</span><span class="label">Статистика</span></button>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ЗАДАЧ ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle">➕ Новая задача</h3>
            <div id="modalFields"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Отмена</button>
                <button class="btn-save-task" id="modalSave">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО НАСТРОЕК ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal" style="max-width:340px;">
            <h3 style="margin-bottom:16px;">⚙️ Настройки</h3>
            <label>Тема</label>
            <div style="display:flex; gap:8px; margin-top:4px;">
                <button class="theme-btn active" data-theme="dark">🌙 Тёмная</button>
                <button class="theme-btn" data-theme="light">☀️ Светлая</button>
            </div>
            <label style="margin-top:16px;">Акцентный цвет</label>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;">
                <button class="color-btn" data-color="#6C5CE7" style="background:#6C5CE7;"></button>
                <button class="color-btn" data-color="#4A8BFE" style="background:#4A8BFE;"></button>
                <button class="color-btn" data-color="#2ED573" style="background:#2ED573;"></button>
                <button class="color-btn" data-color="#FFA502" style="background:#FFA502;"></button>
                <button class="color-btn" data-color="#FF4757" style="background:#FF4757;"></button>
                <button class="color-btn" data-color="#FD79A8" style="background:#FD79A8;"></button>
            </div>
            <div class="modal-actions" style="margin-top:20px;">
                <button class="btn-cancel" id="settingsClose">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. ДАННЫЕ И МИГРАЦИЯ
    // ============================================================
    const STORAGE_KEY = 'rpg_journal_v7';
    const CATEGORIES = ['body','hobby','business','food','finance','debts'];
    const COLORS = {
        body: '#ff4757',
        hobby: '#a29bfe',
        business: '#4a8bfe',
        food: '#2ed573',
        finance: '#ffa502',
        debts: '#ff6348'
    };
    const ICONS = {
        body: '💪',
        hobby: '🎨',
        business: '📈',
        food: '🥗',
        finance: '💰',
        debts: '📋'
    };
    const NAMES = {
        body: 'Тело',
        hobby: 'Хобби',
        business: 'Бизнес',
        food: 'Питание',
        finance: 'Финансы',
        debts: 'Долги'
    };

    function getDefaultData() {
        return {
            character: { name: 'Герой', gender: 'М', hp: 100, str: 10, int: 10, end: 10, level: 1, xp: 0 },
            tasks: {
                body: [],
                hobby: [],
                business: [],
                food: [],
                finance: [],
                debts: []
            },
            notes: [],
            gallery: [] // base64 images
        };
    }

    let data = loadData();

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                const def = getDefaultData();
                // Миграция: добавляем недостающие поля
                for (let key in def) {
                    if (!(key in parsed)) parsed[key] = def[key];
                }
                for (let cat in def.tasks) {
                    if (!(cat in parsed.tasks)) parsed.tasks[cat] = [];
                }
                return parsed;
            }
        } catch(e) {}
        return getDefaultData();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ============================================================
    // 2. РПГ СИСТЕМА
    // ============================================================
    function addXP(amount) {
        data.character.xp += amount;
        const xpNeeded = 100 + data.character.level * 20;
        while (data.character.xp >= xpNeeded) {
            data.character.xp -= xpNeeded;
            data.character.level += 1;
            const stats = ['hp','str','int','end'];
            const s = stats[Math.floor(Math.random() * stats.length)];
            data.character[s] += 1;
        }
        saveData();
        updateAllUI();
    }

    function getPriorityXP(priority) {
        const map = { low: 5, medium: 10, high: 20 };
        return map[priority] || 10;
    }

    // ============================================================
    // 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function formatDate(date) {
        return date.toISOString().split('T')[0];
    }

    function getTasksForDate(dateStr) {
        const result = [];
        CATEGORIES.forEach(cat => {
            data.tasks[cat].forEach(task => {
                if (task.date === dateStr) {
                    result.push({ ...task, category: cat });
                }
                if (task.days && task.days.length) {
                    const d = new Date(dateStr);
                    const dayOfWeek = d.getDay();
                    const dayIndex = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
                    const daysMap = ['mon','tue','wed','thu','fri','sat','sun'];
                    if (task.days.includes(daysMap[dayIndex])) {
                        if (!result.some(t => t === task && t.category === cat)) {
                            result.push({ ...task, category: cat });
                        }
                    }
                }
            });
        });
        return result;
    }

    function getTasksByCategory(cat) {
        return data.tasks[cat] || [];
    }

    function getStats() {
        let total = 0, done = 0, active = 0;
        CATEGORIES.forEach(cat => {
            const tasks = data.tasks[cat] || [];
            total += tasks.length;
            tasks.forEach(t => {
                if (t.status === 'done') done++;
                else if (t.status === 'active') active++;
            });
        });
        return { total, done, active, productivity: total ? Math.round((done / total) * 100) : 0 };
    }

    function getCategoryStats() {
        const result = {};
        CATEGORIES.forEach(cat => {
            const tasks = data.tasks[cat] || [];
            const total = tasks.length;
            const done = tasks.filter(t => t.status === 'done').length;
            result[cat] = { total, done, active: total - done - tasks.filter(t => t.status === 'skipped').length };
        });
        return result;
    }

    // ============================================================
    // 4. UI ОБНОВЛЕНИЕ
    // ============================================================
    function updateAllUI() {
        renderJournalGrid();
        renderProfile();
        renderNotes();
        renderGallery();
        renderStats();
        renderCalendar();
        // Если открыт экран журнала, обновить список задач
        const currentJournal = document.getElementById('journalScreen').dataset.currentJournal;
        if (currentJournal) renderJournalTasks(currentJournal);
    }

    // ============================================================
    // 5. ЖУРНАЛЫ (сетка)
    // ============================================================
    function renderJournalGrid() {
        const grid = document.getElementById('journalGrid');
        grid.innerHTML = CATEGORIES.map(cat => {
            const count = getTasksByCategory(cat).length;
            return `
                <div class="journal-card" data-category="${cat}">
                    <div class="icon">${ICONS[cat]}</div>
                    <div class="name">${NAMES[cat]}</div>
                    <div class="count">${count} задач</div>
                </div>
            `;
        }).join('');
        grid.querySelectorAll('.journal-card').forEach(el => {
            el.addEventListener('click', () => openJournal(el.dataset.category));
        });
    }

    // ============================================================
    // 6. ОТКРЫТИЕ ЖУРНАЛА
    // ============================================================
    let currentJournalCategory = null;

    function openJournal(category) {
        currentJournalCategory = category;
        document.getElementById('journalGrid').style.display = 'none';
        const screen = document.getElementById('journalScreen');
        screen.style.display = 'flex';
        screen.dataset.currentJournal = category;
        document.getElementById('journalTitle').textContent = NAMES[category];
        document.getElementById('journalColor').style.background = COLORS[category];
        // Фильтры
        document.querySelectorAll('#journalFilters button').forEach(b => b.classList.remove('active'));
        document.querySelector('#journalFilters button[data-filter="all"]').classList.add('active');
        renderJournalTasks(category);
        // Календарь
        renderCalendar();
    }

    function closeJournal() {
        document.getElementById('journalGrid').style.display = 'grid';
        document.getElementById('journalScreen').style.display = 'none';
        document.getElementById('journalScreen').dataset.currentJournal = '';
    }

    document.getElementById('journalBack').addEventListener('click', closeJournal);

    // ============================================================
    // 7. ЗАДАЧИ В ЖУРНАЛЕ
    // ============================================================
    function renderJournalTasks(category, filter = 'all') {
        const list = document.getElementById('journalTaskList');
        let tasks = getTasksByCategory(category);
        if (filter === 'active') tasks = tasks.filter(t => t.status === 'active');
        else if (filter === 'done') tasks = tasks.filter(t => t.status === 'done' || t.status === 'skipped');

        if (!tasks.length) {
            list.innerHTML = `<div style="color:var(--text3); text-align:center; padding:20px;">Нет задач</div>`;
            return;
        }

        list.innerHTML = tasks.map((task, idx) => {
            const realIdx = data.tasks[category].indexOf(task);
            const statusClass = task.status === 'done' ? 'done' : (task.status === 'skipped' ? 'skipped' : '');
            const priorityEmoji = { low: '🟢', medium: '🟡', high: '🔴' }[task.priority] || '';
            const daysDisplay = task.days && task.days.length ? ` 📅 ${task.days.map(d => ({mon:'Пн',tue:'Вт',wed:'Ср',thu:'Чт',fri:'Пт',sat:'Сб',sun:'Вс'})[d]).join(' ')}` : '';
            return `
                <div class="task-item ${statusClass}" style="border-left-color:${COLORS[category]};">
                    <div class="task-top">
                        <span class="task-title">${priorityEmoji} ${task.title}</span>
                        <span style="font-size:11px;color:var(--text3);">${task.date || 'без даты'}</span>
                    </div>
                    <div class="task-meta">
                        ${task.duration ? `<span>⏱ ${task.duration} мин</span>` : ''}
                        ${task.status === 'done' ? '✅ Выполнено' : (task.status === 'skipped' ? '⏭ Пропущено' : '⏳ Активно')}
                        ${task.note ? `<span>📝 ${task.note}</span>` : ''}
                        ${task.endDate ? `<span>🔚 ${task.endDate}</span>` : ''}
                    </div>
                    ${task.days && task.days.length ? `<div class="task-days" style="font-size:11px;color:var(--accent-light);">${daysDisplay}</div>` : ''}
                    <div class="task-actions">
                        ${task.status === 'active' ? `
                            <button class="btn-done" data-cat="${category}" data-idx="${realIdx}" data-action="done">✅ Выполнить</button>
                            <button class="btn-skip" data-cat="${category}" data-idx="${realIdx}" data-action="skip">⏭ Пропустить</button>
                        ` : ''}
                        <button class="btn-del" data-cat="${category}" data-idx="${realIdx}" data-action="delete">🗑</button>
                    </div>
                </div>
            `;
        }).join('');

        // Обработчики
        list.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const cat = btn.dataset.cat;
                const idx = parseInt(btn.dataset.idx);
                const action = btn.dataset.action;
                if (action === 'done') {
                    const task = data.tasks[cat][idx];
                    if (task && task.status === 'active') {
                        task.status = 'done';
                        const xp = getPriorityXP(task.priority);
                        addXP(xp);
                        saveData();
                        updateAllUI();
                        renderJournalTasks(cat, getCurrentFilter());
                    }
                } else if (action === 'skip') {
                    const task = data.tasks[cat][idx];
                    if (task && task.status === 'active') {
                        task.status = 'skipped';
                        saveData();
                        updateAllUI();
                        renderJournalTasks(cat, getCurrentFilter());
                    }
                } else if (action === 'delete') {
                    data.tasks[cat].splice(idx, 1);
                    saveData();
                    updateAllUI();
                    renderJournalTasks(cat, getCurrentFilter());
                }
            });
        });
    }

    function getCurrentFilter() {
        const active = document.querySelector('#journalFilters .active');
        return active ? active.dataset.filter : 'all';
    }

    // Фильтры в журнале
    document.querySelectorAll('#journalFilters button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#journalFilters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (currentJournalCategory) {
                renderJournalTasks(currentJournalCategory, btn.dataset.filter);
            }
        });
    });

    // Добавление задачи (кнопка + в журнале)
    document.getElementById('journalAddBtn').addEventListener('click', () => {
        if (currentJournalCategory) openModal(currentJournalCategory);
    });

    // ============================================================
    // 8. КАЛЕНДАРЬ (в журнале)
    // ============================================================
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();

    function renderCalendar() {
        const container = document.getElementById('calendarContent');
        const title = document.getElementById('calTitle');
        title.textContent = monthNames[calMonth] + ' ' + calYear;

        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
        const daysInPrev = new Date(calYear, calMonth, 0).getDate();
        let startOffset = (firstDay === 0) ? 6 : firstDay - 1;

        let html = `<div class="cal-grid">`;
        ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => {
            html += `<div class="weekday">${w}</div>`;
        });

        for (let i=0; i<startOffset; i++) {
            const d = daysInPrev - startOffset + i + 1;
            html += `<div class="day other-month">${d}</div>`;
        }

        const today = new Date();
        for (let d=1; d<=daysInMonth; d++) {
            const dateObj = new Date(calYear, calMonth, d);
            const dateStr = formatDate(dateObj);
            const isToday = (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
            const tasks = getTasksForDate(dateStr);
            const dots = tasks.map(t => `<span class="dot" style="background:${COLORS[t.category]};"></span>`).join('');
            const cls = 'day' + (isToday ? ' today' : '');
            html += `<div class="${cls}" data-date="${dateStr}">${d}${dots ? '<br>'+dots : ''}</div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    document.getElementById('calPrev').addEventListener('click', () => {
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', () => {
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
    });

    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    // ============================================================
    // 9. ПРОФИЛЬ
    // ============================================================
    function renderProfile() {
        const c = data.character;
        document.getElementById('profileAvatar').textContent = '🧙';
        document.getElementById('profileName').textContent = c.name;
        document.getElementById('profileGender').textContent = c.gender;
        document.getElementById('profileLevel').textContent = c.level;
        const xpNeeded = 100 + c.level * 20;
        const pct = Math.min(100, (c.xp / xpNeeded) * 100);
        document.getElementById('profileXpFill').style.width = pct + '%';
        document.getElementById('profileXp').textContent = c.xp;

        const stats = getStats();
        document.getElementById('statTotal').textContent = stats.total;
        document.getElementById('statDone').textContent = stats.done;
        document.getElementById('statActive').textContent = stats.active;

        // Статистика по журналам
        const catStats = getCategoryStats();
        const container = document.getElementById('journalStats');
        container.innerHTML = CATEGORIES.map(cat => {
            const s = catStats[cat];
            const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
            return `
                <div class="row">
                    <span class="icon">${ICONS[cat]}</span>
                    <div class="info">
                        ${NAMES[cat]}
                        <small>${s.done}/${s.total} выполнено</small>
                    </div>
                    <div class="bar"><div class="fill" style="width:${pct}%;"></div></div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // 10. ЗАМЕТКИ
    // ============================================================
    function renderNotes() {
        const list = document.getElementById('noteList');
        if (!data.notes.length) {
            list.innerHTML = '<div style="color:var(--text3); text-align:center; padding:20px;">Нет заметок</div>';
            return;
        }
        list.innerHTML = data.notes.map((note, i) => `
            <div class="note-item">
                <div class="text">${note.text}</div>
                <div class="date">${note.date || ''}</div>
                <button class="del" data-idx="${i}">✕</button>
            </div>
        `).join('');
        list.querySelectorAll('.del').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.idx);
                data.notes.splice(idx, 1);
                saveData();
                renderNotes();
            });
        });
    }

    document.getElementById('noteAddBtn').addEventListener('click', () => {
        const input = document.getElementById('noteInput');
        const text = input.value.trim();
        if (!text) return;
        data.notes.push({ text, date: new Date().toLocaleDateString() });
        saveData();
        input.value = '';
        renderNotes();
    });

    // ============================================================
    // 11. ГАЛЕРЕЯ
    // ============================================================
    function renderGallery() {
        const grid = document.getElementById('galleryGrid');
        if (!data.gallery.length) {
            grid.innerHTML = '<div style="color:var(--text3); text-align:center; padding:20px; grid-column:1/-1;">Нет фото</div>';
            return;
        }
        grid.innerHTML = data.gallery.map((src, i) => `
            <img src="${src}" alt="Фото ${i}" onclick="removeGalleryItem(${i})" />
        `).join('');
    }

    window.removeGalleryItem = function(idx) {
        data.gallery.splice(idx, 1);
        saveData();
        renderGallery();
    };

    document.getElementById('galleryUploadBtn').addEventListener('click', () => {
        const input = document.getElementById('galleryFileInput');
        const files = input.files;
        if (!files.length) return;
        const readers = [];
        for (let f of files) {
            if (!f.type.startsWith('image/')) continue;
            const reader = new FileReader();
            readers.push(new Promise((resolve) => {
                reader.onload = (e) => {
                    data.gallery.push(e.target.result);
                    resolve();
                };
                reader.readAsDataURL(f);
            }));
        }
        Promise.all(readers).then(() => {
            saveData();
            renderGallery();
            input.value = '';
        });
    });

    // ============================================================
    // 12. СТАТИСТИКА
    // ============================================================
    function renderStats() {
        const stats = getStats();
        document.getElementById('statsTotal').textContent = stats.total;
        document.getElementById('statsDone').textContent = stats.done;
        document.getElementById('statsActive').textContent = stats.active;
        document.getElementById('statsProductivity').textContent = stats.productivity + '%';

        // График по журналам
        const catStats = getCategoryStats();
        const container = document.getElementById('chartBars');
        container.innerHTML = CATEGORIES.map(cat => {
            const s = catStats[cat];
            const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
            return `
                <div class="chart-bar">
                    <span class="label">${ICONS[cat]} ${NAMES[cat]}</span>
                    <div class="track"><div class="fill" style="width:${pct}%;"></div></div>
                    <span style="font-size:12px; color:var(--text3);">${pct}%</span>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // 13. МОДАЛЬНОЕ ОКНО ЗАДАЧ
    // ============================================================
    let currentModalScreen = 'body';

    const FORMS = {
        body: {
            title: '💪 Новая тренировка',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Приседания 3x12' },
                { label: 'Группа мышц', type: 'select', id: 'f_muscle', options: ['Грудь','Спина','Ноги','Плечи','Пресс','Руки'] },
                { label: 'Подходы', type: 'number', id: 'f_sets', placeholder: '3' },
                { label: 'Повторы', type: 'number', id: 'f_reps', placeholder: '12' }
            ]
        },
        hobby: {
            title: '🎨 Новое хобби',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Игра на гитаре' },
                { label: 'Навык', type: 'select', id: 'f_skill', options: ['Начальный','Средний','Продвинутый','Эксперт'] },
                { label: 'Уровень сложности', type: 'select', id: 'f_difficulty', options: ['Легкий','Средний','Сложный'] }
            ]
        },
        business: {
            title: '📈 Бизнес-задача',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Презентация проекта' },
                { label: 'Проект', type: 'text', id: 'f_project', placeholder: 'Название проекта' },
                { label: 'Приоритет', type: 'select', id: 'f_priority', options: ['Низкий','Средний','Высокий'] }
            ]
        },
        food: {
            title: '🥗 Приём пищи',
            fields: [
                { label: 'Блюдо', type: 'text', id: 'f_title', placeholder: 'Овсянка с фруктами' },
                { label: 'Калории', type: 'number', id: 'f_calories', placeholder: '350' },
                { label: 'Тип', type: 'select', id: 'f_mealtype', options: ['Завтрак','Обед','Ужин','Перекус'] }
            ]
        },
        finance: {
            title: '💰 Финансовая операция',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Зарплата' },
                { label: 'Тип', type: 'select', id: 'f_type', options: ['Доход','Расход'] },
                { label: 'Сумма', type: 'number', id: 'f_amount', placeholder: '5000' },
                { label: 'Категория', type: 'select', id: 'f_category', options: ['Еда','Транспорт','Развлечения','Сбережения','Другое'] }
            ]
        },
        debts: {
            title: '📋 Долг',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Долг другу' },
                { label: 'Тип', type: 'select', id: 'f_type', options: ['Я должен','Должны мне'] },
                { label: 'Сумма', type: 'number', id: 'f_amount', placeholder: '3000' },
                { label: 'Кому/От кого', type: 'text', id: 'f_whom', placeholder: 'Имя' }
            ]
        }
    };

    function openModal(screen) {
        currentModalScreen = screen;
        const form = FORMS[screen];
        document.getElementById('modalTitle').textContent = form.title;

        let html = '';
        form.fields.forEach(f => {
            if (f.type === 'text' || f.type === 'number') {
                html += `<label>${f.label}</label><input type="${f.type}" id="${f.id}" placeholder="${f.placeholder || ''}" />`;
            } else if (f.type === 'select') {
                html += `<label>${f.label}</label><select id="${f.id}">`;
                f.options.forEach(opt => {
                    html += `<option value="${opt}">${opt}</option>`;
                });
                html += `</select>`;
            }
        });

        // Общие поля
        html += `
            <label>Дата</label>
            <input type="date" id="f_date" />
            <label>Дата окончания (опционально)</label>
            <input type="date" id="f_enddate" />
            <label>Время</label>
            <input type="time" id="f_time" />
            <label>Продолжительность (минут)</label>
            <input type="number" id="f_duration" placeholder="30" />
            <label>Дни недели (для периодических задач)</label>
            <div class="days-check">
                <label><input type="checkbox" value="mon" /> Пн</label>
                <label><input type="checkbox" value="tue" /> Вт</label>
                <label><input type="checkbox" value="wed" /> Ср</label>
                <label><input type="checkbox" value="thu" /> Чт</label>
                <label><input type="checkbox" value="fri" /> Пт</label>
                <label><input type="checkbox" value="sat" /> Сб</label>
                <label><input type="checkbox" value="sun" /> Вс</label>
            </div>
            <label>Заметка</label>
            <textarea id="f_note" placeholder="Дополнительная информация..."></textarea>
        `;

        document.getElementById('modalFields').innerHTML = html;

        const now = new Date();
        document.getElementById('f_date').value = now.toISOString().split('T')[0];
        document.getElementById('f_time').value = now.toTimeString().slice(0,5);

        document.getElementById('modalOverlay').classList.add('open');
    }

    document.getElementById('modalCancel').addEventListener('click', () => {
        document.getElementById('modalOverlay').classList.remove('open');
    });
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) document.getElementById('modalOverlay').classList.remove('open');
    });

    document.getElementById('modalSave').addEventListener('click', () => {
        const title = document.getElementById('f_title')?.value.trim();
        if (!title) { alert('Введите название задачи'); return; }

        const days = [];
        document.querySelectorAll('.days-check input[type="checkbox"]:checked').forEach(cb => {
            days.push(cb.value);
        });

        const custom = {};
        const form = FORMS[currentModalScreen];
        form.fields.forEach(f => {
            if (f.id !== 'f_title') {
                const el = document.getElementById(f.id);
                if (el) custom[f.id.replace('f_', '')] = el.value;
            }
        });

        const task = {
            title: title,
            date: document.getElementById('f_date').value || '',
            endDate: document.getElementById('f_enddate').value || '',
            time: document.getElementById('f_time').value || '',
            duration: parseInt(document.getElementById('f_duration').value) || 0,
            days: days,
            note: document.getElementById('f_note').value.trim(),
            status: 'active',
            priority: 'medium',
            custom: custom,
            createdAt: new Date().toISOString()
        };

        if (custom.priority) {
            const map = { 'Низкий':'low', 'Средний':'medium', 'Высокий':'high' };
            task.priority = map[custom.priority] || 'medium';
        }

        data.tasks[currentModalScreen].push(task);
        saveData();
        document.getElementById('modalOverlay').classList.remove('open');
        updateAllUI();
        if (currentJournalCategory === currentModalScreen) {
            renderJournalTasks(currentModalScreen, getCurrentFilter());
        }
    });

    // ============================================================
    // 14. НАСТРОЙКИ ТЕМЫ И АКЦЕНТА
    // ============================================================
    function loadThemeSettings() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        const savedAccent = localStorage.getItem('app_accent') || '#6C5CE7';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.style.setProperty('--accent', savedAccent);
        document.documentElement.style.setProperty('--accent-light', lightenColor(savedAccent, 30));
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === savedTheme);
        });
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.style.borderColor = (btn.dataset.color === savedAccent) ? '#fff' : 'transparent';
        });
    }

    function lightenColor(hex, percent) {
        const num = parseInt(hex.slice(1), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.min(255, (num >> 16) + amt);
        const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
        const B = Math.min(255, (num & 0x0000FF) + amt);
        return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
    }

    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const color = btn.dataset.color;
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--accent-light', lightenColor(color, 30));
            localStorage.setItem('app_accent', color);
            document.querySelectorAll('.color-btn').forEach(b => b.style.borderColor = 'transparent');
            btn.style.borderColor = '#fff';
        });
    });

    document.getElementById('settingsToggle').addEventListener('click', () => {
        document.getElementById('settingsModal').classList.add('open');
        loadThemeSettings();
    });
    document.getElementById('settingsClose').addEventListener('click', () => {
        document.getElementById('settingsModal').classList.remove('open');
    });
    document.getElementById('settingsModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) document.getElementById('settingsModal').classList.remove('open');
    });

    // ============================================================
    // 15. НАВИГАЦИЯ ПО ВКЛАДКАМ
    // ============================================================
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tabs button, #bottom-nav button').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === tabName);
        });
        document.getElementById('tab-' + tabName).classList.add('active');
        // Если переключились на журналы, закрываем экран журнала
        if (tabName === 'journals') {
            closeJournal();
        }
        // Обновляем UI для соответствующих вкладок
        if (tabName === 'profile') renderProfile();
        if (tabName === 'notes') renderNotes();
        if (tabName === 'gallery') renderGallery();
        if (tabName === 'stats') renderStats();
    }

    document.querySelectorAll('.tabs button, #bottom-nav button').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            if (tab) switchTab(tab);
        });
    });

    // ============================================================
    // 16. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    function init() {
        // Сохранение имени и пола
        document.getElementById('charName')?.addEventListener('input', (e) => {
            data.character.name = e.target.value;
            saveData();
            updateAllUI();
        });
        document.getElementById('charGender')?.addEventListener('change', (e) => {
            data.character.gender = e.target.value;
            saveData();
            updateAllUI();
        });

        loadThemeSettings();
        updateAllUI();
        // Стартовая вкладка
        switchTab('journals');
    }

    // Запускаем
    init();
    console.log('🔥 RPG Планировщик v7 — современный дизайн и новые функции');
</script>
