            // ================== HOME ==================
            renderHome(container) {
                const data = Data._data;
                const profile = data.profile;
                const today = new Date().toISOString().split('T')[0];
                const todayTasks = Data.getTodayTasks();
                const activeGoals = data.goals.filter(g => !g.achieved).slice(0, 3);

                const greetingEl = document.getElementById('greetingText');
                if (greetingEl) greetingEl.textContent = UI.getGreeting();
                const userNameEl = document.getElementById('userName');
                if (userNameEl) userNameEl.textContent = profile.name;
                const initialsEl = document.getElementById('avatarInitials');
                if (initialsEl) initialsEl.textContent = profile.name.charAt(0).toUpperCase();

                const { level, exp, needed } = Data.recalcLevel();
                const doneCount = todayTasks.filter(t => Data.getTaskStatus(t, today) === 'done').length;
                const totalToday = todayTasks.length;
                const productivity = totalToday > 0 ? Math.round((doneCount / totalToday) * 100) : 0;
                const activeTasks = todayTasks.filter(t => Data.getTaskStatus(t, today) === 'pending').slice(0, 3);
                const topJournals = [...data.journals].sort((a, b) => b.exp - a.exp).slice(0, 4);

                let goalsHTML = '';
                if (activeGoals.length > 0) {
                    goalsHTML =
                    `<div class="section-header"><h2>Активные цели</h2><button class="btn btn-sm btn-secondary" data-nav="goals">Все →</button></div>`;
                    activeGoals.forEach(goal => {
                        const tasks = Data.tasks.filter(t => t.goalId === goal.id);
                        const done = tasks.reduce((acc, t) => acc + t.completedDates.length, 0);
                        const total = tasks.reduce((acc, t) => {
                            const start = t.startDate || t.date;
                            const end = t.endDate || t.date;
                            return acc + Data.getDateRange(start, end).length;
                        }, 0);
                        const progress = total > 0 ? Math.round((done / total) * 100) : 0;
                        goalsHTML += `
                            <div class="goal-card" data-goal-id="${goal.id}">
                                <div class="goal-header">
                                    <div>
                                        <div class="goal-title">${goal.title}</div>
                                        <div class="goal-desc">${goal.description || 'Без описания'}</div>
                                    </div>
                                    <span class="chip ${goal.achieved ? 'active' : ''}">${goal.achieved ? '✅' : 'В процессе'}</span>
                                </div>
                                <div class="goal-progress"><div class="progress"><div class="progress-bar" style="width:${progress}%;"></div></div></div>
                                <div class="goal-meta"><span>${done}/${total} задач</span><span>📅 ${UI.formatDate(goal.deadline)}</span></div>
                            </div>
                        `;
                    });
                }

                container.innerHTML = `
                    <div class="level-card">
                        <div class="level-header">
                            <div>
                                <div class="level-label">УРОВЕНЬ</div>
                                <div class="level-number">${level}</div>
                            </div>
                            <div class="level-stats">
                                <span>${Math.floor(exp)} / ${needed} XP</span>
                                <span>🔥 ${profile.streak || 0} дней</span>
                            </div>
                        </div>
                        <div class="progress"><div class="progress-bar" style="width: ${(exp/needed)*100}%;"></div></div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number">${totalToday}</div><div class="stat-label">Задач сегодня</div></div>
                        <div class="stat-card"><div class="stat-number">${doneCount}</div><div class="stat-label">Выполнено</div></div>
                        <div class="stat-card"><div class="stat-number">${productivity}%</div><div class="stat-label">Продуктивность</div></div>
                    </div>

                    <div class="section-header"><h2>Активные задачи</h2><button class="btn btn-sm btn-secondary" data-nav="calendar">Все →</button></div>
                    <div class="tasks-list">
                        ${activeTasks.length === 0 ? `
                            <div class="tasks-empty"><div class="empty-icon">🎉</div><p>На сегодня задач нет</p><p style="color:var(--text-secondary)">Отличная работа!</p></div>
                        ` : activeTasks.map(task => {
                            const journal = Data.getJournalByName(task.journal);
                            const icon = journal ? journal.icon : '📌';
                            return `<div class="task-item" data-task-id="${task.id}">
                                <div class="task-icon">${icon}</div>
                                <div class="task-info">
                                    <div class="task-title">${task.title}</div>
                                    <div class="task-meta"><span>${task.time || '—'}</span><span>${task.duration || 0} мин</span><span>${task.journal}</span></div>
                                </div>
                                <span class="task-status pending">Ожидает</span>
                                <div class="task-actions">
                                    <button class="btn btn-sm btn-success complete-btn" data-task-id="${task.id}" data-date="${today}">Выполнить</button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>

                    ${goalsHTML ? `<div class="goals-section">${goalsHTML}</div>` : ''}

                    <div class="section-header"><h2>Журналы</h2><button class="btn btn-sm btn-secondary" data-nav="journals">Все →</button></div>
                    <div class="journals-grid">
                        ${topJournals.map(journal => {
                            const progress = Math.min((journal.exp / 1000) * 100, 100);
                            return `<div class="journal-card-mini" data-journal="${journal.name}">
                                <div class="journal-icon">${journal.icon || '📌'}</div>
                                <div class="journal-name">${journal.name.charAt(0).toUpperCase() + journal.name.slice(1)}</div>
                                <div class="journal-exp">${Math.floor(journal.exp)} XP</div>
                                <div class="journal-progress"><div class="fill" style="width: ${progress}%;"></div></div>
                            </div>`;
                        }).join('')}
                    </div>
                `;

                container.querySelectorAll('[data-nav]').forEach(btn => {
                    btn.addEventListener('click', () => { this.navigateTo(btn.dataset.nav); });
                });
                container.querySelectorAll('.task-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.complete-btn')) return;
                        const taskId = this.dataset.taskId;
                        if (taskId) UI.openTaskDetail(taskId);
                    });
                });
                container.querySelectorAll('.complete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const taskId = this.dataset.taskId;
                        const dateStr = this.dataset.date;
                        if (Data.completeTaskInstance(taskId, dateStr)) {
                            UI.toast('✅ Задача выполнена!', 'success');
                            App.renderCurrentPage();
                        } else {
                            UI.toast('⚠️ Не удалось выполнить задачу', 'error');
                        }
                    });
                });
                container.querySelectorAll('.goal-card').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.goalId;
                        const goal = Data.goals.find(g => g.id === id);
                        if (goal) UI.toast(`🎯 ${goal.title} — ${goal.achieved ? 'Достигнута' : 'В процессе'}`,
                            'info');
                    });
                });
                container.querySelectorAll('.journal-card-mini').forEach(el => {
                    el.addEventListener('click', function() {
                        UI.toast('📚 Журнал "' + this.dataset.journal + '"', 'info');
                    });
                });

                const goalsBadge = document.getElementById('goalsBadge');
                if (goalsBadge) {
                    const activeGoalsCount = data.goals.filter(g => !g.achieved).length;
                    goalsBadge.textContent = activeGoalsCount;
                    goalsBadge.className = 'badge' + (activeGoalsCount > 0 ? ' show' : '');
                }
            },

            // ================== CALENDAR (полностью рабочий) ==================
            renderCalendar(container) {
                const view = Calendar.getView();
                const baseDate = Calendar.getBaseDate();
                const selectedDate = Calendar.getSelectedDate();
                const tasks = Data.tasks;
                const journals = Data.journals;
                const selectedStr = selectedDate.toISOString().split('T')[0];
                const dayTasks = Data.getTasksForDate(selectedStr);

                let calendarHTML = '';
                let dayDetailHTML = '';

                if (view === 'day') {
                    calendarHTML =
                        `<div class="calendar-grid week">${this._renderDayView(baseDate, tasks, journals)}</div>`;
                } else if (view === 'week') {
                    const week = Calendar.getWeekData(baseDate);
                    calendarHTML =
                        `<div class="calendar-grid week">${week.map(d => this._renderDayCell(d, tasks, journals, selectedDate)).join('')}</div>`;
                } else if (view === 'month') {
                    const year = baseDate.getFullYear();
                    const month = baseDate.getMonth();
                    const weeks = Calendar.getMonthData(year, month);
                    const weekDays = Calendar.getWeekDays();
                    calendarHTML = weekDays.map(d => `<div class="day-header">${d}</div>`).join('') +
                        weeks.flat().map(cell => {
                            const date = new Date(cell.year, cell.month, cell.day);
                            return this._renderDayCell(date, tasks, journals, selectedDate, cell.isOtherMonth);
                        }).join('');
                } else if (view === 'year') {
                    const year = baseDate.getFullYear();
                    const months = Calendar.getYearData(year);
                    calendarHTML =
                    `<div class="year-grid">${months.map((m, idx) => {
                        const hasTasks = Data._data.tasks.some(task => {
                            const start = new Date(task.startDate || task.date);
                            const end = new Date(task.endDate || task.date);
                            return (start.getFullYear() === year && start.getMonth() === idx) || (end.getFullYear() === year && end.getMonth() === idx);
                        });
                        return `<div class="month-card" data-month="${idx}"><div class="month-name">${m.name}</div><div class="month-dots">${Array.from({length:7}, (_, i) => `<div class="dot ${i<3 && hasTasks ? 'has-task' : ''}"></div>`).join('')}</div></div>`;
                    }).join('')}</div>`;
                }

                if (dayTasks.length > 0) {
                    dayDetailHTML =
                    `<div class="calendar-day-detail"><div class="day-title">📋 ${selectedDate.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' })}</div><div class="day-tasks">${dayTasks.map(task => {
                        const status = Data.getTaskStatus(task, selectedStr);
                        const journal = Data.getJournalByName(task.journal);
                        const icon = journal ? journal.icon : '📌';
                        const statusLabels = { done:'✅ Выполнено', pending:'⏳ Ожидает', missed:'❌ Пропущено' };
                        return `<div class="task-item" data-task-id="${task.id}">
                            <div class="task-icon">${icon}</div>
                            <div class="task-info"><div class="task-title">${task.title}</div><div class="task-meta"><span>${task.time || '—'}</span><span>${task.duration || 0} мин</span><span>${task.journal}</span></div></div>
                            <span class="task-status ${status}">${statusLabels[status] || status}</span>
                            ${status === 'pending' ? `<div class="task-actions"><button class="btn btn-sm btn-success complete-btn" data-task-id="${task.id}" data-date="${selectedStr}">Выполнить</button></div>` : ''}
                        </div>`;
                    }).join('')}</div></div>`;
                }

                container.innerHTML = `
                    <div class="calendar-container">
                        <div class="calendar-controls">
                            <div class="btn-group">
                                <button class="btn btn-sm ${view === 'day' ? 'active' : ''}" data-view="day">День</button>
                                <button class="btn btn-sm ${view === 'week' ? 'active' : ''}" data-view="week">Неделя</button>
                                <button class="btn btn-sm ${view === 'month' ? 'active' : ''}" data-view="month">Месяц</button>
                                <button class="btn btn-sm ${view === 'year' ? 'active' : ''}" data-view="year">Год</button>
                            </div>
                            <div class="calendar-nav">
                                <button data-nav="prev">◀</button>
                                <span class="title">${Calendar.getTitle()}</span>
                                <button data-nav="next">▶</button>
                            </div>
                        </div>
                        <div class="calendar-filters">
                            ${journals.map(j => `<span class="chip active" data-filter="${j.name}">${j.icon} ${j.name}</span>`).join('')}
                            <span class="chip" data-filter="all" style="background:var(--primary);color:#fff;">Все</span>
                        </div>
                        <div class="calendar-grid ${view === 'month' ? 'month' : view === 'week' ? 'week' : ''}">
                            ${calendarHTML}
                        </div>
                        ${dayDetailHTML}
                    </div>
                `;

                container.querySelectorAll('[data-view]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        Calendar.setView(this.dataset.view);
                        App.renderCalendar(container);
                    });
                });
                container.querySelectorAll('[data-nav]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const dir = this.dataset.nav === 'prev' ? -1 : 1;
                        Calendar.navigate(dir);
                        App.renderCalendar(container);
                    });
                });
                container.querySelectorAll('.calendar-cell:not(.other-month)').forEach(el => {
                    el.addEventListener('click', function() {
                        const date = new Date(this.dataset.year, this.dataset.month, this.dataset.day);
                        Calendar.setSelectedDate(date);
                        if (view !== 'day') Calendar.setView('day');
                        App.renderCalendar(container);
                    });
                });
                container.querySelectorAll('.month-card').forEach(el => {
                    el.addEventListener('click', function() {
                        const month = parseInt(this.dataset.month, 10);
                        const year = baseDate.getFullYear();
                        Calendar.setBaseDate(new Date(year, month, 1));
                        Calendar.setView('month');
                        App.renderCalendar(container);
                    });
                });
                container.querySelectorAll('.complete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (Data.completeTaskInstance(this.dataset.taskId, this.dataset.date)) {
                            UI.toast('✅ Задача выполнена!', 'success');
                            App.renderCalendar(container);
                        }
                    });
                });
                container.querySelectorAll('.task-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.complete-btn')) return;
                        const taskId = this.dataset.taskId;
                        if (taskId) UI.openTaskDetail(taskId);
                    });
                });
                container.querySelectorAll('[data-filter]').forEach(chip => {
                    chip.addEventListener('click', function() {
                        this.classList.toggle('active');
                        UI.toast('Фильтр: ' + this.textContent, 'info');
                    });
                });
            },

            _renderDayCell: function(date, tasks, journals, selectedDate, isOtherMonth) {
                isOtherMonth = isOtherMonth || false;
                const dateStr = date.toISOString().split('T')[0];
                const dayTasks = Data.getTasksForDate(dateStr);
                const isToday = Data.isSameDay(date, new Date());
                const isSelected = Data.isSameDay(date, selectedDate);
                const badgeCounts = {};
                dayTasks.forEach(task => {
                    const status = Data.getTaskStatus(task, dateStr);
                    if (status !== 'missed') badgeCounts[task.journal] = (badgeCounts[task.journal] || 0) + 1;
                });
                const badgeHTML = Object.entries(badgeCounts).map(([name, count]) =>
                    `<span class="badge">${name}:${count}</span>`).join('');
                let cls = 'calendar-cell';
                if (isToday) cls += ' today';
                if (isSelected) cls += ' selected';
                if (isOtherMonth) cls += ' other-month';
                return `<div class="${cls}" data-year="${date.getFullYear()}" data-month="${date.getMonth()}" data-day="${date.getDate()}">
                    <div class="date">${date.getDate()}</div>
                    ${badgeHTML ? `<div class="badge-container">${badgeHTML}</div>` : ''}
                    ${dayTasks.length > 0 && !badgeHTML ? '<div class="task-indicator"></div>' : ''}
                </div>`;
            },

            _renderDayView: function(date, tasks, journals) {
                const dateStr = date.toISOString().split('T')[0];
                const dayTasks = Data.getTasksForDate(dateStr);
                if (dayTasks.length === 0) return '<div style="grid-column:span 7;text-align:center;padding:20px;color:var(--text-secondary);">Нет задач на этот день</div>';
                return dayTasks.map(task => {
                    const status = Data.getTaskStatus(task, dateStr);
                    const journal = Data.getJournalByName(task.journal);
                    const icon = journal ? journal.icon : '📌';
                    const statusLabels = { done: '✅', pending: '⏳', missed: '❌' };
                    return `<div class="task-item" data-task-id="${task.id}" style="grid-column:span 7;">
                        <div class="task-icon">${icon}</div>
                        <div class="task-info"><div class="task-title">${task.title}</div><div class="task-meta"><span>${task.time || '—'}</span><span>${task.duration || 0} мин</span><span>${task.journal}</span></div></div>
                        <span class="task-status ${status}">${statusLabels[status] || status}</span>
                        ${status === 'pending' ? `<div class="task-actions"><button class="btn btn-sm btn-success complete-btn" data-task-id="${task.id}" data-date="${dateStr}">Выполнить</button></div>` : ''}
                    </div>`;
                }).join('');
            },

            // ================== ЖУРНАЛЫ ==================
            renderJournals(container) {
                const journals = Data.journals;
                container.innerHTML = `
                    <div class="section-header"><h2>Все журналы</h2></div>
                    <div class="journals-grid">
                        ${journals.map(j => {
                            const tasks = Data.tasks.filter(t => t.journal === j.name);
                            const progress = Math.min((j.exp / 1000) * 100, 100);
                            return `<div class="journal-card-mini" data-journal="${j.name}">
                                <div class="journal-icon" style="font-size:40px;">${j.icon || '📌'}</div>
                                <div class="journal-name">${j.name.charAt(0).toUpperCase() + j.name.slice(1)}</div>
                                <div class="journal-exp">${Math.floor(j.exp)} XP</div>
                                <div class="journal-progress"><div class="fill" style="width:${progress}%;"></div></div>
                                <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${tasks.length} задач</div>
                            </div>`;
                        }).join('')}
                    </div>
                `;
                container.querySelectorAll('.journal-card-mini').forEach(el => {
                    el.addEventListener('click', function() {
                        UI.toast('📚 Журнал "' + this.dataset.journal + '"', 'info');
                    });
                });
            },

            // ================== ЦЕЛИ ==================
            renderGoals(container) {
                const goals = Data.goals;
                container.innerHTML =
                    `<div class="section-header"><h2>Цели</h2><button class="btn" id="addGoalBtn">+ Новая цель</button></div>`;
                if (goals.length === 0) {
                    container.innerHTML +=
                        `<div class="tasks-empty"><div class="empty-icon">🎯</div><p>У вас пока нет целей</p><p style="color:var(--text-secondary)">Создайте первую цель!</p></div>`;
                } else {
                    goals.forEach(goal => {
                        const tasks = Data.tasks.filter(t => t.goalId === goal.id);
                        const done = tasks.reduce((acc, t) => acc + t.completedDates.length, 0);
                        const total = tasks.reduce((acc, t) => {
                            const start = t.startDate || t.date;
                            const end = t.endDate || t.date;
                            return acc + Data.getDateRange(start, end).length;
                        }, 0);
                        const progress = total > 0 ? Math.round((done / total) * 100) : 0;
                        const checkpoints = goal.checkpoints ? goal.checkpoints.map(d => UI.formatDate(d)).join(
                            ', ') : '—';
                        container.innerHTML += `
                            <div class="goal-card" data-goal-id="${goal.id}">
                                <div class="goal-header">
                                    <div>
                                        <div class="goal-title">${goal.title}</div>
                                        <div class="goal-desc">${goal.description || 'Без описания'}</div>
                                    </div>
                                    <span class="chip ${goal.achieved ? 'active' : ''}">${goal.achieved ? '✅ Достигнута' : 'В процессе'}</span>
                                </div>
                                <div class="goal-meta"><span>📅 Дедлайн: ${UI.formatDate(goal.deadline)}</span><span>🎯 Контрольные точки: ${checkpoints}</span></div>
                                <div class="goal-progress"><div class="progress"><div class="progress-bar" style="width:${progress}%;"></div></div></div>
                                <div class="goal-meta"><span>${done}/${total} задач выполнено</span></div>
                                <div class="goal-actions">
                                    <button class="btn btn-sm btn-secondary edit-goal-btn" data-goal-id="${goal.id}">✏️</button>
                                    <button class="btn btn-sm btn-danger delete-goal-btn" data-goal-id="${goal.id}">🗑</button>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('addGoalBtn').addEventListener('click', () => { UI.openGoalModal(null); });
                container.querySelectorAll('.edit-goal-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        UI.openGoalModal(this.dataset.goalId);
                    });
                });
                container.querySelectorAll('.delete-goal-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        UI.deleteGoal(this.dataset.goalId);
                    });
                });
                container.querySelectorAll('.goal-card').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('button')) return;
                        const id = this.dataset.goalId;
                        const goal = Data.goals.find(g => g.id === id);
                        if (goal) UI.toast(`🎯 ${goal.title} — ${goal.achieved ? 'Достигнута' : 'В процессе'}`,
                            'info');
                    });
                });
            },

            // ================== ПРОФИЛЬ ==================
            renderProfile(container) {
                const profile = Data.profile;
                const isDark = document.body.classList.contains('dark');
                const themes = ['default', 'jade', 'ruby', 'sapphire', 'amber', 'coral', 'amethyst'];
                let themeChips = '';
                themes.forEach(t => {
                    const isActive = document.body.classList.contains('theme-' + t);
                    const bg = t !== 'default' ? 'var(--primary)' : 'var(--card-border)';
                    themeChips +=
                        `<span class="chip ${isActive ? 'active' : ''}" data-theme="${t}" style="width:32px;height:32px;padding:0;border-radius:60px;background:${bg};display:inline-block;cursor:pointer;border:2px solid transparent;transition:all var(--transition);${isActive ? 'border-color:var(--primary);' : ''}"></span>`;
                });

                container.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <div class="avatar avatar-xl" style="margin:0 auto;width:88px;height:88px;font-size:36px;"><span>${profile.name.charAt(0).toUpperCase()}</span></div>
                        <h2 style="font-size:24px;margin-top:12px;">${profile.name}</h2>
                        <p style="color:var(--text-secondary);">Уровень ${profile.level} · ${Math.floor(profile.totalExp)} XP</p>
                        <div style="display:flex;justify-content:center;gap:24px;margin-top:16px;">
                            <div><span style="font-size:20px;font-weight:700;">${profile.streak || 0}</span><br><span style="font-size:13px;color:var(--text-secondary);">🔥 Дней</span></div>
                            <div><span style="font-size:20px;font-weight:700;">${profile.age}</span><br><span style="font-size:13px;color:var(--text-secondary);">Возраст</span></div>
                            <div><span style="font-size:20px;font-weight:700;">${profile.weight} кг</span><br><span style="font-size:13px;color:var(--text-secondary);">Вес</span></div>
                        </div>
                    </div>

                    <div class="card" style="margin-top:16px;">
                        <h3 style="font-size:18px;font-weight:600;margin-bottom:12px;">Параметры тела</h3>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                            <div><label class="input-label">Рост (см)</label><input type="number" class="input" id="pHeight" value="${profile.height}" step="0.1"></div>
                            <div><label class="input-label">Грудь (см)</label><input type="number" class="input" id="pChest" value="${profile.chest}" step="0.5"></div>
                            <div><label class="input-label">Талия (см)</label><input type="number" class="input" id="pWaist" value="${profile.waist}" step="0.5"></div>
                            <div><label class="input-label">Бёдра (см)</label><input type="number" class="input" id="pHips" value="${profile.hips}" step="0.5"></div>
                            <div><label class="input-label">Бицепс (см)</label><input type="number" class="input" id="pBiceps" value="${profile.biceps}" step="0.5"></div>
                            <div><label class="input-label">Возраст</label><input type="number" class="input" id="pAge" value="${profile.age}"></div>
                            <div style="grid-column:span 2;"><label class="input-label">Вес (кг)</label><input type="number" class="input" id="pWeight" value="${profile.weight}" step="0.1"></div>
                        </div>
                    </div>

                    <div class="card" style="margin-top:16px;">
                        <h3 style="font-size:18px;font-weight:600;margin-bottom:12px;">Настройки</h3>
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card-border);">
                            <span>Тёмный режим</span>
                            <label class="switch"><input type="checkbox" id="darkModeSwitch" ${isDark ? 'checked' : ''}><span class="slider"></span></label>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:8px 0;">
                            <span>Тема</span>
                            <div style="display:flex;gap:8px;">${themeChips}</div>
                        </div>
                    </div>

                    <button class="btn" id="saveProfileBtn" style="width:100%;margin-top:16px;">💾 Сохранить профиль</button>
                `;

                const saveBtn = container.querySelector('#saveProfileBtn');
                if (saveBtn) {
                    saveBtn.addEventListener('click', function() {
                        const age = parseInt(document.getElementById('pAge').value) || 0;
                        const weight = parseFloat(document.getElementById('pWeight').value) || 0;
                        const height = parseFloat(document.getElementById('pHeight').value) || 0;
                        const chest = parseFloat(document.getElementById('pChest').value) || 0;
                        const waist = parseFloat(document.getElementById('pWaist').value) || 0;
                        const hips = parseFloat(document.getElementById('pHips').value) || 0;
                        const biceps = parseFloat(document.getElementById('pBiceps').value) || 0;

                        const profile = Data.profile;
                        profile.age = age;
                        profile.weight = weight;
                        profile.height = height;
                        profile.chest = chest;
                        profile.waist = waist;
                        profile.hips = hips;
                        profile.biceps = biceps;

                        Data.save();
                        UI.toast('✅ Профиль сохранён!', 'success');
                        const userNameEl = document.getElementById('userName');
                        if (userNameEl) userNameEl.textContent = profile.name;
                        const initialsEl = document.getElementById('avatarInitials');
                        if (initialsEl) initialsEl.textContent = profile.name.charAt(0).toUpperCase();
                        App.renderProfile(container);
                    });
                }

                const darkSwitch = container.querySelector('#darkModeSwitch');
                if (darkSwitch) darkSwitch.addEventListener('change', () => { UI.toggleDarkMode(); });

                container.querySelectorAll('[data-theme]').forEach(chip => {
                    chip.addEventListener('click', function() {
                        const theme = this.dataset.theme;
                        document.body.className = document.body.className.split(' ').filter(c => !c.startsWith(
                            'theme-')).join('');
                        if (theme !== 'default') document.body.classList.add('theme-' + theme);
                        UI.toast('🎨 Тема: ' + theme, 'info', 1500);
                        App.renderProfile(container);
                    });
                });
            },

            // ================== ЗАМЕТКИ ==================
            renderNotes(container) {
                const notes = Data.notes;
                container.innerHTML =
                    `<div class="section-header"><h2>Заметки</h2><button class="btn" id="addNoteBtn">+ Новая заметка</button></div>`;
                if (notes.length === 0) {
                    container.innerHTML +=
                        `<div class="tasks-empty"><div class="empty-icon">📝</div><p>Заметок пока нет</p><p style="color:var(--text-secondary)">Создайте первую заметку</p></div>`;
                } else {
                    notes.slice().reverse().forEach(note => {
                        const task = Data.tasks.find(t => t.id === note.taskId);
                        container.innerHTML += `
                            <div class="note-item" data-note-id="${note.id}">
                                <div class="note-text">
                                    <div style="font-weight:500;">${note.text}</div>
                                    <div class="note-date">${UI.formatDate(note.createdAt, 'datetime')} ${task ? '→ ' + task.title : ''}</div>
                                </div>
                                <div class="note-actions">
                                    <button class="btn btn-sm btn-secondary edit-note-btn" data-note-id="${note.id}">✏️</button>
                                    <button class="btn btn-sm btn-danger delete-note-btn" data-note-id="${note.id}">🗑</button>
                                </div>
                            </div>
                        `;
                    });
                }

                document.getElementById('addNoteBtn').addEventListener('click', () => { UI.openNoteModal(null); });
                container.querySelectorAll('.edit-note-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        UI.openNoteModal(this.dataset.noteId);
                    });
                });
                container.querySelectorAll('.delete-note-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        UI.deleteNote(this.dataset.noteId);
                    });
                });
            },

            // ================== ГАЛЕРЕЯ ==================
            renderGallery(container) {
                const photos = Data.photos;
                container.innerHTML =
                    `<div class="section-header"><h2>Галерея</h2><button class="btn" id="addPhotoBtn">+ Добавить фото</button></div>`;
                if (photos.length === 0) {
                    container.innerHTML +=
                        `<div class="tasks-empty"><div class="empty-icon">🖼</div><p>Фото пока нет</p><p style="color:var(--text-secondary)">Добавьте первое фото</p></div>`;
                } else {
                    container.innerHTML += `<div class="photo-grid">`;
                    photos.slice().reverse().forEach(photo => {
                        container.innerHTML += `
                            <div class="photo-item" data-photo-id="${photo.id}">
                                <img src="${photo.data}" alt="Фото">
                                <div class="photo-meta">${photo.note ? photo.note : ''} ${UI.formatDate(photo.date, 'short')}</div>
                                <button class="photo-delete" data-photo-id="${photo.id}">✕</button>
                            </div>
                        `;
                    });
                    container.innerHTML += `</div>`;
                }

                document.getElementById('addPhotoBtn').addEventListener('click', () => { UI.addPhoto(); });
                container.querySelectorAll('.photo-delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        UI.deletePhoto(this.dataset.photoId);
                    });
                });
                container.querySelectorAll('.photo-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.photo-delete')) return;
                        const id = this.dataset.photoId;
                        const photo = Data.photos.find(p => p.id === id);
                        if (photo) {
                            UI.toast('Фото: ' + (photo.note || 'без описания'), 'info', 2000);
                        }
                    });
                });
            },

            // ================== ВСЕ ЗАДАЧИ ==================
            renderAllTasks(container) {
                const tasks = Data.tasks;
                const journals = Data.journals;
                let filterJournal = 'all';
                let filterStatus = 'all';

                container.innerHTML = `
                    <div class="section-header"><h2>Все задачи</h2></div>
                    <div class="all-task-filters" id="journalFilters">
                        <span class="chip active" data-filter-journal="all">Все журналы</span>
                        ${journals.map(j => `<span class="chip" data-filter-journal="${j.name}">${j.icon} ${j.name}</span>`).join('')}
                    </div>
                    <div class="all-task-filters" id="statusFilters">
                        <span class="chip active" data-filter-status="all">Все статусы</span>
                        <span class="chip" data-filter-status="pending">⏳ Ожидает</span>
                        <span class="chip" data-filter-status="done">✅ Выполнено</span>
                        <span class="chip" data-filter-status="missed">❌ Пропущено</span>
                    </div>
                    <div id="allTasksList">
                        ${tasks.length === 0 ? `
                            <div class="tasks-empty"><div class="empty-icon">📋</div><p>Задач пока нет</p></div>
                        ` : tasks.slice().sort((a,b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt)).map(task => {
                            const today = new Date().toISOString().split('T')[0];
                            const status = Data.getTaskStatus(task, today);
                            const journal = Data.getJournalByName(task.journal);
                            const icon = journal ? journal.icon : '📌';
                            const statusLabels = { done:'✅ Выполнено', pending:'⏳ Ожидает', missed:'❌ Пропущено' };
                            return `
                                <div class="all-task-item" data-task-id="${task.id}" data-journal="${task.journal}" data-status="${status}">
                                    <div class="task-info-text">
                                        <div style="font-weight:500;">${icon} ${task.title}</div>
                                        <div class="task-meta-text">${task.journal} · ${task.time || '—'} · ${task.duration || 0} мин · Обновлено: ${UI.formatDate(task.updatedAt || task.createdAt, 'datetime')}</div>
                                    </div>
                                    <span class="task-status ${status}">${statusLabels[status] || status}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

                const applyAllTasksFilter = () => {
                    const items = container.querySelectorAll('.all-task-item');
                    items.forEach(item => {
                        const journal = item.dataset.journal;
                        const status = item.dataset.status;
                        let show = true;
                        if (filterJournal !== 'all' && journal !== filterJournal) show = false;
                        if (filterStatus !== 'all' && status !== filterStatus) show = false;
                        item.style.display = show ? 'flex' : 'none';
                    });
                };

                container.querySelectorAll('#journalFilters .chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        container.querySelectorAll('#journalFilters .chip').forEach(c => c.classList.remove(
                        'active'));
                        this.classList.add('active');
                        filterJournal = this.dataset.filterJournal;
                        applyAllTasksFilter();
                    });
                });

                container.querySelectorAll('#statusFilters .chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        container.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.remove(
                        'active'));
                        this.classList.add('active');
                        filterStatus = this.dataset.filterStatus;
                        applyAllTasksFilter();
                    });
                });

                container.querySelectorAll('.all-task-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const taskId = this.dataset.taskId;
                        if (taskId) UI.openTaskDetail(taskId);
                    });
                });
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            App.init();
        });
        window.App = App;
    </script>
</body>
</html>
