<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>RPG Планировщик v6</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===== */
        :root {
            /* Основные (зависят от темы) */
            --bg-primary: #0e0e1a;
            --bg-secondary: rgba(22, 22, 40, 0.85);
            --bg-card: rgba(30, 30, 58, 0.7);
            --bg-modal: rgba(22, 22, 44, 0.95);
            --bg-input: rgba(10, 10, 26, 0.7);
            --text-primary: #eef0f8;
            --text-secondary: #8899bb;
            --text-muted: #667799;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow-color: rgba(0, 0, 0, 0.7);

            /* Акцент (изменяемый) */
            --accent: #6C5CE7;
            --accent-light: #A29BFE;
            --accent-gradient: linear-gradient(135deg, var(--accent), var(--accent-light));
            --accent-shadow: rgba(108, 92, 231, 0.4);

            /* Цвета журналов (можно будет сделать настраиваемыми позже) */
            --color-body: #ff4757;
            --color-hobby: #a29bfe;
            --color-business: #4a8bfe;
            --color-food: #2ed573;
            --color-finance: #ffa502;
            --color-debts: #ff6348;
        }

        /* Светлая тема */
        [data-theme="light"] {
            --bg-primary: #f0f2f8;
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-modal: rgba(255, 255, 255, 0.95);
            --bg-input: rgba(240, 240, 248, 0.8);
            --text-primary: #1a1a2e;
            --text-secondary: #445566;
            --text-muted: #667799;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        /* ===== СБРОС И БАЗА ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
            transition: background 0.3s, color 0.3s;
        }

        #app {
            max-width: 440px;
            width: 100%;
            background: var(--bg-secondary);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 20px 16px 80px;
            position: relative;
            box-shadow: 0 20px 60px var(--shadow-color);
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }

        /* ===== КНОПКА НАСТРОЕК ===== */
        #settingsToggle {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.2s;
            margin-left: auto;
            display: block;
        }
        #settingsToggle:active {
            transform: scale(0.9);
        }

        /* ===== ПЕРСОНАЖ ===== */
        #character-card {
            background: var(--bg-card);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px var(--shadow-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .avatar {
            font-size: 38px;
            line-height: 1;
        }

        .char-info {
            flex: 1;
            min-width: 140px;
        }

        .char-info .name-gender {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .char-info input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(108, 92, 231, 0.4);
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            width: 120px;
            padding: 2px 0;
            outline: none;
            transition: border-color 0.3s;
        }

        .char-info input:focus {
            border-bottom-color: var(--accent);
        }

        .char-info select {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 14px;
            outline: none;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-size: 14px;
            margin-top: 6px;
        }

        .stats span {
            background: rgba(40, 40, 70, 0.4);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .level-badge {
            background: var(--accent-gradient);
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-shadow);
        }

        .xp-bar {
            width: 100%;
            height: 6px;
            background: rgba(40, 40, 70, 0.4);
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        .xp-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ===== КАЛЕНДАРЬ ===== */
        #calendar-wrap {
            background: var(--bg-card);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px var(--shadow-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .view-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .view-tabs button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 30px;
            background: rgba(40, 40, 70, 0.4);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .view-tabs button.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-shadow);
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cal-header button {
            background: rgba(40, 40, 70, 0.4);
            border: none;
            color: var(--text-primary);
            font-size: 18px;
            padding: 0 16px;
            border-radius: 30px;
            cursor: pointer;
            line-height: 34px;
            transition: 0.2s;
        }

        .cal-header button:active {
            transform: scale(0.94);
        }

        .cal-header .month-year {
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        /* Месяц */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-grid .weekday {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 0;
        }

        .cal-grid .day {
            padding: 8px 0;
            border-radius: 30px;
            background: rgba(26, 26, 50, 0.4);
            font-size: 14px;
            transition: 0.2s;
            cursor: pointer;
            position: relative;
            color: var(--text-primary);
        }

        .cal-grid .day.today {
            background: var(--accent-gradient);
            font-weight: 700;
            box-shadow: 0 0 20px var(--accent-shadow);
            color: #fff;
        }

        .cal-grid .day.other-month {
            opacity: 0.2;
        }

        .cal-grid .day .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .cal-grid .day .dot.body { background: var(--color-body); }
        .cal-grid .day .dot.hobby { background: var(--color-hobby); }
        .cal-grid .day .dot.business { background: var(--color-business); }
        .cal-grid .day .dot.food { background: var(--color-food); }
        .cal-grid .day .dot.finance { background: var(--color-finance); }
        .cal-grid .day .dot.debts { background: var(--color-debts); }

        /* День (почасовой) */
        .hour-grid {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .hour-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: rgba(26, 26, 50, 0.4);
            padding: 6px 12px;
            border-radius: 16px;
            color: var(--text-primary);
        }

        .hour-row .hour-label {
            min-width: 40px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .hour-row .hour-tasks {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .hour-tasks .task-tag {
            background: rgba(40, 40, 70, 0.5);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            border-left: 3px solid;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            color: var(--text-primary);
        }

        /* Неделя */
        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .week-day {
            background: rgba(26, 26, 50, 0.4);
            border-radius: 16px;
            padding: 8px 4px;
            min-height: 80px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            color: var(--text-primary);
        }

        .week-day:active {
            transform: scale(0.96);
        }

        .week-day.today {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-shadow);
        }

        .week-day .day-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        .week-day .day-tasks {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .week-day .day-tasks .task-mini {
            background: rgba(40, 40, 70, 0.3);
            border-radius: 8px;
            padding: 2px 6px;
            margin-bottom: 2px;
            border-left: 3px solid;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 10px;
            color: var(--text-primary);
        }

        /* Год */
        .year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .month-card {
            background: rgba(26, 26, 50, 0.4);
            border-radius: 16px;
            padding: 12px 6px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            text-align: center;
            color: var(--text-primary);
        }

        .month-card:active {
            transform: scale(0.96);
        }

        .month-card .month-name {
            font-weight: 700;
            font-size: 15px;
        }

        .month-card .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 6px;
        }

        .month-card .stats-row .stat-item {
            font-size: 10px;
            background: rgba(40, 40, 70, 0.3);
            padding: 1px 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
        }

        .stat-item .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        /* ===== ЖУРНАЛЫ ===== */
        .screen {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen.active {
            display: flex;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .screen-header h2 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .screen-header .color-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px currentColor;
        }

        .btn-new {
            border: none;
            color: #fff;
            font-size: 24px;
            width: 48px;
            height: 48px;
            border-radius: 40px;
            cursor: pointer;
            background: var(--accent-gradient);
            box-shadow: 0 4px 20px var(--accent-shadow);
            transition: 0.2s;
        }

        .btn-new:active {
            transform: scale(0.90);
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
        }

        .filter-tabs button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 30px;
            background: rgba(40, 40, 70, 0.3);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 2px solid transparent;
        }

        .filter-tabs button.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
            background: rgba(108, 92, 231, 0.15);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task-list::-webkit-scrollbar {
            width: 4px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .task-item {
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 12px 16px;
            border-left: 5px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: 0.2s;
            animation: slideUp 0.25s ease;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item.done {
            opacity: 0.6;
        }

        .task-item.skipped {
            opacity: 0.4;
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-title {
            font-weight: 600;
            font-size: 15px;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .task-meta span {
            background: rgba(40, 40, 70, 0.3);
            padding: 0 10px;
            border-radius: 30px;
        }

        .task-days {
            font-size: 11px;
            color: var(--accent-light);
        }

        .task-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .task-actions button {
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .task-actions button:active {
            transform: scale(0.92);
        }

        .btn-done {
            background: #2e7d32;
            color: #fff;
        }

        .btn-skip {
            background: #7d2e2e;
            color: #fff;
        }

        .btn-del {
            background: rgba(60, 30, 40, 0.8);
            color: #ccb;
        }

        /* ===== МОДАЛЬНЫЕ ОКНА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--bg-modal);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow-color);
            color: var(--text-primary);
            transition: background 0.3s;
        }

        .modal h3 {
            font-size: 20px;
            margin-bottom: 16px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: block;
            margin-top: 10px;
        }

        .modal input,
        .modal select,
        .modal textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            margin-top: 4px;
            outline: none;
            transition: 0.2s;
        }

        .modal input:focus,
        .modal select:focus,
        .modal textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .modal textarea {
            min-height: 60px;
            resize: vertical;
        }

        .modal .days-check {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .modal .days-check label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 400;
            background: rgba(40, 40, 70, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 0;
            color: var(--text-primary);
        }

        .modal .days-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            margin: 0;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-actions button:active {
            transform: scale(0.94);
        }

        .btn-save-task {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-shadow);
        }

        .btn-cancel {
            background: rgba(40, 40, 70, 0.4);
            color: var(--text-secondary);
        }

        /* Специальные стили для кнопок выбора цвета в настройках */
        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .color-btn:active {
            transform: scale(0.9);
        }
        .theme-btn {
            padding: 8px;
            border-radius: 30px;
            border: 2px solid transparent;
            background: var(--bg-input);
            color: var(--text-primary);
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .theme-btn.active {
            border-color: var(--accent);
            background: var(--accent-gradient);
            color: #fff;
        }

        /* ===== НИЖНИЙ ТАБ-БАР ===== */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(12, 12, 26, 0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            border-radius: 0 0 36px 36px;
            padding: 6px 4px 10px;
            display: flex;
            justify-content: space-around;
            transition: background 0.3s, border-color 0.3s;
        }

        #bottom-bar button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 6px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            border-radius: 16px;
        }

        #bottom-bar button .icon {
            font-size: 22px;
            line-height: 1;
        }

        #bottom-bar button .label {
            font-size: 9px;
            font-weight: 500;
        }

        #bottom-bar button.active {
            color: var(--accent);
            background: rgba(108, 92, 231, 0.15);
        }

        #bottom-bar button:active {
            transform: scale(0.90);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 400px) {
            #app {
                padding: 16px 12px 70px;
            }
            .modal {
                padding: 16px;
            }
            .task-title {
                font-size: 14px;
            }
            .cal-header .month-year {
                font-size: 15px;
            }
            .hour-row {
                font-size: 12px;
            }
            .week-day {
                min-height: 60px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ===== КНОПКА НАСТРОЕК ===== -->
    <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
        <button id="settingsToggle" title="Настройки темы и цвета">⚙️</button>
    </div>

    <!-- ===== КАРТОЧКА ПЕРСОНАЖА ===== -->
    <div id="character-card">
        <div class="avatar">🧙</div>
        <div class="char-info">
            <div class="name-gender">
                <input type="text" id="charName" value="Герой" />

    <!-- ===== МОДАЛЬНОЕ ОКНО НАСТРОЕК ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal" style="max-width:340px;">
            <h3 style="margin-bottom:16px;">⚙️ Настройки</h3>

            <label style="display:block; margin-top:8px;">Тема</label>
            <div style="display:flex; gap:8px; margin-top:4px;">
                <button class="theme-btn active" data-theme="dark">🌙 Тёмная</button>
                <button class="theme-btn" data-theme="light">☀️ Светлая</button>
            </div>

            <label style="display:block; margin-top:16px;">Акцентный цвет</label>

                <button class="color-btn" data-color="#6C5CE7" style="background:#6C5CE7;" title="Фиолетовый"></button>
                <button class="color-btn" data-color="#4A8BFE" style="background:#4A8BFE;" title="Синий"></button>
                <button class="color-btn" data-color="#2ED573" style="background:#2ED573;" title="Зелёный"></button>
                <button class="color-btn" data-color="#FFA502" style="background:#FFA502;" title="Оранжевый"></button>
                <button class="color-btn" data-color="#FF4757" style="background:#FF4757;" title="Красный"></button>
                <button class="color-btn" data-color="#FD79A8" style="background:#FD79A8;" title="Розовый"></button>
            </div>

            <div class="modal-actions" style="margin-top:20px;">
                <button class="btn-cancel" id="settingsClose" style="flex:1;">Закрыть</button>
            </div>

</div>

<script>
    // ============================================================
    // 1. ДАННЫЕ
    // ============================================================
    const STORAGE_KEY = 'rpg_journal_v6';
    const COLORS = {
        body: '#ff4757',
        hobby: '#a29bfe',
        business: '#4a8bfe',
        food: '#2ed573',
        finance: '#ffa502',
        debts: '#ff6348'
    };
    const CATEGORIES = ['body','hobby','business','food','finance','debts'];

    function getDefaultData() {
        return {
            character: { name: 'Герой', gender: 'М', hp: 100, str: 10, int: 10, end: 10, level: 1, xp: 0 },
            tasks: {
                body: [],
                hobby: [],
                business: [],
                food: [],
                finance: [],
                debts: []
            }
        };
    }

    let data = loadData();

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                const def = getDefaultData();
                for (let key in def) {
                    if (!(key in parsed)) parsed[key] = def[key];
                }
                for (let cat in def.tasks) {
                    if (!(cat in parsed.tasks)) parsed.tasks[cat] = [];
                }
                return parsed;
            }
        } catch(e) {}
        return getDefaultData();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ============================================================
    // 2. РПГ
    // ============================================================
    function addXP(amount) {
        data.character.xp += amount;
        const xpNeeded = 100 + data.character.level * 20;
        while (data.character.xp >= xpNeeded) {
            data.character.xp -= xpNeeded;
            data.character.level += 1;
            const stats = ['hp','str','int','end'];
            const s = stats[Math.floor(Math.random() * stats.length)];
            data.character[s] += 1;
        }
        saveData();
        updateCharacterUI();
    }

    function getPriorityXP(priority) {
        const map = { low: 5, medium: 10, high: 20 };
        return map[priority] || 10;
    }

    // ============================================================
    // 3. UI ПЕРСОНАЖА
    // ============================================================
    function updateCharacterUI() {
        const c = data.character;
        document.getElementById('charName').value = c.name;
        document.getElementById('charGender').value = c.gender;
        document.getElementById('statHp').textContent = c.hp;
        document.getElementById('statStr').textContent = c.str;
        document.getElementById('statInt').textContent = c.int;
        document.getElementById('statEnd').textContent = c.end;
        document.getElementById('levelDisplay').textContent = c.level;
        const xpNeeded = 100 + c.level * 20;
        const pct = Math.min(100, (c.xp / xpNeeded) * 100);
        document.getElementById('xpFill').style.width = pct + '%';
        document.getElementById('xpText').textContent = c.xp;
    }

    // ============================================================
    // 4. РАБОТА С ЗАДАЧАМИ
    // ============================================================
    function getTasksForDate(dateStr) {
        const result = [];
        CATEGORIES.forEach(cat => {
            data.tasks[cat].forEach(task => {
                // точная дата
                if (task.date === dateStr) {
                    result.push({ ...task, category: cat });
                }
                // повторяющиеся дни
                if (task.days && task.days.length) {
                    const d = new Date(dateStr);
                    const dayOfWeek = d.getDay();
                    const dayIndex = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
                    const daysMap = ['mon','tue','wed','thu','fri','sat','sun'];
                    if (task.days.includes(daysMap[dayIndex])) {
                        if (!result.some(t => t === task && t.category === cat)) {
                            result.push({ ...task, category: cat });
                        }
                    }
                }
            });
        });
        return result;
    }

    function getTasksForWeek(startDateStr) {
        const start = new Date(startDateStr);
        const week = {};
        for (let i=0; i<7; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            const key = d.toISOString().split('T')[0];
            week[key] = getTasksForDate(key);
        }
        return week;
    }

    function getMonthStats(year, month) {
        const stats = {};
        CATEGORIES.forEach(cat => stats[cat] = 0);
        const daysInMonth = new Date(year, month+1, 0).getDate();
        for (let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const tasks = getTasksForDate(dateStr);
            tasks.forEach(task => {
                if (task.category && stats[task.category] !== undefined) {
                    stats[task.category]++;
                }
            });
        }
        return stats;
    }

    // ============================================================
    // 5. КАЛЕНДАРЬ
    // ============================================================
    let viewMode = 'month';
    let selectedDate = new Date();
    let currentYear = selectedDate.getFullYear();
    let currentMonth = selectedDate.getMonth();
    let currentWeekStart = getWeekStart(selectedDate);

    function getWeekStart(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = (day === 0) ? 6 : day - 1;
        d.setDate(d.getDate() - diff);
        d.setHours(0,0,0,0);
        return d;
    }

    function formatDate(date) {
        return date.toISOString().split('T')[0];
    }

    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const shortMonthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

    function renderCalendar() {
        const container = document.getElementById('calendar-content');
        const title = document.getElementById('calTitle');

        switch (viewMode) {
            case 'month': renderMonthView(container, title); break;
            case 'day': renderDayView(container, title); break;
            case 'week': renderWeekView(container, title); break;
            case 'year': renderYearView(container, title); break;
        }
    }

    // ---- МЕСЯЦ ----
    function renderMonthView(container, title) {
        title.textContent = monthNames[currentMonth] + ' ' + currentYear;

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
        const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
        let startOffset = (firstDay === 0) ? 6 : firstDay - 1;

        let html = `<div class="cal-grid">`;
        ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => {
            html += `<div class="weekday">${w}</div>`;
        });

        for (let i=0; i<startOffset; i++) {
            const d = daysInPrev - startOffset + i + 1;
            html += `<div class="day other-month">${d}</div>`;
        }

        const today = new Date();
        for (let d=1; d<=daysInMonth; d++) {
            const dateObj = new Date(currentYear, currentMonth, d);
            const dateStr = formatDate(dateObj);
            const isToday = (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
            const tasks = getTasksForDate(dateStr);
            const dots = tasks.map(t => `<span class="dot ${t.category}"></span>`).join('');
            const cls = 'day' + (isToday ? ' today' : '');
            html += `<div class="${cls}" data-date="${dateStr}">${d}${dots ? '<br>'+dots : ''}</div>`;
        }

        html += `</div>`;
        container.innerHTML = html;

        container.querySelectorAll('.day:not(.other-month)').forEach(el => {
            el.addEventListener('click', () => {
                const dateStr = el.dataset.date;
                if (dateStr) {
                    selectedDate = new Date(dateStr);
                    viewMode = 'day';
                    renderCalendar();
                }
            });
        });
    }

    // ---- ДЕНЬ ----
    function renderDayView(container, title) {
        const dateStr = formatDate(selectedDate);
        const parts = dateStr.split('-');
        const year = parseInt(parts[0]), month = parseInt(parts[1])-1, day = parseInt(parts[2]);
        title.textContent = `${day} ${monthNames[month]} ${year}`;

        const tasks = getTasksForDate(dateStr);
        const byHour = {};
        const noTime = [];
        tasks.forEach(task => {
            if (task.time) {
                const hour = parseInt(task.time.split(':')[0]);
                if (!byHour[hour]) byHour[hour] = [];
                byHour[hour].push(task);
            } else {
                noTime.push(task);
            }
        });

        let html = `<div class="hour-grid">`;
        for (let h=0; h<24; h++) {
            const hourTasks = byHour[h] || [];
            const tasksHtml = hourTasks.map(t =>
                `<span class="task-tag" style="border-left-color:${COLORS[t.category]}; background:${COLORS[t.category]}22;">${t.title}</span>`
            ).join('');
            html += `
                <div class="hour-row">
                    <span class="hour-label">${String(h).padStart(2,'0')}:00</span>
                    <div class="hour-tasks">${tasksHtml}</div>
                </div>
            `;
        }
        if (noTime.length) {
            html += `<div class="hour-row" style="background:rgba(40,40,70,0.3);"><span class="hour-label">📌</span><div class="hour-tasks">`;
            noTime.forEach(t => {
                html += `<span class="task-tag" style="border-left-color:${COLORS[t.category]}; background:${COLORS[t.category]}22;">${t.title}</span>`;
            });
            html += `</div></div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    // ---- НЕДЕЛЯ ----
    function renderWeekView(container, title) {
        const start = new Date(currentWeekStart);
        const end = new Date(start);
        end.setDate(end.getDate() + 6);
        title.textContent = `${start.getDate()} ${monthNames[start.getMonth()]} – ${end.getDate()} ${monthNames[end.getMonth()]} ${start.getFullYear()}`;

        const weekData = getTasksForWeek(formatDate(start));

        let html = `<div class="week-grid">`;
        const daysMap = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        for (let i=0; i<7; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            const dateStr = formatDate(d);
            const tasks = weekData[dateStr] || [];
            const dayTasks = tasks.map(t =>
                `<div class="task-mini" style="border-left-color:${COLORS[t.category]};">${t.title}</div>`
            ).join('');
            const isToday = (dateStr === formatDate(new Date()));
            html += `
                <div class="week-day ${isToday ? 'today' : ''}">
                    <div class="day-label">${daysMap[i]}<br><small>${d.getDate()}</small></div>
                    <div class="day-tasks">${dayTasks || '<span style="color:var(--text-muted);">нет задач</span>'}</div>
                </div>
            `;
        }
        html += `</div>`;
        container.innerHTML = html;

        container.querySelectorAll('.week-day').forEach((el, idx) => {
            el.addEventListener('click', () => {
                const d = new Date(start);
                d.setDate(d.getDate() + idx);
                selectedDate = d;
                viewMode = 'day';
                renderCalendar();
            });
        });
    }

    // ---- ГОД ----
    function renderYearView(container, title) {
        title.textContent = currentYear;

        let html = `<div class="year-grid">`;
        for (let m=0; m<12; m++) {
            const stats = getMonthStats(currentYear, m);
            let statsHtml = '';
            CATEGORIES.forEach(cat => {
                if (stats[cat] > 0) {
                    statsHtml += `<span class="stat-item"><span class="color-dot" style="background:${COLORS[cat]};"></span>${stats[cat]}</span>`;
                }
            });
            if (!statsHtml) statsHtml = '<span style="color:var(--text-muted);font-size:10px;">нет задач</span>';
            html += `
                <div class="month-card" data-year="${currentYear}" data-month="${m}">
                    <div class="month-name">${shortMonthNames[m]}</div>
                    <div class="stats-row">${statsHtml}</div>
                </div>
            `;
        }
        html += `</div>`;
        container.innerHTML = html;

        container.querySelectorAll('.month-card').forEach(el => {
            el.addEventListener('click', () => {
                const year = parseInt(el.dataset.year);
                const month = parseInt(el.dataset.month);
                currentYear = year;
                currentMonth = month;
                viewMode = 'month';
                renderCalendar();
            });
        });
    }

    // ---- НАВИГАЦИЯ КАЛЕНДАРЯ ----
    document.getElementById('calPrev').addEventListener('click', () => {
        switch (viewMode) {
            case 'month':
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                break;
            case 'day':
                selectedDate.setDate(selectedDate.getDate() - 1);
                break;
            case 'week':
                currentWeekStart.setDate(currentWeekStart.getDate() - 7);
                break;
            case 'year':
                currentYear--;
                break;
        }
        renderCalendar();
    });

    document.getElementById('calNext').addEventListener('click', () => {
        switch (viewMode) {
            case 'month':
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                break;
            case 'day':
                selectedDate.setDate(selectedDate.getDate() + 1);
                break;
            case 'week':
                currentWeekStart.setDate(currentWeekStart.getDate() + 7);
                break;
            case 'year':
                currentYear++;
                break;
        }
        renderCalendar();
    });

    // ---- ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ ----
    document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            viewMode = btn.dataset.view;
            if (viewMode === 'week') {
                currentWeekStart = getWeekStart(selectedDate);
            }
            renderCalendar();
        });
    });

    // ============================================================
    // 6. ОТРИСОВКА ЗАДАЧ В ЖУРНАЛАХ
    // ============================================================
    function renderTasksList(listEl, tasks, category) {
        if (!tasks.length) {
            listEl.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:20px;font-size:14px;">Нет задач</div>`;
            return;
        }

        listEl.innerHTML = tasks.map((task, idx) => {
            const realIdx = data.tasks[category].indexOf(task);
            const statusClass = task.status === 'done' ? 'done' : (task.status === 'skipped' ? 'skipped' : '');
            const priorityEmoji = { low: '🟢', medium: '🟡', high: '🔴' }[task.priority] || '';
            const daysDisplay = task.days && task.days.length ? ` 📅 ${task.days.map(d => ({mon:'Пн',tue:'Вт',wed:'Ср',thu:'Чт',fri:'Пт',sat:'Сб',sun:'Вс'})[d]).join(' ')}` : '';
            return `
                <div class="task-item ${statusClass}" style="border-left-color:${COLORS[category]};">
                    <div class="task-top">
                        <span class="task-title">${priorityEmoji} ${task.title}</span>
                        <span style="font-size:11px;color:var(--text-muted);">${task.date || 'без даты'}</span>
                    </div>
                    <div class="task-meta">
                        ${task.duration ? `<span>⏱ ${task.duration} мин</span>` : ''}
                        ${task.status === 'done' ? '✅ Выполнено' : (task.status === 'skipped' ? '⏭ Пропущено' : '⏳ Активно')}
                        ${task.note ? `<span>📝 ${task.note}</span>` : ''}
                        ${task.endDate ? `<span>🔚 ${task.endDate}</span>` : ''}
                    </div>
                    ${task.days && task.days.length ? `<div class="task-days">${daysDisplay}</div>` : ''}
                    <div class="task-actions">
                        ${task.status === 'active' ? `
                            <button class="btn-done" data-cat="${category}" data-idx="${realIdx}" data-action="done">✅ Выполнить</button>
                            <button class="btn-skip" data-cat="${category}" data-idx="${realIdx}" data-action="skip">⏭ Пропустить</button>
                        ` : ''}
                        <button class="btn-del" data-cat="${category}" data-idx="${realIdx}" data-action="delete">🗑</button>
                    </div>
                </div>
            `;
        }).join('');

        listEl.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const cat = btn.dataset.cat;
                const idx = parseInt(btn.dataset.idx);
                const action = btn.dataset.action;
                if (action === 'done') {
                    const task = data.tasks[cat][idx];
                    if (task && task.status === 'active') {
                        task.status = 'done';
                        const xp = getPriorityXP(task.priority);
                        addXP(xp);
                        saveData();
                        renderAll();
                    }
                } else if (action === 'skip') {
                    const task = data.tasks[cat][idx];
                    if (task && task.status === 'active') {
                        task.status = 'skipped';
                        saveData();
                        renderAll();
                    }
                } else if (action === 'delete') {
                    data.tasks[cat].splice(idx, 1);
                    saveData();
                    renderAll();
                }
            });
        });
    }

    function renderTasks(category, filter = 'all') {
        const list = document.getElementById(`list-${category}`);
        const tasks = data.tasks[category] || [];
        let filtered = tasks;
        if (filter === 'active') filtered = tasks.filter(t => t.status === 'active');
        else if (filter === 'done') filtered = tasks.filter(t => t.status === 'done' || t.status === 'skipped');
        renderTasksList(list, filtered, category);
    }

    function renderAll() {
        const currentScreen = document.querySelector('.screen.active');
        if (!currentScreen) return;
        const cat = currentScreen.id.replace('screen-', '');
        const filterBtn = document.querySelector(`.filter-btn[data-screen="${cat}"].active`);
        const filter = filterBtn ? filterBtn.dataset.filter : 'all';
        renderTasks(cat, filter);
        updateCharacterUI();
        renderCalendar();
    }

    // ============================================================
    // 7. НАВИГАЦИЯ ПО ЖУРНАЛАМ
    // ============================================================
    function switchScreen(screenName) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        const target = document.getElementById(`screen-${screenName}`);
        if (target) target.classList.add('active');

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === screenName));

        const filterBtns = document.querySelectorAll(`.filter-btn[data-screen="${screenName}"]`);
        filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));

        renderAll();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchScreen(btn.dataset.screen));
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const screen = btn.dataset.screen;
            document.querySelectorAll(`.filter-btn[data-screen="${screen}"]`).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAll();
        });
    });

    // ============================================================
    // 8. МОДАЛЬНОЕ ОКНО ЗАДАЧ
    // ============================================================
    let currentModalScreen = 'body';

    const FORMS = {

                { label: 'Группа мышц', type: 'select', id: 'f_muscle', options: ['Грудь','Спина','Ноги','Плечи','Пресс','Руки'] },
                { label: 'Подходы', type: 'number', id: 'f_sets', placeholder: '3' },
                { label: 'Повторы', type: 'number', id: 'f_reps', placeholder: '12' }
            ]
        },
        hobby: {
            title: '🎨 Новое хобби',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Игра на гитаре' },
                { label: 'Навык', type: 'select', id: 'f_skill', options: ['Начальный','Средний','Продвинутый','Эксперт'] },
                { label: 'Уровень сложности', type: 'select', id: 'f_difficulty', options: ['Легкий','Средний','Сложный'] }
            ]
        },
        business: {
            title: '📈 Бизнес-задача',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Презентация проекта' },
                { label: 'Проект', type: 'text', id: 'f_project', placeholder: 'Название проекта' },
                { label: 'Приоритет', type: 'select', id: 'f_priority', options: ['Низкий','Средний','Высокий'] }
            ]
        },
        food: {
            title: '🥗 Приём пищи',
            fields: [
                { label: 'Блюдо', type: 'text', id: 'f_title', placeholder: 'Овсянка с фруктами' },
                { label: 'Калории', type: 'number', id: 'f_calories', placeholder: '350' },
                { label: 'Тип', type: 'select', id: 'f_mealtype', options: ['Завтрак','Обед','Ужин','Перекус'] }
            ]
        },
        finance: {
            title: '💰 Финансовая операция',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Зарплата' },
                { label: 'Тип', type: 'select', id: 'f_type', options: ['Доход','Расход'] },
                { label: 'Сумма', type: 'number', id: 'f_amount', placeholder: '5000' },
                { label: 'Категория', type: 'select', id: 'f_category', options: ['Еда','Транспорт','Развлечения','Сбережения','Другое'] }
            ]
        },
        debts: {
            title: '📋 Долг',
            fields: [
                { label: 'Название', type: 'text', id: 'f_title', placeholder: 'Долг другу' },
                { label: 'Тип', type: 'select', id: 'f_type', options: ['Я должен','Должны мне'] },
                { label: 'Сумма', type: 'number', id: 'f_amount', placeholder: '3000' },
                { label: 'Кому/От кого', type: 'text', id: 'f_whom', placeholder: 'Имя' }
            ]
        }
    };

    function openModal(screen) {
        currentModalScreen = screen;
        const form = FORMS[screen];
        document.getElementById('modalTitle').textContent = form.title;

        let html = '';
        form.fields.forEach(f => {
            if (f.type === 'text' || f.type === 'number') {
                html += `<label>${f.label}</label><input type="${f.type}" id="${f.id}" placeholder="${f.placeholder || ''}" />`;
            } else if (f.type === 'select') {
                html += `<label>${f.label}</label><select id="${f.id}">`;
                f.options.forEach(opt => {
                    html += `<option value="${opt}">${opt}</option>`;
                });
                html += `</select>`;
            }
        });

        // Общие поля
        html += `
            <label>Дата</label>
            <input type="date" id="f_date" />
            <label>Дата окончания (опционально)</label>
            <input type="date" id="f_enddate" />
            <label>Время</label>
            <input type="time" id="f_time" />
            <label>Продолжительность (минут)</label>
            <input type="number" id="f_duration" placeholder="30" />
            <label>Дни недели (для периодических задач)</label>
            <div class="days-check">
                <label><input type="checkbox" value="mon" /> Пн</label>
                <label><input type="checkbox" value="tue" /> Вт</label>
                <label><input type="checkbox" value="wed" /> Ср</label>
                <label><input type="checkbox" value="thu" /> Чт</label>
                <label><input type="checkbox" value="fri" /> Пт</label>
                <label><input type="checkbox" value="sat" /> Сб</label>
                <label><input type="checkbox" value="sun" /> Вс</label>
            </div>
            <label>Заметка</label>
            <textarea id="f_note" placeholder="Дополнительная информация..."></textarea>
        `;

        document.getElementById('modalFields').innerHTML = html;

        const now = new Date();
        document.getElementById('f_date').value = now.toISOString().split('T')[0];
        document.getElementById('f_time').value = now.toTimeString().slice(0,5);

        document.getElementById('modalOverlay').classList.add('open');
    }

    document.querySelectorAll('.btn-new').forEach(btn => {
        btn.addEventListener('click', () => openModal(btn.dataset.screen));
    });

    document.getElementById('modalCancel').addEventListener('click', () => {
        document.getElementById('modalOverlay').classList.remove('open');
    });

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) document.getElementById('modalOverlay').classList.remove('open');
    });

    document.getElementById('modalSave').addEventListener('click', () => {
        const title = document.getElementById('f_title')?.value.trim();
        if (!title) { alert('Введите название задачи'); return; }

        const days = [];
        document.querySelectorAll('.days-check input[type="checkbox"]:checked').forEach(cb => {
            days.push(cb.value);
        });

        const custom = {};
        const form = FORMS[currentModalScreen];
        form.fields.forEach(f => {
            if (f.id !== 'f_title') {
                const el = document.getElementById(f.id);
                if (el) custom[f.id.replace('f_', '')] = el.value;
            }
        });

        const task = {
            title: title,
            date: document.getElementById('f_date').value || '',
            endDate: document.getElementById('f_enddate').value || '',
            time: document.getElementById('f_time').value || '',
            duration: parseInt(document.getElementById('f_duration').value) || 0,
            days: days,
            note: document.getElementById('f_note').value.trim(),
            status: 'active',
            priority: 'medium',
            custom: custom,
            createdAt: new Date().toISOString()
        };

        if (custom.priority) {
            const map = { 'Низкий':'low', 'Средний':'medium', 'Высокий':'high' };
            task.priority = map[custom.priority] || 'medium';
        }

        data.tasks[currentModalScreen].push(task);
        saveData();
        document.getElementById('modalOverlay').classList.remove('open');
        renderAll();
    });

    // ============================================================
    // 9. НАСТРОЙКИ ТЕМЫ И АКЦЕНТА
    // ============================================================
    function loadThemeSettings() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        const savedAccent = localStorage.getItem('app_accent') || '#6C5CE7';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.style.setProperty('--accent', savedAccent);
        // Вычисляем светлый вариант акцента (для градиента)
        document.documentElement.style.setProperty('--accent-light', lightenColor(savedAccent, 30));
        // Обновляем кнопки
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === savedTheme);
        });
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.style.borderColor = (btn.dataset.color === savedAccent) ? '#fff' : 'transparent';
        });
        // Обновляем динамические градиенты
        updateGradients();
    }

    function lightenColor(hex, percent) {
        const num = parseInt(hex.slice(1), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.min(255, (num >> 16) + amt);
        const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
        const B = Math.min(255, (num & 0x0000FF) + amt);
        return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
    }

    function updateGradients() {
        // Применяем градиент к элементам, которые используют var(--accent-gradient)
        // (они уже обновятся через CSS-переменные, но для инлайн-стилей нужно обновить)
        document.querySelectorAll('.btn-new, .btn-save-task, .level-badge, .view-tabs .active').forEach(el => {
            if (el.classList.contains('view-tabs') && el.classList.contains('active')) {
                // уже через CSS
            } else {
                el.style.background = 'var(--accent-gradient)';
            }
        });
    }

    // Переключение темы
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // Выбор акцентного цвета
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const color = btn.dataset.color;
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--accent-light', lightenColor(color, 30));
            localStorage.setItem('app_accent', color);
            document.querySelectorAll('.color-btn').forEach(b => b.style.borderColor = 'transparent');
            btn.style.borderColor = '#fff';
            updateGradients();
        });
    });

    // Открытие/закрытие модалки настроек
    document.getElementById('settingsToggle').addEventListener('click', () => {
        document.getElementById('settingsModal').classList.add('open');
        // Обновляем активные кнопки в модалке
        loadThemeSettings();
    });
    document.getElementById('settingsClose').addEventListener('click', () => {
        document.getElementById('settingsModal').classList.remove('open');
    });
    document.getElementById('settingsModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('settingsModal').classList.remove('open');
        }
    });

    // ============================================================
    // 10. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    function init() {
        document.getElementById('charName').addEventListener('input', (e) => {
            data.character.name = e.target.value;
            saveData();
        });
        document.getElementById('charGender').addEventListener('change', (e) => {
            data.character.gender = e.target.value;
            saveData();
        });

        const now = new Date();
        selectedDate = now;
        currentYear = now.getFullYear();
        currentMonth = now.getMonth();
        currentWeekStart = getWeekStart(now);

        // Загружаем настройки темы и акцента
        loadThemeSettings();

        updateCharacterUI();
        renderCalendar();
        switchScreen('body');
    }

    init();
    console.log('🔥 RPG Планировщик v6 (с цветовыми схемами) загружен!');
</script>
