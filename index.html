<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>RPG Планировщик v4</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, sans-serif; }
        body { background:#0b0b16; color:#eaeef2; min-height:100vh; display:flex; justify-content:center; padding:8px; }
        #app { max-width:420px; width:100%; background:#131325; border-radius:32px; padding:16px 14px 80px; position:relative; box-shadow:0 10px 40px rgba(0,0,0,0.8); }

        /* ===== КАРТОЧКА ПЕРСОНАЖА ===== */
        #character-card { background:linear-gradient(145deg,#1e1e3a,#141428); border-radius:20px; padding:12px 16px; margin-bottom:14px; border:1px solid #2e2e4e; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
        #character-card .avatar { font-size:32px; }
        .char-info { flex:1; min-width:120px; }
        .char-info input { background:transparent; border:none; border-bottom:2px solid #3a3a5a; color:#fff; font-size:16px; font-weight:600; width:100px; padding:2px 0; outline:none; }
        .char-info input:focus { border-bottom-color:#7c5cfc; }
        .char-info select { background:#2a2a44; color:#fff; border:1px solid #4a4a6a; border-radius:10px; padding:2px 8px; font-size:13px; }
        .stats { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:13px; margin-top:4px; }
        .stats span { background:#1f1f3a; padding:1px 10px; border-radius:30px; border:1px solid #333355; }
        .level-badge { background:#7c5cfc; padding:1px 12px; border-radius:30px; font-weight:700; font-size:14px; }
        .xp-bar { width:100%; height:5px; background:#1f1f3a; border-radius:10px; margin-top:6px; overflow:hidden; }
        .xp-fill { height:100%; width:0%; background:linear-gradient(90deg,#7c5cfc,#b47cff); border-radius:10px; transition:width 0.4s; }

        /* ===== КАЛЕНДАРЬ ===== */
        #calendar-wrap { background:#14142a; border-radius:20px; padding:12px; margin-bottom:14px; border:1px solid #2a2a44; }
        .cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:4px; }
        .cal-header .nav-group { display:flex; align-items:center; gap:4px; }
        .cal-header button { background:#2a2a44; border:none; color:#fff; font-size:18px; padding:0 12px; border-radius:30px; cursor:pointer; line-height:32px; }
        .cal-header .month-year { font-weight:700; font-size:16px; min-width:120px; text-align:center; }
        .view-tabs { display:flex; gap:4px; margin-bottom:8px; }
        .view-tabs button { flex:1; padding:4px 0; border:none; border-radius:30px; background:#1f1f3a; color:#888; font-size:12px; font-weight:600; cursor:pointer; transition:0.2s; }
        .view-tabs button.active { background:#7c5cfc; color:#fff; }

        /* Содержимое календаря */
        #calendar-content { min-height:180px; }

        /* Месяц */
        .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; }
        .cal-grid .weekday { font-weight:600; color:#8888aa; font-size:11px; padding:4px 0; }
        .cal-grid .day { padding:6px 0; border-radius:20px; background:#1a1a32; font-size:13px; transition:0.15s; cursor:pointer; position:relative; }
        .cal-grid .day.today { background:#7c5cfc; font-weight:700; box-shadow:0 0 12px #7c5cfc66; }
        .cal-grid .day.other-month { opacity:0.25; }
        .cal-grid .day .dot { display:inline-block; width:5px; height:5px; border-radius:50%; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); }
        .cal-grid .day .dot.body { background:#ff4757; }
        .cal-grid .day .dot.hobby { background:#a29bfe; }
        .cal-grid .day .dot.business { background:#4a8bfe; }
        .cal-grid .day .dot.food { background:#2ed573; }
        .cal-grid .day .dot.finance { background:#ffa502; }
        .cal-grid .day .dot.debts { background:#ff6348; }

        /* День (почасовой) */
        .hour-grid { display:flex; flex-direction:column; gap:2px; }
        .hour-row { display:flex; align-items:center; gap:6px; font-size:12px; background:#1a1a32; padding:4px 8px; border-radius:12px; }
        .hour-row .hour-label { min-width:36px; color:#888; }
        .hour-row .hour-tasks { flex:1; display:flex; flex-wrap:wrap; gap:3px; }
        .hour-tasks .task-tag { background:#2a2a44; padding:1px 8px; border-radius:30px; font-size:11px; border-left:3px solid; white-space:nowrap; }

        /* Неделя */
        .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
        .week-day { background:#1a1a32; border-radius:12px; padding:6px; min-height:80px; }
        .week-day .day-label { font-size:12px; font-weight:600; color:#aaa; text-align:center; }
        .week-day .day-tasks { font-size:11px; color:#ccc; margin-top:4px; }
        .week-day .day-tasks .task-mini { background:#252540; border-radius:8px; padding:2px 6px; margin-bottom:2px; border-left:3px solid; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* Год */
        .year-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .month-card { background:#1a1a32; border-radius:16px; padding:10px; cursor:pointer; transition:0.2s; }
        .month-card:active { transform:scale(0.96); }
        .month-card .month-name { font-weight:700; font-size:14px; text-align:center; }
        .month-card .stats-row { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; margin-top:4px; }
        .month-card .stats-row .stat-item { font-size:10px; background:#252540; padding:1px 6px; border-radius:20px; display:flex; align-items:center; gap:3px; }
        .stat-item .color-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

        /* ===== ЭКРАНЫ ЖУРНАЛОВ ===== */
        .screen { display:none; flex-direction:column; gap:10px; }
        .screen.active { display:flex; }

        .screen-header { display:flex; justify-content:space-between; align-items:center; }
        .screen-header h2 { font-size:20px; display:flex; align-items:center; gap:8px; }
        .screen-header .color-badge { width:14px; height:14px; border-radius:50%; display:inline-block; }
        .btn-new { border:none; color:#fff; font-size:24px; width:44px; height:44px; border-radius:40px; cursor:pointer; box-shadow:0 0 16px rgba(124,92,252,0.3); transition:0.2s; }
        .btn-new:active { transform:scale(0.92); }

        .filter-tabs { display:flex; gap:5px; }
        .filter-tabs button { flex:1; padding:5px 0; border:none; border-radius:30px; background:#1f1f3a; color:#999; font-size:11px; font-weight:600; cursor:pointer; transition:0.2s; }
        .filter-tabs button.active { color:#fff; }

        .task-list { display:flex; flex-direction:column; gap:7px; max-height:320px; overflow-y:auto; padding-right:3px; }
        .task-list::-webkit-scrollbar { width:3px; }
        .task-list::-webkit-scrollbar-thumb { background:#7c5cfc; border-radius:10px; }

        .task-item { background:#17172e; border-radius:14px; padding:10px 12px; border-left:5px solid #7c5cfc; display:flex; flex-direction:column; gap:3px; }
        .task-item.done { opacity:0.6; }
        .task-item.skipped { opacity:0.4; }
        .task-top { display:flex; justify-content:space-between; align-items:center; }
        .task-title { font-weight:600; font-size:15px; }
        .task-meta { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:12px; color:#999; }
        .task-meta span { background:#22223e; padding:0 8px; border-radius:30px; }
        .task-days { font-size:11px; color:#7c5cfc; }
        .task-actions { display:flex; gap:5px; margin-top:3px; flex-wrap:wrap; }
        .task-actions button { border:none; padding:3px 10px; border-radius:30px; font-size:11px; font-weight:600; cursor:pointer; }
        .btn-done { background:#2e7d32; color:#fff; }
        .btn-skip { background:#7d2e2e; color:#fff; }
        .btn-del { background:#4a2a3a; color:#ccc; }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000000cc; justify-content:center; align-items:center; z-index:999; padding:16px; }
        .modal-overlay.open { display:flex; }
        .modal { background:#1a1a2e; border-radius:28px; padding:20px 16px; max-width:400px; width:100%; max-height:90vh; overflow-y:auto; border:1px solid #3a3a5a; }
        .modal h3 { font-size:19px; margin-bottom:12px; }
        .modal label { font-size:13px; font-weight:500; color:#aaa; display:block; margin-top:8px; }
        .modal input, .modal select, .modal textarea { width:100%; padding:8px 10px; border-radius:12px; border:1px solid #3a3a5a; background:#0f0f22; color:#fff; font-size:14px; margin-top:3px; outline:none; }
        .modal input:focus, .modal select:focus, .modal textarea:focus { border-color:#7c5cfc; }
        .modal textarea { min-height:50px; resize:vertical; }
        .modal .days-check { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
        .modal .days-check label { display:flex; align-items:center; gap:4px; font-size:13px; font-weight:400; background:#1f1f3a; padding:4px 10px; border-radius:30px; cursor:pointer; }
        .modal .days-check input[type="checkbox"] { width:16px; height:16px; accent-color:#7c5cfc; }
        .modal-actions { display:flex; gap:10px; margin-top:16px; }
        .modal-actions button { flex:1; padding:10px; border:none; border-radius:40px; font-weight:700; font-size:15px; cursor:pointer; }
        .btn-save-task { color:#fff; }
        .btn-cancel { background:#2a2a44; color:#aaa; }

        /* ===== НИЖНИЙ БАР ===== */
        #bottom-bar { position:absolute; bottom:0; left:0; width:100%; background:#0f0f1e; border-top:1px solid #2a2a44; border-radius:0 0 32px 32px; padding:4px 2px 8px; display:flex; justify-content:space-around; }
        #bottom-bar button { background:transparent; border:none; color:#666; font-size:10px; display:flex; flex-direction:column; align-items:center; gap:1px; padding:3px 4px; cursor:pointer; transition:0.2s; flex:1; border-radius:14px; }
        #bottom-bar button .icon { font-size:20px; line-height:1; }
        #bottom-bar button .label { font-size:9px; }
        #bottom-bar button.active { color:#fff; background:#1a1a30; }
        #bottom-bar button:active { transform:scale(0.92); }

        @media (max-width:400px) {
            #app { padding:12px 8px 70px; }
            .modal { padding:14px; }
            .task-title { font-size:14px; }
            .cal-header .month-year { font-size:14px; min-width:80px; }
            .hour-row { font-size:11px; }
            .week-day { min-height:60px; }
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ===== КАРТОЧКА ПЕРСОНАЖА ===== -->
    <div id="character-card">
        <div class="avatar">🧙</div>
        <div class="char-info">
            <div>
                <input type="text" id="charName" value="Герой" />
                <select id="charGender"><option value="М">М</option><option value="Ж">Ж</option></select>
            </div>
            <div class="stats">
                <span>❤️ <span id="statHp">100</span></span>
                <span>💪 <span id="statStr">10</span></span>
                <span>🧠 <span id="statInt">10</span></span>
                <span>🏃 <span id="statEnd">10</span></span>
                <span class="level-badge">УР <span id="levelDisplay">1</span></span>
            </div>
            <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
            <div style="font-size:11px;color:#888;">Опыт: <span id="xpText">0</span></div>
        </div>
    </div>

    <!-- ===== КАЛЕНДАРЬ ===== -->
    <div id="calendar-wrap">
        <!-- Переключатель режимов -->
        <div class="view-tabs">
            <button class="view-btn active" data-view="month">Месяц</button>
            <button class="view-btn" data-view="week">Неделя</button>
            <button class="view-btn" data-view="day">День</button>
            <button class="view-btn" data-view="year">Год</button>
        </div>

        <!-- Заголовок и навигация -->
        <div class="cal-header">
            <div class="nav-group">
                <button id="calPrev">◀</button>
                <button id="calNext">▶</button>
            </div>
            <span class="month-year" id="calTitle">Январь 2026</span>
            <div style="width:40px;"></div> <!-- пусто для баланса -->
        </div>

        <!-- Контейнер для содержимого -->
        <div id="calendar-content"></div>
    </div>

    <!-- ===== ЭКРАНЫ ЖУРНАЛОВ (без изменений) ===== -->
    <!-- 1. ТЕЛО -->
    <div class="screen active" id="screen-body">
        <div class="screen-header">
            <h2><span class="color-badge" style="background:#ff4757;"></span> Тело</h2>
            <button class="btn-new" style="background:#ff4757;" data-screen="body">➕</button>
        </div>
        <div class="filter-tabs">
            <button class="filter-btn active" data-screen="body" data-filter="all" style="border-bottom:2px solid #ff4757;">Все</button>
            <button class="filter-btn" data-screen="body" data-filter="active" style="border-bottom:2px solid #ff4757;">Активные</button>
            <button class="filter-btn" data-screen="body" data-filter="done" style="border-bottom:2px solid #ff4757;">Выполненные</button>
        </div>
        <div class="task-list" id="list-body"></div>
    </div>

    <!-- 2. ХОББИ -->
    <div class="screen" id="screen-hobby">
        <div class="screen-header">
            <h2><span class="color-badge" style="background:#a29bfe;"></span> Хобби</h2>
            <button class="btn-new" style="background:#a29bfe;" data-screen="hobby">➕</button>
        </div>
        <div class="filter-tabs">
            <button class="filter-btn active" data-screen="hobby" data-filter="all" style="border-bottom:2px solid #a29bfe;">Все</button>
            <button class="filter-btn" data-screen="hobby" data-filter="active" style="border-bottom:2px solid #a29bfe;">Активные</button>
            <button class="filter-btn" data-screen="hobby" data-filter="done" style="border-bottom:2px solid #a29bfe;">Выполненные</button>
        </div>
        <div class="task-list" id="list-hobby"></div>
    </div>

    <!-- 3. БИЗНЕС -->
    <div class="screen" id="screen-business">
        <div class="screen-header">
            <h2><span class="color-badge" style="background:#4a8bfe;"></span> Бизнес</h2>
            <button class="btn-new" style="background:#4a8bfe;" data-screen="business">➕</button>
        </div>
        <div class="filter-tabs">
            <button class="filter-btn active" data-screen="business" data-filter="all" style="border-bottom:2px solid #4a8bfe;">Все</button>
            <button class="filter-btn" data-screen="business" data-filter="active" style="border-bottom:2px solid #4a8bfe;">Активные</button>
            <button class="filter-btn" data-screen="business" data-filter="done" style="border-bottom:2px solid #4a8bfe;">Выполненные</button>
        </div>
        <div class="task-list" id="list-business"></div>
    </div>

    <!-- 4. ПИТАНИЕ -->
    <div class="screen" id="screen-food">
        <div class="screen-header">
            <h2><span class="color-badge" style="background:#2ed573;"></span> Питание</h2>
            <button class="btn-new" style="background:#2ed573;" data-screen="food">➕</button>
        </div>
        <div class="filter-tabs">
            <button class="filter-btn active" data-screen="food" data-filter="all" style="border-bottom:2px solid #2ed573;">Все</button>
            <button class="filter-btn" data-screen="food" data-filter="active" style="border-bottom:2px solid #2ed573;">Активные</button>
            <button class="filter-btn" data-screen="food" data-filter="done" style="border-bottom:2px solid #2ed573;">Выполненные</button>
        </div>
        <div class="task-list" id="list-food"></div>
    </div>

    <!-- 5. ФИНАНСЫ -->
    <div class="screen" id="screen-finance">
        <div class="screen-header">
            <h2><span class="color-badge" style="background:#ffa502;"></span> Финансы</h2>
            <button class="btn-new" style="background:#ffa502;" data-screen="finance">➕</button>
        </div>
        <div class="filter-tabs">
            <button class="filter-btn active" data-screen="finance" data-filter="all" style="border-bottom:2px solid #ffa502;">Все</button>
            <button class="filter-btn" data-screen="finance" data-filter="active" style="border-bottom:2px solid #ffa502;">Активные</button>
            <button class="filter-btn" data-screen="finance" data-filter="done" style="border-bottom:2px solid #ffa502;">Выполненные</button>
        </div>
        <div class="task-list" id="list-finance"></div>
    </div>

    <!-- 6. ДОЛГИ -->
    <div class="screen" id="screen-debts">
        <div class="screen-header">
            <h2><span class="color-badge" style="background:#ff6348;"></span> Долги</h2>
            <button class="btn-new" style="background:#ff6348;" data-screen="debts">➕</button>
        </div>
        <div class="filter-tabs">
            <button class="filter-btn active" data-screen="debts" data-filter="all" style="border-bottom:2px solid #ff6348;">Все</button>
            <button class="filter-btn" data-screen="debts" data-filter="active" style="border-bottom:2px solid #ff6348;">Активные</button>
            <button class="filter-btn" data-screen="debts" data-filter="done" style="border-bottom:2px solid #ff6348;">Выполненные</button>
        </div>
        <div class="task-list" id="list-debts"></div>
    </div>

    <!-- ===== НИЖНИЙ БАР ===== -->
    <div id="bottom-bar">
        <button class="tab-btn active" data-screen="body"><span class="icon">💪</span><span class="label">Тело</span></button>
        <button class="tab-btn" data-screen="hobby"><span class="icon">🎨</span><span class="label">Хобби</span></button>
        <button class="tab-btn" data-screen="business"><span class="icon">📈</span><span class="label">Бизнес</span></button>
        <button class="tab-btn" data-screen="food"><span class="icon">🥗</span><span class="label">Питание</span></button>
        <button class="tab-btn" data-screen="finance"><span class="icon">💰</span><span class="label">Финансы</span></button>
        <button class="tab-btn" data-screen="debts"><span class="icon">📋</span><span class="label">Долги</span></button>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle">➕ Новая задача</h3>
            <div id="modalFields"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Отмена</button>
                <button class="btn-save-task" id="modalSave" style="background:#7c5cfc;">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. ДАННЫЕ
    // ============================================================
    const STORAGE_KEY = 'rpg_journal_v4';
    const COLORS = {
        body: '#ff4757',
        hobby: '#a29bfe',
        business: '#4a8bfe',
        food: '#2ed573',
        finance: '#ffa502',
        debts: '#ff6348'
    };
    const CATEGORIES = ['body','hobby','business','food','finance','debts'];

    function getDefaultData() {
        return {
            character: { name: 'Герой', gender: 'М', hp: 100, str: 10, int: 10, end: 10, level: 1, xp: 0 },
            tasks: {
                body: [],
                hobby: [],
                business: [],
                food: [],
                finance: [],
                debts: []
            }
        };
    }

    let data = loadData();

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                const def = getDefaultData();
                for (let key in def) {
                    if (!(key in parsed)) parsed[key] = def[key];
                }
                for (let cat in def.tasks) {
                    if (!(cat in parsed.tasks)) parsed.tasks[cat] = [];
                }
                return parsed;
            }
        } catch(e) {}
        return getDefaultData();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ============================================================
    // 2. РПГ СИСТЕМА
    // ============================================================
    function addXP(amount) {
        data.character.xp += amount;
        const xpNeeded = 100 + data.character.level * 20;
        while (data.character.xp >= xpNeeded) {
            data.character.xp -= xpNeeded;
            data.character.level += 1;
            const stats = ['hp','str','int','end'];
            const s = stats[Math.floor(Math.random() * stats.length)];
            data.character[s] += 1;
        }
        saveData();
        updateCharacterUI();
    }

    function getPriorityXP(priority) {
        const map = { low: 5, medium: 10, high: 20 };
        return map[priority] || 10;
    }

    // ============================================================
    // 3. UI ПЕРСОНАЖА
    // ============================================================
    function updateCharacterUI() {
        const c = data.character;
        document.getElementById('charName').value = c.name;
        document.getElementById('charGender').value = c.gender;
        document.getElementById('statHp').textContent = c.hp;
        document.getElementById('statStr').textContent = c.str;
        document.getElementById('statInt').textContent = c.int;
        document.getElementById('statEnd').textContent = c.end;
        document.getElementById('levelDisplay').textContent = c.level;
        const xpNeeded = 100 + c.level * 20;
        const pct = Math.min(100, (c.xp / xpNeeded) * 100);
        document.getElementById('xpFill').style.width = pct + '%';
        document.getElementById('xpText').textContent = c.xp;
    }

    // ============================================================
    // 4. ФУНКЦИИ РАБОТЫ С ЗАДАЧАМИ
    // ============================================================
    function getTasksForDate(dateStr) {
        // Возвращает массив задач из всех журналов, запланированных на эту дату
        const result = [];
        CATEGORIES.forEach(cat => {
            data.tasks[cat].forEach(task => {
                // Проверяем точную дату
                if (task.date === dateStr) {
                    result.push({ ...task, category: cat });
                }
                // Проверяем повторяющиеся дни недели
                if (task.days && task.days.length) {
                    const d = new Date(dateStr);
                    const dayOfWeek = d.getDay(); // 0=вс
                    const dayIndex = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
                    const daysMap = ['mon','tue','wed','thu','fri','sat','sun'];
                    if (task.days.includes(daysMap[dayIndex])) {
                        // Добавляем, если ещё нет
                        if (!result.some(t => t === task && t.category === cat)) {
                            result.push({ ...task, category: cat });
                        }
                    }
                }
            });
        });
        return result;
    }

    function getTasksForWeek(startDateStr) {
        // Возвращает объект { dateStr: [tasks] } для 7 дней
        const start = new Date(startDateStr);
        const week = {};
        for (let i=0; i<7; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            const key = d.toISOString().split('T')[0];
            week[key] = getTasksForDate(key);
        }
        return week;
    }

    function getMonthStats(year, month) {
        // Статистика по журналам за месяц: количество задач (всех статусов)
        const stats = {};
        CATEGORIES.forEach(cat => stats[cat] = 0);
        const daysInMonth = new Date(year, month+1, 0).getDate();
        for (let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const tasks = getTasksForDate(dateStr);
            tasks.forEach(task => {
                if (task.category && stats[task.category] !== undefined) {
                    stats[task.category]++;
                }
            });
        }
        return stats;
    }

    // ============================================================
    // 5. КАЛЕНДАРЬ: УПРАВЛЕНИЕ РЕЖИМАМИ
    // ============================================================
    let viewMode = 'month';      // 'month', 'day', 'week', 'year'
    let selectedDate = new Date(); // для режима day
    let currentYear = selectedDate.getFullYear();
    let currentMonth = selectedDate.getMonth();
    let currentWeekStart = getWeekStart(selectedDate); // понедельник

    function getWeekStart(date) {
        const d = new Date(date);
        const day = d.getDay(); // 0=вс
        const diff = (day === 0) ? 6 : day - 1; // понедельник
        d.setDate(d.getDate() - diff);
        d.setHours(0,0,0,0);
        return d;
    }

    function formatDate(date) {
        return date.toISOString().split('T')[0];
    }

    // ============================================================
    // 6. РЕНДЕРИНГ КАЛЕНДАРЯ
    // ============================================================
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const shortMonthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

    function renderCalendar() {
        const container = document.getElementById('calendar-content');
        const title = document.getElementById('calTitle');

        switch (viewMode) {
            case 'month': renderMonthView(container, title); break;
            case 'day': renderDayView(container, title); break;
            case 'week': renderWeekView(container, title); break;
            case 'year': renderYearView(container, title); break;
        }
        updateNavButtons();
    }

    // ---------- МЕСЯЦ ----------
    function renderMonthView(container, title) {
        title.textContent = monthNames[currentMonth] + ' ' + currentYear;

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
        const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
        let startOffset = (firstDay === 0) ? 6 : firstDay - 1;

        let html = `<div class="cal-grid">`;
        ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => {
            html += `<div class="weekday">${w}</div>`;
        });

        for (let i=0; i<startOffset; i++) {
            const d = daysInPrev - startOffset + i + 1;
            html += `<div class="day other-month">${d}</div>`;
        }

        const today = new Date();
        for (let d=1; d<=daysInMonth; d++) {
            const dateObj = new Date(currentYear, currentMonth, d);
            const dateStr = formatDate(dateObj);
            const isToday = (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
            const tasks = getTasksForDate(dateStr);
            const dots = tasks.map(t => `<span class="dot ${t.category}"></span>`).join('');
            const cls = 'day' + (isToday ? ' today' : '');
            html += `<div class="${cls}" data-date="${dateStr}">${d}${dots ? '<br>'+dots : ''}</div>`;
        }

        html += `</div>`;
        container.innerHTML = html;

        // Клик по дню -> переключиться в режим дня
        container.querySelectorAll('.day:not(.other-month)').forEach(el => {
            el.addEventListener('click', () => {
                const dateStr = el.dataset.date;
                if (dateStr) {
                    selectedDate = new Date(dateStr);
                    viewMode = 'day';
                    renderCalendar();
                }
            });
        });
    }

    // ---------- ДЕНЬ (почасовой) ----------
    function renderDayView(container, title) {
        const dateStr = formatDate(selectedDate);
        const parts = dateStr.split('-');
        const year = parseInt(parts[0]), month = parseInt(parts[1])-1, day = parseInt(parts[2]);
        title.textContent = `${day} ${monthNames[month]} ${year}`;

        const tasks = getTasksForDate(dateStr);
        // Группируем по часам (если время указано)
        const byHour = {};
        const noTime = [];
        tasks.forEach(task => {
            if (task.time) {
                const hour = parseInt(task.time.split(':')[0]);
                if (!byHour[hour]) byHour[hour] = [];
                byHour[hour].push(task);
            } else {
                noTime.push(task);
            }
        });

        let html = `<div class="hour-grid">`;
        // Часы 0-23
        for (let h=0; h<24; h++) {
            const hourTasks = byHour[h] || [];
            const tasksHtml = hourTasks.map(t =>
                `<span class="task-tag" style="border-left-color:${COLORS[t.category]}; background:${COLORS[t.category]}22;">${t.title}</span>`
            ).join('');
            html += `
                <div class="hour-row">
                    <span class="hour-label">${String(h).padStart(2,'0')}:00</span>
                    <div class="hour-tasks">${tasksHtml}</div>
                </div>
            `;
        }
        // Задачи без времени
        if (noTime.length) {
            html += `<div class="hour-row" style="background:#2a2a44;"><span class="hour-label">📌</span><div class="hour-tasks">`;
            noTime.forEach(t => {
                html += `<span class="task-tag" style="border-left-color:${COLORS[t.category]}; background:${COLORS[t.category]}22;">${t.title}</span>`;
            });
            html += `</div></div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    // ---------- НЕДЕЛЯ ----------
    function renderWeekView(container, title) {
        const start = new Date(currentWeekStart);
        const end = new Date(start);
        end.setDate(end.getDate() + 6);
        title.textContent = `${start.getDate()} ${monthNames[start.getMonth()]} – ${end.getDate()} ${monthNames[end.getMonth()]} ${start.getFullYear()}`;

        const weekData = getTasksForWeek(formatDate(start));

        let html = `<div class="week-grid">`;
        const daysMap = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        for (let i=0; i<7; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            const dateStr = formatDate(d);
            const tasks = weekData[dateStr] || [];
            const dayTasks = tasks.map(t =>
                `<div class="task-mini" style="border-left-color:${COLORS[t.category]};">${t.title}</div>`
            ).join('');
            const isToday = (dateStr === formatDate(new Date()));
            html += `
                <div class="week-day" style="${isToday ? 'border:2px solid #7c5cfc;' : ''}">
                    <div class="day-label">${daysMap[i]}<br><small>${d.getDate()}</small></div>
                    <div class="day-tasks">${dayTasks || '<span style="color:#555;">нет задач</span>'}</div>
                </div>
            `;
        }
        html += `</div>`;
        container.innerHTML = html;

        // Клик по дню -> переключиться в день
        container.querySelectorAll('.week-day').forEach((el, idx) => {
            el.addEventListener('click', () => {
                const d = new Date(start);
                d.setDate(d.getDate() + idx);
                selectedDate = d;
                viewMode = 'day';
                renderCalendar();
            });
        });
    }

    // ---------- ГОД ----------
    function renderYearView(container, title) {
        title.textContent = currentYear;

        let html = `<div class="year-grid">`;
        for (let m=0; m<12; m++) {
            const stats = getMonthStats(currentYear, m);
            let statsHtml = '';
            CATEGORIES.forEach(cat => {
                if (stats[cat] > 0) {
                    statsHtml += `<span class="stat-item"><span class="color-dot" style="background:${COLORS[cat]};"></span>${stats[cat]}</span>`;
                }
            });
            if (!statsHtml) statsHtml = '<span style="color:#555;font-size:10px;">нет задач</span>';
            html += `
                <div class="month-card" data-year="${currentYear}" data-month="${m}">
                    <div class="month-name">${shortMonthNames[m]}</div>
                    <div class="stats-row">${statsHtml}</div>
                </div>
            `;
        }
        html += `</div>`;
        container.innerHTML = html;

        // Клик по месяцу -> переключиться в месяц
        container.querySelectorAll('.month-card').forEach(el => {
            el.addEventListener('click', () => {
                const year = parseInt(el.dataset.year);
                const month = parseInt(el.dataset.month);
                currentYear = year;
                currentMonth = month;
                viewMode = 'month';
                renderCalendar();
            });
        });
    }

    // ============================================================
    // 7. НАВИГАЦИЯ ПО КАЛЕНДАРЮ
    // ============================================================
    function updateNavButtons() {
        // Просто перерисовываем, кнопки уже есть
    }

    document.getElementById('calPrev').addEventListener('click', () => {
        switch (viewMode) {
            case 'month':
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                break;
            case 'day':
                selectedDate.setDate(selectedDate.getDate() - 1);
                break;
            case 'week':
                currentWeekStart.setDate(currentWeekStart.getDate() - 7);
                break;
            case 'year':
                currentYear--;
                break;
        }
        renderCalendar();
    });

    document.getElementById('calNext').addEventListener('click', () => {
        switch (viewMode) {
            case 'month':
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                break;
            case 'day':
                selectedDate.setDate(selectedDate.getDate() + 1);
                break;
            case 'week':
                currentWeekStart.setDate(currentWeekStart.getDate() + 7);
                break;
            case 'year':
                currentYear++;
                break;
        }
        renderCalendar();
    });

    // ============================================================
    // 8. ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ
    // ============================================================
    document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));

            // При переключении в день, устанавливаем selectedDate на сегодня (или сохраняем)
            if (newMode === 'day') {

            } else if (newMode === 'week') {
                currentWeekStart = getWeekStart(selectedDate);

            }

    // ============================================================
    // 9. ОТРИСОВКА ЗАДАЧ В ЖУРНАЛАХ (без изменений, но с учётом фильтров)
    // ============================================================
    function renderTasksList(listEl, tasks, category) {
        if (!tasks.length) {
            listEl.innerHTML = `<div style="color:#666;text-align:center;padding:16px;">Нет задач</div>`;
            return;
        }

        listEl.innerHTML = tasks.map((task, idx) => {
            const realIdx = data.tasks[category].indexOf(task);
            const statusClass = task.status === 'done' ? 'done' : (task.status === 'skipped' ? 'skipped' : '');
            const priorityEmoji = { low: '🟢', medium: '🟡', high: '🔴' }[task.priority] || '';
            const daysDisplay = task.days && task.days.length ? ` 📅 ${task.days.map(d => ({mon:'Пн',tue:'Вт',wed:'Ср',thu:'Чт',fri:'Пт',sat:'Сб',sun:'Вс'})[d]).join(' ')}` : '';
            return `
                <div class="task-item ${statusClass}" style="border-left-color:${COLORS[category]};">
                    <div class="task-top">
                        <span class="task-title">${priorityEmoji} ${task.title}</span>
                        <span style="font-size:11px;color:#888;">${task.date || 'без даты'}</span>
                    </div>
                    <div class="task-meta">
                        ${task.duration ? `<span>⏱ ${task.duration} мин</span>` : ''}
                        ${task.status === 'done' ? '✅ Выполнено' : (task.status === 'skipped' ? '⏭ Пропущено' : '⏳ Активно')}
                        ${task.note ? `<span>📝 ${task.note}</span>` : ''}
                        ${task.endDate ? `<span>🔚 ${task.endDate}</span>` : ''}
                    </div>
                    ${task.days && task.days.length ? `<div class="task-days">${daysDisplay}</div>` : ''}
                    <div class="task-actions">
                        ${task.status === 'active' ? `
                            <button class="btn-done" data-cat="${category}" data-idx="${realIdx}" data-action="done">✅ Выполнить</button>
                            <button class="btn-skip" data-cat="${category}" data-idx="${realIdx}" data-action="skip">⏭ Пропустить</button>
                        ` : ''}
                        <button class="btn-del" data-cat="${category}" data-idx="${realIdx}" data-action="delete">🗑</button>
                    </div>
                </div>
            `;
        }).join('');

        listEl.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const cat = btn.dataset.cat;
                const idx = parseInt(btn.dataset.idx);
                const action = btn.dataset.action;
                if (action === 'done') {
                    const task = data.tasks[cat][idx];
                    if (task && task.status === 'active') {
                        task.status = 'done';
                        const xp = getPriorityXP(task.priority);
                        addXP(xp);
                        saveData();
                        renderAll();
                    }
                } else if (action === 'skip') {
                    const task = data.tasks[cat][idx];
                    if (task && task.status === 'active') {
                        task.status = 'skipped';
                        saveData();
                        renderAll();
                    }
                } else if (action === 'delete') {
                    data.tasks[cat].splice(idx, 1);
                    saveData();
                    renderAll();
                }
            });
        });
    }

    function renderTasks(category, filter = 'all') {
        const list = document.getElementById(`list-${category}`);
        const tasks = data.tasks[category] || [];
        let filtered = tasks;
        if (filter === 'active') filtered = tasks.filter(t => t.status === 'active');
        else if (filter === 'done') filtered = tasks.filter(t => t.status === 'done' || t.status === 'skipped');
        renderTasksList(list, filtered, category);
    }

    function renderAll() {
        const currentScreen = document.querySelector('.screen.active');

        const cat = currentScreen.id.replace('screen-', '');
        const filterBtn = document.querySelector(`.filter-btn[data-screen="${cat}"].active`);
        const filter = filterBtn ? filterBtn.dataset.filter : 'all';
        renderTasks(cat, filter);
        updateCharacterUI();

        // Но мы можем перерисовать его, если нужно обновить точки
        renderCalendar();
    }

            time: document.getElementById('f_time').value || '',
            duration: parseInt(document.getElementById('f_duration').value) || 0,
            days: days,
            note: document.getElementById('f_note').value.trim(),
            status: 'active',
            priority: 'medium',
            custom: custom,
            createdAt: new Date().toISOString()
        };

        if (custom.priority) {
            const map = { 'Низкий':'low', 'Средний':'medium', 'Высокий':'high' };
            task.priority = map[custom.priority] || 'medium';
        }

        data.tasks[currentModalScreen].push(task);
        saveData();
        document.getElementById('modalOverlay').classList.remove('open');
        renderAll();
    });

    // ============================================================
    // 12. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    function init() {
        document.getElementById('charName').addEventListener('input', (e) => {
            data.character.name = e.target.value;
            saveData();
        });
        document.getElementById('charGender').addEventListener('change', (e) => {
            data.character.gender = e.target.value;
            saveData();
        });

        const now = new Date();
        selectedDate = now;
        currentYear = now.getFullYear();
        currentMonth = now.getMonth();
        currentWeekStart = getWeekStart(now);

        updateCharacterUI();
        renderCalendar();
        switchScreen('body');
    }

    init();
    console.log('🔥 RPG Планировщик v4 загружен!');
</script>
</body>
</html>
