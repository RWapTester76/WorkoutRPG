<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SkillQuest</title>
    <style>
        /* ===== Дизайн-система ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fb;
            --card: rgba(255, 255, 255, 0.70);
            --card-border: rgba(255, 255, 255, 0.30);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.14);
            --text: #1a1a2e;
            --text-secondary: #4a4a5a;
            --text-tertiary: #8a8a9a;
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --primary-bg: rgba(108, 92, 231, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --spring: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px 100px;
            transition: background var(--transition);
        }

        /* Тёмная тема */
        body.dark {
            --bg: #12121a;
            --card: rgba(30, 30, 46, 0.80);
            --card-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.6);
            --text: #eeecf0;
            --text-secondary: #a8a6b2;
            --text-tertiary: #6a6878;
            --primary-bg: rgba(108, 92, 231, 0.20);
        }

        /* Цветовые темы */
        body.theme-jade { --primary: #00b894; --primary-light: #55efc4; }
        body.theme-ruby { --primary: #e17055; --primary-light: #fd79a8; }
        body.theme-sapphire { --primary: #0984e3; --primary-light: #74b9ff; }
        body.theme-amber { --primary: #fdcb6e; --primary-light: #ffeaa7; }
        body.theme-coral { --primary: #e17055; --primary-light: #fd9a8a; }
        body.theme-amethyst { --primary: #a29bfe; --primary-light: #c8c3ff; }

        /* ===== Общие компоненты ===== */
        .glass {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            transition: all var(--transition);
        }

        .glass:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .card {
            padding: 20px;
            border-radius: var(--radius);
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            line-height: 1;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.30);
            min-height: 48px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.40);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            box-shadow: none;
            border: 1px solid var(--text-tertiary);
        }

        .btn-secondary:hover {
            background: var(--primary-bg);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: none;
        }

        .btn-danger {
            background: #ff6b6b;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.30);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            min-height: 36px;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 60px;
            min-width: 44px;
            font-size: 20px;
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 15px;
            color: var(--text);
            transition: all var(--transition);
            min-height: 48px;
        }

        .input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-bg);
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        /* ===== Шапка ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 20px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            transition: background var(--transition);
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-greeting {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 60px;
            background: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            border: 2px solid transparent;
        }

        .avatar:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* ===== Нижняя навигация (прокручиваемая) ===== */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 8px 0 env(safe-area-inset-bottom);
            z-index: 20;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .bottom-nav-wrapper::-webkit-scrollbar {
            display: none;
        }

        .bottom-nav {
            display: flex;
            gap: 4px;
            padding: 0 12px;
            min-width: max-content;
        }

        .bottom-nav-item {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 14px;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            border-radius: 40px;
            min-height: 56px;
            justify-content: center;
        }

        .bottom-nav-item .icon {
            font-size: 22px;
            transition: all var(--transition);
        }

        .bottom-nav-item.active {
            color: var(--primary);
            background: var(--primary-bg);
        }

        .bottom-nav-item.active .icon {
            transform: scale(1.1);
        }

        .bottom-nav-item .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ff6b6b;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 40px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .bottom-nav-item .badge.show {
            display: flex;
        }

        /* ===== Страницы ===== */
        .page {
            display: none;
            animation: fadeUp 0.35s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== Главная ===== */
        .level-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(108, 92, 231, 0.30);
            margin-bottom: 20px;
        }

        .level-card .level-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .level-card .level-label {
            font-size: 12px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .level-card .level-number {
            font-size: 32px;
            font-weight: 700;
        }

        .level-card .level-stats {
            text-align: right;
            font-size: 14px;
        }

        .level-card .level-stats span {
            display: block;
            opacity: 0.9;
        }

        .level-card .progress {
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            overflow: hidden;
        }

        .level-card .progress-bar {
            height: 100%;
            background: #fff;
            border-radius: 40px;
            transition: width 0.6s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            text-align: center;
            padding: 16px 8px;
            border-radius: var(--radius-sm);
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
        }

        .stat-card .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Списки задач */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            cursor: pointer;
        }

        .task-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-hover);
        }

        .task-item .task-icon {
            font-size: 24px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-bg);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .task-item .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-item .task-title {
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-item .task-meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .task-item .task-status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            background: var(--primary-bg);
            color: var(--primary);
        }

        .task-item .task-status.done {
            background: #d4edda;
            color: #155724;
        }

        .task-item .task-status.missed {
            background: #f8d7da;
            color: #721c24;
        }

        .task-item .task-actions {
            display: flex;
            gap: 8px;
        }

        .tasks-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            background: var(--card);
            border-radius: var(--radius-sm);
            border: 1px dashed var(--card-border);
        }

        .tasks-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Журналы */
        .journals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .journal-card-mini {
            text-align: center;
            padding: 16px 8px;
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            cursor: pointer;
        }

        .journal-card-mini:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .journal-card-mini .journal-icon {
            font-size: 32px;
        }

        .journal-card-mini .journal-name {
            font-weight: 600;
            margin-top: 6px;
            font-size: 14px;
        }

        .journal-card-mini .journal-exp {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .journal-card-mini .journal-progress {
            height: 4px;
            background: var(--card-border);
            border-radius: 40px;
            margin-top: 8px;
            overflow: hidden;
        }

        .journal-card-mini .journal-progress .fill {
            height: 100%;
            background: var(--primary);
            border-radius: 40px;
            transition: width 0.6s ease;
        }

        /* Цели */
        .goal-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            cursor: pointer;
        }

        .goal-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .goal-card .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .goal-card .goal-title {
            font-weight: 600;
            font-size: 18px;
        }

        .goal-card .goal-desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .goal-card .goal-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .goal-card .goal-progress {
            margin-top: 12px;
        }

        .goal-card .goal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
        }

        /* ===== Календарь ===== */
        .calendar-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-controls .btn-group {
            display: flex;
            gap: 4px;
        }

        .calendar-controls .btn-group .btn {
            padding: 6px 14px;
            font-size: 13px;
            min-height: 36px;
            border-radius: 40px;
            background: transparent;
            color: var(--text-secondary);
            box-shadow: none;
            border: 1px solid transparent;
        }

        .calendar-controls .btn-group .btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.30);
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .calendar-nav .title {
            font-weight: 600;
            font-size: 18px;
            min-width: 120px;
            text-align: center;
        }

        .calendar-nav button {
            width: 36px;
            height: 36px;
            border-radius: 40px;
            background: var(--card);
            border: 1px solid var(--card-border);
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .calendar-nav button:hover {
            background: var(--primary-bg);
        }

        .calendar-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .calendar-filters .chip {
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .calendar-filters .chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .calendar-grid {
            display: grid;
            gap: 4px;
        }

        .calendar-grid.week {
            grid-template-columns: repeat(7, 1fr);
        }

        .calendar-grid.month {
            grid-template-columns: repeat(7, 1fr);
        }

        .calendar-grid .day-header {
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 0;
        }

        .calendar-cell {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 8px 4px;
            text-align: center;
            min-height: 56px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .calendar-cell:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-hover);
        }

        .calendar-cell.today {
            border-color: var(--primary);
            background: var(--primary-bg);
        }

        .calendar-cell.selected {
            background: var(--primary);
            color: #fff;
        }

        .calendar-cell.selected .date {
            color: #fff;
        }

        .calendar-cell .date {
            font-weight: 600;
            font-size: 16px;
        }

        .calendar-cell .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            justify-content: center;
            margin-top: 4px;
        }

        .calendar-cell .badge {
            font-size: 9px;
            padding: 0 6px;
            border-radius: 40px;
            background: var(--primary-bg);
            color: var(--primary);
            font-weight: 600;
        }

        .calendar-cell.selected .badge {
            background: rgba(255, 255, 255, 0.20);
            color: #fff;
        }

        .calendar-cell .task-indicator {
            width: 6px;
            height: 6px;
            border-radius: 40px;
            background: var(--primary);
            margin-top: 4px;
        }

        .calendar-day-detail {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        .calendar-day-detail .day-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .calendar-day-detail .day-tasks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .year-grid .month-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .year-grid .month-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .year-grid .month-card .month-name {
            font-weight: 600;
        }

        .year-grid .month-card .month-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 8px;
        }

        .year-grid .month-card .dot {
            width: 8px;
            height: 8px;
            border-radius: 40px;
            background: var(--card-border);
        }

        .year-grid .month-card .dot.has-task {
            background: var(--primary);
        }

        /* ===== Модалки ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.20);
            animation: fadeUp 0.3s ease;
        }

        .modal .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .modal h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal .form-group {
            margin-bottom: 16px;
        }

        .modal .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .modal .form-row .form-group {
            flex: 1;
            min-width: 120px;
        }

        .modal .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .modal .task-detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .modal .task-detail-item .label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ===== Заметки ===== */
        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--card);

            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 60px;

        .fab:hover {

        /* ===== Toast ===== */
        .toast {
            position: fixed;

        .toast.success { background: #00b894; }
        .toast.error { background: #ff6b6b; }

    <script>
        // ========================== DATA LAYER ==========================
        const Data = {
            _data: null,
            _listeners: [],
            load() {
                const raw = localStorage.getItem('skillquest_data');
                if (raw) {
                    try { this._data = JSON.parse(raw); } catch (e) { this._data = this.getDefaultData(); }
                } else {
                    this._data = this.getDefaultData();
                }
                return this._data;
            },
            save() {
                localStorage.setItem('skillquest_data', JSON.stringify(this._data));
                this._notifyListeners();
            },
            subscribe(callback) {
                this._listeners.push(callback);
                return () => { this._listeners = this._listeners.filter(cb => cb !== callback); };
            },
            _notifyListeners() {
                this._listeners.forEach(cb => cb(this._data));
            },
            getDefaultData() {
                return {
                    profile: { name: 'Герой', age: 25, weight: 70, height: 175, chest: 100, waist: 80, hips: 100,
                        biceps: 35, avatar: null, totalExp: 0, level: 1, streak: 0, lastActive: null },
                    journals: [
                        { name: 'тело', exp: 0, icon: '💪' },
                        { name: 'питание', exp: 0, icon: '🍎' },
                        { name: 'дела', exp: 0, icon: '📋' },
                        { name: 'учеба', exp: 0, icon: '📚' },
                        { name: 'хобби', exp: 0, icon: '🎨' },
                        { name: 'путешествия', exp: 0, icon: '✈️' },
                        { name: 'долги', exp: 0, icon: '💰' },
                        { name: 'другое', exp: 0, icon: '📌' }
                    ],
                    tasks: [],
                    goals: [],
                    weightLog: [],
                    notes: [],
                    photos: []
                };
            },
            get profile() { return this._data.profile; },
            get journals() { return this._data.journals; },
            get tasks() { return this._data.tasks; },
            get goals() { return this._data.goals; },
            get notes() { return this._data.notes; },
            get photos() { return this._data.photos; },
            getJournalByName(name) { return this._data.journals.find(j => j.name === name); },
            // --- Задачи ---
            addTask(task) {
                const newTask = {
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                    ...task,
                    completedDates: [],
                    missedDates: [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                this._data.tasks.push(newTask);
                this.save();
                return newTask;
            },
            updateTask(id, updates) {
                const idx = this._data.tasks.findIndex(t => t.id === id);
                if (idx !== -1) {
                    this._data.tasks[idx] = { ...this._data.tasks[idx], ...updates, updatedAt: new Date().toISOString() };
                    this.save();
                    return this._data.tasks[idx];
                }
                return null;
            },
            deleteTask(id) {
                this._data.tasks = this._data.tasks.filter(t => t.id !== id);
                this.save();
            },
            // --- Цели ---
            addGoal(goal) {
                const newGoal = { id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5), ...goal,
                    achieved: false, createdAt: new Date().toISOString() };
                this._data.goals.push(newGoal);
                this.save();
                return newGoal;
            },
            updateGoal(id, updates) {
                const idx = this._data.goals.findIndex(g => g.id === id);
                if (idx !== -1) {
                    this._data.goals[idx] = { ...this._data.goals[idx], ...updates };
                    this.save();
                    return this._data.goals[idx];
                }
                return null;
            },
            deleteGoal(id) {
                this._data.goals = this._data.goals.filter(g => g.id !== id);
                this.save();
            },
            // --- Заметки ---
            addNote(note) {
                const newNote = { id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5), text: note.text,
                    taskId: note.taskId || null, createdAt: new Date().toISOString(), updatedAt: new Date()
                        .toISOString() };
                this._data.notes.push(newNote);
                this.save();
                return newNote;
            },
            updateNote(id, updates) {
                const idx = this._data.notes.findIndex(n => n.id === id);
                if (idx !== -1) {
                    this._data.notes[idx] = { ...this._data.notes[idx], ...updates, updatedAt: new Date().toISOString() };
                    this.save();
                    return this._data.notes[idx];
                }
                return null;
            },
            deleteNote(id) {
                this._data.notes = this._data.notes.filter(n => n.id !== id);
                this.save();
            },
            // --- Фото ---
            addPhoto(photoData) {
                const newPhoto = { id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5), data: photoData.data,
                    note: photoData.note || '', date: photoData.date || new Date().toISOString() };
                this._data.photos.push(newPhoto);
                this.save();
                return newPhoto;
            },
            deletePhoto(id) {
                this._data.photos = this._data.photos.filter(p => p.id !== id);
                this.save();
            },
            // --- Вспомогательные ---
            getTasksForDate(date) {
                const dateStr = typeof date === 'string' ? date : date.toISOString().split('T')[0];
                return this._data.tasks.filter(task => {
                    const start = task.startDate || task.date;
                    const end = task.endDate || task.date;
                    const days = task.daysOfWeek || [];
                    const d = new Date(dateStr);
                    const dayOfWeek = d.getDay();
                    if (days.length === 0) return dateStr >= start && dateStr <= end;
                    return days.includes(dayOfWeek) && dateStr >= start && dateStr <= end;
                });
            },
            getTodayTasks() {
                const today = new Date().toISOString().split('T')[0];
                return this.getTasksForDate(today);
            },
            getTaskStatus(task, dateStr) {
                if (task.completedDates.includes(dateStr)) return 'done';
                if (task.missedDates.includes(dateStr)) return 'missed';
                const taskDate = new Date(dateStr);
                const now = new Date();
                if (taskDate < now && !this.isSameDay(taskDate, now)) return 'missed';
                return 'pending';
            },
            isSameDay(d1, d2) {
                return d1.getFullYear() === d2.getFullYear() &&
                    d1.getMonth() === d2.getMonth() &&
                    d1.getDate() === d2.getDate();
            },
            recalcLevel() {
                const exp = this._data.profile.totalExp;
                let level = 1,
                    needed = 100;
                while (exp >= needed) { level++;
                    needed = level * 100; }
                this._data.profile.level = level;
                this.save();
                return { level, exp, needed };
            },
            addExp(amount) {
                this._data.profile.totalExp += amount;
                this.recalcLevel();
                this.save();
            },
            updateStreak() {
                const today = new Date().toISOString().split('T')[0];
                const last = this._data.profile.lastActive;
                if (last === today) return;
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];
                if (last === yesterdayStr) {
                    this._data.profile.streak += 1;
                } else {
                    this._data.profile.streak = 1;
                }
                this._data.profile.lastActive = today;
                this.save();
            },
            completeTaskInstance(taskId, dateStr) {
                const task = this._data.tasks.find(t => t.id === taskId);
                if (!task) return false;
                if (task.completedDates.includes(dateStr)) return false;
                const now = new Date();
                const taskDate = new Date(dateStr);
                const isLate = taskDate < now && !this.isSameDay(taskDate, now);
                const expJournal = task.duration * 0.01;
                const expTotal = task.duration * 0.005;
                const multiplier = isLate ? 0.5 : 1;
                const journal = this.getJournalByName(task.journal);
                if (journal) journal.exp += expJournal * multiplier;
                this._data.profile.totalExp += expTotal * multiplier;
                task.completedDates.push(dateStr);
                this.recalcLevel();
                this.updateStreak();
                this.save();
                this.checkGoalsAchievement();
                return true;
            },
            autoMissTasks() {
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                this._data.tasks.forEach(task => {
                    const start = task.startDate || task.date;
                    const end = task.endDate || task.date;
                    const days = task.daysOfWeek || [];
                    let current = new Date(start);
                    const endDate = new Date(end);
                    while (current <= endDate) {
                        const dateStr = current.toISOString().split('T')[0];
                        const d = new Date(dateStr);
                        if (d < now && !this.isSameDay(d, now) &&
                            !task.completedDates.includes(dateStr) &&
                            !task.missedDates.includes(dateStr)) {
                            if (days.length === 0 || days.includes(d.getDay())) {
                                task.missedDates.push(dateStr);
                            }
                        }
                        current.setDate(current.getDate() + 1);
                    }
                });
                this.save();
            },
            getDateRange(startDate, endDate) {
                const dates = [];
                let current = new Date(startDate);
                const end = new Date(endDate);
                while (current <= end) {
                    dates.push(current.toISOString().split('T')[0]);
                    current.setDate(current.getDate() + 1);
                }
                return dates;
            },
            checkGoalsAchievement() {
                this._data.goals.forEach(goal => {
                    if (goal.achieved) return;
                    const goalTasks = this._data.tasks.filter(t => t.goalId === goal.id);
                    if (goalTasks.length === 0) return;
                    const allDone = goalTasks.every(task => {
                        const dates = this.getDateRange(task.startDate || task.date, task.endDate || task
                        .date);
                        return dates.every(d => task.completedDates.includes(d) || task.missedDates.includes(
                        d));
                    });
                    if (allDone) {
                        goal.achieved = true;
                        this._data.profile.totalExp += 0.05;
                        this.recalcLevel();
                        this.save();
                        UI.toast('🎉 Цель "' + goal.title + '" достигнута! +0.05 XP', 'success', 5000);

        const Calendar = {
            _view: 'month',
            _baseDate: new Date(),
            _selectedDate: new Date(),
            init() {
                this._baseDate = new Date();
                this._selectedDate = new Date();
            },
            getView() { return this._view; },
            getBaseDate() { return this._baseDate; },
            getSelectedDate() { return this._selectedDate; },
            setView(view) { this._view = view; },
            setBaseDate(date) { this._baseDate = new Date(date); },
            setSelectedDate(date) { this._selectedDate = new Date(date); },
            navigate(direction) {
                const d = new Date(this._baseDate);
                if (this._view === 'day') d.setDate(d.getDate() + direction);
                else if (this._view === 'week') d.setDate(d.getDate() + direction * 7);
                else if (this._view === 'month') d.setMonth(d.getMonth() + direction);
                else if (this._view === 'year') d.setFullYear(d.getFullYear() + direction);
                this._baseDate = d;
                return d;
            },
            getWeekDays() { return ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб']; },
            getMonthData(year, month) {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrevMonth = new Date(year, month, 0).getDate();
                const today = new Date();
                const weeks = [];
                let week = [];
                for (let i = firstDay - 1; i >= 0; i--) {
                    const day = daysInPrevMonth - i;
                    week.push({ day, month: month - 1, year: month === 0 ? year - 1 : year, isOtherMonth: true,
                        isToday: false });
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const date = new Date(year, month, d);
                    const isToday = date.getFullYear() === today.getFullYear() &&
                        date.getMonth() === today.getMonth() &&
                        date.getDate() === today.getDate();
                    week.push({ day: d, month, year, isOtherMonth: false, isToday });
                    if (week.length === 7) { weeks.push(week);
                        week = []; }
                }
                if (week.length > 0) {
                    let nextMonthDay = 1;
                    while (week.length < 7) {
                        week.push({ day: nextMonthDay, month: month + 1, year: month === 11 ? year + 1 : year,
                            isOtherMonth: true, isToday: false });
                        nextMonthDay++;
                    }
                    weeks.push(week);
                }
                return weeks;
            },
            getWeekData(baseDate) {
                const start = new Date(baseDate);
                start.setDate(start.getDate() - start.getDay());
                const week = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(start);
                    d.setDate(d.getDate() + i);
                    week.push(d);
                }
                return week;
            },
            getYearData(year) {
                const months = [];
                for (let m = 0; m < 12; m++) {
                    const date = new Date(year, m, 1);
                    months.push({ month: m, year, name: date.toLocaleString('ru-RU', { month: 'short' }) });
                }
                return months;
            },
            getTitle() {
                const d = this._baseDate;
                if (this._view === 'day') return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long',
                        year: 'numeric' });
                if (this._view === 'week') {
                    const start = new Date(d);
                    start.setDate(start.getDate() - start.getDay());
                    const end = new Date(start);
                    end.setDate(end.getDate() + 6);
                    if (start.getMonth() === end.getMonth()) {
                        return start.getDate() + ' – ' + end.getDate() + ' ' + start.toLocaleString('ru-RU', { month: 'long' }) +
                            ' ' + start.getFullYear();
                    }
                    return start.getDate() + ' ' + start.toLocaleString('ru-RU', { month: 'short' }) + ' – ' + end.getDate() +
                        ' ' + end.toLocaleString('ru-RU', { month: 'short' }) + ' ' + start.getFullYear();
                }
                if (this._view === 'month') return d.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
                return d.getFullYear().toString();
            }
        };
