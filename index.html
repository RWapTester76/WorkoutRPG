

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Хроники Героя · RPG Календарь</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== БАЗА ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-primary: #0f0e17;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --text-primary: #fffffe;
            --text-secondary: #a7a9be;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --success: #00d2d3;
            --warning: #fdcb6e;
            --danger: #ff6b6b;
            --radius: 20px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(108,92,231,0.08) 0%, transparent 60%);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        /* ===== КОНТЕЙНЕР ===== */
        .app {
            max-width: 420px;
            width: 100%;
            position: relative;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-btn {
            background: var(--bg-card);
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .menu-btn:hover { background: var(--accent); transform: scale(1.05); }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 4px 14px 4px 4px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: 0.2s;
        }
        .user-badge:hover { border-color: var(--accent); }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .user-info .name { font-size: 0.8rem; font-weight: 600; }
        .user-info .level { font-size: 0.6rem; color: var(--text-secondary); }

        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-btn {
            background: var(--bg-card);
            border: none;
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: var(--accent); color: white; transform: scale(1.05); }
        .icon-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 0.5rem;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .icon-btn { position: relative; }

        /* ===== XP БАР ===== */
        .xp-bar-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .xp-bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .xp-bar-header span:last-child { color: var(--accent-light); font-weight: 600; }
        .xp-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
            position: relative;
        }
        .xp-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2));
            border-radius: 10px;
        }

        /* ===== ДАШБОРД ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
            transition: 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .stat-card .icon { font-size: 1.2rem; margin-bottom: 4px; }
        .stat-card .value { font-size: 1.2rem; font-weight: 700; }
        .stat-card .label { font-size: 0.55rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

        /* ===== ЕЖЕДНЕВНЫЙ КВЕСТ ===== */
        .daily-quest {
            background: linear-gradient(135deg, var(--bg-card), rgba(108,92,231,0.1));
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(108,92,231,0.2);
            position: relative;
            overflow: hidden;
        }
        .daily-quest::before {
            content: '⚡';
            position: absolute;
            right: -10px;
            top: -10px;
            font-size: 4rem;
            opacity: 0.06;
        }
        .daily-quest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .daily-quest-header h3 { font-size: 0.85rem; font-weight: 600; }
        .daily-quest-header .reward { font-size: 0.7rem; color: var(--warning); }
        .quest-progress {
            display: flex;
            gap: 6px;
        }
        .quest-slot {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
        }
        .quest-slot .fill {
            height: 100%;
            background: var(--accent-light);
            border-radius: 10px;
            transition: width 0.5s;
            width: 0%;
        }
        .quest-slot.done .fill { background: var(--success); width: 100% !important; }

        /* ===== КАЛЕНДАРЬ-ВИДЖЕТ ===== */
        .calendar-widget {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-nav h4 { font-size: 0.9rem; font-weight: 600; }
        .calendar-nav .nav-btns { display: flex; gap: 6px; }
        .calendar-nav .nav-btns button {
            background: rgba(255,255,255,0.04);
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .calendar-nav .nav-btns button:hover { background: var(--accent); color: white; }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.55rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .cal-day {
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            border: 1px solid transparent;
        }
        .cal-day:hover { background: rgba(108,92,231,0.15); transform: scale(1.05); }
        .cal-day.other-month { opacity: 0.2; }
        .cal-day.today { border-color: var(--accent); background: rgba(108,92,231,0.1); }
        .cal-day .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            margin-top: 2px;
        }
        .cal-day .dot.has-task { background: var(--accent-light); }
        .cal-day .dot.done { background: var(--success); }
        .cal-day .count-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 0.45rem;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* ===== ЗАДАЧИ ===== */
        .tasks-section {
            margin-bottom: 16px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .section-header h4 { font-size: 0.9rem; font-weight: 600; }
        .section-header .see-all {
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .section-header .see-all:hover { color: var(--accent-light); }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: 0.2s;
            cursor: pointer;
        }
        .task-item:hover { border-color: rgba(108,92,231,0.2); transform: translateX(4px); }
        .task-item .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .task-item .info { flex: 1; min-width: 0; }
        .task-item .info .title {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-item .info .meta {
            font-size: 0.55rem;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .task-item .info .meta .tag {
            background: rgba(108,92,231,0.15);
            color: var(--accent-light);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 0.5rem;
        }
        .task-item .status {
            font-size: 1.2rem;
            opacity: 0.2;
            transition: 0.2s;
        }
        .task-item.done .status { opacity: 1; color: var(--success); }
        .task-item.done .info .title { opacity: 0.4; text-decoration: line-through; }
        .task-item .xp-badge {
            background: rgba(253,203,110,0.1);
            color: var(--warning);
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 8px 4px;
            border: 1px solid rgba(255,255,255,0.04);
            position: sticky;
            bottom: 0;
            margin-top: 8px;
        }
        .bottom-nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            padding: 8px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 0.6rem;
        }
        .bottom-nav button i { font-size: 1.2rem; }
        .bottom-nav button:hover { color: var(--text-primary); }
        .bottom-nav button.active {
            color: var(--accent-light);
            background: rgba(108,92,231,0.1);
        }
        .bottom-nav button .nav-label { font-size: 0.5rem; opacity: 0.6; }

        /* ===== МЕНЮ ===== */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .menu-overlay.open { display: flex; }
        .menu-panel {
            background: var(--bg-secondary);
            border-radius: 28px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.06);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .menu-panel .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
        }
        .menu-panel .close-btn:hover { color: var(--text-primary); }
        .menu-panel h3 { margin-bottom: 20px; font-size: 1.2rem; }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-secondary);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-size: 0.9rem;
        }
        .menu-item:hover { background: rgba(108,92,231,0.1); color: var(--text-primary); }
        .menu-item i { width: 24px; font-size: 1.1rem; }
        .menu-divider {
            height: 1px;
            background: rgba(255,255,255,0.04);
            margin: 8px 0;
        }
        .menu-item.danger { color: var(--danger); }
        .menu-item.danger:hover { background: rgba(255,107,107,0.1); }

        /* ===== МОДАЛКИ ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 28px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.06);
            animation: slideUp 0.3s ease;
        }
        .modal h3 { margin-bottom: 16px; font-size: 1.1rem; }
        .modal label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: block;
            margin: 12px 0 4px;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .modal textarea { min-height: 60px; resize: vertical; }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .modal .modal-actions button {
            padding: 10px 22px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .modal .btn-primary { background: var(--accent); color: white; }
        .modal .btn-primary:hover { transform: scale(1.03); box-shadow: 0 4px 20px var(--accent-glow); }
        .modal .btn-secondary { background: rgba(255,255,255,0.04); color: var(--text-secondary); }
        .modal .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .modal .btn-danger { background: var(--danger); color: white; }

        .category-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }
        .category-selector .cat-opt {
            padding: 4px 12px;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .category-selector .cat-opt.active { border-color: white; transform: scale(1.05); }

        /* ===== ПРОФИЛЬ ===== */
        .profile-header {
            text-align: center;
            margin-bottom: 16px;
        }
        .profile-header .big-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 3px solid rgba(255,255,255,0.06);
        }
        .profile-header .name { font-size: 1.1rem; font-weight: 600; }
        .profile-header .rank {
            font-size: 0.7rem;
            color: var(--accent-light);
            background: rgba(108,92,231,0.1);
            padding: 2px 14px;
            border-radius: 20px;
            display: inline-block;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .profile-stats .p-stat {
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 14px;
            text-align: center;
        }
        .profile-stats .p-stat .val { font-size: 1.1rem; font-weight: 700; }
        .profile-stats .p-stat .lbl { font-size: 0.55rem; color: var(--text-secondary); text-transform: uppercase; }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .stats-grid { grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
            .stat-card { padding: 8px 4px; }
            .stat-card .value { font-size: 1rem; }
            .bottom-nav button { padding: 6px 10px; font-size: 0.5rem; }
            .bottom-nav button i { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- ===== ХЕДЕР ===== -->
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <div class="user-badge" id="profileBtn">
                    <div class="user-avatar" id="avatarDisplay">🧙</div>
                    <div class="user-info">
                        <div class="name" id="userName">Эльдар</div>
                        <div class="level" id="userLevel">Ур. 1</div>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="addTaskBtn"><i class="fas fa-plus"></i></button>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <!-- ===== XP БАР ===== -->
        <div class="xp-bar-container">
            <div class="xp-bar-header">
                <span>Опыт</span>
                <span id="xpText">0 / 1 XP</span>
            </div>
            <div class="xp-track">
                <div class="xp-fill" id="xpFill" style="width:0%;"></div>
            </div>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📋</div>
                <div class="value" id="statTotal">0</div>
                <div class="label">Всего задач</div>
            </div>
            <div class="stat-card">
                <div class="icon">✅</div>
                <div class="value" id="statDone">0</div>
                <div class="label">Выполнено</div>
            </div>
            <div class="stat-card">
                <div class="icon">🔥</div>
                <div class="value" id="statStreak">0</div>
                <div class="label">Дней стрик</div>
            </div>
        </div>

        <!-- ===== ЕЖЕДНЕВНЫЙ КВЕСТ ===== -->
        <div class="daily-quest" id="dailyQuest">
            <div class="daily-quest-header">
                <h3>⚡ Ежедневный квест</h3>
                <span class="reward">+15 XP</span>
            </div>
            <div class="quest-progress" id="questProgress">
                <div class="quest-slot"><div class="fill" style="width:0%;"></div></div>
                <div class="quest-slot"><div class="fill" style="width:0%;"></div></div>
                <div class="quest-slot"><div class="fill" style="width:0%;"></div></div>
            </div>
            <div style="font-size:0.65rem; color:var(--text-secondary); margin-top:6px;" id="questText">Выполните 3 задачи сегодня</div>
        </div>

        <!-- ===== КАЛЕНДАРЬ ===== -->
        <div class="calendar-widget">
            <div class="calendar-nav">
                <h4 id="calMonth">Июль 2026</h4>
                <div class="nav-btns">

            </div>

        </div>

        <!-- ===== ЗАДАЧИ ===== -->
        <div class="tasks-section">
            <div class="section-header">
                <h4>📌 Сегодня</h4>
                <span class="see-all" id="seeAllTasks">Все задачи →</span>

        <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
        <nav class="bottom-nav">
            <button class="active" data-view="dashboard"><i class="fas fa-home"></i><span class="nav-label">Главная</span></button>

    <!-- ===== МЕНЮ ===== -->
    <div class="menu-overlay" id="menuOverlay">

    <div class="modal-overlay" id="profileModal">

                <div class="p-stat"><div class="val" id="pXP">0</div><div class="lbl">Всего XP</div></div>
                <div class="p-stat"><div class="val" id="pTasks">0</div><div class="lbl">Задач</div></div>

    <!-- ===== МОДАЛКА ДОБАВЛЕНИЯ ЗАДАЧИ ===== -->
    <div class="modal-overlay" id="addTaskModal">
        <div class="modal">
            <h3>➕ Новая задача</h3>
            <label>Название</label>
            <input type="text" id="taskTitle" placeholder="Что нужно сделать?">
            <label>Категория</label>
            <div class="category-selector" id="taskCategorySelector"></div>
            <label>Продолжительность (мин)</label>
            <input type="number" id="taskDuration" value="30" min="0">
            <label>Дата</label>
            <input type="date" id="taskDate">
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelTask">Отмена</button>
                <button class="btn-primary" id="saveTask">Сохранить</button>

    <!-- ===== МОДАЛКА ЦЕЛЕЙ ===== -->
    <div class="modal-overlay" id="goalsModal">
        <div class="modal">
            <h3>🎯 Цели</h3>
            <div id="goalsList"></div>
            <div style="margin-top:12px;">
                <label>Новая цель</label>
                <input type="text" id="newGoalInput" placeholder="Название цели">
                <div class="modal-actions">
                    <button class="btn-secondary" id="closeGoals">Закрыть</button>
                    <button class="btn-primary" id="addGoalBtn">Добавить цель</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ПОЛНАЯ ЛОГИКА ПРИЛОЖЕНИЯ
        // ============================================================

        // ----- КАТЕГОРИИ -----
        const CATEGORIES = [
            { id: 'sport', label: 'Спорт', color: '#e67e22' },
            { id: 'food', label: 'Питание', color: '#2ecc71' },
            { id: 'tasks', label: 'Дела', color: '#3498db' },
            { id: 'hobby', label: 'Хобби', color: '#9b59b6' },
            { id: 'travel', label: 'Путешествия', color: '#1abc9c' },
            { id: 'debt', label: 'Долги', color: '#e74c3c' },
            { id: 'other', label: 'Другое', color: '#f39c12' }
        ];

        // ----- СОСТОЯНИЕ -----
        let state = {
            tasks: [],
            goals: [],
            player: { name: 'Эльдар', totalXP: 0, level: 1 },
            achievements: [],
            currentDate: new Date(),
            filterCategory: null,
            darkMode: true,
            view: 'dashboard'
        };

        let nextTaskId = 1;
        let nextGoalId = 1;

        // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
        function getDateStr(d) {
            const date = d || new Date();
            return date.toISOString().split('T')[0];
        }

        function getToday() { return getDateStr(new Date()); }

        function formatDateKey(year, month, day) {
            return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        }

        function isDateInRange(dateStr, fromStr, toStr) {
            return dateStr >= fromStr && dateStr <= toStr;
        }

        function getTasksForDate(dateStr) {
            return state.tasks.filter(t => {
                const from = t.dateFrom || t.date;
                const to = t.dateTo || t.date;
                return isDateInRange(dateStr, from, to);
            });
        }

        function getTodayTasks() {
            return getTasksForDate(getToday());
        }

        function calculateLevel(totalXP) {
            let l = 1;
            while (l * (l + 1) / 2 <= totalXP) l++;
            return l - 1;
        }

        function getXPToNext(totalXP, level) {
            return (level + 1) * (level + 2) / 2 - totalXP;
        }

        function getProgress(totalXP, level) {
            const cur = level * (level + 1) / 2;
            const next = (level + 1) * (level + 2) / 2;
            return Math.min(1, Math.max(0, (totalXP - cur) / (next - cur)));
        }

        function getRank(level) {
            const ranks = ['Новичок', 'Искатель', 'Странник', 'Ветеран', 'Герой', 'Легенда'];
            const idx = Math.min(Math.floor(level / 3), ranks.length - 1);
            return ranks[idx] || 'Легенда';
        }

        function getAvatar(level) {
            const avatars = ['🧙', '⚔️', '🛡️', '🧝', '🐉', '👑', '🌟', '💫'];
            return avatars[Math.min(level - 1, avatars.length - 1)] || '🧙';
        }

        // ----- ЗАГРУЗКА / СОХРАНЕНИЕ -----
        function loadData() {
            try {
                const saved = localStorage.getItem('hero_chronicles_v1');
                if (saved) {
                    const data = JSON.parse(saved);
                    state.tasks = data.tasks || [];
                    state.goals = data.goals || [];
                    state.player = data.player || { name: 'Эльдар', totalXP: 0, level: 1 };
                    state.achievements = data.achievements || [];
                    nextTaskId = data.nextTaskId || 1;
                    nextGoalId = data.nextGoalId || 1;
                    state.player.level = calculateLevel(state.player.totalXP);
                } else {
                    // Тестовые данные
                    const today = getToday();
                    state.tasks = [
                        { id: nextTaskId++, title: '🏃 Утренняя пробежка', date: today, dateFrom: today, dateTo: today, category: 'sport', done: false, important: true, duration: 30 },
                        { id: nextTaskId++, title: '🥗 Здоровый завтрак', date: today, dateFrom: today, dateTo: today, category: 'food', done: false, important: false, duration: 15 },
                        { id: nextTaskId++, title: '📚 Почитать книгу', date: getDateStr(new Date(Date.now() + 86400000)), dateFrom: getDateStr(new Date(Date.now() + 86400000)), dateTo: getDateStr(new Date(Date.now() + 86400000)), category: 'hobby', done: false, important: false, duration: 45 },
                    ];
                    state.goals = [
                        { id: nextGoalId++, title: 'Фитнес-трансформация', description: 'Сбросить вес и подтянуть тело', done: false, taskIds: [1] }
                    ];
                    state.player = { name: 'Эльдар', totalXP: 15, level: 1 };
                }
            } catch (e) {
                state.tasks = [];
                state.goals = [];
                state.player = { name: 'Эльдар', totalXP: 0, level: 1 };
            }
            state.player.level = calculateLevel(state.player.totalXP);
            renderAll();
        }

        function saveData() {
            try {
                localStorage.setItem('hero_chronicles_v1', JSON.stringify({
                    tasks: state.tasks,
                    goals: state.goals,
                    player: state.player,
                    achievements: state.achievements,
                    nextTaskId,
                    nextGoalId
                }));
            } catch (e) {}
        }

        // ----- XP СИСТЕМА -----
        function addXP(amount) {
            if (amount <= 0) return;
            state.player.totalXP += amount;
            const newLevel = calculateLevel(state.player.totalXP);
            if (newLevel > state.player.level) {
                state.player.level = newLevel;
                checkAchievements();
                setTimeout(() => {
                    alert(`🎉 ПОВЫШЕНИЕ УРОВНЯ! Теперь вы уровень ${state.player.level}!`);
                }, 200);
            } else {
                state.player.level = newLevel;
            }
            saveData();
            renderAll();
        }

        // ----- ДОСТИЖЕНИЯ -----
        function checkAchievements() {
            const done = state.tasks.filter(t => t.done).length;
            const total = state.tasks.length;
            const doneGoals = state.goals.filter(g => g.done).length;
            const list = [];
            if (total >= 1 && !state.achievements.includes('first')) { state.achievements.push('first');
                list.push('🎯 Первая задача!'); }
            if (done >= 5 && !state.achievements.includes('done5')) { state.achievements.push('done5');
                list.push('🏅 5 задач выполнено!'); }
            if (done >= 10 && !state.achievements.includes('done10')) { state.achievements.push('done10');
                list.push('🏆 10 задач выполнено!'); }
            if (done >= 25 && !state.achievements.includes('done25')) { state.achievements.push('done25');
                list.push('👑 25 задач выполнено!'); }
            if (state.player.level >= 5 && !state.achievements.includes('lv5')) { state.achievements.push('lv5');
                list.push('⭐ Уровень 5!'); }
            if (state.player.level >= 10 && !state.achievements.includes('lv10')) { state.achievements.push('lv10');
                list.push('🌟 Уровень 10!'); }
            if (doneGoals >= 1 && !state.achievements.includes('first_goal')) { state.achievements.push('first_goal');
                list.push('🎯 Первая цель достигнута!'); }
            if (list.length) {
                saveData();
                setTimeout(() => alert('🏅 ДОСТИЖЕНИЯ:\n' + list.join('\n')), 300);
            }
        }

        // ----- СТРИК -----
        function getStreak() {
            const doneDates = state.tasks.filter(t => t.done).map(t => t.date).sort();
            if (doneDates.length === 0) return 0;
            const unique = [...new Set(doneDates)].sort();
            let streak = 0;
            let checkDate = new Date();
            checkDate.setHours(0, 0, 0, 0);
            while (true) {
                const ds = checkDate.toISOString().split('T')[0];
                if (unique.includes(ds)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else break;
            }
            return streak;
        }

        // ----- ЗАДАЧИ -----
        function addTask(title, date, category, duration, important) {
            if (!title.trim()) return false;
            const newTask = {
                id: nextTaskId++,
                title: title.trim(),
                date: date,
                dateFrom: date,
                dateTo: date,
                category: category || 'other',
                done: false,
                important: important || false,
                duration: parseInt(duration) || 0
            };
            state.tasks.push(newTask);
            saveData();
            renderAll();
            return true;
        }

        function toggleTaskDone(id) {
            const task = state.tasks.find(t => t.id === id);
            if (!task) return;
            if (!task.done) {
                const xp = (task.duration || 0) * 0.01 + (task.important ? 5 : 0);
                if (xp > 0) addXP(xp);
            }
            task.done = !task.done;
            saveData();
            renderAll();
        }

        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveData();
            renderAll();
        }

        // ----- ЦЕЛИ -----
        function addGoal(title) {
            if (!title.trim()) return false;
            const newGoal = {
                id: nextGoalId++,
                title: title.trim(),
                description: '',
                done: false,
                taskIds: []
            };
            state.goals.push(newGoal);
            saveData();
            renderAll();
            return true;
        }

        function toggleGoalDone(id) {
            const goal = state.goals.find(g => g.id === id);
            if (!goal) return;
            goal.done = !goal.done;
            if (goal.done) {
                const goalTasks = state.tasks.filter(t => t.goalId === id);
                if (goalTasks.filter(t => !t.done).length === 0) addXP(25);
            }
            saveData();
            renderAll();
        }

        function deleteGoal(id) {
            state.goals = state.goals.filter(g => g.id !== id);
            state.tasks.forEach(t => { if (t.goalId === id) t.goalId = null; });
            saveData();
            renderAll();
        }

        // ----- ОТРИСОВКА -----
        function renderAll() {
            renderXP();
            renderStats();
            renderDailyQuest();
            renderCalendar();
            renderTodayTasks();
            renderProfile();
            renderGoalsList();
            renderUserBadge();
        }

        function renderXP() {
            const total = state.player.totalXP;
            const level = state.player.level;
            const progress = getProgress(total, level);
            const xpToNext = getXPToNext(total, level);
            document.getElementById('xpFill').style.width = (progress * 100) + '%';
            document.getElementById('xpText').textContent = `${total - level*(level+1)/2} / ${xpToNext} XP`;
        }

        function renderStats() {
            const total = state.tasks.length;
            const done = state.tasks.filter(t => t.done).length;
            const streak = getStreak();
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statDone').textContent = done;
            document.getElementById('statStreak').textContent = streak;
        }

        function renderDailyQuest() {
            const todayTasks = getTodayTasks();
            const done = todayTasks.filter(t => t.done).length;
            const total = todayTasks.length;
            const slots = document.querySelectorAll('#questProgress .quest-slot');
            slots.forEach((slot, i) => {
                const fill = slot.querySelector('.fill');
                if (i < total) {
                    slot.style.display = 'block';
                    fill.style.width = (i < done) ? '100%' : '0%';
                    slot.classList.toggle('done', i < done);
                } else {
                    slot.style.display = 'none';
                }
            });
            document.getElementById('questText').textContent =
                total > 0 ? `Выполнено ${done} из ${total} задач сегодня` : 'Нет задач на сегодня';
        }

        function renderCalendar() {
            const year = state.currentDate.getFullYear();
            const month = state.currentDate.getMonth();
            document.getElementById('calMonth').textContent =
                new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' }).format(state.currentDate);

            const firstDay = new Date(year, month, 1);
            const startDay = (firstDay.getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();
            const today = getToday();

            let html = '';
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrev - i;
                const m = month === 0 ? 11 : month - 1;
                const y = month === 0 ? year - 1 : year;
                const ds = formatDateKey(y, m, day);
                const tasks = getTasksForDate(ds);
                html += createDayCell(day, true, tasks, ds, today);
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const ds = formatDateKey(year, month, day);
                const tasks = getTasksForDate(ds);
                html += createDayCell(day, false, tasks, ds, today);
            }
            const total = startDay + daysInMonth;
            const rem = (7 - (total % 7)) % 7;
            for (let day = 1; day <= rem; day++) {
                const m = month === 11 ? 0 : month + 1;
                const y = month === 11 ? year + 1 : year;
                const ds = formatDateKey(y, m, day);
                const tasks = getTasksForDate(ds);
                html += createDayCell(day, true, tasks, ds, today);
            }
            document.getElementById('calGrid').innerHTML = html;

            document.querySelectorAll('.cal-day').forEach(el => {
                el.addEventListener('click', function() {
                    const date = this.dataset.date;
                    if (date) {
                        // Фильтруем задачи по дате
                        const tasks = getTasksForDate(date);
                        if (tasks.length > 0) {
                            alert('📋 Задачи на ' + date + ':\n' + tasks.map(t => (t.done ? '✅ ' : '⬜ ') + t.title).join(
                            '\n'));
                        } else {
                            alert('📋 На ' + date + ' нет задач');
                        }
                    }
                });
            });
        }

        function createDayCell(day, isOther, tasks, dateStr, today) {
            const count = tasks.length;
            const done = tasks.filter(t => t.done).length;
            let dots = '';
            if (count > 0) dots = '<div class="dot ' + (done === count ? 'done' : 'has-task') + '"></div>';
            let badge = '';
            if (count > 1) badge = '<span class="count-badge">' + count + '</span>';
            const isToday = dateStr === today;
            const cls = 'cal-day' +
                (isOther ? ' other-month' : '') +
                (isToday ? ' today' : '');
            return `<div class="${cls}" data-date="${dateStr}">
                <span>${day}</span>${badge}
                ${dots}
            </div>`;
        }

        function renderTodayTasks() {
            const container = document.getElementById('todayTasks');
            const tasks = getTodayTasks();
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:16px; color:var(--text-secondary); font-size:0.8rem;">
                        ✨ Нет задач на сегодня
                    </div>
                `;
                return;
            }
            let html = '';
            tasks.slice(0, 5).forEach(task => {
                const cat = CATEGORIES.find(c => c.id === task.category);
                const doneClass = task.done ? 'done' : '';
                const statusIcon = task.done ? 'fa-check-circle' : 'fa-circle';
                const xp = (task.duration || 0) * 0.01 + (task.important ? 5 : 0);
                html += `
                    <div class="task-item ${doneClass}" data-id="${task.id}">
                        <div class="color-dot" style="background:${cat ? cat.color : '#999'};"></div>
                        <div class="info">
                            <div class="title">${task.title}</div>
                            <div class="meta">
                                ${cat ? `<span class="tag">${cat.label}</span>` : ''}
                                ${task.duration ? `<span>⏱ ${task.duration} мин</span>` : ''}
                                ${xp > 0 ? `<span class="xp-badge">+${xp.toFixed(1)} XP</span>` : ''}
                            </div>
                        </div>
                        <button class="status" data-action="toggle">
                            <i class="fas ${statusIcon}"></i>
                        </button>
                    </div>
                `;
            });
            if (tasks.length > 5) {
                html += `<div style="text-align:center; padding:8px; color:var(--text-secondary); font-size:0.7rem;">и ещё ${tasks.length - 5} задач...</div>`;
            }
            container.innerHTML = html;

            container.querySelectorAll('.task-item').forEach(el => {
                const id = parseInt(el.dataset.id);
                el.querySelector('[data-action="toggle"]')?.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleTaskDone(id);
                });
                el.addEventListener('dblclick', function() {
                    if (confirm('Удалить задачу?')) deleteTask(id);
                });
            });
        }

        function renderUserBadge() {
            const level = state.player.level;
            document.getElementById('userName').textContent = state.player.name;
            document.getElementById('userLevel').textContent = 'Ур. ' + level;
            document.getElementById('avatarDisplay').textContent = getAvatar(level);
        }

        function renderProfile() {
            const level = state.player.level;
            document.getElementById('profileAvatar').textContent = getAvatar(level);
            document.getElementById('profileName').textContent = state.player.name;
            document.getElementById('profileRank').textContent = getRank(level);
            document.getElementById('pLevel').textContent = level;
            document.getElementById('pXP').textContent = Math.round(state.player.totalXP);
            document.getElementById('pTasks').textContent = state.tasks.length;
            document.getElementById('pStreak').textContent = getStreak();
            document.getElementById('editName').value = state.player.name;
        }

        function renderGoalsList() {
            const container = document.getElementById('goalsList');
            if (state.goals.length === 0) {
                container.innerHTML = '<div style="color:var(--text-secondary); text-align:center; padding:12px; font-size:0.8rem;">Нет целей. Создайте первую!</div>';
                return;
            }
            let html = '';
            state.goals.forEach(goal => {
                const taskIds = goal.taskIds || [];
                const goalTasks = state.tasks.filter(t => taskIds.includes(t.id));
                const done = goalTasks.filter(t => t.done).length;
                const total = goalTasks.length;
                const progress = total > 0 ? Math.round((done / total) * 100) : 0;
                html += `
                    <div class="task-item" style="margin-bottom:6px;">
                        <div class="color-dot" style="background:${goal.done ? '#00d2d3' : '#6c5ce7'};"></div>
                        <div class="info">
                            <div class="title">${goal.done ? '✅ ' : '🎯 '}${goal.title}</div>
                            <div class="meta">
                                <span>${done}/${total} задач</span>
                                <span style="color:var(--accent-light);">${progress}%</span>
                            </div>
                        </div>
                        <button class="status" data-action="toggle-goal" style="font-size:0.8rem; opacity:0.6;">
                            <i class="fas ${goal.done ? 'fa-undo' : 'fa-check'}"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('[data-action="toggle-goal"]').forEach(btn => {
                const item = btn.closest('.task-item');
                const idx = Array.from(container.children).indexOf(item);
                const goal = state.goals[idx];
                if (goal) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        toggleGoalDone(goal.id);
                    });
                }
            });
        }

        // ----- НАВИГАЦИЯ -----
        function switchView(view) {
            state.view = view;
            document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.bottom-nav button[data-view="${view}"]`)?.classList.add('active');
            // Показываем/скрываем секции
            const sections = ['dashboard', 'calendar', 'goals', 'stats'];
            sections.forEach(s => {
                const el = document.querySelector(`[data-section="${s}"]`);
                if (el) el.style.display = s === view ? 'block' : 'none';
            });
            // Для упрощения — показываем всё, но скрываем ненужное
            if (view === 'goals') {
                document.getElementById('goalsModal').classList.add('open');
            } else {
                document.getElementById('goalsModal').classList.remove('open');
            }
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        function init() {
            loadData();

            // ---- КАЛЕНДАРЬ ----
            document.getElementById('calPrev').addEventListener('click', () => {
                state.currentDate.setMonth(state.currentDate.getMonth() - 1);
                renderCalendar();
            });
            document.getElementById('calNext').addEventListener('click', () => {
                state.currentDate.setMonth(state.currentDate.getMonth() + 1);
                renderCalendar();
            });

            // ---- МЕНЮ ----
            document.getElementById('menuBtn').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.add('open');
            });
            document.getElementById('menuClose').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.remove('open');
            });
            document.getElementById('menuOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('open');
            });

            // ---- ПРОФИЛЬ ----
            document.getElementById('profileBtn').addEventListener('click', () => {
                document.getElementById('profileModal').classList.add('open');
                renderProfile();
            });
            document.getElementById('menuProfile').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.remove('open');
                document.getElementById('profileModal').classList.add('open');
                renderProfile();
            });
            document.getElementById('closeProfile').addEventListener('click', () => {
                document.getElementById('profileModal').classList.remove('open');
            });
            document.getElementById('saveProfile').addEventListener('click', () => {
                const name = document.getElementById('editName').value.trim();
                if (name) {
                    state.player.name = name;
                    saveData();
                    renderAll();
                }
                document.getElementById('profileModal').classList.remove('open');
            });

            // ---- ЗАДАЧИ ----
            document.getElementById('addTaskBtn').addEventListener('click', () => {
                document.getElementById('addTaskModal').classList.add('open');
                document.getElementById('taskDate').value = getToday();
                // Категории
                const container = document.getElementById('taskCategorySelector');
                container.innerHTML = '';
                CATEGORIES.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-opt' + (cat.id === 'tasks' ? ' active' : '');
                    btn.style.background = cat.color;
                    btn.textContent = cat.label;
                    btn.dataset.cat = cat.id;
                    btn.addEventListener('click', function() {
                        container.querySelectorAll('.cat-opt').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                    });
                    container.appendChild(btn);
                });
            });
            document.getElementById('cancelTask').addEventListener('click', () => {
                document.getElementById('addTaskModal').classList.remove('open');
            });
            document.getElementById('saveTask').addEventListener('click', () => {
                const title = document.getElementById('taskTitle').value.trim();
                const date = document.getElementById('taskDate').value;
                const duration = document.getElementById('taskDuration').value || 0;
                const activeCat = document.querySelector('#taskCategorySelector .cat-opt.active');
                const category = activeCat ? activeCat.dataset.cat : 'tasks';
                if (!title) { alert('Введите название задачи'); return; }
                if (!date) { alert('Выберите дату'); return; }
                if (addTask(title, date, category, duration, false)) {
                    document.getElementById('addTaskModal').classList.remove('active');
                    document.getElementById('taskTitle').value = '';
                }
            });

            // ---- ЦЕЛИ ----
            document.getElementById('menuGoals').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.remove('open');
                document.getElementById('goalsModal').classList.add('open');
                renderGoalsList();
            });
            document.getElementById('closeGoals').addEventListener('click', () => {
                document.getElementById('goalsModal').classList.remove('open');
            });
            document.getElementById('addGoalBtn').addEventListener('click', () => {
                const title = document.getElementById('newGoalInput').value.trim();
                if (title) {
                    addGoal(title);
                    document.getElementById('newGoalInput').value = '';
                }
            });

            // ---- СТАТИСТИКА ----
            document.getElementById('menuStats').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.remove('open');
                const done = state.tasks.filter(t => t.done).length;
                const total = state.tasks.length;
                const goalsDone = state.goals.filter(g => g.done).length;
                alert(`📊 СТАТИСТИКА\n━━━━━━━━━━━━━━\n📌 Задач: ${total}\n✅ Выполнено: ${done}\n🎯 Целей: ${state.goals.length}\n✅ Целей достигнуто: ${goalsDone}\n🔥 Стрик: ${getStreak()} дн.\n⚡ Всего XP: ${Math.round(state.player.totalXP)}\n👤 Уровень: ${state.player.level}`);
            });

            // ---- ДОСТИЖЕНИЯ ----
            document.getElementById('menuAchievements').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.remove('open');
                const list = state.achievements.length ? state.achievements.map((a, i) => `${i+1}. ${a}`).join('\n') :
                    'Пока нет достижений';
                alert(`🏅 ДОСТИЖЕНИЯ (${state.achievements.length})\n━━━━━━━━━━━━\n${list}`);
            });

            // ---- ЭКСПОРТ ----
            document.getElementById('menuExport').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.remove('open');
                const data = {
                    tasks: state.tasks,
                    goals: state.goals,
                    player: state.player,
                    achievements: state.achievements,
                    exported: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `hero_chronicles_${getToday()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // ---- СБРОС ----
            document.getElementById('menuReset').addEventListener('click', () => {
                document.getElementById('menuOverlay').classList.remove('open');
                if (confirm('⚠️ Удалить все данные?')) {
                    if (confirm('Точно? Это нельзя отменить!')) {
                        state.tasks = [];
                        state.goals = [];
                        state.player = { name: 'Эльдар', totalXP: 0, level: 1 };
                        state.achievements = [];
                        nextTaskId = 1;
                        nextGoalId = 1;
                        saveData();
                        renderAll();
                        alert('✅ Данные сброшены');
                    }
                }
            });

            // ---- НИЖНЯЯ НАВИГАЦИЯ ----
            document.querySelectorAll('.bottom-nav button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const view = this.dataset.view;
                    if (view === 'goals') {
                        document.getElementById('goalsModal').classList.add('open');
                        renderGoalsList();
                    } else if (view === 'stats') {
                        const done = state.tasks.filter(t => t.done).length;
                        const total = state.tasks.length;
                        alert(`📊 СТАТИСТИКА\n━━━━━━━━━━━━━━\n📌 Задач: ${total}\n✅ Выполнено: ${done}\n🔥 Стрик: ${getStreak()} дн.\n⚡ Всего XP: ${Math.round(state.player.totalXP)}\n👤 Уровень: ${state.player.level}`);
                    } else {
                        document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        // Прокрутка к нужной секции
                        if (view === 'dashboard') {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }
                });
            });

            // ---- СЕЕ ВСЕ ЗАДАЧИ ----
            document.getElementById('seeAllTasks').addEventListener('click', () => {
                const tasks = getTodayTasks();
                if (tasks.length === 0) {
                    alert('✨ На сегодня нет задач');
                    return;
                }
                const msg = tasks.map((t, i) =>
                    `${i+1}. ${t.done ? '✅' : '⬜'} ${t.title}${t.duration ? ` (${t.duration} мин)` : ''}`
                ).join('\n');
                alert(`📋 Задачи на сегодня (${tasks.length}):\n━━━━━━━━━━━━━━\n${msg}`);
            });

            // ---- ТЕМА ----
            document.getElementById('themeToggle').addEventListener('click', function() {
                state.darkMode = !state.darkMode;
                document.body.style.background = state.darkMode ? '#0f0e17' : '#f0ece4';
                document.body.style.color = state.darkMode ? '#fffffe' : '#1a1a2e';
                this.innerHTML = state.darkMode ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
                // Меняем переменные
                document.documentElement.style.setProperty('--bg-primary', state.darkMode ? '#0f0e17' : '#f0ece4');
                document.documentElement.style.setProperty('--bg-secondary', state.darkMode ? '#1a1a2e' : '#ffffff');
                document.documentElement.style.setProperty('--bg-card', state.darkMode ? '#16213e' : '#f5f0eb');
                document.documentElement.style.setProperty('--text-primary', state.darkMode ? '#fffffe' : '#1a1a2e');
                document.documentElement.style.setProperty('--text-secondary', state.darkMode ? '#a7a9be' : '#5a5a6a');
            });

            // ---- ЗАКРЫТИЕ МОДАЛОК ПО ОВЕРЛЕЮ ----
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('open');
                });
            });

            // ---- ПРОФИЛЬ В МЕНЮ ----
            document.getElementById('menuProfile').addEventListener('click', function() {
                document.getElementById('menuOverlay').classList.remove('open');
                document.getElementById('profileModal').classList.add('open');
                renderProfile();
            });

            renderAll();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
