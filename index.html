<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Планировщик — выбор темы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* —————— БАЗОВЫЙ СБРОС —————— */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            transition: background 0.4s ease;
            padding: 12px;
        }

        /* —————— КОНТЕЙНЕР —————— */
        .app-container {
            width: 100%;
            max-width: 1200px;
            border-radius: 28px;
            padding: 20px;
            transition: background 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            background: #ffffff;
        }

        /* —————— ХЕДЕР —————— */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-bottom: 24px;
        }

        .app-header h1 {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 700;
            letter-spacing: -0.4px;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1 i {
            font-size: clamp(18px, 3vw, 24px);
        }

        .theme-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .theme-btn {
            width: clamp(38px, 7vw, 48px);
            height: clamp(38px, 7vw, 48px);
            border-radius: 14px;
            border: 2.5px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #1e1e2a;
            background: #f0f0f5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            padding: 0 4px;
            gap: 4px;
            flex-shrink: 0;
        }

        .theme-btn:active {
            transform: scale(0.92);
        }

        .theme-btn.active {
            border-color: currentColor;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.10);
        }

        .theme-btn .color-dots {
            display: flex;
            gap: 3px;
        }

        .theme-btn .color-dots span {
            display: block;
            width: clamp(8px, 1.5vw, 12px);
            height: clamp(8px, 1.5vw, 12px);
            border-radius: 4px;
        }

        .theme-btn .theme-label {
            display: none;
        }

        @media (min-width: 600px) {
            .theme-btn .theme-label {
                display: inline;
                font-size: 10px;
                margin-left: 2px;
            }
        }

        /* —————— ОСНОВНАЯ СЕТКА —————— */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            margin-bottom: 24px;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1.8fr 1fr;
                gap: 24px;
            }
        }

        @media (min-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 2fr 1.1fr;
                gap: 28px;
            }
        }

        /* —————— КАРТОЧКИ —————— */
        .card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 18px 16px;
            transition: background 0.35s ease, box-shadow 0.35s ease;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
        }

        @media (min-width: 480px) {
            .card {
                padding: 22px 24px;
                border-radius: 24px;
            }
        }

        .card-title {
            font-size: clamp(12px, 1.8vw, 15px);
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ——— ЗАДАЧИ ——— */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: background 0.25s ease;
            border: 1px solid rgba(0,0,0,0.02);
            touch-action: manipulation;
        }

        @media (min-width: 480px) {
            .task-item {
                padding: 12px 16px;
                gap: 14px;
            }
        }

        .task-check {
            width: clamp(20px, 4vw, 26px);
            height: clamp(20px, 4vw, 26px);
            border-radius: 8px;
            border: 2px solid rgba(0,0,0,0.15);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .task-check:active {
            transform: scale(0.85);
        }

        .task-check.done {
            background: currentColor;
            border-color: currentColor;
            color: #fff;
        }

        .task-check.done i {
            font-size: clamp(10px, 1.8vw, 14px);
        }

        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .task-name {
            font-weight: 500;
            font-size: clamp(14px, 2.2vw, 16px);
            word-break: break-word;
        }

        .task-meta {
            font-size: clamp(11px, 1.6vw, 13px);
            opacity: 0.5;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: center;
        }

        .task-tag {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: clamp(10px, 1.4vw, 12px);
            font-weight: 500;
            background: rgba(0,0,0,0.05);
            color: inherit;
            white-space: nowrap;
        }

        /* ——— ПРОГРЕСС ——— */
        .progress-block {
            margin-top: 4px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: clamp(13px, 2vw, 15px);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .progress-track {
            width: 100%;
            height: clamp(6px, 1vw, 10px);
            border-radius: 20px;
            background: rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 20px;
            background: currentColor;
            transition: width 0.6s ease;
        }

        /* ——— СТАТИСТИКА ——— */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        @media (min-width: 480px) {
            .stats-row {
                gap: 12px;
            }
        }

        .stat-item {
            text-align: center;
            padding: 8px 4px;
            border-radius: 14px;
            background: rgba(255,255,255,0.3);
        }

        @media (min-width: 480px) {
            .stat-item {
                padding: 12px 8px;
                border-radius: 16px;
            }
        }

        .stat-number {
            font-size: clamp(22px, 4.5vw, 30px);
            font-weight: 700;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .stat-label {
            font-size: clamp(10px, 1.4vw, 13px);
            opacity: 0.5;
            margin-top: 2px;
        }

        /* ——— КАЛЕНДАРЬ ——— */
        .mini-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 8px 0 4px;
        }

        @media (min-width: 480px) {
            .mini-calendar {
                gap: 6px;
            }
        }

        .mini-calendar .day {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: clamp(8px, 1.5vw, 14px);
            font-size: clamp(12px, 2vw, 16px);
            font-weight: 500;
            background: rgba(255,255,255,0.2);
            transition: background 0.2s ease;
            cursor: default;
            -webkit-user-select: none;
            user-select: none;
        }

        .mini-calendar .day.has-task {
            background: currentColor;
            color: #fff;
            opacity: 0.7;
        }

        .mini-calendar .day.today {
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
        }

        .mini-calendar .day.weekend {
            opacity: 0.4;
        }

        /* ——— ЦЕЛИ ——— */
        .goal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            gap: 12px;
        }

        .goal-item:last-child {
            border-bottom: none;
        }

        .goal-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .goal-name {
            font-weight: 500;
            font-size: clamp(14px, 2.2vw, 16px);
            word-break: break-word;
        }

        .goal-sub {
            font-size: clamp(12px, 1.6vw, 14px);
            opacity: 0.5;
        }

        .goal-badge {
            font-size: clamp(11px, 1.5vw, 13px);
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(0,0,0,0.04);
            white-space: nowrap;
        }

        /* ——— НИЖНЯЯ ПАНЕЛЬ ——— */
        .bottom-bar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.04);
        }

        @media (min-width: 600px) {
            .bottom-bar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .tag-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag-group .tag {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: clamp(12px, 1.6vw, 14px);
            font-weight: 500;
            background: rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            border: none;
            color: inherit;
        }

        .tag-group .tag:active {
            transform: scale(0.92);
        }

        .tag-group .tag.active-tag {
            background: var(--accent, #4a6fa5);
            color: #fff;
        }

        .bottom-stats {
            display: flex;
            gap: 16px;
            font-size: clamp(13px, 1.8vw, 15px);
            opacity: 0.5;
            flex-wrap: wrap;
        }

        .bottom-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ——— ДОПОЛНИТЕЛЬНЫЕ КНОПКИ ——— */
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: clamp(13px, 1.8vw, 15px);
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 100px;
        }

        .action-btn:active {
            transform: scale(0.94);
        }

        .action-btn.primary {
            background: var(--accent, #4a6fa5);
        }

        .action-btn.success {
            background: #2ecc71;
        }

        .action-btn.danger {
            background: #e74c3c;
        }

        .action-btn.warning {
            background: #f39c12;
        }

        /* ——— TOAST-УВЕДОМЛЕНИЕ ——— */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e1e2a;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* —————— ТЕМЫ —————— */
        [data-theme="nordic"] {
            --bg: #eef2f5;
            --surface: #ffffff;
            --text: #1e2a3a;
            --accent: #4a6fa5;
            --accent-light: #d4e0f0;
            --border: rgba(30,42,58,0.06);
        }
        [data-theme="nordic"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        [data-theme="nordic"] .card {
            background: rgba(255,255,255,0.7);
            border-color: var(--border);
        }

        [data-theme="amber"] {
            --bg: #fbf3e8;
            --surface: #fff9f0;
            --text: #3d2c1b;
            --accent: #d48c4b;
            --accent-light: #f0dec8;
            --border: rgba(61,44,27,0.07);
        }
        [data-theme="amber"] .app-container {
            background: var(--surface);
            color: var(--text);
        }
        [data-theme="amber"] .card {
            background: rgba(255,248,235,0.7);
        }

        [data-theme="forest"] {
            --bg: #eaf0e6;
            --surface: #f4f9f0;
            --text: #1f3327;
            --accent: #4a7c59;
            --accent-light: #cde0d4;
            --border: rgba(31,51,39,0.06);
        }
        [data-theme="forest"] .app-container {
            background: var(--surface);
            color: var(--text);
        }
        [data-theme="forest"] .card {
            background: rgba(255,255,255,0.65);
        }

        [data-theme="indigo"] {
            --bg: #131b2b;
            --surface: #1a2538;
            --text: #e8edf5;
            --accent: #7a9bcb;
            --accent-light: #2a3a55;
            --border: rgba(255,255,255,0.05);
        }
        [data-theme="indigo"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        [data-theme="indigo"] .card {
            background: rgba(255,255,255,0.04);
            border-color: var(--border);
        }
        [data-theme="indigo"] .task-item {
            background: rgba(255,255,255,0.04);
        }
        [data-theme="indigo"] .task-check {
            border-color: rgba(255,255,255,0.2);
        }
        [data-theme="indigo"] .stat-item {
            background: rgba(255,255,255,0.03);
        }
        [data-theme="indigo"] .bottom-bar {
            border-color: var(--border);
        }
        [data-theme="indigo"] .goal-item {
            border-color: var(--border);
        }

        [data-theme="rose"] {
            --bg: #f9f0f2;
            --surface: #fff7f9;
            --text: #3d2a33;
            --accent: #d4899e;
            --accent-light: #f2d9e0;
            --border: rgba(61,42,51,0.06);
        }
        [data-theme="rose"] .app-container {
            background: var(--surface);
            color: var(--text);
        }
        [data-theme="rose"] .card {
            background: rgba(255,245,247,0.7);
        }

        [data-theme="technoir"] {
            --bg: #0b0d14;
            --surface: #131721;
            --text: #eef2ff;
            --accent: #00d4b6;
            --accent-light: #1a2a2f;
            --border: rgba(0,212,182,0.12);
            --glow: 0 0 18px rgba(0,212,182,0.08);
        }
        [data-theme="technoir"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--glow);
        }
        [data-theme="technoir"] .card {
            background: rgba(255,255,255,0.02);
            border-color: var(--border);
            box-shadow: var(--glow);
        }
        [data-theme="technoir"] .task-item {
            background: rgba(255,255,255,0.02);
            border-color: var(--border);
        }
        [data-theme="technoir"] .task-check {
            border-color: rgba(255,255,255,0.15);
        }
        [data-theme="technoir"] .stat-item {
            background: rgba(255,255,255,0.02);
        }
        [data-theme="technoir"] .bottom-bar {
            border-color: var(--border);
        }
        [data-theme="technoir"] .goal-item {
            border-color: var(--border);
        }

        [data-theme="paper"] {
            --bg: #f6f4ef;
            --surface: #ffffff;
            --text: #1f1d1b;
            --accent: #b8a99a;
            --accent-light: #e8e1d8;
            --border: rgba(31,29,27,0.05);
        }
        [data-theme="paper"] .app-container {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }
        [data-theme="paper"] .card {
            background: rgba(255,252,248,0.7);
            border-color: var(--border);
        }
        [data-theme="paper"] .task-item {
            background: rgba(255,252,248,0.5);
        }

        /* ——— Общие стили для всех тем ——— */
        .theme-btn {
            color: var(--text, #1e1e2a);
            background: var(--surface, #f0f0f5);
        }
        .theme-btn.active {
            border-color: var(--accent, #4a6fa5);
            color: var(--accent, #4a6fa5);
        }

        body {
            background: var(--bg, #f3f4f6);
        }

        /* ——— iPhone Safe Area ——— */
        @supports (padding: max(0px)) {
            .app-container {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
            }
        }

        /* ——— Отладка для очень маленьких экранов ——— */
        @media (max-width: 380px) {
            .app-container {
                padding: 12px 10px;
                border-radius: 20px;
            }
            .card {
                padding: 14px 12px;
                border-radius: 16px;
            }
            .task-item {
                padding: 8px 10px;
                gap: 10px;
            }
            .theme-btn {
                width: 34px;
                height: 34px;
                border-radius: 10px;
            }
            .theme-btn .color-dots span {
                width: 6px;
                height: 6px;
            }
            .stats-row {
                gap: 4px;
            }
            .stat-item {
                padding: 6px 2px;
            }
            .stat-number {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="app-container" id="app" data-theme="nordic">
    <!-- ХЕДЕР -->
    <header class="app-header">
        <h1><i class="far fa-calendar-alt"></i>Планировщик</h1>
        <div class="theme-picker" id="themePicker"></div>
    </header>

    <!-- ОСНОВНАЯ СЕТКА -->
    <div class="dashboard-grid">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <div>
            <div class="card" style="margin-bottom: 18px;">
                <div class="card-title"><i class="far fa-check-circle"></i>Сегодня</div>
                <div class="task-list" id="taskList">
                    <!-- Задачи рендерятся из JS -->
                </div>
            </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-chart-line"></i>Прогресс недели</div>
                <div class="progress-block">
                    <div class="progress-label">
                        <span>Выполнено задач</span>
                        <span id="progressText">9 / 14</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width: 64%;"></div>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-number" id="statPlanned">12</div>
                        <div class="stat-label">Запланировано</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="statDone">9</div>
                        <div class="stat-label">Выполнено</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="statRemaining">3</div>
                        <div class="stat-label">Осталось</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div>
            <div class="card" style="margin-bottom: 18px;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                    <span class="card-title" style="margin-bottom:0;"><i class="far fa-calendar"></i><span id="monthLabel">Июль 2026</span></span>
                    <span class="text-sm" style="opacity:0.5; font-size:clamp(11px,1.6vw,14px);">неделя 30</span>
                </div>
                <div class="mini-calendar" id="miniCalendar"></div>
                <div style="margin-top: 10px; display: flex; gap: 14px; font-size: clamp(11px,1.6vw,13px); opacity: 0.5; flex-wrap:wrap;">
                    <span><span style="display:inline-block; width:10px; height:10px; border-radius:4px; background:currentColor; margin-right:6px;"></span> с задачами</span>
                    <span><span style="display:inline-block; width:10px; height:10px; border-radius:4px; border:2px solid currentColor; margin-right:6px;"></span> сегодня</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-bullseye"></i>Цели</div>
                <div id="goalList">
                    <!-- Цели рендерятся из JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar">
        <div class="tag-group" id="tagGroup">
            <button class="tag active-tag" data-tag="all">Все</button>
            <button class="tag" data-tag="work">Работа</button>
            <button class="tag" data-tag="personal">Личное</button>
            <button class="tag" data-tag="health">Здоровье</button>
            <button class="tag" data-tag="learning">Обучение</button>
        </div>
        <div class="bottom-stats">
            <span><i class="far fa-star"></i> <span id="xpDisplay">18</span> XP</span>
            <span><i class="fas fa-fire"></i> <span id="streakDisplay">5</span> дн.</span>
        </div>
    </div>

    <!-- КНОПКИ ДЕЙСТВИЙ -->
    <div class="action-buttons">
        <button class="action-btn primary" id="btnAddTask"><i class="fas fa-plus"></i> Новая задача</button>
        <button class="action-btn success" id="btnCompleteAll"><i class="fas fa-check-double"></i> Все готово</button>
        <button class="action-btn warning" id="btnResetStats"><i class="fas fa-undo"></i> Сброс</button>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        // ———— ДАННЫЕ ————
        const tasks = [
            { id: 1, name: 'Создать макет дашборда', tag: 'Работа', time: '10:30 – 12:00', done: true },
            { id: 2, name: 'Написать документацию', tag: 'Разработка', time: '14:00 – 15:30', done: false },
            { id: 3, name: 'Обзор кода команды', tag: 'Ревью', time: '16:00 – 17:00', done: false },
            { id: 4, name: 'Планерка с дизайнерами', tag: 'Работа', time: '09:00 – 10:00', done: false }
        ];

        const goals = [
            { name: 'Запустить MVP', done: 3, total: 5 },
            { name: 'Изучить Vue 3', done: 2, total: 4 },
            { name: 'Дизайн-система', done: 1, total: 3 }
        ];

        let currentTheme = 'nordic';
        let taskData = [...tasks];
        let doneCount = taskData.filter(t => t.done).length;

        // ———— ТЕМЫ ————
        const themes = [
            { id: 'nordic',   label: 'Нордик',   colors: ['#4a6fa5', '#d4e0f0', '#eef2f5'] },
            { id: 'amber',    label: 'Янтарь',   colors: ['#d48c4b', '#f0dec8', '#fbf3e8'] },
            { id: 'forest',   label: 'Лесной',   colors: ['#4a7c59', '#cde0d4', '#eaf0e6'] },
            { id: 'indigo',   label: 'Индиго',   colors: ['#7a9bcb', '#2a3a55', '#131b2b'] },
            { id: 'rose',     label: 'Розовый',  colors: ['#d4899e', '#f2d9e0', '#f9f0f2'] },
            { id: 'technoir', label: 'Техно',    colors: ['#00d4b6', '#1a2a2f', '#0b0d14'] },
            { id: 'paper',    label: 'Бумага',   colors: ['#b8a99a', '#e8e1d8', '#f6f4ef'] }
        ];

        // ———— DOM ————
        const app = document.getElementById('app');
        const picker = document.getElementById('themePicker');
        const taskList = document.getElementById('taskList');
        const goalList = document.getElementById('goalList');
        const miniCalendar = document.getElementById('miniCalendar');
        const toast = document.getElementById('toast');
        let toastTimer = null;

        // ———— TOAST ————
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ———— РЕНДЕР ТЕМ ————
        function renderThemeButtons() {
            picker.innerHTML = '';
            themes.forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'theme-btn' + (t.id === currentTheme ? ' active' : '');
                btn.dataset.theme = t.id;
                btn.title = t.label;

                const dots = document.createElement('span');
                dots.className = 'color-dots';
                t.colors.forEach(c => {
                    const dot = document.createElement('span');
                    dot.style.background = c;
                    dots.appendChild(dot);
                });
                btn.appendChild(dots);

                const label = document.createElement('span');
                label.className = 'theme-label';
                label.textContent = t.label;
                btn.appendChild(label);

                btn.addEventListener('click', () => setTheme(t.id));
                picker.appendChild(btn);
            });
        }

        function setTheme(themeId) {
            currentTheme = themeId;
            app.dataset.theme = themeId;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === themeId);
            });
            try { localStorage.setItem('planner-theme', themeId); } catch(_) {}
            showToast('Тема: ' + themes.find(t => t.id === themeId)?.label);
        }

        function loadTheme() {
            try {
                const saved = localStorage.getItem('planner-theme');
                if (saved && themes.some(t => t.id === saved)) {
                    currentTheme = saved;
                }
            } catch(_) {}
            app.dataset.theme = currentTheme;
        }

        // ———— РЕНДЕР ЗАДАЧ ————
        function renderTasks(filter = 'all') {
            const filtered = filter === 'all' ? taskData : taskData.filter(t => t.tag.toLowerCase() === filter);
            taskList.innerHTML = '';
            filtered.forEach(task => {
                const item = document.createElement('div');
                item.className = 'task-item';

                const check = document.createElement('div');
                check.className = 'task-check' + (task.done ? ' done' : '');
                check.innerHTML = task.done ? '<i class="fas fa-check"></i>' : '';
                check.addEventListener('click', (e) => {
                    e.stopPropagation();
                    task.done = !task.done;
                    updateStats();
                    renderTasks(document.querySelector('.tag.active-tag')?.dataset?.tag || 'all');
                    showToast(task.done ? '✅ Задача выполнена!' : '↩️ Задача возвращена');
                });

                const content = document.createElement('div');
                content.className = 'task-content';
                content.innerHTML = `
                    <span class="task-name">${task.name}</span>
                    <span class="task-meta">
                        <span class="task-tag">${task.tag}</span>
                        ${task.time || ''}
                    </span>
                `;

                item.appendChild(check);
                item.appendChild(content);
                taskList.appendChild(item);
            });
            updateStats();
        }

        // ———— РЕНДЕР ЦЕЛЕЙ ————
        function renderGoals() {
            goalList.innerHTML = '';
            goals.forEach(g => {
                const pct = Math.round((g.done / g.total) * 100);
                const item = document.createElement('div');
                item.className = 'goal-item';
                item.innerHTML = `
                    <div class="goal-info">
                        <span class="goal-name">${g.name}</span>
                        <span class="goal-sub">${g.done} из ${g.total} задач выполнено</span>
                    </div>
                    <span class="goal-badge" style="color:var(--accent);">${pct}%</span>
                `;
                goalList.appendChild(item);
            });
        }

        // ———— РЕНДЕР КАЛЕНДАРЯ ————
        function renderCalendar() {
            const daysOfWeek = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            miniCalendar.innerHTML = '';
            daysOfWeek.forEach(d => {
                const el = document.createElement('span');
                el.className = 'day';
                el.textContent = d;
                miniCalendar.appendChild(el);
            });

            const startDay = 3;
            const daysInMonth = 31;
            const today = 30;

            for (let i = 1; i <= daysInMonth; i++) {
                const dayEl = document.createElement('span');
                dayEl.className = 'day';
                dayEl.textContent = i;

                const dayOfWeek = (startDay + i - 1) % 7;
                if (dayOfWeek === 5 || dayOfWeek === 6) {
                    dayEl.classList.add('weekend');
                }

                if (i % 3 === 0 || i === 15 || i === 22 || i === 30) {
                    dayEl.classList.add('has-task');
                }
                if (i === today) {
                    dayEl.classList.add('today');
                }
                miniCalendar.appendChild(dayEl);
            }
        }

        // ———— ОБНОВЛЕНИЕ СТАТИСТИКИ ————
        function updateStats() {
            doneCount = taskData.filter(t => t.done).length;
            const total = taskData.length;
            const remaining = total - doneCount;
            const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

            document.getElementById('progressText').textContent = `${doneCount} / ${total}`;
            document.getElementById('progressFill').style.width = `${pct}%`;
            document.getElementById('statPlanned').textContent = total;
            document.getElementById('statDone').textContent = doneCount;
            document.getElementById('statRemaining').textContent = remaining;

            // XP и стрик (демо)
            document.getElementById('xpDisplay').textContent = 18 + doneCount * 2;
            document.getElementById('streakDisplay').textContent = 5 + (doneCount > 2 ? 1 : 0);
        }

        // ———— ФИЛЬТРЫ ————
        function setupFilters() {
            document.querySelectorAll('.tag-group .tag').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tag-group .tag').forEach(b => b.classList.remove('active-tag'));
                    this.classList.add('active-tag');
                    const filter = this.dataset.tag;
                    renderTasks(filter);
                    showToast('Фильтр: ' + (filter === 'all' ? 'Все' : this.textContent));
                });
            });
        }

        // ———— КНОПКИ ДЕЙСТВИЙ ————
        function setupActions() {
            // Новая задача
            document.getElementById('btnAddTask').addEventListener('click', () => {
                const name = prompt('Название задачи:');
                if (name && name.trim()) {
                    const tag = prompt('Категория (Работа/Личное/Здоровье/Обучение):') || 'Другое';
                    taskData.push({
                        id: Date.now(),
                        name: name.trim(),
                        tag: tag,
                        time: new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'}),
                        done: false
                    });
                    renderTasks(document.querySelector('.tag.active-tag')?.dataset?.tag || 'all');
                    showToast('➕ Задача добавлена!');
                }
            });

            // Все готово
            document.getElementById('btnCompleteAll').addEventListener('click', () => {
                if (taskData.every(t => t.done)) {
                    showToast('🎉 Все уже выполнено!');
                    return;
                }
                if (confirm('Отметить все задачи как выполненные?')) {
                    taskData.forEach(t => t.done = true);
                    renderTasks(document.querySelector('.tag.active-tag')?.dataset?.tag || 'all');
                    showToast('✅ Все задачи выполнены!');
                }
            });

            // Сброс
            document.getElementById('btnResetStats').addEventListener('click', () => {
                if (confirm('Сбросить все задачи и статистику?')) {
                    taskData = tasks.map(t => ({ ...t, done: false }));
                    renderTasks('all');
                    // сбросить активный фильтр
                    document.querySelectorAll('.tag-group .tag').forEach(b => b.classList.remove('active-tag'));
                    document.querySelector('[data-tag="all"]').classList.add('active-tag');
                    showToast('🔄 Статистика сброшена');
                }
            });
        }

        // ———— ИНИЦИАЛИЗАЦИЯ ————
        function init() {
            loadTheme();
            renderThemeButtons();
            renderTasks('all');
            renderGoals();
            renderCalendar();
            setupFilters();
            setupActions();

            // обновить активный фильтр
            document.querySelector('[data-tag="all"]').classList.add('active-tag');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>

</body>
</html>
