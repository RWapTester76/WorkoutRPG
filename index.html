<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>SkillQuest Pro — Personal Growth OS</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#f0f2f8;--text:#171827;--muted:#73768a;
  --primary:#6d5dfc;--primary2:#8f83ff;--success:#18b981;--warning:#f5a524;--danger:#ef5b6b;
  --border:rgba(25,25,45,.08);--shadow:0 14px 45px rgba(35,32,75,.09);--r:22px;--r2:15px;
  --nav:76px;--max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at 10% 0%,rgba(109,93,252,.10),transparent 28%),var(--bg);color:var(--text);
min-height:100vh;padding-bottom:calc(var(--nav) + 25px);line-height:1.45}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:var(--max);margin:auto;padding:18px 18px 0}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 10px 25px rgba(109,93,252,.28)}
.brand h1{font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px}
.top-actions{display:flex;gap:8px;align-items:center}.icon-btn,.avatar-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--text)}
.avatar-btn{overflow:hidden;font-weight:800}.avatar-btn img{width:100%;height:100%;object-fit:cover}
.page{display:none}.page.active{display:block;animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:rgba(255,255,255,.84);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.dark{--bg:#0e1018;--surface:#171a25;--surface2:#202432;--text:#f2f3f7;--muted:#9a9eb0;--border:rgba(255,255,255,.08);--shadow:0 18px 55px rgba(0,0,0,.28)}
.dark body{background:radial-gradient(circle at 10% 0%,rgba(109,93,252,.15),transparent 28%),var(--bg)}
.dark .card,.dark .icon-btn,.dark .avatar-btn{background:rgba(23,26,37,.88)}
.hero{position:relative;overflow:hidden;padding:26px;background:linear-gradient(135deg,#6253ee,#8e80ff);color:#fff;border:0}
.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-70px;top:-100px;background:rgba(255,255,255,.12)}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:1}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;opacity:.78;font-weight:800}.hero h2{font-size:32px;line-height:1.05;margin:6px 0}.hero p{opacity:.8}
.level-ring{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),rgba(255,255,255,.18) 0);position:relative}
.level-ring:before{content:"";position:absolute;inset:8px;background:#6d5dfc;border-radius:50%}.level-ring b{position:relative;font-size:24px}
.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.stat-value{font-size:28px;font-weight:850;margin-top:8px}.stat-sub{color:var(--muted);font-size:12px;margin-top:3px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:19px}.section-head p{color:var(--muted);font-size:13px}
.btn{min-height:40px;padding:0 15px;border-radius:13px;background:var(--primary);color:#fff;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.success{background:var(--success)}.btn.danger{background:var(--danger)}
.btn.sm{min-height:34px;padding:0 11px;font-size:12px;border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 11px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:750;border:1px solid var(--border)}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.progress{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:inherit}
.journal{padding:16px}.journal-head{display:flex;align-items:center;gap:10px}.journal-icon{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:21px}.journal h3{font-size:15px}.journal small{color:var(--muted)}.journal .xp{margin-left:auto;font-weight:850;font-size:13px}.journal .progress{margin-top:13px}
.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.task:last-child{border-bottom:0}.task-icon{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center}.task-main{min-width:0;flex:1}.task-title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{color:var(--muted);font-size:12px;margin-top:3px}.task-status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px}.done{background:rgba(24,185,129,.12);color:var(--success)}.pending{background:rgba(109,93,252,.11);color:var(--primary)}.missed{background:rgba(239,91,107,.12);color:var(--danger)}
.chart{height:240px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart-grid{stroke:var(--border);stroke-width:1}.chart-label{fill:var(--muted);font-size:10px}.chart-line{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-area{fill:url(#areaGrad);opacity:.25}.bar{fill:var(--primary);opacity:.82}.bar:hover{opacity:1}.donut-wrap{display:flex;align-items:center;gap:20px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--primary) 0 var(--done),var(--danger) var(--done) var(--total),var(--surface2) var(--total) 100%);display:grid;place-items:center}.donut:after{content:"";width:92px;height:92px;border-radius:50%;background:var(--surface);position:absolute}.donut-center{position:relative;z-index:1;text-align:center}.donut-center b{font-size:24px;display:block}.legend{display:grid;gap:10px;flex:1}.legend div{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--primary)}.dot.red{background:var(--danger)}.dot.gray{background:var(--surface2)}
.empty{text-align:center;padding:34px 15px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}
.list{display:grid;gap:10px}.goal{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.goal-top{display:flex;justify-content:space-between;gap:10px}.goal h3{font-size:15px}.goal p{font-size:12px;color:var(--muted);margin-top:4px}.goal .progress{margin-top:13px}.goal-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}
.table-wrap{overflow:auto}.mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table th,.mini-table td{padding:10px;border-bottom:1px solid var(--border);text-align:left}.mini-table th{color:var(--muted);font-size:11px;text-transform:uppercase}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.calendar-title{font-weight:800}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head{font-size:10px;color:var(--muted);text-align:center;padding:5px}.cal-cell{min-height:76px;border:1px solid var(--border);border-radius:12px;padding:7px;background:var(--surface2);cursor:pointer}.cal-cell.other{opacity:.35}.cal-cell.today{outline:2px solid var(--primary)}.cal-cell .day{font-weight:800;font-size:12px}.cal-dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}.cal-dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}.cal-dot.done{background:var(--success)}.cal-dot.missed{background:var(--danger)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:800}.input{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:11px 12px;outline:0}.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(109,93,252,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.58);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}.modal-bg.open{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal-head h2{font-size:19px}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:var(--nav);padding:8px max(10px,calc((100vw - var(--max))/2));background:rgba(255,255,255,.86);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:center;gap:5px}.dark .bottom-nav{background:rgba(17,20,29,.9)}.nav{width:100%;max-width:var(--max);display:flex;justify-content:space-around}.nav button{flex:1;max-width:130px;background:transparent;color:var(--muted);border-radius:14px;padding:7px 4px;font-size:11px;font-weight:750}.nav button b{display:block;font-size:19px;line-height:22px;margin-bottom:2px}.nav button.active{background:var(--primary-bg);color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translate(-50%,20px);opacity:0;z-index:100;padding:12px 16px;border-radius:14px;background:var(--text);color:var(--surface);font-size:13px;font-weight:750;transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.kpi{display:flex;align-items:center;gap:12px}.kpi-icon{width:43px;height:43px;border-radius:14px;background:var(--primary-bg);display:grid;place-items:center;font-size:20px}.kpi b{font-size:20px}.kpi span{display:block;color:var(--muted);font-size:11px}
.note{padding:15px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.note h3{font-size:14px}.note p{white-space:pre-wrap;color:var(--muted);font-size:12px;margin-top:6px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.settings-row:last-child{border-bottom:0}
@media(max-width:800px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.hero h2{font-size:27px}}
@media(max-width:560px){.app{padding:10px 12px 0}.topbar{height:60px}.brand-mark{width:38px;height:38px}.brand h1{font-size:16px}.card{padding:15px;border-radius:18px}.g4,.g3{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero-row{align-items:flex-start}.level-ring{width:82px;height:82px}.level-ring:before{inset:7px}.cal-cell{min-height:57px;padding:5px}.cal-dots{margin-top:7px}.cal-dot{width:6px;height:6px}.chart{height:210px}}
</style>

<style id="skillquest-compact-ui">
/* SkillQuest compact UI pass */
:root{
  --sq-density: .88;
  --sq-radius: 16px;
}
html,body{min-height:100%;overflow-x:hidden}
body{font-size:14px}
.app{min-height:100dvh}
main,.main,.content,.page-container{max-width:1280px}
.page{padding:14px 16px 92px;min-height:calc(100dvh - 76px)}
.page > .page-head,
.page > .section-head,
.page > .toolbar,
.page > header{
  margin-bottom:12px!important;
}
h1{font-size:clamp(22px,4vw,30px)!important;line-height:1.12}
h2{font-size:clamp(18px,3vw,23px)!important}
h3{font-size:16px!important}
.card,.panel,.stat-card,.journal-card,.goal-card,.note-card,.task-card,.weight-profile-card{
  border-radius:var(--sq-radius)!important;
}
.card,.panel,.stat-card{padding:14px!important}
.grid,.cards-grid,.stats-grid,.dashboard-grid{
  gap:10px!important;
}
.stats-grid,.dashboard-grid{
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr))!important;
}
.stat-card{min-height:88px!important}
.stat-card .value,.metric-value{font-size:22px!important}
button,.btn,.icon-btn,input,select,textarea{
  min-height:40px;
}
button,.btn{padding:8px 12px!important}
input,select{height:40px!important;padding:8px 11px!important}
textarea{min-height:110px!important}
.modal .modal-content,.modal-card,.dialog{
  max-height:min(88dvh,760px)!important;
  overflow:auto!important;
  padding:16px!important;
}
.modal-header,.dialog-header{position:sticky;top:-16px;z-index:3;padding-bottom:10px!important}
.table-wrap{max-height:48dvh;overflow:auto}
table th,table td{padding:8px 9px!important}
.calendar-grid{gap:4px!important}
.calendar-cell{min-height:72px!important;padding:6px!important}
.calendar-toolbar,.cal-view-tabs,.filters,.filter-bar{
  gap:6px!important;
  padding:6px!important;
}
.cal-view-tabs button,.filters button,.filter-bar button{min-height:36px!important;padding:6px 10px!important}
.chart-card,.chart-wrap{padding:10px!important}
.chart-wrap canvas{max-height:240px!important}
.notes-grid,.goals-grid,.journals-grid{gap:10px!important}
.note-card,.goal-card,.journal-card{padding:12px!important}
.note-card .excerpt,.goal-card .description{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.journal-card{min-height:110px!important}
.goal-card{min-height:125px!important}
.task-list{gap:6px!important}
.task-item,.task-card{padding:9px 11px!important}
.task-item .description{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.profile-grid{gap:10px!important}
.profile-card{padding:12px!important}
.avatar-xl{width:64px!important;height:64px!important}
.empty-state{padding:26px 14px!important}
.sqFabTask{width:52px!important;height:52px!important;right:16px!important;bottom:82px!important}
.bottom-nav{height:64px!important;padding:6px 8px calc(6px + env(safe-area-inset-bottom))!important}
.bottom-nav button{min-height:48px!important;padding:4px 5px!important}
.bottom-nav .label{font-size:10px!important}
@media (min-width:900px){
  .page{padding:18px 22px 30px}
  .stats-grid{grid-template-columns:repeat(4,1fr)!important}
  .dashboard-grid{grid-template-columns:repeat(12,1fr)!important}
  .dashboard-grid>.wide{grid-column:span 8}
  .dashboard-grid>.narrow{grid-column:span 4}
  .chart-wrap canvas{max-height:280px!important}
}
@media (max-width:600px){
  .page{padding:10px 10px 82px}
  .page > .page-head,.page > .section-head{margin-bottom:8px!important}
  .page-head,.section-head{gap:8px!important}
  .page-head .actions,.section-head .actions{width:auto}
  .stats-grid,.dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .stat-card{min-height:76px!important;padding:10px!important}

  .two-col,.split,.form-grid{grid-template-columns:1fr!important}

  .toolbar,.filters,.filter-bar{overflow:visible;flex-wrap:wrap!important}
  
  .toolbar>* ,.filters>* ,.filter-bar>*{flex:0 1 auto;min-width:0}
}
</style>

<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">⚡</div><div><h1>SkillQuest</h1><small>Personal Growth OS</small></div></div>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" title="Тема">☾</button>
    <button class="avatar-btn" id="avatarBtn" title="Аватар">Г</button>
  </div>
</header>

<section id="home" class="page active"></section>
<section id="analytics" class="page"></section>
<section id="calendar" class="page"></section>
<section id="journals" class="page"></section>
<section id="goals" class="page"></section>
<section id="notes" class="page"></section>
<section id="settings" class="page"></section>
</div>

<nav class="bottom-nav" aria-label="Основная навигация"><div class="nav">
  <button data-page="home" class="active"><b>⌂</b><span>Главная</span></button>
  <button data-page="analytics"><b>◔</b><span>Аналитика</span></button>
  <button data-page="calendar"><b>▦</b><span>Календарь</span></button>
  <button data-page="journals"><b>◉</b><span>Журналы</span></button>
  <button type="button" class="nav-more" id="navMore"><b>•••</b><span>Ещё</span></button>
</div></nav>

<div class="modal-bg" id="taskModal"><div class="modal">
  <div class="modal-head"><h2 id="taskModalTitle">Новая задача</h2><button class="icon-btn" data-close="taskModal">×</button></div>
  <form id="taskForm" class="form-grid">
    <div class="field full"><label>Название</label><input class="input" id="fTitle" required maxlength="100" placeholder="Например: тренировка"></div>
    <div class="field"><label>Журнал</label><select class="input" id="fJournal"></select></div>
    <div class="field"><label>Длительность, мин</label><input class="input" id="fDuration" type="number" min="1" max="1440" value="30"></div>
    <div class="field"><label>Начало</label><input class="input" id="fStart" type="date" required></div>
    <div class="field"><label>Окончание</label><input class="input" id="fEnd" type="date" required></div>
    <div class="field"><label>Время</label><input class="input" id="fTime" type="time"></div>
    <div class="field"><label>Цель</label><select class="input" id="fGoal"><option value="">Без цели</option></select></div>
    <div class="field full"><label>Дни недели (пусто = каждый день)</label><div class="chips" id="fDays"></div></div>
    <div class="field full"><label>Заметка</label><textarea class="input" id="fNote" rows="3" maxlength="500" placeholder="Необязательно"></textarea></div>
    <div class="field full" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn secondary" data-close="taskModal">Отмена</button><button class="btn" type="submit">Сохранить</button></div>
  </form>
</div></div>

<div class="modal-bg" id="noteModal"><div class="modal">
  <div class="modal-head"><h2>Новая заметка</h2><button class="icon-btn" data-close="noteModal">×</button></div>
  <form id="noteForm" class="form-grid">
    <div class="field full"><label>Текст</label><textarea class="input" id="nText" rows="7" required maxlength="5000" placeholder="Что сегодня важно?"></textarea></div>
    <div class="field full" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn secondary" data-close="noteModal">Отмена</button><button class="btn">Сохранить</button></div>
  </form>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- DATE UTILS: календарные даты без UTC-ловушек ---------- */
const Dates={
  pad:n=>String(n).padStart(2,"0"),
  localDate(d=new Date()){return `${d.getFullYear()}-${this.pad(d.getMonth()+1)}-${this.pad(d.getDate())}`},
  parse(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)},
  add(s,n){const d=this.parse(s);d.setDate(d.getDate()+n);return this.localDate(d)},
  diff(a,b){return Math.round((this.parse(b)-this.parse(a))/86400000)},
  same(a,b){return a===b},
  days(start,end,filter=[]){const out=[];let d=this.parse(start),e=this.parse(end);while(d<=e){const s=this.localDate(d);if(!filter.length||filter.includes(d.getDay()))out.push(s);d.setDate(d.getDate()+1)}return out},
  monthKey(s){return s.slice(0,7)},
  label(s,opts={day:"numeric",month:"short"}){return this.parse(s).toLocaleDateString("ru-RU",opts)}
};

const JOURNALS=[
  {name:"тело",icon:"💪"},{name:"питание",icon:"🍎"},{name:"дела",icon:"📋"},{name:"учеба",icon:"📚"},
  {name:"хобби",icon:"🎨"},{name:"путешествия",icon:"✈️"},{name:"долги",icon:"💰"},{name:"другое",icon:"📌"}
];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const Data={
  key:"skillquest_data",
  version:3,
  state:null,
  listeners:[],
  defaults(){
    return {version:this.version,profile:{name:"Герой",age:25,weight:70,height:175,avatar:null,totalExp:0,level:1,streak:0,lastActive:null},
      journals:JOURNALS.map(j=>({...j,exp:0})),tasks:[],goals:[],weightLog:[],notes:[],photos:[]};
  },
  load(){
    let raw=null;try{raw=JSON.parse(localStorage.getItem(this.key)||"null")}catch{}
    const base=this.defaults();
    if(raw&&typeof raw==="object"){
      this.state={...base,...raw,profile:{...base.profile,...raw.profile},
        journals:Array.isArray(raw.journals)?raw.journals:base.journals,tasks:Array.isArray(raw.tasks)?raw.tasks:[],
        goals:Array.isArray(raw.goals)?raw.goals:[],weightLog:Array.isArray(raw.weightLog)?raw.weightLog:[],
        notes:Array.isArray(raw.notes)?raw.notes:[],photos:Array.isArray(raw.photos)?raw.photos:[]};
    }else this.state=base;
    this.migrate();this.recalcLevel();this.notify();return this.state;
  },
  migrate(){
    this.state.version=this.version;
    this.state.journals=this.state.journals.map(j=>({...j,exp:Number(j.exp)||0}));
    this.state.tasks=this.state.tasks.map(t=>({...t,id:t.id||id(),title:t.title||"Без названия",journal:t.journal||"другое",
      duration:Number(t.duration)||1,startDate:t.startDate||t.date||Dates.localDate(),endDate:t.endDate||t.date||t.startDate||Dates.localDate(),
      daysOfWeek:Array.isArray(t.daysOfWeek)?t.daysOfWeek:[],completedDates:Array.isArray(t.completedDates)?[...new Set(t.completedDates)]:[],
      missedDates:Array.isArray(t.missedDates)?[...new Set(t.missedDates)]:[],note:t.note||"",time:t.time||"",goalId:t.goalId||null}));
  },
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.state));this.notify()}catch(e){Toast("Не удалось сохранить данные. Возможно, переполнено хранилище.","error")}},
  notify(){this.listeners.forEach(fn=>fn())},
  on(fn){this.listeners.push(fn)},
  get journals(){return this.state.journals},get tasks(){return this.state.tasks},get goals(){return this.state.goals},
  profile(){return this.state.profile},
  journal(name){return this.journals.find(j=>j.name===name)},
  occurrences(task){return Dates.days(task.startDate,task.endDate,task.daysOfWeek||[])},
  isScheduled(task,date){return this.occurrences(task).includes(date)},
  status(task,date){
    if(task.completedDates.includes(date))return"done";
    if(task.missedDates.includes(date))return"missed";
    if(date<Dates.localDate())return"missed";
    return"pending";
  },
  tasksForDate(date=Dates.localDate()){return this.tasks.filter(t=>this.isScheduled(t,date))},
  complete(taskId,date=Dates.localDate()){
    const t=this.tasks.find(x=>x.id===taskId);if(!t||!this.isScheduled(t,date))return false;
    if(date>Dates.localDate()){Toast("Будущую задачу выполнить нельзя","warning");return false}
    if(t.completedDates.includes(date))return false;
    const late=date<Dates.localDate(),mult=late?.25:1;
    const journal=this.journal(t.journal);if(journal)journal.exp+=t.duration*.01*mult;
    this.state.profile.totalExp+=t.duration*.005*mult;
    t.completedDates.push(date);t.missedDates=t.missedDates.filter(x=>x!==date);
    this.updateStreak(date);this.checkGoals();this.recalcLevel();this.save();
    Toast(`Задача выполнена · +${(t.duration*.005*mult).toFixed(2)} XP`,late?"warning":"success");return true;
  },
  updateStreak(date){
    const p=this.state.profile,last=p.lastActive;
    if(last===date)return;
    if(last===Dates.add(date,-1))p.streak=(p.streak||0)+1;else p.streak=1;
    p.lastActive=date;
  },
  autoMiss(){
    const today=Dates.localDate();let changed=false;
    this.tasks.forEach(t=>this.occurrences(t).forEach(d=>{if(d<today&&!t.completedDates.includes(d)&&!t.missedDates.includes(d)){t.missedDates.push(d);changed=true}}));
    if(changed)this.save();
  },
  recalcLevel(){let xp=Math.max(0,Number(this.state.profile.totalExp)||0),level=1,need=100;while(xp>=need){level++;need=level*100}this.state.profile.level=level;return{level,xp,need}},
  checkGoals(){
    this.goals.forEach(g=>{
      if(g.achieved)return;
      const tasks=this.tasks.filter(t=>t.goalId===g.id);if(!tasks.length)return;
      const required=tasks.flatMap(t=>this.occurrences(t));const unique=[...new Set(required)];
      if(unique.length&&unique.every(d=>tasks.some(t=>t.completedDates.includes(d)))){
        g.achieved=true;g.achievedAt=new Date().toISOString();this.state.profile.totalExp+=.05;this.recalcLevel();Toast(`🎉 Цель «${g.title}» достигнута!`,"success");
      }
    });
  },
  addTask(payload){const t={...payload,id:id(),completedDates:[],missedDates:[],createdAt:new Date().toISOString()};this.tasks.push(t);this.save();return t},
  updateTask(taskId,payload){const t=this.tasks.find(x=>x.id===taskId);if(!t)return;Object.assign(t,payload);this.save()},
  deleteTask(taskId){this.state.tasks=this.tasks.filter(t=>t.id!==taskId);this.save()},
  addGoal(title,desc){this.goals.push({id:id(),title,desc:desc||"",achieved:false,createdAt:new Date().toISOString()});this.save()},
  addNote(text){this.state.notes.push({id:id(),text,createdAt:new Date().toISOString()});this.save()},
  deleteNote(nid){this.state.notes=this.state.notes.filter(n=>n.id!==nid);this.save()},
  stats(){
    const all=this.tasks, done=all.reduce((n,t)=>n+t.completedDates.length,0),miss=all.reduce((n,t)=>n+t.missedDates.length,0);
    const scheduled=all.reduce((n,t)=>n+this.occurrences(t).length,0);
    return{tasks:all.length,done,miss,scheduled,rate:scheduled?Math.round(done/scheduled*100):0};
  },
  analytics(days=30){
    const end=Dates.localDate(), start=Dates.add(end,-(days-1));
    const labels=[],done=[],missed=[],xp=[];
    for(let i=0;i<days;i++){const d=Dates.add(start,i);labels.push(d);let dn=0,ms=0,x=0;
      this.tasks.forEach(t=>{if(this.isScheduled(t,d)){if(t.completedDates.includes(d)){dn++;x+=t.duration*.005}else if(t.missedDates.includes(d)||d<end)ms++}});
      done.push(dn);missed.push(ms);xp.push(x);
    }
    const journal=this.journals.map(j=>{let d=0,m=0,xp=0;this.tasks.filter(t=>t.journal===j.name).forEach(t=>{d+=t.completedDates.length;m+=t.missedDates.length;xp+=t.duration*.005*t.completedDates.length});return{...j,done:d,missed:m,xp}}).sort((a,b)=>b.xp-a.xp);
    return{labels,done,missed,xp,journal};
  }
};

  },
  notes(){
    const ns=Data.state.notes.slice().reverse();document.getElementById("notes").innerHTML=`<div class="section-head"><div><h2>Заметки</h2><p>Мысли, наблюдения и итоги</p></div><button class="btn" onclick="App.openNote()">+ Заметка</button></div><div class="list">${ns.length?ns.map(n=>`<div class="note"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${Dates.label(n.createdAt.slice(0,10),{day:"numeric",month:"long",year:"numeric"})}</h3><button class="btn danger sm" onclick="Data.deleteNote('${n.id}')">Удалить</button></div><p>${esc(n.text)}</p></div>`).join(""):`<div class="card empty"><strong>Пустая страница</strong>Добавь первую заметку.</div>`}</div>`;
  },
  settings(){
    const p=Data.profile();document.getElementById("settings").innerHTML=`<div class="section-head"><div><h2>Ещё</h2><p>Профиль, данные и внешний вид</p></div></div>
    <div class="grid g2"><div class="card"><h2 style="font-size:17px;margin-bottom:12px">Профиль</h2><div class="form-grid">
      <div class="field"><label>Имя</label><input class="input" id="pName" value="${esc(p.name)}"></div><div class="field"><label>Возраст</label><input class="input" id="pAge" type="number" value="${p.age||0}"></div>
      <div class="field"><label>Вес, кг</label><input class="input" id="pWeight" type="number" step=".1" value="${p.weight||0}"></div><div class="field"><label>Рост, см</label><input class="input" id="pHeight" type="number" value="${p.height||0}"></div>
      <div class="field full"><button class="btn" onclick="App.saveProfile()">Сохранить профиль</button></div></div></div>
      <div class="card"><h2 style="font-size:17px;margin-bottom:12px">Данные</h2><div class="settings-row"><span>Экспорт</span><button class="btn secondary sm" onclick="App.export()">Скачать JSON</button></div><div class="settings-row"><span>Импорт</span><button class="btn secondary sm" onclick="document.getElementById('importFile').click()">Загрузить JSON</button></div><input id="importFile" type="file" accept=".json" hidden onchange="App.import(this.files[0])"><div class="settings-row"><span>Тема</span><button class="btn secondary sm" onclick="App.toggleTheme()">Сменить</button></div><div class="settings-row"><span>Сброс</span><button class="btn danger sm" onclick="App.reset()">Удалить всё</button></div></div></div>`;
  },
  openTask(){
    this.fillFormLists();this.editingTask=null;document.getElementById("taskModalTitle").textContent="Новая задача";
    document.getElementById("taskForm").reset();const today=Dates.localDate();document.getElementById("fStart").value=today;document.getElementById("fEnd").value=today;
    document.querySelectorAll(".day-chip").forEach(c=>c.classList.remove("active"));this.open("taskModal");
  },
  saveTask(){
    const start=document.getElementById("fStart").value,end=document.getElementById("fEnd").value;if(!start||!end||end<start){Toast("Проверь даты","error");return}
    const days=[...document.querySelectorAll(".day-chip.active")].map(x=>Number(x.dataset.day));
    const payload={title:document.getElementById("fTitle").value.trim(),journal:document.getElementById("fJournal").value,duration:Number(document.getElementById("fDuration").value)||1,startDate:start,endDate:end,time:document.getElementById("fTime").value,goalId:document.getElementById("fGoal").value||null,daysOfWeek:days,note:document.getElementById("fNote").value.trim()};
    if(this.editingTask)Data.updateTask(this.editingTask,payload);else Data.addTask(payload);this.close("taskModal");Toast("Сохранено","success");this.render();
  },
  openNote(){document.getElementById("noteForm").reset();this.open("noteModal")},
  saveNote(){const text=document.getElementById("nText").value.trim();if(!text)return;Data.addNote(text);this.close("noteModal");Toast("Заметка сохранена","success")},
  addGoal(){const title=prompt("Название цели:");if(!title?.trim())return;const desc=prompt("Короткое описание (необязательно):")||"";Data.addGoal(title.trim(),desc);Toast("Цель создана","success")},
  saveProfile(){const p=Data.profile();p.name=document.getElementById("pName").value.trim()||"Герой";p.age=Number(document.getElementById("pAge").value)||0;p.weight=Number(document.getElementById("pWeight").value)||0;p.height=Number(document.getElementById("pHeight").value)||0;Data.save();Toast("Профиль сохранён","success")},
  toggleTheme(){document.documentElement.classList.toggle("dark");localStorage.setItem("skillquest_dark",document.documentElement.classList.contains("dark")?"1":"0");this.render()},
  avatar(){const input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{Data.profile().avatar=r.result;Data.save();Toast("Аватар обновлён","success")};r.readAsDataURL(f)};input.click()},
  export(){const blob=new Blob([JSON.stringify(Data.state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`skillquest-backup-${Dates.localDate()}.json`;a.click();URL.revokeObjectURL(a.href)},
  import(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=="object"||!Array.isArray(obj.tasks)||!Array.isArray(obj.journals))throw 0;localStorage.setItem(Data.key,JSON.stringify(obj));Data.load();Toast("Данные импортированы","success")}catch{Toast("Файл не похож на резервную копию SkillQuest","error")}};r.readAsText(file)},
  reset(){if(!confirm("Удалить все данные SkillQuest? Это действие нельзя отменить."))return;localStorage.removeItem(Data.key);location.reload()},
  open(id){document.getElementById(id).classList.add("open")},close(id){document.getElementById(id).classList.remove("open")}
};

(function boot(){
  if(localStorage.getItem("skillquest_dark")==="1")document.documentElement.classList.add("dark");
  document.getElementById("avatarBtn").textContent=(Data.profile().name||"Г").charAt(0).toUpperCase();
  App.init();
})();
</script>

<script>
"use strict";

/* SkillQuest Pro enhancement layer.
   Keeps the original data model and UI, while adding migration-safe fields,
   editing/deletion, weight journal, filters, calendar journal filtering,
   richer analytics, goals, notes search, and defensive import/export. */

const SQ = {
  today(){return Dates.localDate()},
  uniq(a){return [...new Set(a||[])]},
  clamp(n,a,b){return Math.max(a,Math.min(b,n))},
  daysFor(t){return Data.occurrences(t)},
  scheduledCount(t){return Data.occurrences(t).length},
  completedCount(t){return Data.uniq(t.completedDates).length},
  missedCount(t){return Data.uniq(t.missedDates).length},
  safeNum(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d},
  dateTimeNow(){return new Date().toISOString()},
  periodStart(period){
    const n={7:7,30:30,90:90}[period];
    return n?Dates.add(this.today(),-(n-1)):"0000-01-01";
  },
  periodDates(period){
    const end=this.today(), start=this.periodStart(period);
    return Dates.days(start,end);
  },
  isFuture(date){return date>this.today()},
  escapeAttr(s){return esc(String(s??"")).replace(/`/g,"&#096;")}
};

/* ---------- Migration / normalization ---------- */
const originalMigrate = Data.migrate.bind(Data);
Data.migrate = function(){
  originalMigrate();
  const s=this.state;
  s.version=this.version;
  s.profile={...this.defaults().profile,...(s.profile||{})};
  s.profile.totalExp=Math.max(0,SQ.safeNum(s.profile.totalExp));
  s.profile.streak=Math.max(0,Math.floor(SQ.safeNum(s.profile.streak)));
  s.profile.lastActive=s.profile.lastActive||null;
  s.journals=(Array.isArray(s.journals)?s.journals:[]).map(j=>({
    name:String(j.name||"другое"),icon:String(j.icon||"📌"),exp:Math.max(0,SQ.safeNum(j.exp))
  }));
  const known=new Set(s.journals.map(j=>j.name));
  if(!known.size){s.journals=JOURNALS.map(j=>({...j,exp:0}));}
  s.tasks=(Array.isArray(s.tasks)?s.tasks:[]).map(t=>({
    ...t,id:t.id||id(),title:String(t.title||"Без названия"),
    journal:String(t.journal||"другое"),duration:Math.max(1,SQ.safeNum(t.duration,1)),
    startDate:t.startDate||t.date||this.today(),endDate:t.endDate||t.date||t.startDate||this.today(),
    daysOfWeek:Array.isArray(t.daysOfWeek)?this.uniq(t.daysOfWeek.map(Number).filter(x=>x>=0&&x<=6)):[],
    completedDates:this.uniq(t.completedDates).filter(Boolean),
    missedDates:this.uniq(t.missedDates).filter(Boolean),
    note:String(t.note||""),time:String(t.time||""),goalId:t.goalId||null,
    createdAt:t.createdAt||SQ.dateTimeNow()
  }));
  s.goals=(Array.isArray(s.goals)?s.goals:[]).map(g=>({
    ...g,id:g.id||id(),title:String(g.title||"Цель"),desc:String(g.desc||""),
    deadline:g.deadline||"",rewardXP:Math.max(0,SQ.safeNum(g.rewardXP,.05)),
    achieved:Boolean(g.achieved),achievedAt:g.achievedAt||null
  }));
  s.notes=(Array.isArray(s.notes)?s.notes:[]).map(n=>({
    ...n,id:n.id||id(),text:String(n.text||""),createdAt:n.createdAt||SQ.dateTimeNow(),
    date:n.date||String(n.createdAt||SQ.dateTimeNow()).slice(0,10),journal:n.journal||""
  }));
  s.weightLog=(Array.isArray(s.weightLog)?s.weightLog:[]).map(w=>({
    id:w.id||id(),date:w.date||this.today(),weight:SQ.safeNum(w.weight,0),
    note:String(w.note||""),createdAt:w.createdAt||SQ.dateTimeNow()
  })).filter(w=>w.weight>0).sort((a,b)=>a.date.localeCompare(b.date));
  this.recalcLevel();
};
Data.load();

/* ---------- Corrected task / XP / streak logic ---------- */
Data.tasksForDate=function(date=SQ.today(),journal=""){
  return this.tasks.filter(t=>this.isScheduled(t,date)&&(!journal||t.journal===journal));
};
Data.status=function(task,date){
  if(task.completedDates.includes(date))return"done";
  if(task.missedDates.includes(date))return"missed";
  if(date>this.today())return"pending";
  return"missed";
};
Data.rebuildStreak=function(){
  const completed=new Set(this.tasks.flatMap(t=>t.completedDates).filter(d=>d<=this.today()));
  let streak=0,d=this.today();
  while(completed.has(d)){streak++;d=Dates.add(d,-1)}
  this.state.profile.streak=streak;
  this.state.profile.lastActive=streak?this.today():null;
  return streak;
};
Data.complete=function(taskId,date=SQ.today()){
  const t=this.tasks.find(x=>x.id===taskId);
  if(!t||!this.isScheduled(t,date))return false;
  if(date>this.today()){Toast("Будущую задачу выполнить нельзя","warning");return false}
  if(t.completedDates.includes(date))return false;
  const late=date<this.today(), mult=late?.25:1;
  const earned=t.duration*.005*mult;
  const j=this.journal(t.journal);
  if(j)j.exp=Math.max(0,j.exp+t.duration*.01*mult);
  this.state.profile.totalExp=Math.max(0,this.state.profile.totalExp+earned);
  t.completedDates=this.uniq([...t.completedDates,date]);
  t.missedDates=t.missedDates.filter(x=>x!==date);
  this.rebuildStreak();
  this.checkGoals();
  this.recalcLevel();
  this.save();
  Toast(`Задача выполнена · +${earned.toFixed(2)} XP`,late?"warning":"success");
  return true;
};
Data.uncomplete=function(taskId,date){
  const t=this.tasks.find(x=>x.id===taskId);if(!t)return false;
  if(!t.completedDates.includes(date))return false;
  const mult=date<SQ.today()?.25:1,earned=t.duration*.005*mult;
  t.completedDates=t.completedDates.filter(x=>x!==date);
  const j=this.journal(t.journal);if(j)j.exp=Math.max(0,j.exp-t.duration*.01*mult);
  this.state.profile.totalExp=Math.max(0,this.state.profile.totalExp-earned);
  this.rebuildStreak();this.checkGoals();this.recalcLevel();this.save();
  Toast("Выполнение отменено","info");return true;
};
Data.autoMiss=function(){
  const today=this.today();let changed=false;
  this.tasks.forEach(t=>this.occurrences(t).forEach(d=>{
    if(d<today&&!t.completedDates.includes(d)&&!t.missedDates.includes(d)){t.missedDates.push(d);changed=true}
  }));
  if(changed)this.save();
};
Data.checkGoals=function(){
  this.goals.forEach(g=>{
    if(g.achieved)return;
    const ts=this.tasks.filter(t=>t.goalId===g.id);
    const required=SQ.uniq(ts.flatMap(t=>this.occurrences(t)));
    const done=required.filter(d=>ts.some(t=>t.completedDates.includes(d)));
    const eligible=required.length>0 && done.length===required.length;
    if(eligible){
      g.achieved=true;g.achievedAt=SQ.dateTimeNow();
      const reward=Math.max(0,SQ.safeNum(g.rewardXP,.05));
      this.state.profile.totalExp+=reward;
      this.recalcLevel();
      Toast(`🎉 Цель «${g.title}» достигнута · +${reward} XP`,"success");
    }
  });
};
Data.goalProgress=function(g){
  const ts=this.tasks.filter(t=>t.goalId===g.id);
  const required=SQ.uniq(ts.flatMap(t=>this.occurrences(t)));
  const done=required.filter(d=>ts.some(t=>t.completedDates.includes(d))).length;
  return {tasks:ts,required:required.length,done,rate:required.length?Math.round(done/required.length*100):0};
};
Data.recalcLevel=function(){
  let xp=Math.max(0,SQ.safeNum(this.state.profile.totalExp)),level=1;
  while(xp>=level*100){xp-=level*100;level++}
  this.state.profile.level=level;
  return {level,xp,total:SQ.safeNum(this.state.profile.totalExp),need:level*100};
};
Data.stats=function(){
  const all=this.tasks, done=all.reduce((n,t)=>n+SQ.completedCount(t),0),
    miss=all.reduce((n,t)=>n+SQ.missedCount(t),0),
    scheduled=all.reduce((n,t)=>n+this.occurrences(t).length,0);
  return {tasks:all.length,done,miss,scheduled,rate:scheduled?Math.round(done/scheduled*100):0};
};

/* ---------- Weight journal ---------- */
Data.addWeight=function(weight,date,note=""){
  weight=SQ.safeNum(weight);date=date||SQ.today();
  if(weight<=0||!date||date>SQ.today()){Toast("Укажи корректный вес и дату","error");return false}
  const existing=this.state.weightLog.find(w=>w.date===date);
  if(existing){existing.weight=weight;existing.note=note||""}
  else this.state.weightLog.push({id:id(),date,weight,note,createdAt:SQ.dateTimeNow()});
  this.state.weightLog.sort((a,b)=>a.date.localeCompare(b.date));
  this.state.profile.weight=weight;this.save();Toast("Измерение сохранено","success");return true;
};
Data.updateWeight=function(wid,weight,date,note=""){
  const w=this.state.weightLog.find(x=>x.id===wid);if(!w)return false;
  weight=SQ.safeNum(weight);if(weight<=0||date>SQ.today())return false;
  w.weight=weight;w.date=date;w.note=note;this.state.weightLog.sort((a,b)=>a.date.localeCompare(b.date));
  this.state.profile.weight=weight;this.save();return true;
};
Data.deleteWeight=function(wid){
  const before=this.state.weightLog.length;
  this.state.weightLog=this.state.weightLog.filter(w=>w.id!==wid);
  if(before!==this.state.weightLog.length){
    const last=this.state.weightLog[this.state.weightLog.length-1];
    if(last)this.state.profile.weight=last.weight;
    this.save();Toast("Измерение удалено","success");
  }
};
Data.weightStats=function(period="all"){
  const start=SQ.periodStart(period==="all"?null:Number(period));
  const rows=this.state.weightLog.filter(w=>w.date>=start&&w.date<=SQ.today()).sort((a,b)=>a.date.localeCompare(b.date));
  const all=this.state.weightLog.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const last=rows.at(-1)||null,prev=rows.at(-2)||null;
  return {rows,last,prev,change:last&&prev?last.weight-prev.weight:null,
    min:rows.length?Math.min(...rows.map(w=>w.weight)):null,
    max:rows.length?Math.max(...rows.map(w=>w.weight)):null,
    avg:rows.length?rows.reduce((s,w)=>s+w.weight,0)/rows.length:null,all};
};

/* ---------- Notes / goals CRUD ---------- */
Data.updateNote=function(nid,text,date,journal){
  const n=this.state.notes.find(x=>x.id===nid);if(!n)return;
  n.text=text.trim();n.date=date||n.date||SQ.today();n.journal=journal||"";
  this.save();Toast("Заметка обновлена","success");
};
Data.addNote=function(text,date=SQ.today(),journal=""){
  this.state.notes.push({id:id(),text:text.trim(),date,journal,createdAt:SQ.dateTimeNow()});this.save();
};
Data.updateGoal=function(gid,payload){const g=this.goals.find(x=>x.id===gid);if(!g)return;Object.assign(g,payload);this.save()};
Data.deleteGoal=function(gid){
  this.state.tasks.forEach(t=>{if(t.goalId===gid)t.goalId=null});
  this.state.goals=this.goals.filter(g=>g.id!==gid);this.save();Toast("Цель удалена","success");
};

/* ---------- Improved charts ---------- */
function sqLineChart(values,labels,{color="var(--primary)",height=220,unit=""}={}){
  const W=760,H=height,padL=42,padR=12,padT=16,padB=30,max=Math.max(...values,1),min=Math.min(...values,0),range=max-min||1;
  const x=i=>padL+(values.length===1?(W-padL-padR)/2:i*(W-padL-padR)/(values.length-1));
  const y=v=>H-padB-(v-min)/range*(H-padT-padB);
  const points=values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const step=Math.max(1,Math.ceil(labels.length/6));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${[0,.25,.5,.75,1].map(v=>`<line class="chart-grid" x1="${padL}" x2="${W-padR}" y1="${H-padB-v*(H-padT-padB)}" y2="${H-padB-v*(H-padT-padB)}"/>`).join("")}
    <polyline class="chart-line" style="stroke:${color}" points="${points}"/>
    ${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${values.length<15?4:2.7}" fill="${color}"><title>${esc(labels[i])}: ${v}${unit}</title></circle>`).join("")}
    ${labels.map((d,i)=>i%step===0?`<text class="chart-label" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(Dates.label(d,{day:"numeric",month:"short"}))}</text>`:"").join("")}
  </svg></div>`;
}
function sqBars(values,labels){
  const W=760,H=220,pad=28,max=Math.max(...values,1),bw=Math.max(3,(W-pad*2)/Math.max(values.length,1)*.62);
  const step=Math.max(1,Math.ceil(labels.length/7));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
  ${values.map((v,i)=>{const x=pad+i*(W-pad*2)/values.length,y=H-pad-v/max*(H-pad*2);return `<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${H-pad-y}" rx="3"><title>${esc(labels[i])}: ${v} XP</title></rect>`}).join("")}
  ${labels.map((d,i)=>i%step===0?`<text class="chart-label" x="${pad+i*(W-pad*2)/values.length}" y="${H-6}" text-anchor="middle">${esc(Dates.label(d,{day:"numeric",month:"short"}))}</text>`:"").join("")}
  </svg></div>`;
}

/* ---------- App overrides ---------- */
App.page=App.page||"home";
App.analyticsPeriod=30;App.weightPeriod="30";App.calendarJournal="";App.taskFilters={status:"all",journal:"",goal:"",search:""};

App.render=function(){this.renderPage();this.fillFormLists();this.bindDynamic()};
App.renderPage=function(){
  const fn={home:this.home,analytics:this.analytics,calendar:this.calendar,journals:this.journals,goals:this.goals,notes:this.notes,settings:this.settings,weight:this.weight}[this.page];
  if(fn)fn.call(this);
  this.bindDynamic();
};
App.bindDynamic=function(){
  document.querySelectorAll(".complete").forEach(b=>b.onclick=e=>{
    e.stopPropagation();Data.complete(b.dataset.id,b.dataset.date);
  });
  document.querySelectorAll(".undo-complete").forEach(b=>b.onclick=e=>{
    e.stopPropagation();Data.uncomplete(b.dataset.id,b.dataset.date);
  });
};
App.init=function(){
  this.render();
  Data.on(()=>this.renderPage());
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>this.go(b.dataset.page));
  document.getElementById("themeBtn").onclick=()=>this.toggleTheme();
  document.getElementById("avatarBtn").onclick=()=>this.avatar();
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>this.close(b.dataset.close));
  document.getElementById("taskForm").onsubmit=e=>{e.preventDefault();this.saveTask()};
  document.getElementById("noteForm").onsubmit=e=>{e.preventDefault();this.saveNote()};
  setInterval(()=>Data.autoMiss(),60000);Data.autoMiss();Data.rebuildStreak();this.render();
};
App.go=function(page){this.page=page;document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===page));document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));this.renderPage()};
App.fillFormLists=function(){
  const j=document.getElementById("fJournal");j.innerHTML=this.journalsOptions(Data.journals);
  const g=document.getElementById("fGoal");g.innerHTML='<option value="">Без цели</option>'+Data.goals.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join("");
  document.getElementById("fDays").innerHTML=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"].map((x,i)=>`<button type="button" class="chip day-chip" data-day="${i}">${x}</button>`).join("");
  document.querySelectorAll(".day-chip").forEach(c=>c.onclick=()=>c.classList.toggle("active"));
};
App.taskHTML=function(t,date){
  const st=Data.status(t,date),j=Data.journal(t.journal)||{icon:"📌"};
  const edit=`<button class="btn secondary sm" onclick="App.editTask('${esc(t.id)}')">Изм.</button>`;
  const del=`<button class="btn danger sm" onclick="App.deleteTask('${esc(t.id)}')">Удал.</button>`;
  const action=st==="done"?`<button class="btn secondary sm undo-complete" data-id="${esc(t.id)}" data-date="${date}">Отменить</button>`:
    (date<=SQ.today()?`<button class="btn success sm complete" data-id="${esc(t.id)}" data-date="${date}">${st==="missed"?"Выполнить":"Выполнить"}</button>`:"");
  return `<div class="task"><div class="task-icon">${j.icon}</div><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(t.journal)} · ${t.duration} мин${t.time?" · "+esc(t.time):""}${t.goalId?" · 🎯":""}</div>${t.note?`<div class="subtle">${esc(t.note)}</div>`:""}</div><span class="task-status ${st}">${st==="done"?"Выполнено":st==="missed"?"Пропущено":"В плане"}</span><div class="task-actions">${action}${edit}${del}</div></div>`;
};
App.taskList=function(tasks,date){
  if(!tasks.length)return `<div class="empty"><strong>Ничего не найдено</strong>Измени фильтры или добавь задачу.</div>`;
  return tasks.map(t=>this.taskHTML(t,date)).join("");
};
App.home=function(){
  const s=Data.stats(),p=Data.profile(),lv=Data.recalcLevel(),prog=SQ.clamp(lv.xp/lv.need*100,0,100),today=Data.tasksForDate();
  document.getElementById("home").innerHTML=`<div class="card hero"><div class="hero-row"><div><div class="eyebrow">${Dates.label(SQ.today(),{weekday:"long",day:"numeric",month:"long"})}</div><h2>Привет, ${esc(p.name)} 👋</h2><p>Сегодня главное — сделать следующий маленький шаг.</p></div><div class="level-ring" style="--p:${prog}%"><b>${lv.level}</b></div></div><div style="margin-top:20px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Прогресс уровня</span><b>${Math.floor(lv.xp)} / ${lv.need} XP</b></div><div class="progress" style="background:rgba(255,255,255,.18)"><i style="width:${prog}%;background:#fff"></i></div></div></div>
  <div class="metric-grid" style="margin-top:16px"><div class="metric"><span>Уровень</span><b>${lv.level}</b></div><div class="metric"><span>XP</span><b>${Math.floor(p.totalExp)}</b></div><div class="metric"><span>Streak</span><b>🔥 ${p.streak}</b></div><div class="metric"><span>Всего задач</span><b>${s.tasks}</b></div><div class="metric"><span>Выполнено</span><b>${s.done}</b></div><div class="metric"><span>Процент</span><b>${s.rate}%</b></div></div>
  <div class="section-head"><div><h2>Сегодня</h2><p>${today.length?today.length+" задач в плане":"План на сегодня свободен"}</p></div><button class="btn" onclick="App.openTask()">+ Задача</button></div><div class="card">${this.taskList(today,SQ.today())}</div>
  <div class="section-head"><div><h2>Быстрый обзор</h2><p>Текущая динамика</p></div><button class="btn secondary sm" onclick="App.go('analytics')">Открыть аналитику</button></div>
  <div class="grid g2"><div class="card"><h2 style="font-size:16px">Вес</h2>${this.weightMini()}</div><div class="card"><h2 style="font-size:16px">Цели</h2>${Data.goals.length?Data.goals.slice(0,3).map(g=>{const x=Data.goalProgress(g);return `<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${g.achieved?"🏆":"🎯"} ${esc(g.title)}</b><span>${x.rate}%</span></div><div class="progress" style="margin-top:6px"><i style="width:${x.rate}%"></i></div></div>`}).join(""):`<div class="empty" style="padding:18px">Целей пока нет</div>`}</div></div>`;
  this.bindDynamic();
};
App.weightMini=function(){
  const w=Data.weightStats("30"),l=w.last;return `<div class="weight-kpis" style="margin-top:12px"><div class="weight-kpi"><span>Последний</span><b>${l?l.weight.toFixed(1)+" кг":"—"}</b></div><div class="weight-kpi"><span>Изменение</span><b>${w.change==null?"—":(w.change>0?"+":"")+w.change.toFixed(1)}</b></div></div><button class="btn secondary sm" style="margin-top:12px" onclick="App.go('weight')">Журнал веса</button>`;
};

/* ---------- Analytics ---------- */
App.analytics=function(){
  const period=this.analyticsPeriod,a=Data.analytics(period),s=Data.stats(),p=Data.profile(),lv=Data.recalcLevel();
  const xpPeriod=a.xp.reduce((x,y)=>x+y,0);
  document.getElementById("analytics").innerHTML=`<div class="section-head"><div><h2>Аналитика</h2><p>Данные SkillQuest за выбранный период</p></div><div class="toolbar"><div class="segmented">${[7,30,90].map(n=>`<button class="${period===n?"active":""}" onclick="App.setAnalyticsPeriod(${n})">${n}D</button>`).join("")}</div><button class="btn" onclick="App.openTask()">+ Задача</button></div></div>
  <div class="metric-grid"><div class="metric"><span>Уровень</span><b>${lv.level}</b></div><div class="metric"><span>Общий XP</span><b>${Math.floor(p.totalExp)}</b></div><div class="metric"><span>XP за период</span><b>${xpPeriod.toFixed(1)}</b></div><div class="metric"><span>Streak</span><b>🔥 ${p.streak}</b></div><div class="metric"><span>Задач</span><b>${s.tasks}</b></div><div class="metric"><span>Выполнение</span><b>${s.rate}%</b></div></div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><div class="section-head" style="margin-top:0"><div><h2>Активность</h2><p>Выполнено и пропущено</p></div></div>${this.activityChart(period)}</div><div class="card"><div class="section-head" style="margin-top:0"><div><h2>Выполненные / пропущенные</h2></div></div>${this.donutChart(s)}</div></div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><div class="section-head" style="margin-top:0"><div><h2>XP по дням</h2><p>За ${period} дней</p></div></div>${this.xpPeriodChart(period)}</div><div class="card"><div class="section-head" style="margin-top:0"><div><h2>Журналы</h2><p>Результативность</p></div></div>${this.journalBars(a.journal)}</div></div>
  <div class="card" style="margin-top:16px"><div class="section-head" style="margin-top:0"><div><h2>Динамика веса</h2><p>Реальные измерения пользователя</p></div><div class="segmented">${["7","30","90","all"].map(x=>`<button class="${this.weightPeriod===x?"active":""}" onclick="App.setWeightPeriod('${x}')">${x==="all"?"ALL":x+"D"}</button>`).join("")}</div></div>${this.weightChart(this.weightPeriod)}</div>
  <div class="section-head"><div><h2>Аналитика журналов</h2><p>Нажми «Открыть» для детальной статистики</p></div></div><div class="grid g2">${Data.journals.map(j=>{const x=this.journalAnalytics(j.name,period);return `<div class="card"><div class="journal-head"><div class="journal-icon">${j.icon}</div><div><h3>${esc(j.name)}</h3><small>${x.rate}% выполнения</small></div><div class="xp">${x.xp.toFixed(1)} XP</div></div><div class="progress" style="margin-top:12px"><i style="width:${x.rate}%"></i></div><div class="data-actions" style="margin-top:12px"><span class="subtle">${x.tasks} задач · ${x.done} выполнено · ${x.missed} пропущено</span><button class="btn secondary sm" onclick="App.openJournalAnalytics('${esc(j.name)}')">Открыть</button></div></div>`}).join("")}</div>`;
};
App.setAnalyticsPeriod=function(n){this.analyticsPeriod=n;this.renderPage()};
App.activityChart=function(period){
  const end=SQ.today(),start=Dates.add(end,-(period-1)),labels=[],done=[],miss=[];
  for(let i=0;i<period;i++){const d=Dates.add(start,i);labels.push(d);let a=0,b=0;Data.tasks.forEach(t=>{if(Data.isScheduled(t,d)){if(t.completedDates.includes(d))a++;else if(t.missedDates.includes(d)||d<end)b++}});done.push(a);miss.push(b)}
  const W=760,H=220,pad=36,max=Math.max(...done,...miss,1),step=Math.max(1,Math.ceil(period/7)),x=i=>pad+i*(W-pad*2)/(period-1),y=v=>H-30-v/max*(H-50);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${done.map((v,i)=>i%step===0?`<text class="chart-label" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(Dates.label(labels[i],{day:"numeric",month:"short"}))}</text>`:"").join("")}<polyline class="chart-line" points="${done.map((v,i)=>`${x(i)},${y(v)}`).join(" ")}"/><polyline class="chart-line" style="stroke:var(--danger);stroke-width:2" points="${miss.map((v,i)=>`${x(i)},${y(v)}`).join(" ")}"/>${done.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="var(--primary)"><title>${labels[i]}: ${v}</title></circle>`).join("")}</svg></div><div class="subtle">● выполнено &nbsp; <span style="color:var(--danger)">●</span> пропущено</div>`;
};
App.donutChart=function(s){
  const total=s.done+s.miss||1,rate=Math.round(s.done/total*100);
  return `<div class="donut-wrap"><div class="donut" style="--done:${s.done/total*100}%;--total:100%"><div class="donut-center"><b>${rate}%</b><span>успех</span></div></div><div class="legend"><div><span><i class="dot"></i>Выполнено</span><b>${s.done}</b></div><div><span><i class="dot red"></i>Пропущено</span><b>${s.miss}</b></div><div><span><i class="dot gray"></i>Запланировано</span><b>${s.scheduled}</b></div></div></div>`;
};
App.xpPeriodChart=function(period){
  const a=Data.analytics(period);return sqBars(a.xp,a.labels);
};
App.weightChart=function(period){
  const w=Data.weightStats(period),rows=w.rows;
  if(!rows.length)return `<div class="empty"><strong>Пока нет измерений</strong>Добавь первое значение веса, и график появится автоматически.</div>`;
  const values=rows.map(x=>x.weight),labels=rows.map(x=>x.date);
  return `<div class="weight-kpis"><div class="weight-kpi"><span>Последний</span><b>${w.last.weight.toFixed(1)} кг</b></div><div class="weight-kpi"><span>Изменение</span><b>${w.change==null?"—":(w.change>0?"+":"")+w.change.toFixed(1)} кг</b></div><div class="weight-kpi"><span>Минимум</span><b>${w.min.toFixed(1)} кг</b></div><div class="weight-kpi"><span>Максимум</span><b>${w.max.toFixed(1)} кг</b></div></div>${sqLineChart(values,labels,{unit:" кг"})}`;
};
App.setWeightPeriod=function(p){this.weightPeriod=p;this.renderPage()};
App.journalAnalytics=function(name,period){
  const start=Dates.add(SQ.today(),-(period-1)),tasks=Data.tasks.filter(t=>t.journal===name);
  let done=0,missed=0,xp=0;
  tasks.forEach(t=>{t.completedDates.forEach(d=>{if(d>=start&&d<=SQ.today()){done++;xp+=t.duration*.005}});t.missedDates.forEach(d=>{if(d>=start&&d<=SQ.today())missed++})});
  return {tasks:tasks.length,done,missed,xp,rate:done+missed?Math.round(done/(done+missed)*100):0};
};
App.openJournalAnalytics=function(name){
  const period=this.analyticsPeriod,x=this.journalAnalytics(name,period),a=Data.analytics(period),j=Data.journal(name)||{icon:"📌"};
  const activity=a.labels.map((d,i)=>{let n=0;Data.tasks.filter(t=>t.journal===name).forEach(t=>{if(t.completedDates.includes(d))n++});return n});
  document.getElementById("analytics").innerHTML=`<div class="section-head"><div><h2>${j.icon} ${esc(name)}</h2><p>Детальная аналитика за ${period} дней</p></div><button class="btn secondary" onclick="App.analytics()">← Назад</button></div><div class="metric-grid"><div class="metric"><span>Задач</span><b>${x.tasks}</b></div><div class="metric"><span>Выполнено</span><b>${x.done}</b></div><div class="metric"><span>Пропущено</span><b>${x.missed}</b></div><div class="metric"><span>Выполнение</span><b>${x.rate}%</b></div><div class="metric"><span>XP</span><b>${x.xp.toFixed(1)}</b></div><div class="metric"><span>Streak</span><b>🔥 ${this.journalStreak(name)}</b></div></div><div class="card" style="margin-top:16px"><h2 style="font-size:17px">Активность по дням</h2>${sqLineChart(activity,a.labels)}</div>`;
};
App.journalStreak=function(name){
  const set=new Set(Data.tasks.filter(t=>t.journal===name).flatMap(t=>t.completedDates).filter(d=>d<=SQ.today()));let n=0,d=SQ.today();while(set.has(d)){n++;d=Dates.add(d,-1)}return n;
};

/* ---------- Weight page ---------- */
App.weight=function(){
  const w=Data.weightStats(this.weightPeriod),rows=w.all.slice().reverse();
  document.getElementById("weight").innerHTML=`<div class="section-head"><div><h2>Журнал веса</h2><p>История измерений и динамика</p></div><button class="btn" onclick="App.openWeight()">+ Измерение</button></div>
  <div class="card"><div class="section-head" style="margin-top:0"><div><h2>Динамика веса</h2><p>График обновляется после каждого измерения</p></div><div class="segmented">${["7","30","90","all"].map(x=>`<button class="${this.weightPeriod===x?"active":""}" onclick="App.setWeightPeriod('${x}')">${x==="all"?"ALL":x+"D"}</button>`).join("")}</div></div>${this.weightChart(this.weightPeriod)}</div>
  <div class="section-head"><div><h2>История</h2><p>${rows.length} измерений</p></div></div><div class="card">${rows.length?`<div class="table-wrap"><table class="mini-table"><thead><tr><th>Дата</th><th>Вес</th><th>Изменение</th><th>Действия</th></tr></thead><tbody>${rows.map((r,i)=>{const newer=rows[i-1];const ch=newer?r.weight-newer.weight:null;return `<tr><td>${esc(Dates.label(r.date,{day:"numeric",month:"short",year:"numeric"}))}</td><td><b>${r.weight.toFixed(1)} кг</b></td><td>${ch==null?"—":(ch>0?"+":"")+ch.toFixed(1)+" кг"}</td><td><button class="btn secondary sm" onclick="App.editWeight('${r.id}')">Изм.</button> <button class="btn danger sm" onclick="App.removeWeight('${r.id}')">Удал.</button></td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty"><strong>Журнал веса пуст</strong>Добавь первое измерение.</div>`}</div>`;
};
App.openWeight=function(wid=null){
  const w=wid?Data.state.weightLog.find(x=>x.id===wid):null;
  const title=w?"Изменить измерение":"Новое измерение";
  document.getElementById("weightModalTitle").textContent=title;
  document.getElementById("wId").value=w?.id||"";
  document.getElementById("wValue").value=w?.weight??Data.profile().weight??"";
  document.getElementById("wDate").value=w?.date||SQ.today();
  document.getElementById("wNote").value=w?.note||"";
  this.open("weightModal");
};
App.editWeight=function(id){this.openWeight(id)};
App.removeWeight=function(id){if(confirm("Удалить это измерение?"))Data.deleteWeight(id)};
App.saveWeight=function(){
  const idv=document.getElementById("wId").value,weight=SQ.safeNum(document.getElementById("wValue").value),date=document.getElementById("wDate").value,note=document.getElementById("wNote").value.trim();
  if(weight<=0||!date||date>SQ.today()){Toast("Проверь значение веса и дату","error");return}
  if(idv)Data.updateWeight(idv,weight,date,note);else Data.addWeight(weight,date,note);
  this.close("weightModal");this.renderPage();
};

/* ---------- Calendar with journal filter + day statistics ---------- */
App.calendar=function(){
  const d=this.calMonth,year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate();
  let cells=[];for(let i=first-1;i>=0;i--)cells.push({day:prev-i,other:1,date:Dates.localDate(new Date(year,month-1,prev-i))});
  for(let x=1;x<=days;x++)cells.push({day:x,other:0,date:`${year}-${Dates.pad(month+1)}-${Dates.pad(x)}`});
  while(cells.length%7){const n=cells.length-days-first+1;cells.push({day:n,other:1,date:`${year}-${Dates.pad(month+2)}-${Dates.pad(n)}`})}
  const heads=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
  const filtered=dte=>Data.tasksForDate(dte,this.calendarJournal);
  const monthTasks=[...new Set(cells.filter(c=>!c.other).flatMap(c=>filtered(c.date).map(t=>t.id)))];
  const done=monthTasks.filter(idv=>{const t=Data.tasks.find(x=>x.id===idv);return t&&t.completedDates.some(x=>x.slice(0,7)===`${year}-${Dates.pad(month+1)}`)}).length;
  document.getElementById("calendar").innerHTML=`<div class="section-head"><div><h2>Календарь</h2><p>План, факт и пропуски</p></div><button class="btn" onclick="App.openTask()">+ Задача</button></div>
  <div class="card"><div class="toolbar" style="margin-bottom:12px"><label class="subtle">Фильтр журнала</label><select class="input" onchange="App.calendarJournal=this.value;App.calendar()"><option value="">Все журналы</option>${Data.journals.map(j=>`<option value="${esc(j.name)}" ${this.calendarJournal===j.name?"selected":""}>${j.icon} ${esc(j.name)}</option>`).join("")}</select></div>
  <div class="calendar-toolbar"><button class="btn secondary sm" onclick="App.calMove(-1)">←</button><div class="calendar-title">${d.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})}</div><div style="display:flex;gap:6px"><button class="btn secondary sm" onclick="App.calToday()">Сегодня</button><button class="btn secondary sm" onclick="App.calMove(1)">→</button></div></div>
  <div class="cal-grid">${heads.map(h=>`<div class="cal-head">${h}</div>`).join("")}${cells.map(c=>{const ts=filtered(c.date),isToday=c.date===SQ.today();return `<div class="cal-cell ${c.other?"other":""} ${isToday?"today":""}" onclick="App.day('${c.date}')"><div class="day">${c.day}</div><div class="cal-dots">${ts.slice(0,8).map(t=>`<i class="cal-dot ${Data.status(t,c.date)}" title="${esc(t.title)}"></i>`).join("")}</div></div>`}).join("")}</div>
  <div class="subtle" style="margin-top:12px">Задач в выбранном месяце: ${monthTasks.length} · выполнено: ${done}</div></div><div id="dayDetail"></div>`;
};
App.day=function(date){
  const ts=Data.tasksForDate(date,this.calendarJournal);
  document.getElementById("dayDetail").innerHTML=`<div class="section-head"><div><h2>${Dates.label(date,{weekday:"long",day:"numeric",month:"long"})}</h2><p>${ts.length} задач${this.calendarJournal?" · "+esc(this.calendarJournal):""}</p></div></div><div class="card">${this.taskList(ts,date)}</div>`;
  this.bindDynamic();
};

/* ---------- Task filters ---------- */
App.taskFiltersHTML=function(){
  const f=this.taskFilters;
  return `<div class="card" style="margin-bottom:14px"><div class="toolbar"><input class="input" placeholder="Поиск задач…" value="${esc(f.search)}" oninput="App.taskFilters.search=this.value;App.renderTaskFiltered()"><select class="input" onchange="App.taskFilters.status=this.value;App.renderTaskFiltered()"><option value="all" ${f.status==="all"?"selected":""}>Все</option><option value="done" ${f.status==="done"?"selected":""}>Выполненные</option><option value="pending" ${f.status==="pending"?"selected":""}>Невыполненные</option><option value="missed" ${f.status==="missed"?"selected":""}>Просроченные</option><option value="today" ${f.status==="today"?"selected":""}>Сегодня</option><option value="future" ${f.status==="future"?"selected":""}>Будущие</option></select><select class="input" onchange="App.taskFilters.journal=this.value;App.renderTaskFiltered()"><option value="">Все журналы</option>${Data.journals.map(j=>`<option value="${esc(j.name)}" ${f.journal===j.name?"selected":""}>${j.icon} ${esc(j.name)}</option>`).join("")}</select><select class="input" onchange="App.taskFilters.goal=this.value;App.renderTaskFiltered()"><option value="">Все цели</option>${Data.goals.map(g=>`<option value="${esc(g.id)}" ${f.goal===g.id?"selected":""}>🎯 ${esc(g.title)}</option>`).join("")}</select></div></div>`;
};
App.renderTaskFiltered=function(){
  const box=document.getElementById("taskFilterResults");if(!box)return;
  const f=this.taskFilters,today=SQ.today(),q=f.search.toLowerCase();
  let arr=Data.tasks.filter(t=>(!f.journal||t.journal===f.journal)&&(!f.goal||t.goalId===f.goal)&&(!q||t.title.toLowerCase().includes(q)||t.note.toLowerCase().includes(q)));
  arr=arr.filter(t=>{if(f.status==="today")return Data.isScheduled(t,today);if(f.status==="future")return Data.occurrences(t).some(d=>d>today);if(f.status==="done")return t.completedDates.length>0;if(f.status==="missed")return t.missedDates.length>0;if(f.status==="pending")return Data.occurrences(t).some(d=>d>=today&&!t.completedDates.includes(d));return true});
  arr.sort((a,b)=>a.startDate.localeCompare(b.startDate));
  box.innerHTML=this.taskList(arr,today);
  this.bindDynamic();
};

/* ---------- Profile / import-export hardening ---------- */
App.saveProfile=function(){
  const p=Data.profile();p.name=document.getElementById("pName").value.trim()||"Герой";p.age=Math.max(0,SQ.safeNum(document.getElementById("pAge").value));p.weight=Math.max(0,SQ.safeNum(document.getElementById("pWeight").value));p.height=Math.max(0,SQ.safeNum(document.getElementById("pHeight").value));

};
App.import=function(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{
    const obj=JSON.parse(r.result);if(!obj||typeof obj!=="object")throw new Error();
    const base=Data.defaults();
    const merged={...base,...obj,profile:{...base.profile,...(obj.profile||{})},
      journals:Array.isArray(obj.journals)?obj.journals:base.journals,tasks:Array.isArray(obj.tasks)?obj.tasks:[],
      goals:Array.isArray(obj.goals)?obj.goals:[],weightLog:Array.isArray(obj.weightLog)?obj.weightLog:[],
      notes:Array.isArray(obj.notes)?obj.notes:[],photos:Array.isArray(obj.photos)?obj.photos:[]};
    localStorage.setItem(Data.key,JSON.stringify(merged));Data.load();Data.save();Toast("Данные импортированы и мигрированы","success");
  }catch(e){Toast("Не удалось импортировать: повреждённый или неподдерживаемый JSON","error")}};
  r.readAsText(file);
};

  <div class="card"><h2 style="font-size:17px;margin-bottom:12px">Данные</h2><div class="settings-row"><span>Экспорт</span><button class="btn secondary sm" onclick="App.export()">Скачать JSON</button></div><div class="settings-row"><span>Импорт</span><button class="btn secondary sm" onclick="document.getElementById('importFile').click()">Загрузить JSON</button></div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="App.import(this.files[0])"><div class="settings-row"><span>Тема</span><button class="btn secondary sm" onclick="App.toggleTheme()">Сменить</button></div><div class="settings-row"><span>Версия данных</span><span class="subtle">${Data.state.version} · миграция включена</span></div><div class="settings-row"><span>Сброс</span><button class="btn danger sm" onclick="App.reset()">Удалить всё</button></div></div></div>`;
};
App.export=function(){

  a.href=URL.createObjectURL(blob);a.download=`skillquest-backup-${SQ.today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);Toast("Резервная копия создана","success");
};

<script id="sq-v3">
(function(){
"use strict";
const SCHEMES=[
  ["violet","Violet","#6d5dfc","#8f83ff"],["ocean","Ocean","#087ea4","#18b6d9"],
  ["forest","Forest","#16845a","#43b581"],["sunset","Sunset","#e15b35","#f39b4a"],
  ["rose","Rose","#c13b72","#ef75a8"],["midnight","Midnight","#4f8cff","#7c5cff"],["gold","Gold","#a96f00","#e0a92f"]
];
const JCOLORS={тело:"#22c55e",питание:"#f59e0b",дела:"#64748b",учеба:"#3b82f6",хобби:"#ec4899",путешествия:"#06b6d4",долги:"#eab308",другое:"#8b5cf6"};
const JOURNAL_DEFAULTS={тело:"#22c55e",питание:"#f59e0b",дела:"#64748b",учеба:"#3b82f6",хобби:"#ec4899",путешествия:"#06b6d4",долги:"#eab308",другое:"#8b5cf6"};
const jcolor=n=>(Data.journal(n)?.color||JCOLORS[n]||"#8b5cf6");
const oldMigrate=Data.migrate.bind(Data);
Data.migrate=function(){
  oldMigrate();
  this.state.journals=this.state.journals.map((j,i)=>({...j,color:j.color||JCOLORS[j.name]||["#22c55e","#f59e0b","#64748b","#3b82f6","#ec4899","#06b6d4","#eab308","#8b5cf6"][i%8]}));
  this.state.goals=this.state.goals.map(g=>({...g,photos:Array.isArray(g.photos)?g.photos:[]}));
};
Data.load();

function setScheme(name){
  const allowed=SCHEMES.map(x=>x[0]); if(!allowed.includes(name))name="violet";
  document.documentElement.dataset.scheme=name;
  localStorage.setItem("skillquest_scheme",name);
}
setScheme(localStorage.getItem("skillquest_scheme")||"violet");

App.calendarView=App.calendarView||"month";
App.goalJournalFilter=App.goalJournalFilter||"";
App.notesJournalFilter=App.notesJournalFilter||"";

App.journalCard=function(j){
  const max=Math.max(...Data.journals.map(x=>x.exp),1),pr=Math.min(100,j.exp/max*100),c=jcolor(j.name);
  const count=Data.tasks.filter(t=>t.journal===j.name).length;

App.addGoalPhoto=function(){

App.openGoalReader=function(gid){

const oldSaveGoal=App.saveGoal;
App.saveGoal=function(){
  const gid=document.getElementById("gId").value,title=document.getElementById("gTitle").value.trim(),desc=document.getElementById("gDesc").value.trim(),deadline=document.getElementById("gDeadline").value,reward=Math.max(0,SQ.safeNum(document.getElementById("gReward").value,1)),journal=document.getElementById("gJournal").value;
  if(!title){Toast("Введите название цели","error");return}

  else Data.goals.push({id:id(),title,desc,deadline,rewardXP:reward,journal,photos:[],achieved:false,achievedAt:null,createdAt:SQ.dateTimeNow()});

/* Calendar day/week/month/year */
App.calendar=function(){
  const d=this.calMonth,year=d.getFullYear(),month=d.getMonth();
  const heads=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
  const filter=dte=>Data.tasksForDate(dte,this.calendarJournal);
  const monthStart=`${year}-${Dates.pad(month+1)}-01`,monthEnd=`${year}-${Dates.pad(month+1)}-${Dates.pad(new Date(year,month+1,0).getDate())}`;
  const header=`<div class="section-head"><div><h2>Календарь</h2><p>День · неделя · месяц · год</p></div><button class="btn" onclick="App.openTask()">+ Задача</button></div>
  <div class="card"><div class="toolbar" style="justify-content:space-between"><div class="cal-view-tabs">${["day","week","month","year"].map(v=>`<button class="${this.calendarView===v?"active":""}" onclick="App.setCalendarView('${v}')">${v==="day"?"День":v==="week"?"Неделя":v==="month"?"Месяц":"Год"}</button>`).join("")}</div><select class="input" style="max-width:220px" onchange="App.calendarJournal=this.value;App.calendar()"><option value="">Все журналы</option>${Data.journals.map(j=>`<option value="${esc(j.name)}" ${this.calendarJournal===j.name?"selected":""}>${j.icon} ${esc(j.name)}</option>`).join("")}</select></div>
  <div class="calendar-toolbar" style="margin-top:12px"><button class="btn secondary sm" onclick="App.calMove(-1)">←</button><div class="calendar-title">${this.calendarTitle()}</div><div style="display:flex;gap:6px"><button class="btn secondary sm" onclick="App.calToday()">Сегодня</button><button class="btn secondary sm" onclick="App.calMove(1)">→</button></div></div></div>`;
  document.getElementById("calendar").innerHTML=header+this.calendarViewHTML();
};
App.calendarTitle=function(){
  const d=this.calMonth;
  if(this.calendarView==="year")return String(d.getFullYear());
  if(this.calendarView==="day")return Dates.label(this.calDate,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(this.calendarView==="week"){const start=this.weekStart(this.calDate);return `${Dates.label(start,{day:"numeric",month:"short"})} — ${Dates.label(Dates.add(start,6),{day:"numeric",month:"short",year:"numeric"})}`;}
  return d.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
};
App.weekStart=function(date){const d=Dates.parse(date),dow=d.getDay();return Dates.add(date,-dow)};
App.setCalendarView=function(v){this.calendarView=v;this.renderPage()};
App.calMove=function(n){
  if(this.calendarView==="day")this.calDate=Dates.add(this.calDate,n);
  else if(this.calendarView==="week")this.calDate=Dates.add(this.calDate,n*7);
  else if(this.calendarView==="year")this.calMonth.setFullYear(this.calMonth.getFullYear()+n);
  else this.calMonth.setMonth(this.calMonth.getMonth()+n);
  this.calendar();
};
App.calToday=function(){this.calDate=SQ.today();this.calMonth=new Date();this.calendar()};
App.calendarViewHTML=function(){
  if(this.calendarView==="day"){
    const ts=Data.tasksForDate(this.calDate,this.calendarJournal);
    return `<div class="card"><div class="cal-day-list">${this.taskList(ts,this.calDate)}</div></div>`;
  }
  if(this.calendarView==="week"){
    const start=this.weekStart(this.calDate);
    return `<div class="card"><div class="cal-week">${Array.from({length:7},(_,i)=>{const date=Dates.add(start,i),ts=Data.tasksForDate(date,this.calendarJournal);return `<div class="cal-week-day ${date===SQ.today()?"today":""}" onclick="App.day('${date}')"><b>${headsLabel(date)}</b>${ts.length?ts.map(t=>`<div class="cal-task-mini" style="--jcolor:${jcolor(t.journal)}">${(Data.journal(t.journal)||{}).icon||"📌"} ${esc(t.title)}</div>`).join(""):`<div class="subtle" style="margin-top:10px">Нет задач</div>`}</div>`}).join("")}</div></div>`;
  }
  if(this.calendarView==="year"){
    const y=this.calMonth.getFullYear();
    return `<div class="card"><div class="year-grid">${Array.from({length:12},(_,m)=>{const total=new Date(y,m+1,0).getDate();let active=0;for(let d=1;d<=total;d++){const date=`${y}-${Dates.pad(m+1)}-${Dates.pad(d)}`;if(Data.tasksForDate(date,this.calendarJournal).length)active++}return `<div class="year-month" onclick="App.openMonth(${y},${m})"><div class="year-month-head"><span>${new Date(y,m,1).toLocaleDateString("ru-RU",{month:"long"})}</span><span>${active}</span></div><div class="mini-month">${Array.from({length:total},(_,d)=>{const date=`${y}-${Dates.pad(m+1)}-${Dates.pad(d+1)}`;return `<i class="${Data.tasksForDate(date,this.calendarJournal).length?"has":""}"></i>`}).join("")}</div></div>`}).join("")}</div></div>`;
  }
  const y=this.calMonth.getFullYear(),m=this.calMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let cells=[];
  for(let i=first-1;i>=0;i--)cells.push({day:prev-i,other:1,date:Dates.localDate(new Date(y,m-1,prev-i))});
  for(let x=1;x<=days;x++)cells.push({day:x,other:0,date:`${y}-${Dates.pad(m+1)}-${Dates.pad(x)}`});
  while(cells.length%7){const n=cells.length-days-first+1;cells.push({day:n,other:1,date:`${y}-${Dates.pad(m+2)}-${Dates.pad(n)}`})}
  return `<div class="card"><div class="cal-grid">${heads.map(h=>`<div class="cal-head">${h}</div>`).join("")}${cells.map(c=>{const ts=Data.tasksForDate(c.date,this.calendarJournal),today=c.date===SQ.today();return `<div class="cal-cell ${c.other?"other":""} ${today?"today":""}" onclick="App.day('${c.date}')"><div class="day">${c.day}</div><div class="cal-dots">${ts.slice(0,8).map(t=>`<i class="cal-dot ${Data.status(t,c.date)}" style="background:${jcolor(t.journal)}" title="${esc(t.title)}"></i>`).join("")}</div></div>`}).join("")}</div><div id="dayDetail"></div></div>`;
};
function headsLabel(date){return Dates.label(date,{weekday:"short",day:"numeric",month:"short"})}
App.openMonth=function(y,m){this.calendarView="month";this.calMonth=new Date(y,m,1);this.calendar()};
App.day=function(date){this.calDate=date;const ts=Data.tasksForDate(date,this.calendarJournal);const detail=document.getElementById("dayDetail");if(detail)detail.innerHTML=`<div class="section-head"><div><h2>${Dates.label(date,{weekday:"long",day:"numeric",month:"long"})}</h2><p>${ts.length} задач${this.calendarJournal?" · "+esc(this.calendarJournal):""}</p></div></div><div class="card">${this.taskList(ts,date)}</div>`;this.bindDynamic()};
