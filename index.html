<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LVL UP · RPG Planner</title>
<style>
  /* === Сброс и базовые стили === */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  #app {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #16213e;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    background: #0f3460;
    border-bottom: 2px solid #e94560;
  }

  .logo {
    font-size: 1.8rem;
    color: #e94560;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(233,69,96,0.6);
  }

  .btn-icon {
    background: none;
    border: none;
    color: #e0e0e0;
    font-size: 1.8rem;
    cursor: pointer;
  }

  /* Навигация */
  .main-nav {
    background: #0f3460;
    border-bottom: 2px solid #e94560;
    padding: 0.5rem;
  }

  .main-nav.hidden {
    display: none;
  }

  .main-nav ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }

  .main-nav li {
    background: #16213e;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid transparent;
    font-size: 0.9rem;
  }

  .main-nav li:hover {
    border-color: #e94560;
    color: #e94560;
    box-shadow: 0 0 10px rgba(233,69,96,0.4);
  }

  /* Контент */
  #screenContainer {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
  }

  /* Экран профиля (пример) */
  .profile-card {
    background: #0f3460;
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1rem;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #e94560;
    margin: 0 auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
  }

  .xp-bar {
    background: #1a1a2e;
    height: 10px;
    border-radius: 5px;
    margin: 0.5rem 0;
    overflow: hidden;
  }

  .xp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e94560, #ff6b6b);
    border-radius: 5px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin: 1rem 0;
  }

  .stat-item {
    background: #16213e;
    padding: 0.8rem;
    border-radius: 10px;
    text-align: center;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: bold;
    color: #e94560;
  }

  .btn {
    background: #e94560;
    border: none;
    color: white;
    padding: 0.8rem 1.5rem;
    border-radius: 25px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    background: #c23152;
    box-shadow: 0 0 15px rgba(233,69,96,0.5);
  }

  .hidden {
    display: none;
  }

  /* Адаптив для телефона */
  @media (max-width: 480px) {
    .main-nav li {
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
    }
/* Экран квестов */
.quest-form-toggle {
  background: #e94560;
  border: none;
  color: white;
  padding: 0.7rem 1.2rem;
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
  width: 100%;
  margin-bottom: 1rem;
  transition: 0.3s;
}
.quest-form-toggle:hover {
  background: #c23152;
  box-shadow: 0 0 12px rgba(233,69,96,0.5);
}
.quest-form {
  background: #0f3460;
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  display: none;
}
.quest-form.active {
  display: block;
}
.quest-form input,
.quest-form select,
.quest-form textarea {
  width: 100%;
  margin-bottom: 0.8rem;
  padding: 0.7rem;
  border-radius: 10px;
  border: 1px solid #2a2a4a;
  background: #16213e;
  color: #e0e0e0;
  font-size: 1rem;
}
.quest-form label {
  display: block;
  margin-bottom: 0.3rem;
  font-weight: bold;
  color: #e94560;
}
.quest-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.quest-item {
  background: #0f3460;
  border-radius: 12px;
  padding: 1rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  border-left: 6px solid #e94560;
  transition: 0.3s;
}
.quest-item.completed {
  opacity: 0.5;
  border-left-color: #4ecca3;
  text-decoration: line-through;
}
.quest-info {
  flex: 1;
}
.quest-title {
  font-weight: bold;
  font-size: 1.1rem;
}
.quest-meta {
  font-size: 0.8rem;
  color: #a0a0b0;
}
.quest-actions button {
  background: #e94560;
  border: none;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}
.quest-actions button:disabled {
  background: #555;
  cursor: not-allowed;
}
.guild-badge {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: bold;
  text-transform: uppercase;
  margin-right: 0.5rem;
}
  }
</style>
</head>
<body>
  <div id="app">
    <!-- Шапка -->
    <header class="app-header">
      <h1 class="logo">⚔️ LVL UP</h1>
      <button id="menuToggle" class="btn-icon" aria-label="Меню">☰</button>
    </header>

    <!-- Навигация (боковая панель, скрыта по умолчанию) -->
    <nav id="mainNav" class="main-nav hidden">
      <ul>
        <li data-screen="profile">🧙 Профиль</li>
        <li data-screen="calendar">📅 Календарь</li>
        <li data-screen="tasks">📋 Квесты</li>
        <li data-screen="guilds">🛡️ Гильдии</li>
        <li data-screen="goals">🎯 Эпик-квесты</li>
        <li data-screen="notes">📝 Заметки</li>
        <li data-screen="gallery">🖼️ Галерея</li>
        <li data-screen="stats">📊 Статистика</li>
        <li data-screen="settings">⚙️ Настройки</li>
        <li data-screen="info">ℹ️ Инфо</li>
      </ul>
    </nav>

    <!-- Основной контент -->
    <main id="screenContainer">
      <!-- Контент экранов будет рендериться динамически -->
    </main>
  </div>

<script>
  // === Гильдии ===
  const GUILDS = [
    { id: 'body', name: 'Тело', icon: '💪', color: '#e94560' },
    { id: 'creativity', name: 'Творчество', icon: '🎨', color: '#f5a623' },
    { id: 'business', name: 'Бизнес', icon: '💼', color: '#4a90e2' },
    { id: 'habits', name: 'Привычки', icon: '🔄', color: '#7ed321' },
    { id: 'oneoff', name: 'Одноразки', icon: '🗑️', color: '#b8b8b8' },
    { id: 'travel', name: 'Путешествия', icon: '✈️', color: '#50e3c2' },
    { id: 'debts', name: 'Долги', icon: '💰', color: '#f8e71c' },
    { id: 'other', name: 'Другое', icon: '📦', color: '#9b9b9b' },
    { id: 'nutrition', name: 'Питание', icon: '🍎', color: '#f06292' }
  ];

  // === Хранилище ===
  const Storage = {
    get(key, defaultValue = null) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : defaultValue;
    },
    set(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
  };

  // === Игровое состояние ===
  const GameState = {
    player: {
      name: 'Александр',
      lvl: 1,
      xp: 0.5,
      streak: 0,
      lastCompletedDate: null, // 'YYYY-MM-DD'
      get xpToNext() {
        return this.lvl * (this.lvl + 1) / 2;
      },
      get progress() {
        const currentLvlTotal = (this.lvl - 1) * this.lvl / 2;
        const needed = this.xpToNext - currentLvlTotal;
        const currentXp = this.xp - currentLvlTotal;
        return Math.min((currentXp / needed) * 100, 100).toFixed(0);
      }
    },
    tasks: Storage.get('tasks', [])
  };

  // Сохраняем игрока и задачи
  function savePlayer() {
    Storage.set('player', GameState.player);
  }
  function saveTasks() {
    Storage.set('tasks', GameState.tasks);
  }

  // === Навигация ===
  const menuToggle = document.getElementById('menuToggle');
  const mainNav = document.getElementById('mainNav');
  const screenContainer = document.getElementById('screenContainer');

  menuToggle.addEventListener('click', () => {
    mainNav.classList.toggle('hidden');
  });

  document.querySelectorAll('.main-nav li').forEach(item => {
    item.addEventListener('click', (e) => {
      const screen = e.target.dataset.screen;
      renderScreen(screen);
      mainNav.classList.add('hidden');
    });
  });

  function renderScreen(screen) {
    switch (screen) {
      case 'profile': renderProfile(); break;
      case 'calendar': renderCalendar(); break;
      case 'tasks': renderTasks(); break;
      case 'guilds': renderGuilds(); break;
      case 'goals': renderGoals(); break;
      case 'notes': renderNotes(); break;
      case 'gallery': renderGallery(); break;
      case 'stats': renderStats(); break;
      case 'settings': renderSettings(); break;
      case 'info': renderInfo(); break;
      default: renderProfile();
    }
  }

  // === Профиль ===
  function renderProfile() {
    const p = GameState.player;
    const html = `
      <div class="profile-card">
        <div class="avatar">🧙</div>
        <h2>${p.name}</h2>
        <p>Уровень ${p.lvl} · ${p.xp.toFixed(1)} XP</p>
        <div class="xp-bar">
          <div class="xp-fill" style="width: ${p.progress}%;"></div>
        </div>
        <p style="font-size:0.8rem;">До следующего уровня: ${p.progress}%</p>
        <div class="stats-grid">
          <div class="stat-item"><span class="stat-value">${GameState.tasks.filter(t => t.completed).length}</span><br>Выполнено</div>
          <div class="stat-item"><span class="stat-value">${p.streak}</span><br>🔥 Комбо</div>
        </div>
      </div>
    `;
    screenContainer.innerHTML = html;
  }

  // === Квесты ===
  function renderTasks() {
    const activeTasks = GameState.tasks.filter(t => !t.completed).sort((a, b) => {
      if (a.date < b.date) return -1;
      if (a.date > b.date) return 1;
      return a.time.localeCompare(b.time);
    });

    const guildOptions = GUILDS.map(g => `<option value="${g.id}">${g.icon} ${g.name}</option>`).join('');

    let tasksHtml = activeTasks.length === 0 
      ? '<p style="text-align:center; margin-top:2rem;">Нет активных квестов. Создай первый!</p>'
      : activeTasks.map(task => {
          const guild = GUILDS.find(g => g.id === task.category) || GUILDS[7];
          const today = new Date().toISOString().slice(0, 10);
          const isFuture = task.date > today;
          const disableComplete = isFuture || task.completed;
          return `
            <div class="quest-item ${task.completed ? 'completed' : ''}" style="border-left-color: ${guild.color};">
              <div class="quest-info">
                <div class="quest-title">
                  <span class="guild-badge" style="background:${guild.color}; color:white;">${guild.icon} ${guild.name}</span>
                  ${task.title}
                </div>
                <div class="quest-meta">
                  📅 ${task.date} 🕒 ${task.time} · ⏱️ ${task.minutes} мин
                  ${task.note ? `<br>📝 ${task.note}` : ''}
                </div>
              </div>
              <div class="quest-actions">
                <button ${disableComplete ? 'disabled' : ''} 
                        onclick="completeQuest('${task.id}')">
                  ✔ Выполнить
                </button>
              </div>
            </div>
          `;
        }).join('');

    const html = `
      <button class="quest-form-toggle" onclick="toggleQuestForm()">➕ Новый квест</button>
      <div id="questForm" class="quest-form">
        <form onsubmit="addQuest(event)">
          <label>Гильдия</label>
          <select id="questCategory" required>${guildOptions}</select>
          <label>Название</label>
          <input type="text" id="questTitle" required placeholder="Что нужно сделать?">
          <label>Продолжительность (мин)</label>
          <input type="number" id="questMinutes" required min="1" value="30" placeholder="Минуты">
          <label>Дата</label>
          <input type="date" id="questDate" required>
          <label>Время</label>
          <input type="time" id="questTime" required>
          <label>Заметка (опционально)</label>
          <textarea id="questNote" rows="2" placeholder="Детали..."></textarea>
          <button type="submit" class="btn" style="width:100%;">Создать квест</button>
        </form>
      </div>
      <div class="quest-list">${tasksHtml}</div>
    `;
    screenContainer.innerHTML = html;

    // Установим дату по умолчанию = сегодня
    const dateInput = document.getElementById('questDate');
    if (dateInput) {
      dateInput.value = new Date().toISOString().slice(0, 10);
    }
    const timeInput = document.getElementById('questTime');
    if (timeInput) {
      timeInput.value = new Date().toTimeString().slice(0, 5);
    }
  }

  function toggleQuestForm() {
    const form = document.getElementById('questForm');
    if (form) form.classList.toggle('active');
  }

  function addQuest(event) {
    event.preventDefault();
    const category = document.getElementById('questCategory').value;
    const title = document.getElementById('questTitle').value.trim();
    const minutes = parseInt(document.getElementById('questMinutes').value, 10);
    const date = document.getElementById('questDate').value;
    const time = document.getElementById('questTime').value;
    const note = document.getElementById('questNote').value.trim();

    if (!title || !date || !time || isNaN(minutes) || minutes <= 0) return;

    const newQuest = {
      id: Date.now().toString(36) + Math.random().toString(36).substr(2),
      category,
      title,
      minutes,
      date,
      time,
      note,
      completed: false,
      dateCompleted: null,
      createdAt: new Date().toISOString()
    };

    GameState.tasks.push(newQuest);
    saveTasks();
    renderTasks(); // обновим список
  }

  function completeQuest(id) {
    const task = GameState.tasks.find(t => t.id === id);
    if (!task || task.completed) return;

    const today = new Date().toISOString().slice(0, 10);
    if (task.date > today) {
      alert('Этот квест запланирован на будущее, выполнить нельзя!');
      return;
    }

    task.completed = true;
    task.dateCompleted = today;

    // Начисляем XP = минуты * 0.01
    const gainedXp = task.minutes * 0.01;
    GameState.player.xp += gainedXp;
    checkLevelUp();

    // Обновляем стрик
    updateStreak(today);

    saveTasks();
    savePlayer();
    renderTasks();
  }

  function updateStreak(today) {
    const p = GameState.player;
    const lastDate = p.lastCompletedDate;

    if (lastDate === today) {
      // Уже была выполнена задача сегодня, стрик не меняем
      return;
    }

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().slice(0, 10);

    if (lastDate === yesterdayStr) {
      p.streak += 1;
    } else if (lastDate !== today) {
      p.streak = 1; // сброс или начало нового
    }

    p.lastCompletedDate = today;
    savePlayer();
  }

  function checkLevelUp() {
    const p = GameState.player;
    let neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2;
    while (p.xp >= neededForNext) {
      p.lvl++;
      neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2;
    }
    savePlayer();
  }

  function getGuildColor(categoryId) {
    const guild = GUILDS.find(g => g.id === categoryId);
    return guild ? guild.color : '#9b9b9b';
  }

  // === Остальные экраны-заглушки ===
  function renderCalendar() { screenContainer.innerHTML = '<h2>📅 Календарь</h2><p>В разработке.</p>'; }
  function renderGuilds() { 
    const guildList = GUILDS.map(g => `<p style="color:${g.color}">${g.icon} ${g.name}</p>`).join('');
    screenContainer.innerHTML = `<h2>🛡️ Гильдии</h2>${guildList}<p>Кастомизация позже.</p>`; 
  }
  function renderGoals() { screenContainer.innerHTML = '<h2>🎯 Эпик-квесты</h2><p>Цели с наградой +1 XP.</p>'; }
  function renderNotes() { screenContainer.innerHTML = '<h2>📝 Заметки</h2><p>Заметки (в разработке).</p>'; }
  function renderGallery() { screenContainer.innerHTML = '<h2>🖼️ Галерея</h2><p>Фото успехов.</p>'; }
  function renderStats() { screenContainer.innerHTML = '<h2>📊 Статистика</h2><p>Графики позже.</p>'; }
  function renderSettings() { screenContainer.innerHTML = '<h2>⚙️ Настройки</h2><p>Темы, экспорт/импорт.</p>'; }
  function renderInfo() { screenContainer.innerHTML = '<h2>ℹ️ Инфо</h2><p>Описание РПГ-системы.</p>'; }

  // === Инициализация ===
  const savedPlayer = Storage.get('player');
  if (savedPlayer) {
    GameState.player = { ...GameState.player, ...savedPlayer };
  }
  renderScreen('profile');
</script></body>
</html>
