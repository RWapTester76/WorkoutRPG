<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Планировщик</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ========================================
           БАЗОВЫЙ СБРОС
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #f0f2f5;
            transition: background 0.4s ease;
            padding: 16px;
        }

        /* ========================================
           КОНТЕЙНЕР
           ======================================== */
        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            border-radius: 32px;
            padding: 24px 28px 32px;
            transition: background 0.4s ease, box-shadow 0.4s ease;
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
        }

        /* ========================================
           ХЕДЕР
           ======================================== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 2px solid rgba(0,0,0,0.04);
        }

        .app-header h1 {
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 800;
            letter-spacing: -0.5px;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-header h1 i {
            font-size: clamp(20px, 3vw, 26px);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        /* ========================================
           ТЕМЫ
           ======================================== */
        .theme-picker {
            display: flex;
            gap: 6px;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(255,255,255,0.3);
            flex-shrink: 0;
        }

        .theme-btn:active {
            transform: scale(0.88);
        }

        .theme-btn.active {
            border-color: currentColor;
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .theme-btn .color-dots {
            display: flex;
            gap: 3px;
        }

        .theme-btn .color-dots span {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 4px;
        }

        .theme-btn .theme-label {
            display: none;
        }

        /* ========================================
           НАВИГАЦИЯ
           ======================================== */
        .main-nav {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.03);
            padding: 4px;
            border-radius: 14px;
        }

        .main-nav button {
            padding: 8px 18px;
            border-radius: 11px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            color: inherit;
            opacity: 0.5;
        }

        .main-nav button:active {
            transform: scale(0.92);
        }

        .main-nav button.active {
            background: var(--accent, #4a6fa5);
            color: #fff;
            opacity: 1;
            box-shadow: 0 4px 12px rgba(74,111,165,0.25);
        }

        /* ========================================
           СЕТКА — ВСЁ ПО ВЕРТИКАЛИ
           ======================================== */
        .main-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ========================================
           ВЕРХНИЙ БЛОК: СТАТИСТИКА + КАЛЕНДАРЬ
           ======================================== */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 24px;
        }

        @media (max-width: 820px) {
            .top-row {
                grid-template-columns: 1fr;
            }
        }

        /* ========================================
           КАРТОЧКИ
           ======================================== */
        .card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ========================================
           СТАТИСТИКА
           ======================================== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-block {
            background: rgba(255,255,255,0.3);
            border-radius: 16px;
            padding: 14px 16px;
            text-align: center;
        }

        .stat-number {
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 4px;
            font-weight: 500;
        }

        .progress-block {
            margin-top: 14px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 20px;
            background: currentColor;
            transition: width 0.6s ease;
        }

        /* ========================================
           КАЛЕНДАРЬ (полноценный)
           ======================================== */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-nav {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .calendar-nav button {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: inherit;
        }

        .calendar-nav button:active {
            transform: scale(0.88);
        }

        .calendar-nav button:hover {
            background: rgba(0,0,0,0.08);
        }

        .calendar-title {
            font-size: 18px;
            font-weight: 700;
            min-width: 140px;
            text-align: center;
        }

        .calendar-view-tabs {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.03);
            padding: 3px;
            border-radius: 10px;
        }

        .calendar-view-tabs button {
            padding: 4px 12px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: inherit;
            opacity: 0.4;
            transition: all 0.2s ease;
        }

        .calendar-view-tabs button:active {
            transform: scale(0.9);
        }

        .calendar-view-tabs button.active {
            background: var(--accent, #4a6fa5);
            color: #fff;
            opacity: 1;
        }

        /* Сетка календаря */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-grid .day-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.3;
            text-align: center;
            padding: 6px 0;
        }

        .calendar-day {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            gap: 2px;
            min-height: 44px;
        }

        .calendar-day:active {
            transform: scale(0.88);
        }

        .calendar-day.other-month {
            opacity: 0.2;
        }

        .calendar-day.today {
            border: 3px solid var(--accent, #4a6fa5);
            background: transparent;
        }

        .calendar-day.has-task {
            background: currentColor;
            color: #fff !important;
            opacity: 0.8;
        }

        .calendar-day.has-task .day-dot {
            background: #fff;
        }

        .calendar-day .day-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent, #4a6fa5);
            opacity: 0.6;
        }

        .calendar-day .day-number {
            line-height: 1;
        }

        /* ========================================
           ЗАДАЧИ
           ======================================== */
        .tasks-section {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .tasks-section {
                grid-template-columns: 1fr;
            }
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task-list::-webkit-scrollbar {
            width: 4px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }

        .task-item.completed {
            opacity: 0.5;
        }

        .task-item.completed .task-name {
            text-decoration: line-through;
        }

        .task-check {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 2px solid rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .task-check:active {
            transform: scale(0.8);
        }

        .task-check.done {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .task-check.done i {
            font-size: 12px;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-weight: 600;
            font-size: 15px;
            word-break: break-word;
        }

        .task-meta {
            font-size: 12px;
            opacity: 0.5;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: center;
            margin-top: 2px;
        }

        .task-tag {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(0,0,0,0.05);
        }

        .task-delete {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.15;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .task-delete:hover {
            opacity: 0.8;
            background: rgba(231,76,60,0.1);
        }

        .task-delete:active {
            transform: scale(0.8);
        }

        .empty-state {
            text-align: center;
            padding: 30px 16px;
            opacity: 0.3;
        }

        .empty-state i {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        /* ========================================
           ЦЕЛИ
           ======================================== */
        .goal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            gap: 12px;
        }

        .goal-item:last-child {
            border-bottom: none;
        }

        .goal-info {
            min-width: 0;
        }

        .goal-name {
            font-weight: 600;
            font-size: 15px;
        }

        .goal-sub {
            font-size: 13px;
            opacity: 0.4;
        }

        .goal-badge {
            font-size: 13px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 30px;
            background: rgba(0,0,0,0.04);
            white-space: nowrap;
        }

        /* ========================================
           ФИЛЬТРЫ И КНОПКИ
           ======================================== */
        .bottom-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 2px solid rgba(0,0,0,0.04);
        }

        .tag-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag-group .tag {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            color: inherit;
        }

        .tag-group .tag:active {
            transform: scale(0.9);
        }

        .tag-group .tag.active-tag {
            background: var(--accent);
            color: #fff;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 10px 22px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .action-btn.primary { background: var(--accent); }
        .action-btn.success { background: #2ecc71; }
        .action-btn.danger { background: #e74c3c; }
        .action-btn.warning { background: #f39c12; }

        /* ========================================
           МОДАЛКА
           ======================================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal-content {
            background: var(--surface, #fff);
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .modal-header h2 { font-size: 22px; font-weight: 700; margin:0; }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.3;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .modal-close:hover { opacity:1; background: rgba(0,0,0,0.04); }

        .task-form { display: flex; flex-direction: column; gap: 16px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }

        .form-group label { font-size: 14px; font-weight: 600; opacity: 0.7; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .form-input {
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid rgba(0,0,0,0.06);
            font-size: 14px;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.5);
            color: inherit;
            width: 100%;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(74,111,165,0.1);
        }

        .form-input.error { border-color: #e74c3c; }
        .error-text { color: #e74c3c; font-size: 12px; display:none; }

        .habit-presets {
            display: flex;
            gap: 8px;
            margin: 6px 0;
        }

        .preset-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid rgba(0,0,0,0.06);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .preset-btn:active { transform: scale(0.9); }
        .preset-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .toggle-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid rgba(0,0,0,0.06);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .toggle-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active { transform: scale(0.92); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: rgba(0,0,0,0.04); color: inherit; }

        /* ========================================
           TOAST
           ======================================== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e1e2a;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========================================
           ТЕМЫ — КАРДИНАЛЬНО РАЗНЫЕ
           ======================================== */

        /* 1. Океан (сине-бирюзовый) */
        [data-theme="ocean"] {
            --bg: #e8f4f8;
            --surface: #ffffff;
            --text: #0a2a3a;
            --accent: #0b7a9c;
            --accent-light: #b8e2ed;
            --border: rgba(10,42,58,0.06);
        }
        [data-theme="ocean"] .app-container { background: var(--surface); color: var(--text); }
        [data-theme="ocean"] .card { background: rgba(255,255,255,0.7); }
        [data-theme="ocean"] .calendar-day.has-task { background: #0b7a9c; }

        /* 2. Лаванда (фиолетово-розовый) */
        [data-theme="lavender"] {
            --bg: #f5edf9;
            --surface: #fcf8ff;
            --text: #2a1a3a;
            --accent: #8b5cf6;
            --accent-light: #ddd0f0;
            --border: rgba(42,26,58,0.06);
        }
        [data-theme="lavender"] .app-container { background: var(--surface); color: var(--text); }
        [data-theme="lavender"] .card { background: rgba(255,248,255,0.7); }
        [data-theme="lavender"] .calendar-day.has-task { background: #8b5cf6; }

        /* 3. Мятный (свежий зелёный) */
        [data-theme="mint"] {
            --bg: #e8f5ee;
            --surface: #f4fcf8;
            --text: #0a2a1e;
            --accent: #0b9e6a;
            --accent-light: #b8e8d4;
            --border: rgba(10,42,30,0.06);
        }
        [data-theme="mint"] .app-container { background: var(--surface); color: var(--text); }
        [data-theme="mint"] .card { background: rgba(240,255,248,0.7); }
        [data-theme="mint"] .calendar-day.has-task { background: #0b9e6a; }

        /* 4. Терракота (тёплый оранжево-красный) */
        [data-theme="terracotta"] {
            --bg: #f8efe8;
            --surface: #fdf8f2;
            --text: #3a1e0a;
            --accent: #c76b2e;
            --accent-light: #f0dac8;
            --border: rgba(58,30,10,0.06);
        }
        [data-theme="terracotta"] .app-container { background: var(--surface); color: var(--text); }
        [data-theme="terracotta"] .card { background: rgba(255,248,240,0.7); }
        [data-theme="terracotta"] .calendar-day.has-task { background: #c76b2e; }

        /* 5. Космос (тёмный фиолетово-синий) */
        [data-theme="cosmos"] {
            --bg: #0d0b1a;
            --surface: #14122b;
            --text: #e8e4f5;
            --accent: #7c5cfc;
            --accent-light: #2a1f4a;
            --border: rgba(255,255,255,0.05);
        }
        [data-theme="cosmos"] .app-container { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        [data-theme="cosmos"] .card { background: rgba(255,255,255,0.04); border-color: var(--border); }
        [data-theme="cosmos"] .task-item { background: rgba(255,255,255,0.04); }
        [data-theme="cosmos"] .task-check { border-color: rgba(255,255,255,0.15); }
        [data-theme="cosmos"] .stat-block { background: rgba(255,255,255,0.03); }
        [data-theme="cosmos"] .calendar-day.has-task { background: #7c5cfc; }
        [data-theme="cosmos"] .bottom-bar { border-color: var(--border); }
        [data-theme="cosmos"] .goal-item { border-color: var(--border); }
        [data-theme="cosmos"] .modal-content { background: #14122b; color: #e8e4f5; }
        [data-theme="cosmos"] .form-input { background: rgba(255,255,255,0.05); color: #e8e4f5; border-color: rgba(255,255,255,0.08); }

        /* 6. Вишня (насыщенный красный) */
        [data-theme="cherry"] {
            --bg: #f8ecec;
            --surface: #fdf5f5;
            --text: #3a1010;
            --accent: #c72828;
            --accent-light: #f0d0d0;
            --border: rgba(58,16,16,0.06);
        }
        [data-theme="cherry"] .app-container { background: var(--surface); color: var(--text); }
        [data-theme="cherry"] .card { background: rgba(255,245,245,0.7); }
        [data-theme="cherry"] .calendar-day.has-task { background: #c72828; }

        /* 7. Золотой (тёплый жёлто-оранжевый) */
        [data-theme="gold"] {
            --bg: #f8f2e0;
            --surface: #fdfaf0;
            --text: #3a2a0a;
            --accent: #c99c2e;
            --accent-light: #f0e4c0;
            --border: rgba(58,42,10,0.06);
        }
        [data-theme="gold"] .app-container { background: var(--surface); color: var(--text); }
        [data-theme="gold"] .card { background: rgba(255,248,235,0.7); }
        [data-theme="gold"] .calendar-day.has-task { background: #c99c2e; }

        /* ========================================
           ОБЩИЕ СТИЛИ
           ======================================== */
        .theme-btn {
            color: var(--text, #1e1e2a);
            background: var(--surface, #f0f0f5);
        }
        .theme-btn.active {
            border-color: var(--accent, #4a6fa5);
            color: var(--accent, #4a6fa5);
        }
        body { background: var(--bg, #f0f2f5); }

        /* ========================================
           АДАПТИВ
           ======================================== */
        @media (max-width: 600px) {
            .app-container { padding: 16px; border-radius: 20px; }
            .card { padding: 14px 16px; }
            .top-row { grid-template-columns: 1fr; }
            .tasks-section { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .app-header { flex-direction: column; align-items: stretch; }
            .header-controls { justify-content: space-between; }
            .main-nav button { padding: 6px 12px; font-size: 12px; }
            .calendar-day { font-size: 13px; min-height: 36px; }
            .action-buttons { flex: 1; }
            .action-btn { flex: 1; justify-content: center; padding: 8px 14px; font-size: 12px; }
            .modal-content { padding: 20px; }
            .calendar-view-tabs button { font-size: 10px; padding: 3px 8px; }
        }

        @media (max-width: 400px) {
            .app-container { padding: 10px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-block { padding: 10px; }
            .stat-number { font-size: 22px; }
        }

        @supports (padding: max(0px)) {
            .app-container {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>

<div class="app-container" id="app" data-theme="ocean">
    <!-- ===== ХЕДЕР ===== -->
    <header class="app-header">
        <h1><i class="fas fa-tasks"></i> Планировщик</h1>
        <div class="header-controls">
            <div class="main-nav">
                <button class="active" data-view="day">День</button>
                <button data-view="week">Неделя</button>
                <button data-view="month">Месяц</button>
                <button data-view="year">Год</button>
            </div>
            <div class="theme-picker" id="themePicker"></div>
        </div>
    </header>

    <!-- ===== ОСНОВНАЯ СЕТКА ===== -->
    <div class="main-grid">

        <!-- ВЕРХНИЙ РЯД: СТАТИСТИКА + КАЛЕНДАРЬ -->
        <div class="top-row">
            <!-- СТАТИСТИКА -->
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-simple"></i> Статистика</div>
                <div class="stats-grid">
                    <div class="stat-block">
                        <div class="stat-number" id="statXp">0</div>
                        <div class="stat-label">Всего XP</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-number" id="statLevel">1</div>
                        <div class="stat-label">Уровень</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-number" id="statStreak">0</div>
                        <div class="stat-label">Стрик (дн)</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-number" id="statDoneCount">0</div>
                        <div class="stat-label">Выполнено</div>
                    </div>
                </div>
                <div class="progress-block">
                    <div class="progress-label">
                        <span>Прогресс до следующего уровня</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                    </div>
                </div>
            </div>

            <!-- КАЛЕНДАРЬ -->
            <div class="card">
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button id="calPrev"><i class="fas fa-chevron-left"></i></button>
                        <span class="calendar-title" id="calendarTitle">Июль 2026</span>
                        <button id="calNext"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="calendar-view-tabs">
                        <button class="active" data-view="month">Месяц</button>
                        <button data-view="week">Неделя</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div style="margin-top:12px; display:flex; gap:16px; font-size:12px; opacity:0.4; flex-wrap:wrap;">
                    <span><span style="display:inline-block; width:12px; height:12px; border-radius:4px; background:currentColor; margin-right:6px;"></span> есть задачи</span>
                    <span><span style="display:inline-block; width:12px; height:12px; border-radius:4px; border:3px solid currentColor; margin-right:6px;"></span> сегодня</span>
                </div>
            </div>
        </div>

        <!-- НИЖНИЙ РЯД: ЗАДАЧИ + ЦЕЛИ -->
        <div class="tasks-section">
            <!-- ЗАДАЧИ -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-list-check"></i> Задачи
                    <span style="margin-left:auto; font-size:12px; opacity:0.5;" id="taskDateLabel">сегодня</span>
                </div>
                <div class="task-list" id="taskList"></div>
                <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="action-btn primary" id="btnAddTask" style="flex:1; padding:8px 16px; font-size:13px;">
                        <i class="fas fa-plus"></i> Добавить
                    </button>
                    <button class="action-btn success" id="btnCompleteAll" style="flex:1; padding:8px 16px; font-size:13px;">
                        <i class="fas fa-check-double"></i> Все готово
                    </button>
                    <button class="action-btn warning" id="btnResetStats" style="flex:1; padding:8px 16px; font-size:13px;">
                        <i class="fas fa-undo"></i> Сброс
                    </button>
                </div>
            </div>

            <!-- ЦЕЛИ -->
            <div class="card">
                <div class="card-title"><i class="fas fa-bullseye"></i> Цели</div>
                <div id="goalList"></div>
            </div>
        </div>

        <!-- ФИЛЬТРЫ И НИЖНЯЯ ПАНЕЛЬ -->
        <div class="bottom-bar">
            <div class="tag-group" id="tagGroup">
                <button class="tag active-tag" data-tag="all">Все</button>
                <button class="tag" data-tag="Тело">Тело</button>
                <button class="tag" data-tag="Творчество">Творчество</button>
                <button class="tag" data-tag="Бизнес">Бизнес</button>
                <button class="tag" data-tag="Привычки">Привычки</button>
                <button class="tag" data-tag="Путешествия">Путешествия</button>
                <button class="tag" data-tag="Долги">Долги</button>
                <button class="tag" data-tag="Питание">Питание</button>
                <button class="tag" data-tag="Другое">Другое</button>
            </div>
            <div style="display:flex; gap:16px; font-size:14px; opacity:0.4;">
                <span><i class="far fa-star"></i> <span id="xpDisplay">0</span> XP</span>
                <span><i class="fas fa-fire"></i> <span id="streakDisplay">0</span> дн.</span>
            </div>
        </div>
    </div>
</div>

<!-- ===== МОДАЛКА ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Новая задача</h2>
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
        </div>
        <form id="taskForm" class="task-form">
            <div class="form-group">
                <label>Название *</label>
                <input type="text" id="taskName" class="form-input" placeholder="Что нужно сделать?" required />
                <span class="error-text" id="taskNameError">Название обязательно</span>
            </div>
            <div class="form-group">
                <label>Категория</label>
                <select id="taskCategory" class="form-input">
                    <option value="Тело">Тело</option>
                    <option value="Творчество">Творчество</option>
                    <option value="Бизнес">Бизнес</option>
                    <option value="Привычки">Привычки</option>
                    <option value="Одноразки">Одноразки</option>
                    <option value="Путешествия">Путешествия</option>
                    <option value="Долги">Долги</option>
                    <option value="Питание">Питание</option>
                    <option value="Другое" selected>Другое</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Дата *</label>
                    <input type="date" id="taskDate" class="form-input" required />
                </div>
                <div class="form-group">
                    <label>Время</label>
                    <input type="time" id="taskTime" class="form-input" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Длительность (мин)</label>
                    <input type="number" id="taskDuration" class="form-input" min="1" max="1440" value="30" />
                </div>
                <div class="form-group">
                    <label>Напоминание</label>
                    <button type="button" id="taskReminder" class="toggle-btn">Выкл</button>
                </div>
            </div>
            <div class="form-group">
                <label style="flex-direction:row; gap:8px; cursor:pointer; align-items:center;">
                    <input type="checkbox" id="taskIsHabit" /> Это привычка
                </label>
                <div id="habitDaysContainer" style="display:none;">
                    <div class="habit-days">
                        <label>Длительность (дней)</label>
                        <div class="habit-presets">
                            <button type="button" class="preset-btn" data-days="7">7</button>
                            <button type="button" class="preset-btn active" data-days="21">21</button>
                            <button type="button" class="preset-btn" data-days="30">30</button>
                            <button type="button" class="preset-btn" data-days="60">60</button>
                        </div>
                        <small style="opacity:0.5; font-size:12px;">💡 Привычка формируется за 21 день</small>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Заметка</label>
                <textarea id="taskNotes" class="form-input" rows="2" placeholder="Дополнительно..."></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="modalCancel">Отмена</button>
                <button type="submit" class="btn btn-primary" id="modalSubmit">Создать</button>

        </form>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
(function() {
    'use strict';

    // ===== ДАННЫЕ =====
    let taskData = [];
    let goalsData = [];
    let currentFilter = 'all';
    let currentTheme = 'ocean';
    let nextId = 1;

    // Календарь
    let currentDate = new Date();
    let currentView = 'month'; // 'month' | 'week'
    let selectedDate = getToday();

    // ===== DOM =====
    const app = document.getElementById('app');
    const themePicker = document.getElementById('themePicker');
    const taskList = document.getElementById('taskList');
    const goalList = document.getElementById('goalList');
    const calendarGrid = document.getElementById('calendarGrid');
    const calendarTitle = document.getElementById('calendarTitle');
    const toast = document.getElementById('toast');

    const modalOverlay = document.getElementById('modalOverlay');
    const taskForm = document.getElementById('taskForm');
    const modalClose = document.getElementById('modalClose');
    const modalCancel = document.getElementById('modalCancel');
    const modalSubmit = document.getElementById('modalSubmit');
    const modalTitle = document.getElementById('modalTitle');

    const taskName = document.getElementById('taskName');
    const taskCategory = document.getElementById('taskCategory');
    const taskDate = document.getElementById('taskDate');
    const taskTime = document.getElementById('taskTime');
    const taskDuration = document.getElementById('taskDuration');
    const taskReminder = document.getElementById('taskReminder');
    const taskIsHabit = document.getElementById('taskIsHabit');
    const habitDaysContainer = document.getElementById('habitDaysContainer');
    const taskNotes = document.getElementById('taskNotes');
    const taskNameError = document.getElementById('taskNameError');

    let toastTimer = null;
    let reminderOn = false;
    let habitDays = 21;
    let editingTaskId = null;

    // ===== ЦВЕТА =====
    const categoryColors = {
        'Тело': '#4a7c59',
        'Творчество': '#d4899e',
        'Бизнес': '#4a6fa5',
        'Привычки': '#f39c12',
        'Одноразки': '#8e44ad',
        'Путешествия': '#00d4b6',
        'Долги': '#e74c3c',
        'Питание': '#27ae60',
        'Другое': '#95a5a6'
    };

    // ===== ТЕМЫ =====
    const themes = [
        { id: 'ocean', label: 'Океан', colors: ['#0b7a9c', '#b8e2ed', '#e8f4f8'] },
        { id: 'lavender', label: 'Лаванда', colors: ['#8b5cf6', '#ddd0f0', '#f5edf9'] },
        { id: 'mint', label: 'Мятный', colors: ['#0b9e6a', '#b8e8d4', '#e8f5ee'] },
        { id: 'terracotta', label: 'Терракота', colors: ['#c76b2e', '#f0dac8', '#f8efe8'] },
        { id: 'cosmos', label: 'Космос', colors: ['#7c5cfc', '#2a1f4a', '#0d0b1a'] },
        { id: 'cherry', label: 'Вишня', colors: ['#c72828', '#f0d0d0', '#f8ecec'] },
        { id: 'gold', label: 'Золотой', colors: ['#c99c2e', '#f0e4c0', '#f8f2e0'] }
    ];

    // ===== ВСПОМОГАТЕЛЬНЫЕ =====
    function getToday() {
        return new Date().toISOString().split('T')[0];
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('ru', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getCategoryColor(cat) {
        return categoryColors[cat] || '#95a5a6';
    }

    function generateId() {
        return nextId++;
    }

    // ===== XP =====
    function calculateLevel(totalXP) {
        if (totalXP < 1) return 1;
        let level = 1;
        while (true) {
            const xpForLevel = (level * (level + 1)) / 2;
            if (totalXP < xpForLevel) return level - 1 || 1;
            level++;
        }
    }

    function calculateTaskXP(minutes) {
        return Math.round(minutes * 0.01);
    }

    // ===== TOAST =====
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== LOCAL STORAGE =====
    function saveToLocalStorage() {
        try {
            localStorage.setItem('planner_tasks', JSON.stringify(taskData));
            localStorage.setItem('planner_goals', JSON.stringify(goalsData));
            localStorage.setItem('planner_nextId', String(nextId));
            localStorage.setItem('planner_theme', currentTheme);
        } catch(e) {}
    }

    function loadFromLocalStorage() {
        try {
            const tasks = localStorage.getItem('planner_tasks');
            const goals = localStorage.getItem('planner_goals');
            const savedId = localStorage.getItem('planner_nextId');
            const theme = localStorage.getItem('planner_theme');
            if (tasks) taskData = JSON.parse(tasks);
            if (goals) goalsData = JSON.parse(goals);
            if (savedId) nextId = parseInt(savedId);
            if (theme && themes.some(t => t.id === theme)) currentTheme = theme;
            return true;
        } catch(e) { return false; }
    }

    function initData() {
        taskData = [
            { id: generateId(), name: 'Создать макет дашборда', category: 'Творчество', date: getToday(), time: '10:30', duration: 90, done: false, isHabit: false, notes: '', reminder: false },
            { id: generateId(), name: 'Написать документацию', category: 'Бизнес', date: getToday(), time: '14:00', duration: 60, done: false, isHabit: false, notes: '', reminder: false },
            { id: generateId(), name: 'Утренняя зарядка', category: 'Тело', date: getToday(), time: '07:00', duration: 15, done: false, isHabit: true, habitDays: 21, habitCurrentDay: 1, notes: '', reminder: true },
        ];
        goalsData = [
            { id: 1, name: 'Запустить MVP', done: 3, total: 5 },
            { id: 2, name: 'Изучить Vue 3', done: 2, total: 4 },
            { id: 3, name: 'Дизайн-система', done: 1, total: 3 }
        ];
        saveToLocalStorage();
    }

    // ===== ТЕМЫ =====
    function renderThemeButtons() {
        themePicker.innerHTML = '';
        themes.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'theme-btn' + (t.id === currentTheme ? ' active' : '');
            btn.dataset.theme = t.id;
            btn.title = t.label;
            const dots = document.createElement('span');
            dots.className = 'color-dots';
            t.colors.forEach(c => {
                const dot = document.createElement('span');
                dot.style.background = c;
                dots.appendChild(dot);
            });
            btn.appendChild(dots);
            btn.addEventListener('click', () => setTheme(t.id));
            themePicker.appendChild(btn);
        });
    }

    function setTheme(id) {
        currentTheme = id;
        app.dataset.theme = id;
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === id));
        saveToLocalStorage();
        showToast('Тема: ' + themes.find(t => t.id === id)?.label);
    }

    // ===== КАЛЕНДАРЬ =====
    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const today = getToday();

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startOffset = (firstDay.getDay() + 6) % 7;

        calendarTitle.textContent = firstDay.toLocaleDateString('ru', { month: 'long', year: 'numeric' });

        // Собираем даты с задачами
        const taskDates = new Set();
        taskData.forEach(t => { if (t.date) taskDates.add(t.date); });

        let html = '';
        const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        weekDays.forEach(d => {
            html += `<div class="day-header">${d}</div>`;
        });

        // Пустые ячейки
        for (let i = 0; i < startOffset; i++) {
            html += `<div class="calendar-day other-month"></div>`;
        }

        // Дни
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday = dateStr === today;
            const hasTask = taskDates.has(dateStr);
            const dayOfWeek = (startOffset + d - 1) % 7;
            const isWeekend = dayOfWeek === 5 || dayOfWeek === 6;

            let classes = 'calendar-day';
            if (isToday) classes += ' today';
            if (hasTask) classes += ' has-task';
            if (isWeekend) classes += ' weekend';

            html += `<div class="${classes}" data-date="${dateStr}" style="${hasTask ? 'color:' + getCategoryColor(taskData.find(t => t.date === dateStr)?.category || '#4a6fa5') : ''}">
                <span class="day-number">${d}</span>
                ${hasTask ? '<span class="day-dot"></span>' : ''}
            </div>`;
        }

        calendarGrid.innerHTML = html;

        // Клик по дню
        calendarGrid.querySelectorAll('.calendar-day[data-date]').forEach(el => {
            el.addEventListener('click', function() {
                const date = this.dataset.date;
                selectedDate = date;
                document.getElementById('taskDateLabel').textContent = formatDate(date);
                renderTasks(currentFilter);
                showToast('📅 ' + formatDate(date));
            });
        });
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    // ===== ЗАДАЧИ =====
    function renderTasks(filter) {
        const f = filter || currentFilter;
        let filtered = f === 'all' ? taskData : taskData.filter(t => t.category === f);

        // Фильтр по выбранной дате
        filtered = filtered.filter(t => t.date === selectedDate);

        filtered.sort((a, b) => {
            if (a.time && b.time) return a.time.localeCompare(b.time);
            if (a.time) return -1;
            if (b.time) return 1;
            return 0;
        });

        taskList.innerHTML = '';

        if (filtered.length === 0) {
            taskList.innerHTML = `<div class="empty-state"><i class="fas fa-check-circle"></i><p>Нет задач на этот день</p></div>`;
            updateStats();
            return;
        }

        filtered.forEach(task => {
            const item = document.createElement('div');
            item.className = 'task-item' + (task.done ? ' completed' : '');

            const check = document.createElement('div');
            check.className = 'task-check' + (task.done ? ' done' : '');
            check.innerHTML = task.done ? '<i class="fas fa-check"></i>' : '';
            check.addEventListener('click', () => toggleTask(task.id));

            const content = document.createElement('div');
            content.className = 'task-content';
            content.innerHTML = `
                <div class="task-name">${task.name}</div>
                <div class="task-meta">
                    <span class="task-tag" style="background:${getCategoryColor(task.category)}22;color:${getCategoryColor(task.category)}">${task.category}</span>
                    ${task.time ? `<span>${task.time}</span>` : ''}
                    ${task.duration ? `<span>⏱ ${task.duration} мин</span>` : ''}
                    ${task.isHabit ? `<span>🔄 ${task.habitCurrentDay||'?'}/${task.habitDays}</span>` : ''}
                    ${task.reminder ? `<span>🔔</span>` : ''}
                </div>
            `;

            const del = document.createElement('button');
            del.className = 'task-delete';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => {
                if (confirm('Удалить задачу?')) deleteTask(task.id);
            });

            item.appendChild(check);
            item.appendChild(content);
            item.appendChild(del);
            taskList.appendChild(item);
        });

        updateStats();
    }

    function toggleTask(id) {
        const task = taskData.find(t => t.id === id);
        if (!task) return;
        const today = getToday();
        if (task.date > today && !task.done) {
            showToast('❌ Нельзя выполнить задачу раньше срока');
            return;
        }
        task.done = !task.done;
        if (task.done) {
            const xp = calculateTaskXP(task.duration || 0);
            showToast('✅ +' + xp + ' XP');
        } else {
            showToast('↩️ Возвращено');
        }
        saveToLocalStorage();
        renderTasks(currentFilter);
    }

    function deleteTask(id) {
        taskData = taskData.filter(t => t.id !== id);
        saveToLocalStorage();
        renderTasks(currentFilter);
        showToast('🗑️ Удалено');
    }

    function addTask(task) {
        taskData.push(task);
        saveToLocalStorage();
        renderTasks(currentFilter);
    }

    function generateHabitTasks(base) {
        const tasks = [];
        const today = new Date();
        for (let i = 0; i < base.habitDays; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() + i);
            tasks.push({
                id: generateId(),
                name: base.name,
                category: base.category,
                date: d.toISOString().split('T')[0],
                time: base.time || '',
                duration: base.duration || 0,
                done: false,
                isHabit: true,
                habitDays: base.habitDays,
                habitCurrentDay: i + 1,
                notes: base.notes || '',
                reminder: base.reminder || false,
            });
        }
        taskData.push(...tasks);
        saveToLocalStorage();
        renderTasks(currentFilter);
        showToast('🔄 Создано ' + tasks.length + ' привычек');
    }

    // ===== ЦЕЛИ =====
    function renderGoals() {
        goalList.innerHTML = '';
        if (goalsData.length === 0) {
            goalList.innerHTML = `<div class="empty-state"><i class="fas fa-bullseye"></i><p>Нет целей</p></div>`;
            return;
        }
        goalsData.forEach(g => {
            const pct = Math.round((g.done / g.total) * 100);
            const item = document.createElement('div');
            item.className = 'goal-item';
            item.innerHTML = `
                <div class="goal-info">
                    <div class="goal-name">${g.name}</div>
                    <div class="goal-sub">${g.done} из ${g.total} задач</div>
                </div>
                <span class="goal-badge" style="color:var(--accent);">${pct}%</span>
            `;
            goalList.appendChild(item);
        });
    }

    // ===== СТАТИСТИКА =====
    function updateStats() {
        const total = taskData.length;
        const done = taskData.filter(t => t.done).length;
        const xp = 18 + done * 2;
        const level = calculateLevel(xp);
        const streak = 5 + (done > 2 ? 1 : 0);

        document.getElementById('statXp').textContent = xp;
        document.getElementById('statLevel').textContent = level;
        document.getElementById('statStreak').textContent = streak;
        document.getElementById('statDoneCount').textContent = done;
        document.getElementById('xpDisplay').textContent = xp;
        document.getElementById('streakDisplay').textContent = streak;

        // Прогресс до следующего уровня
        const xpForLevel = (level * (level + 1)) / 2;
        const xpForNext = ((level + 1) * (level + 2)) / 2;
        const xpInLevel = xp - xpForLevel;
        const xpNeeded = xpForNext - xpForLevel;
        const pct = Math.min((xpInLevel / xpNeeded) * 100, 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPercent').textContent = Math.round(pct) + '%';
    }

    // ===== МОДАЛКА =====
    function openModal(title, data) {
        modalTitle.textContent = title;
        modalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';

        if (data) {
            taskName.value = data.name || '';
            taskCategory.value = data.category || 'Другое';
            taskDate.value = data.date || getToday();
            taskTime.value = data.time || '';
            taskDuration.value = data.duration || 30;
            taskNotes.value = data.notes || '';
            reminderOn = data.reminder || false;
            taskReminder.textContent = reminderOn ? 'Вкл' : 'Выкл';
            taskReminder.classList.toggle('active', reminderOn);
            taskIsHabit.checked = data.isHabit || false;
            habitDaysContainer.style.display = taskIsHabit.checked ? 'block' : 'none';
            editingTaskId = data.id || null;
        } else {
            taskName.value = '';
            taskCategory.value = 'Другое';
            taskDate.value = getToday();
            taskTime.value = '';
            taskDuration.value = 30;
            taskNotes.value = '';
            reminderOn = false;
            taskReminder.textContent = 'Выкл';
            taskReminder.classList.remove('active');
            taskIsHabit.checked = false;
            habitDaysContainer.style.display = 'none';
            editingTaskId = null;
        }
        taskNameError.style.display = 'none';
        taskName.focus();
        modalSubmit.textContent = editingTaskId ? 'Сохранить' : 'Создать';
    }

    function closeModal() {
        modalOverlay.classList.remove('open');
        document.body.style.overflow = '';
        editingTaskId = null;
    }

    // ===== ОБРАБОТКА ФОРМЫ =====
    function handleFormSubmit(e) {
        e.preventDefault();
        const name = taskName.value.trim();
        if (!name) {
            taskNameError.style.display = 'block';
            taskName.focus();
            return;
        }
        taskNameError.style.display = 'none';

        const task = {
            id: editingTaskId || generateId(),
            name: name,
            category: taskCategory.value,
            date: taskDate.value,
            time: taskTime.value || '',
            duration: parseInt(taskDuration.value) || 0,
            done: false,
            isHabit: taskIsHabit.checked,
            habitDays: taskIsHabit.checked ? habitDays : undefined,
            habitCurrentDay: taskIsHabit.checked ? 1 : undefined,
            notes: taskNotes.value.trim() || '',
            reminder: reminderOn,
        };

        if (editingTaskId) {
            const idx = taskData.findIndex(t => t.id === editingTaskId);
            if (idx !== -1) {
                taskData[idx] = { ...taskData[idx], ...task };
                showToast('✏️ Обновлено');
            }
        } else {
            if (task.isHabit) {
                generateHabitTasks(task);
            } else {
                addTask(task);
                showToast('✅ Создано');
            }
        }
        saveToLocalStorage();
        renderTasks(currentFilter);
        closeModal();
    }

    // ===== НАВИГАЦИЯ ПО ВИДАМ =====
    document.querySelectorAll('.main-nav button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.main-nav button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const view = this.dataset.view;
            if (view === 'day') showToast('📅 День: ' + formatDate(selectedDate));
            else if (view === 'week') showToast('📅 Неделя ' + currentDate.toLocaleDateString('ru', { week: 'numeric' }));
            else if (view === 'month') showToast('📅 ' + currentDate.toLocaleDateString('ru', { month: 'long' }));
            else if (view === 'year') showToast('📅 ' + currentDate.getFullYear());
        });
    });

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    function init() {
        const hasData = loadFromLocalStorage();
        if (!hasData || taskData.length === 0) initData();

        app.dataset.theme = currentTheme;

        renderThemeButtons();
        renderCalendar();
        renderTasks('all');
        renderGoals();

        // События календаря
        document.getElementById('calPrev').addEventListener('click', () => changeMonth(-1));
        document.getElementById('calNext').addEventListener('click', () => changeMonth(1));

        // Фильтры
        document.querySelectorAll('.tag-group .tag').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tag-group .tag').forEach(b => b.classList.remove('active-tag'));
                this.classList.add('active-tag');
                currentFilter = this.dataset.tag;
                renderTasks(currentFilter);
                showToast('Фильтр: ' + (currentFilter === 'all' ? 'Все' : this.textContent));
            });
        });

        // Кнопки
        document.getElementById('btnAddTask').addEventListener('click', () => openModal('Новая задача'));
        document.getElementById('btnCompleteAll').addEventListener('click', () => {
            const pending = taskData.filter(t => !t.done && t.date <= getToday());
            if (pending.length === 0) { showToast('🎉 Все выполнено!'); return; }
            if (confirm('Отметить все как выполненные?')) {
                let xp = 0;
                pending.forEach(t => { t.done = true; xp += calculateTaskXP(t.duration || 0); });
                saveToLocalStorage();
                renderTasks(currentFilter);
                showToast('✅ +' + xp + ' XP');
            }
        });

        document.getElementById('btnResetStats').addEventListener('click', () => {
            if (confirm('Сбросить все задачи?')) {
                taskData.forEach(t => t.done = false);
                saveToLocalStorage();
                renderTasks('all');
                document.querySelectorAll('.tag-group .tag').forEach(b => b.classList.remove('active-tag'));
                document.querySelector('[data-tag="all"]').classList.add('active-tag');
                currentFilter = 'all';
                showToast('🔄 Сброшено');
            }
        });

        // Модалка
        modalClose.addEventListener('click', closeModal);
        modalCancel.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
        taskForm.addEventListener('submit', handleFormSubmit);

        taskIsHabit.addEventListener('change', function() {
            habitDaysContainer.style.display = this.checked ? 'block' : 'none';
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                habitDays = parseInt(this.dataset.days);
            });
        });

        taskReminder.addEventListener('click', function() {
            reminderOn = !reminderOn;
            this.textContent = reminderOn ? 'Вкл' : 'Выкл';
            this.classList.toggle('active', reminderOn);
        });

        taskName.addEventListener('input', () => {
            if (taskName.value.trim()) taskNameError.style.display = 'none';
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // Клик по дню календаря
        document.getElementById('taskDateLabel').textContent = formatDate(selectedDate);

        console.log('🚀 Планировщик загружен');
        console.log('📊 Задач:', taskData.length);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
