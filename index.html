<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Долги — Календарь</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 20px;
            position: relative;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .header h1 span {
            color: #007aff;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .header-actions button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: 0.2s;
            background: #f0f4fa;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:active {
            transform: scale(0.92);
        }
        .header-actions .add-btn {
            background: #007aff;
            color: white;
        }

        /* ===== КАЛЕНДАРЬ (СТИЛЬ КАК НА IPHONE) ===== */
        .calendar {
            background: white;
            border-radius: 24px;
            padding: 16px 12px 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 6px;
        }
        .calendar-header .month-year {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .calendar-header .nav-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: 0.2s;
            color: #007aff;
            font-weight: 300;
        }
        .calendar-header .nav-btn:active {
            background: #eef2f7;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #8e98a3;
            margin-bottom: 6px;
            padding: 0 4px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .calendar-day {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            background: transparent;
            border: none;
            padding: 0;
            min-height: 44px;
        }
        .calendar-day:active {
            transform: scale(0.90);
        }
        .calendar-day.other-month {
            color: #c0c7d1;
        }
        .calendar-day.today {
            background: #007aff;
            color: white;
            font-weight: 700;
        }
        .calendar-day .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff3b30;
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }
        .calendar-day .dot.return {
            background: #34c759;
        }
        .calendar-day .dot.partial {
            background: #ff9500;
        }
        .calendar-day .dot.borrow {
            background: #ff3b30;
        }
        .calendar-day .dot.lent {
            background: #007aff;
        }
        .calendar-day.selected {
            background: #e8f0fe;
            border: 2px solid #007aff;
        }
        .calendar-day.has-debt {
            font-weight: 700;
        }

        /* ===== ИНФО О ВЫБРАННОМ ДНЕ ===== */
        .day-details {
            background: #f8faff;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 16px;
            min-height: 60px;
            transition: 0.3s;
        }
        .day-details .date-label {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .day-details .date-label small {
            font-weight: 400;
            color: #8e98a3;
            font-size: 13px;
        }
        .day-details .no-events {
            color: #8e98a3;
            font-size: 14px;
            padding: 8px 0;
        }

        .event-item {
            background: white;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border-left: 4px solid #007aff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .event-item .event-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .event-item .event-info {
            flex: 1;
        }
        .event-item .event-info .event-title {
            font-weight: 600;
            font-size: 14px;
            color: #1a1a2e;
        }
        .event-item .event-info .event-sub {
            font-size: 12px;
            color: #6c7a8d;
            margin-top: 2px;
        }
        .event-item .event-info .event-dates {
            font-size: 11px;
            color: #8e98a3;
            margin-top: 2px;
        }
        .event-item .event-amount {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
        }
        .event-item .event-amount.positive {
            color: #34c759;
        }
        .event-item .event-amount.negative {
            color: #ff3b30;
        }
        .event-item .event-actions {
            display: flex;
            gap: 6px;
        }
        .event-item .event-actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .event-item .event-actions button:active {
            background: #eef2f7;
        }
        .event-item .event-photo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .event-item .event-photo img {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            object-fit: cover;
        }
        .event-item .return-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: #e8f7ef;
            color: #1a8a4a;
        }
        .event-item .return-badge.partial {
            background: #fff5e6;
            color: #b26a00;
        }
        .event-item .event-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            align-items: flex-end;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal {
            background: white;
            border-radius: 32px 32px 0 0;
            padding: 28px 24px 34px;
            max-width: 500px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            background: #d0d7e2;
            border-radius: 4px;
            margin: -8px auto 16px;
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #1a1a2e;
        }
        .modal label {
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            display: block;
            margin: 12px 0 4px;
        }
        .modal .label-hint {
            font-weight: 400;
            font-size: 12px;
            color: #8e98a3;
        }
        .modal input,
        .modal select,
        .modal textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8edf4;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #fafcff;
        }
        .modal input:focus,
        .modal select:focus,
        .modal textarea:focus {
            border-color: #007aff;
            background: white;
        }
        .modal textarea {
            resize: vertical;
            min-height: 50px;
        }
        .modal .form-row {
            display: flex;
            gap: 12px;
        }
        .modal .form-row>* {
            flex: 1;
        }

        .modal .photo-upload {
            border: 2px dashed #d0d7e2;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fafcff;
            margin-top: 4px;
            position: relative;
        }
        .modal .photo-upload:active {
            background: #eef2f7;
        }
        .modal .photo-upload input[type="file"] {
            display: none;
        }
        .modal .photo-upload .preview {
            max-width: 100%;
            max-height: 120px;
            border-radius: 10px;
            margin-top: 6px;
        }
        .modal .photo-upload .remove-photo {
            position: absolute;
            top: 6px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 16px;
            cursor: pointer;
        }

        .modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }
        .modal .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal .modal-actions .btn-cancel {
            background: #eef2f7;
            color: #2c3e50;
        }
        .modal .modal-actions .btn-cancel:active {
            background: #dce3ec;
        }
        .modal .modal-actions .btn-save {
            background: #007aff;
            color: white;
        }
        .modal .modal-actions .btn-save:active {
            background: #0062d1;
        }
        .modal .modal-actions .btn-danger {
            background: #ff3b30;
            color: white;
        }
        .modal .modal-actions .btn-danger:active {
            background: #d63031;
        }

        /* ===== ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: 0.4s ease;
            pointer-events: none;
            z-index: 1000;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .app {
                padding: 12px;
                border-radius: 24px;
            }
            .modal {
                padding: 20px 16px 28px;
            }
            .calendar-day {
                font-size: 14px;
                min-height: 38px;
            }
            .calendar {
                padding: 10px 6px 8px;
            }
            .event-item {
                padding: 10px 12px;
            }
            .event-item .event-amount {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div class="app" id="app">
        <div class="header">
            <h1>📅 <span>Долги</span></h1>
            <div class="header-actions">
                <button onclick="goToToday()" title="Сегодня">📌</button>
                <button class="add-btn" onclick="openCreateModal()">＋</button>
            </div>
        </div>

        <!-- ===== КАЛЕНДАРЬ ===== -->
        <div class="calendar">
            <div class="calendar-header">
                <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
                <span class="month-year" id="monthYear">Сентябрь 2026</span>
                <button class="nav-btn" onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-weekdays">
                <span>Пн</span><span>Вт</span><span>Ср</span>
                <span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- ===== ДЕТАЛИ ДНЯ ===== -->
        <div class="day-details" id="dayDetails">
            <div class="date-label" id="selectedDateLabel">Выберите день <small>в календаре</small></div>
            <div id="dayEvents">
                <div class="no-events">Нет записей</div>
            </div>
        </div>
    </div>

    <!-- ===== ТОСТ ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-handle"></div>
            <h2 id="modalTitle">➕ Добавить запись</h2>
            <form id="eventForm">
                <input type="hidden" id="editId" value="" />

                <label for="eventType">Тип операции</label>
                <select id="eventType">
                    <option value="lent">💰 Я дал в долг</option>
                    <option value="borrowed">📥 Я занял</option>
                    <option value="return_full">✅ Полный возврат</option>
                    <option value="return_partial">🔄 Частичный возврат</option>
                </select>

                <label for="eventCounterparty">Кому / у кого *</label>
                <input type="text" id="eventCounterparty" placeholder="Имя или название" required />

                <label for="eventAmount">Сумма (₽) *</label>
                <input type="number" id="eventAmount" placeholder="5000" required min="0" step="0.01" />

                <!-- ===== ДВЕ ДАТЫ ===== -->
                <div class="form-row">
                    <div>
                        <label>Дата операции <span class="label-hint">(когда занял/дал)</span></label>
                        <input type="date" id="eventStartDate" required />
                    </div>
                    <div>
                        <label>Дата возврата <span class="label-hint">(когда отдать)</span></label>
                        <input type="date" id="eventReturnDate" />
                    </div>
                </div>

                <label for="eventNote">Примечание</label>
                <input type="text" id="eventNote" placeholder="За что, цель, условия" />

                <!-- ===== ЗАГРУЗКА ФОТО ===== -->
                <label>Фото чека / расписки</label>
                <div class="photo-upload" id="photoUpload">
                    <span id="photoPlaceholder">📷 Нажмите, чтобы добавить фото</span>
                    <input type="file" id="photoInput" accept="image/*" />
                    <img class="preview" id="photoPreview" style="display:none;" />
                    <button class="remove-photo" id="removePhotoBtn" style="display:none;">✕</button>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn-save" id="saveBtn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ================================================================
        //  ГЛАВНЫЙ JS — КАЛЕНДАРЬ ДОЛГОВ С ДВУМЯ ДАТАМИ
        // ================================================================

        // ---- ХРАНЕНИЕ ----
        const STORAGE_KEY = 'debt_calendar_data_v2';

        // ---- СОСТОЯНИЕ ----
        let events = [];
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let selectedDate = null; // { year, month, day } или null

        // ---- DOM ----
        const grid = document.getElementById('calendarGrid');
        const monthYearEl = document.getElementById('monthYear');
        const selectedDateLabel = document.getElementById('selectedDateLabel');
        const dayEventsEl = document.getElementById('dayEvents');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const eventForm = document.getElementById('eventForm');
        const editId = document.getElementById('editId');
        const eventType = document.getElementById('eventType');
        const eventCounterparty = document.getElementById('eventCounterparty');
        const eventAmount = document.getElementById('eventAmount');
        const eventStartDate = document.getElementById('eventStartDate');
        const eventReturnDate = document.getElementById('eventReturnDate');
        const eventNote = document.getElementById('eventNote');
        const photoInput = document.getElementById('photoInput');
        const photoPreview = document.getElementById('photoPreview');
        const photoPlaceholder = document.getElementById('photoPlaceholder');
        const removePhotoBtn = document.getElementById('removePhotoBtn');
        let currentPhotoData = null; // base64

        // ---- ИНИЦИАЛИЗАЦИЯ ----
        function init() {
            loadData();
            if (events.length === 0) {
                addDemoData();
            }
            const today = new Date();
            selectedDate = { year: today.getFullYear(), month: today.getMonth(), day: today.getDate() };
            renderCalendar();
            renderDayDetails();
            bindEvents();
        }

        // ---- ДЕМО-ДАННЫЕ ----
        function addDemoData() {
            const today = new Date();
            const d = today.getDate();
            const m = today.getMonth();
            const y = today.getFullYear();

            events = [{
                id: '1',
                startDate: `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
                returnDate: `${y}-${String(m+1).padStart(2,'0')}-${String(d+14).padStart(2,'0')}`,
                type: 'lent',
                counterparty: 'Анна',
                amount: 15000,
                note: 'На покупку ноутбука',
                photo: null
            }, {
                id: '2',
                startDate: `${y}-${String(m+1).padStart(2,'0')}-${String(d-3).padStart(2,'0')}`,
                returnDate: `${y}-${String(m+1).padStart(2,'0')}-${String(d+7).padStart(2,'0')}`,
                type: 'borrowed',
                counterparty: 'Сергей',
                amount: 5000,
                note: 'До зарплаты',
                photo: null
            }, {
                id: '3',
                startDate: `${y}-${String(m+1).padStart(2,'0')}-${String(d-10).padStart(2,'0')}`,
                returnDate: `${y}-${String(m+1).padStart(2,'0')}-${String(d-10).padStart(2,'0')}`,
                type: 'return_full',
                counterparty: 'Анна',
                amount: 15000,
                note: 'Вернул полностью',
                photo: null
            }];
            saveData();
        }

        // ---- ЗАГРУЗКА / СОХРАНЕНИЕ ----
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try { events = JSON.parse(stored); } catch (e) { events = []; }
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        // ---- ПОЛУЧИТЬ СОБЫТИЯ ДЛЯ ДНЯ ----
        function getEventsForDate(year, month, day) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            return events.filter(e => e.startDate === dateStr || e.returnDate === dateStr);
        }

        function hasEventsForDate(year, month, day) {
            return getEventsForDate(year, month, day).length > 0;
        }

        // ---- РЕНДЕР КАЛЕНДАРЯ ----
        function renderCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            const today = new Date();
            const todayY = today.getFullYear();
            const todayM = today.getMonth();
            const todayD = today.getDate();

            monthYearEl.textContent = `${getMonthName(currentMonth)} ${currentYear}`;

            let html = '';

            for (let i = 0; i < startOffset; i++) {
                html += `<div class="calendar-day other-month"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = (day === todayD && currentMonth === todayM && currentYear === todayY);
                const isSelected = (selectedDate && day === selectedDate.day &&
                    currentMonth === selectedDate.month &&
                    currentYear === selectedDate.year);
                const hasEvents = hasEventsForDate(currentYear, currentMonth, day);

                let dotHtml = '';
                if (hasEvents) {
                    const dayEvents = getEventsForDate(currentYear, currentMonth, day);
                    const hasReturn = dayEvents.some(e => e.type === 'return_full' || e.type === 'return_partial');
                    const hasPartial = dayEvents.some(e => e.type === 'return_partial');
                    const hasLent = dayEvents.some(e => e.type === 'lent');
                    const hasBorrowed = dayEvents.some(e => e.type === 'borrowed');

                    if (hasReturn && hasPartial) {
                        dotHtml = `<span class="dot return partial"></span>`;
                    } else if (hasReturn) {
                        dotHtml = `<span class="dot return"></span>`;
                    } else if (hasPartial) {
                        dotHtml = `<span class="dot partial"></span>`;
                    } else if (hasLent) {
                        dotHtml = `<span class="dot lent"></span>`;
                    } else if (hasBorrowed) {
                        dotHtml = `<span class="dot borrow"></span>`;
                    } else {
                        dotHtml = `<span class="dot"></span>`;
                    }
                }

                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                if (hasEvents) classes += ' has-debt';

                html += `
                        <button class="${classes}" data-year="${currentYear}" data-month="${currentMonth}" data-day="${day}">
                            ${day}
                            ${dotHtml}
                        </button>
                    `;
            }

            grid.innerHTML = html;

            grid.querySelectorAll('.calendar-day').forEach(btn => {
                if (btn.classList.contains('other-month')) return;
                btn.addEventListener('click', function() {
                    const y = parseInt(this.dataset.year);
                    const m = parseInt(this.dataset.month);
                    const d = parseInt(this.dataset.day);
                    selectedDate = { year: y, month: m, day: d };
                    renderCalendar();
                    renderDayDetails();
                });
            });
        }

        // ---- РЕНДЕР ДЕТАЛЕЙ ДНЯ ----
        function renderDayDetails() {
            if (!selectedDate) {
                selectedDateLabel.textContent = 'Выберите день в календаре';
                dayEventsEl.innerHTML = `<div class="no-events">Нет записей</div>`;
                return;
            }

            const { year, month, day } = selectedDate;
            const dateObj = new Date(year, month, day);
            const dayEvents = getEventsForDate(year, month, day);

            const weekdays = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
            const wd = dateObj.getDay() === 0 ? 6 : dateObj.getDay() - 1;

            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const dateDisplay = `${weekdays[wd]}, ${day} ${getMonthName(month)} ${year}`;

            selectedDateLabel.innerHTML = `
                    ${dateDisplay}
                    <small style="font-weight:400;color:#8e98a3;margin-left:8px;">
                        ${dayEvents.length} записей
                    </small>
                `;

            if (dayEvents.length === 0) {
                dayEventsEl.innerHTML = `
                        <div class="no-events">Нет записей на этот день</div>
                        <button class="btn-save" style="margin-top:10px;padding:10px 20px;border:none;border-radius:14px;background:#007aff;color:white;font-weight:600;cursor:pointer;font-size:14px;width:100%;" onclick="openCreateModalForDate(${year},${month},${day})">
                            ＋ Добавить запись
                        </button>
                    `;
                return;
            }

            let html = '';
            const sorted = [...dayEvents].sort((a, b) => {
                const order = { 'return_full': 0, 'return_partial': 1, 'lent': 2, 'borrowed': 3 };
                return (order[a.type] || 2) - (order[b.type] || 2);
            });

            sorted.forEach(e => {
                const typeLabels = {
                    lent: '💰 Дал в долг',
                    borrowed: '📥 Занял',
                    return_full: '✅ Полный возврат',
                    return_partial: '🔄 Частичный возврат'
                };
                const isPositive = e.type === 'lent' || e.type === 'return_partial';
                const sign = (e.type === 'lent' || e.type === 'return_full') ? '+' : '-';
                const colorClass = (e.type === 'lent' || e.type === 'return_full') ? 'positive' : 'negative';
                const amountDisplay = `${sign}${Number(e.amount).toLocaleString('ru-RU')} ₽`;

                // Определяем, какая дата совпадает с выбранным днём
                const isStartDate = e.startDate === dateStr;
                const isReturnDate = e.returnDate === dateStr;
                let dateHint = '';
                if (isStartDate && isReturnDate) {
                    dateHint = '📅 Дата операции и возврата';
                } else if (isStartDate) {
                    dateHint = '📌 Дата операции';
                } else if (isReturnDate) {
                    dateHint = '⏰ Дата возврата';
                }

                let photoHtml = '';
                if (e.photo) {
                    photoHtml = `<div class="event-photo" onclick="viewPhoto('${e.photo}')">
                                    <img src="${e.photo}" alt="чек" />
                                </div>`;
                } else {
                    photoHtml = `<div class="event-photo" style="color:#b0b8c5;">📷</div>`;
                }

                let returnBadge = '';
                if (e.type === 'return_full') {
                    returnBadge = `<span class="return-badge">✅ Полный</span>`;
                } else if (e.type === 'return_partial') {
                    returnBadge = `<span class="return-badge partial">🔄 Частичный</span>`;
                }

                const startDateFormatted = formatDate(e.startDate);
                const returnDateFormatted = e.returnDate ? formatDate(e.returnDate) : 'не указана';

                html += `
                        <div class="event-item" style="border-left-color: ${e.type === 'return_full' ? '#34c759' : e.type === 'return_partial' ? '#ff9500' : '#007aff'}">
                            <div class="event-top">
                                <div class="event-info">
                                    <div class="event-title">
                                        ${typeLabels[e.type] || e.type}
                                        ${returnBadge}
                                    </div>
                                    <div class="event-sub">
                                        ${e.counterparty} ${e.note ? '· ' + e.note : ''}
                                    </div>
                                    <div class="event-dates">
                                        📆 ${startDateFormatted} → ${returnDateFormatted}
                                        ${dateHint ? ' · ' + dateHint : ''}
                                    </div>
                                </div>
                                <div class="event-amount ${colorClass}">${amountDisplay}</div>
                            </div>
                            <div class="event-row">
                                ${photoHtml}
                                <div class="event-actions">
                                    <button onclick="editEvent('${e.id}')" title="Редактировать">✎</button>
                                    <button onclick="deleteEvent('${e.id}')" title="Удалить">✕</button>
                                </div>
                            </div>
                        </div>
                    `;
            });

            html += `
                    <button class="btn-save" style="margin-top:10px;padding:10px 20px;border:none;border-radius:14px;background:#007aff;color:white;font-weight:600;cursor:pointer;font-size:14px;width:100%;" onclick="openCreateModalForDate(${year},${month},${day})">
                        ＋ Добавить запись
                    </button>
                `;

            dayEventsEl.innerHTML = html;
        }

        // ---- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----
        function getMonthName(month) {
            const names = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
            ];
            return names[month];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const parts = dateStr.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            const wd = d.getDay() === 0 ? 6 : d.getDay() - 1;
            return `${weekdays[wd]}, ${parseInt(parts[2])} ${getMonthName(parseInt(parts[1])-1).slice(0,3)} ${parts[0]}`;
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) { currentMonth = 11;
                currentYear--; }
            if (currentMonth > 11) { currentMonth = 0;
                currentYear++; }
            renderCalendar();
            if (selectedDate && (selectedDate.month !== currentMonth || selectedDate.year !== currentYear)) {
                const maxDay = new Date(currentYear, currentMonth + 1, 0).getDate();
                if (selectedDate.day > maxDay) {
                    // сбрасываем
                }
                renderDayDetails();
            } else {
                renderDayDetails();
            }
        }

        function goToToday() {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            selectedDate = { year: currentYear, month: currentMonth, day: today.getDate() };
            renderCalendar();
            renderDayDetails();
        }

        // ---- ОТКРЫТИЕ МОДАЛКИ ----
        function openCreateModal() {
            const today = new Date();
            const y = selectedDate ? selectedDate.year : today.getFullYear();
            const m = selectedDate ? selectedDate.month : today.getMonth();
            const d = selectedDate ? selectedDate.day : today.getDate();
            openCreateModalForDate(y, m, d);
        }

        function openCreateModalForDate(year, month, day) {
            modalTitle.textContent = '➕ Добавить запись';
            editId.value = '';
            eventForm.reset();
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            eventStartDate.value = dateStr;
            // Дата возврата по умолчанию +14 дней
            const returnDate = new Date(year, month, day + 14);
            eventReturnDate.value = `${returnDate.getFullYear()}-${String(returnDate.getMonth()+1).padStart(2,'0')}-${String(returnDate.getDate()).padStart(2,'0')}`;
            eventType.value = 'lent';
            currentPhotoData = null;
            photoPreview.style.display = 'none';
            photoPlaceholder.style.display = 'block';
            removePhotoBtn.style.display = 'none';
            modalOverlay.classList.add('open');
            eventCounterparty.focus();
        }

        function editEvent(id) {
            const e = events.find(ev => ev.id === id);
            if (!e) return;
            modalTitle.textContent = '✎ Редактировать запись';
            editId.value = e.id;
            eventStartDate.value = e.startDate;
            eventReturnDate.value = e.returnDate || '';
            eventType.value = e.type;
            eventCounterparty.value = e.counterparty;
            eventAmount.value = e.amount;
            eventNote.value = e.note || '';
            currentPhotoData = e.photo || null;
            if (currentPhotoData) {
                photoPreview.src = currentPhotoData;
                photoPreview.style.display = 'block';
                photoPlaceholder.style.display = 'none';
                removePhotoBtn.style.display = 'block';
            } else {
                photoPreview.style.display = 'none';
                photoPlaceholder.style.display = 'block';
                removePhotoBtn.style.display = 'none';
            }
            modalOverlay.classList.add('open');
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            currentPhotoData = null;
        }

        function deleteEvent(id) {
            if (!confirm('Удалить эту запись?')) return;
            events = events.filter(e => e.id !== id);
            saveData();
            renderCalendar();
            renderDayDetails();
            showToast('🗑️ Запись удалена');
        }

        // ---- ОБРАБОТКА ФОРМЫ ----
        function handleFormSubmit(e) {
            e.preventDefault();

            const startDate = eventStartDate.value;
            const returnDate = eventReturnDate.value;
            const type = eventType.value;
            const counterparty = eventCounterparty.value.trim();
            const amount = parseFloat(eventAmount.value);
            const note = eventNote.value.trim();

            if (!startDate || !counterparty || !amount || amount <= 0) {
                showToast('⚠️ Заполните все обязательные поля');
                return;
            }

            const editIdVal = editId.value;

            if (editIdVal) {
                const idx = events.findIndex(ev => ev.id === editIdVal);
                if (idx === -1) return;
                events[idx] = {
                    ...events[idx],
                    startDate,
                    returnDate: returnDate || null,
                    type,
                    counterparty,
                    amount,
                    note,
                    photo: currentPhotoData || events[idx].photo
                };
                showToast('✅ Запись обновлена');
            } else {
                const newEvent = {
                    id: generateId(),
                    startDate,
                    returnDate: returnDate || null,
                    type,
                    counterparty,
                    amount,
                    note,
                    photo: currentPhotoData || null
                };
                events.push(newEvent);
                showToast('✅ Запись добавлена');
            }

            saveData();
            closeModal();
            renderCalendar();

            const [y, m, d] = startDate.split('-').map(Number);
            selectedDate = { year: y, month: m - 1, day: d };
            renderDayDetails();
        }

        // ---- ФОТО ----
        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('⚠️ Пожалуйста, выберите изображение');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
                currentPhotoData = ev.target.result;
                photoPreview.src = currentPhotoData;
                photoPreview.style.display = 'block';
                photoPlaceholder.style.display = 'none';
                removePhotoBtn.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            currentPhotoData = null;
            photoPreview.style.display = 'none';
            photoPlaceholder.style.display = 'block';
            removePhotoBtn.style.display = 'none';
            photoInput.value = '';
        }

        function viewPhoto(photoData) {
            if (!photoData) return;
            window.open(photoData, '_blank');
        }

        // ---- ТОСТ ----
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ---- СОБЫТИЯ ----
        function bindEvents() {
            eventForm.addEventListener('submit', handleFormSubmit);
            photoInput.addEventListener('change', handlePhotoUpload);
            removePhotoBtn.addEventListener('click', removePhoto);

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            let touchStartY = 0;
            const modalEl = document.querySelector('.modal');
            modalEl.addEventListener('touchstart', function(e) {
                touchStartY = e.touches[0].clientY;
            });
            modalEl.addEventListener('touchmove', function(e) {
                const diff = e.touches[0].clientY - touchStartY;
                if (diff > 80) {
                    closeModal();
                }
            });
        }

        // ---- СТАРТ ----
        document.addEventListener('DOMContentLoaded', init);

        window.changeMonth = changeMonth;
        window.goToToday = goToToday;
        window.openCreateModal = openCreateModal;
        window.openCreateModalForDate = openCreateModalForDate;
        window.editEvent = editEvent;
        window.deleteEvent = deleteEvent;
        window.closeModal = closeModal;
        window.viewPhoto = viewPhoto;
    </script>

</body>
</html>
