<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LVL UP · RPG Planner</title>
<style>
  /* === Сброс и базовые стили === */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  #app {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #16213e;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    background: #0f3460;
    border-bottom: 2px solid #e94560;
  }

  .logo {
    font-size: 1.8rem;
    color: #e94560;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(233,69,96,0.6);
  }

  .btn-icon {
    background: none;
    border: none;
    color: #e0e0e0;
    font-size: 1.8rem;
    cursor: pointer;
  }

  /* Навигация */
  .main-nav {
    background: #0f3460;
    border-bottom: 2px solid #e94560;
    padding: 0.5rem;
  }

  .main-nav.hidden {
    display: none;
  }

  .main-nav ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }

  .main-nav li {
    background: #16213e;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid transparent;
    font-size: 0.9rem;
  }

  .main-nav li:hover {
    border-color: #e94560;
    color: #e94560;
    box-shadow: 0 0 10px rgba(233,69,96,0.4);
  }

  /* Контент */
  #screenContainer {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
  }

  /* Экран профиля (пример) */
  .profile-card {
    background: #0f3460;
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1rem;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #e94560;
    margin: 0 auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
  }

  .xp-bar {
    background: #1a1a2e;
    height: 10px;
    border-radius: 5px;
    margin: 0.5rem 0;
    overflow: hidden;
  }

  .xp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e94560, #ff6b6b);
    border-radius: 5px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin: 1rem 0;
  }

  .stat-item {
    background: #16213e;
    padding: 0.8rem;
    border-radius: 10px;
    text-align: center;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: bold;
    color: #e94560;
  }

  .btn {
    background: #e94560;
    border: none;
    color: white;
    padding: 0.8rem 1.5rem;
    border-radius: 25px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    background: #c23152;
    box-shadow: 0 0 15px rgba(233,69,96,0.5);
  }

  .hidden {
    display: none;
  }

  /* Адаптив для телефона */
  @media (max-width: 480px) {
    .main-nav li {
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
    }
/* Экран квестов */
.quest-form-toggle {
  background: #e94560;
  border: none;
  color: white;
  padding: 0.7rem 1.2rem;
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
  width: 100%;
  margin-bottom: 1rem;
  transition: 0.3s;
}
.quest-form-toggle:hover {
  background: #c23152;
  box-shadow: 0 0 12px rgba(233,69,96,0.5);
}
.quest-form {
  background: #0f3460;
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  display: none;
}
.quest-form.active {
  display: block;
}
.quest-form input,
.quest-form select,
.quest-form textarea {
  width: 100%;
  margin-bottom: 0.8rem;
  padding: 0.7rem;
  border-radius: 10px;
  border: 1px solid #2a2a4a;
  background: #16213e;
  color: #e0e0e0;
  font-size: 1rem;
}
.quest-form label {
  display: block;
  margin-bottom: 0.3rem;
  font-weight: bold;
  color: #e94560;
}
.quest-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.quest-item {
  background: #0f3460;
  border-radius: 12px;
  padding: 1rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  border-left: 6px solid #e94560;
  transition: 0.3s;
}
.quest-item.completed {
  opacity: 0.5;
  border-left-color: #4ecca3;
  text-decoration: line-through;
}
.quest-info {
  flex: 1;
}
.quest-title {
  font-weight: bold;
  font-size: 1.1rem;
}
.quest-meta {
  font-size: 0.8rem;
  color: #a0a0b0;
}
.quest-actions button {
  background: #e94560;
  border: none;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}
.quest-actions button:disabled {
  background: #555;
  cursor: not-allowed;
}
.guild-badge {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: bold;
  text-transform: uppercase;
  margin-right: 0.5rem;
}
  /* === Календарь === */
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}
.calendar-header h2 {
  font-size: 1.5rem;
  color: #e94560;
  margin: 0;
}
.calendar-nav {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
.calendar-nav button {
  background: #0f3460;
  border: 1px solid #2a2a4a;
  color: #e0e0e0;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
}
.calendar-nav button:hover {
  background: #e94560;
  border-color: #e94560;
}

/* Переключение режимов */
.view-switcher {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  justify-content: center;
}
.view-switcher button {
  background: #16213e;
  border: 1px solid #2a2a4a;
  color: #e0e0e0;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: 0.3s;
}
.view-switcher button.active {
  background: #e94560;
  border-color: #e94560;
  color: white;
  font-weight: bold;
}

/* Сетка месяца */
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
  margin-bottom: 1rem;
}
.weekday-header {
  color: #a0a0b0;
  font-size: 0.8rem;
  padding: 0.5rem 0;
  font-weight: bold;
}
.day-cell {
  background: #0f3460;
  border-radius: 8px;
  padding: 0.5rem;
  min-height: 50px;
  cursor: pointer;
  position: relative;
  transition: 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.day-cell:hover {
  background: #1a1a3e;
  box-shadow: 0 0 10px rgba(233,69,96,0.3);
}
.day-cell.today {
  border: 2px solid #e94560;
}
.day-cell.other-month {
  opacity: 0.4;
}
.day-number {
  font-size: 0.9rem;
  font-weight: bold;
}
.markers {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  margin-top: 4px;
  justify-content: center;
}
.marker {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #e94560;
}
.marker.completed {
  background: #4ecca3;
}
.marker.planned {
  background: #f5a623;
}
.marker.overdue {
  background: #e94560;
  box-shadow: 0 0 5px red;
}

/* Неделя и день */
.week-list, .day-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.week-day-block, .day-hour-block {
  background: #0f3460;
  border-radius: 10px;
  padding: 0.8rem;
}
.week-day-block h3 {
  margin: 0 0 0.5rem 0;
  color: #e94560;
}
.quest-item.mini {
  background: #16213e;
  border-radius: 8px;
  padding: 0.6rem;
  margin: 0.3rem 0;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.quest-item.mini .guild-badge {
  transform: scale(0.8);
}

/* Фильтры гильдий */
.guild-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1rem;
  justify-content: center;
}
.guild-filter-btn {
  background: #16213e;
  border: 1px solid #2a2a4a;
  color: #e0e0e0;
  padding: 0.3rem 0.8rem;
  border-radius: 15px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: 0.2s;
}
.guild-filter-btn.active {
  background: #e94560;
  border-color: #e94560;
  color: white;
  font-weight: bold;
}
  }
  </style>
</head>
<body>
  <div id="app">
    <!-- Шапка -->
    <header class="app-header">
      <h1 class="logo">⚔️ LVL UP</h1>
      <button id="menuToggle" class="btn-icon" aria-label="Меню">☰</button>
    </header>

    <!-- Навигация (боковая панель, скрыта по умолчанию) -->
    <nav id="mainNav" class="main-nav hidden">
      <ul>
        <li data-screen="profile">🧙 Профиль</li>
        <li data-screen="calendar">📅 Календарь</li>
        <li data-screen="tasks">📋 Квесты</li>
        <li data-screen="guilds">🛡️ Гильдии</li>
        <li data-screen="goals">🎯 Эпик-квесты</li>
        <li data-screen="notes">📝 Заметки</li>
        <li data-screen="gallery">🖼️ Галерея</li>
        <li data-screen="stats">📊 Статистика</li>
        <li data-screen="settings">⚙️ Настройки</li>
        <li data-screen="info">ℹ️ Инфо</li>
      </ul>
    </nav>

    <!-- Основной контент -->
    <main id="screenContainer">
      <!-- Контент экранов будет рендериться динамически -->
    </main>
  </div>

<script>
  // Состояние календаря
const CalendarState = {
  currentDate: new Date(), // дата, которую мы просматриваем
  view: 'month', // 'month', 'week', 'day'
  selectedDay: null, // дата для просмотра дня
  guildFilter: null // id гильдии или null (все)
};
  // === Гильдии ===
  const GUILDS = [
    { id: 'body', name: 'Тело', icon: '💪', color: '#e94560' },
    { id: 'creativity', name: 'Творчество', icon: '🎨', color: '#f5a623' },
    { id: 'business', name: 'Бизнес', icon: '💼', color: '#4a90e2' },
    { id: 'habits', name: 'Привычки', icon: '🔄', color: '#7ed321' },
    { id: 'oneoff', name: 'Одноразки', icon: '🗑️', color: '#b8b8b8' },
    { id: 'travel', name: 'Путешествия', icon: '✈️', color: '#50e3c2' },
    { id: 'debts', name: 'Долги', icon: '💰', color: '#f8e71c' },
    { id: 'other', name: 'Другое', icon: '📦', color: '#9b9b9b' },
    { id: 'nutrition', name: 'Питание', icon: '🍎', color: '#f06292' }
  ];

  // === Хранилище ===
  const Storage = {
    get(key, defaultValue = null) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : defaultValue;
    },
    set(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
  };

  // === Игровое состояние ===
  const GameState = {
    player: {
      name: 'Александр',
      lvl: 1,
      xp: 0.5,
      streak: 0,
      lastCompletedDate: null, // 'YYYY-MM-DD'
      get xpToNext() {
        return this.lvl * (this.lvl + 1) / 2;
      },
      get progress() {
        const currentLvlTotal = (this.lvl - 1) * this.lvl / 2;
        const needed = this.xpToNext - currentLvlTotal;
        const currentXp = this.xp - currentLvlTotal;
        return Math.min((currentXp / needed) * 100, 100).toFixed(0);
      }
    },
    tasks: Storage.get('tasks', [])
  };

  // Сохраняем игрока и задачи
  function savePlayer() {
    Storage.set('player', GameState.player);
  }
  function saveTasks() {
    Storage.set('tasks', GameState.tasks);
  }

  // === Навигация ===
  const menuToggle = document.getElementById('menuToggle');
  const mainNav = document.getElementById('mainNav');
  const screenContainer = document.getElementById('screenContainer');

  menuToggle.addEventListener('click', () => {
    mainNav.classList.toggle('hidden');
  });

  document.querySelectorAll('.main-nav li').forEach(item => {
    item.addEventListener('click', (e) => {
      const screen = e.target.dataset.screen;
      renderScreen(screen);
      mainNav.classList.add('hidden');
    });
  });

  function renderScreen(screen) {
    switch (screen) {
      case 'profile': renderProfile(); break;
      case 'calendar': renderCalendar(); break;
      case 'tasks': renderTasks(); break;
      case 'guilds': renderGuilds(); break;
      case 'goals': renderGoals(); break;
      case 'notes': renderNotes(); break;
      case 'gallery': renderGallery(); break;
      case 'stats': renderStats(); break;
      case 'settings': renderSettings(); break;
      case 'info': renderInfo(); break;
      default: renderProfile();
    }
  }

  // === Профиль ===
  function renderProfile() {
    const p = GameState.player;
    const html = `
      <div class="profile-card">
        <div class="avatar">🧙</div>
        <h2>${p.name}</h2>
        <p>Уровень ${p.lvl} · ${p.xp.toFixed(1)} XP</p>
        <div class="xp-bar">
          <div class="xp-fill" style="width: ${p.progress}%;"></div>
        </div>
        <p style="font-size:0.8rem;">До следующего уровня: ${p.progress}%</p>
        <div class="stats-grid">
          <div class="stat-item"><span class="stat-value">${GameState.tasks.filter(t => t.completed).length}</span><br>Выполнено</div>
          <div class="stat-item"><span class="stat-value">${p.streak}</span><br>🔥 Комбо</div>
        </div>
      </div>
    `;
    screenContainer.innerHTML = html;
  }

  // === Квесты ===
  function renderTasks() {
    const activeTasks = GameState.tasks.filter(t => !t.completed).sort((a, b) => {
      if (a.date < b.date) return -1;
      if (a.date > b.date) return 1;
      return a.time.localeCompare(b.time);
    });

    const guildOptions = GUILDS.map(g => `<option value="${g.id}">${g.icon} ${g.name}</option>`).join('');

    let tasksHtml = activeTasks.length === 0 
      ? '<p style="text-align:center; margin-top:2rem;">Нет активных квестов. Создай первый!</p>'
      : activeTasks.map(task => {
          const guild = GUILDS.find(g => g.id === task.category) || GUILDS[7];
          const today = new Date().toISOString().slice(0, 10);
          const isFuture = task.date > today;
          const disableComplete = isFuture || task.completed;
          return `
            <div class="quest-item ${task.completed ? 'completed' : ''}" style="border-left-color: ${guild.color};">
              <div class="quest-info">
                <div class="quest-title">
                  <span class="guild-badge" style="background:${guild.color}; color:white;">${guild.icon} ${guild.name}</span>
                  ${task.title}
                </div>
                <div class="quest-meta">
                  📅 ${task.date} 🕒 ${task.time} · ⏱️ ${task.minutes} мин
                  ${task.note ? `<br>📝 ${task.note}` : ''}
                </div>
              </div>
              <div class="quest-actions">
                <button ${disableComplete ? 'disabled' : ''} 
                        onclick="completeQuest('${task.id}')">
                  ✔ Выполнить
                </button>
              </div>
            </div>
          `;
        }).join('');

    const html = `
      <button class="quest-form-toggle" onclick="toggleQuestForm()">➕ Новый квест</button>
      <div id="questForm" class="quest-form">
        <form onsubmit="addQuest(event)">
          <label>Гильдия</label>
          <select id="questCategory" required>${guildOptions}</select>
          <label>Название</label>
          <input type="text" id="questTitle" required placeholder="Что нужно сделать?">
          <label>Продолжительность (мин)</label>
          <input type="number" id="questMinutes" required min="1" value="30" placeholder="Минуты">
          <label>Дата</label>
          <input type="date" id="questDate" required>
          <label>Время</label>
          <input type="time" id="questTime" required>
          <label>Заметка (опционально)</label>
          <textarea id="questNote" rows="2" placeholder="Детали..."></textarea>
          <button type="submit" class="btn" style="width:100%;">Создать квест</button>
        </form>
      </div>
      <div class="quest-list">${tasksHtml}</div>
    `;
    screenContainer.innerHTML = html;

    // Установим дату по умолчанию = сегодня
    const dateInput = document.getElementById('questDate');
    if (dateInput) {
      dateInput.value = new Date().toISOString().slice(0, 10);
    }
    const timeInput = document.getElementById('questTime');
    if (timeInput) {
      timeInput.value = new Date().toTimeString().slice(0, 5);
    }
  }

  function toggleQuestForm() {
    const form = document.getElementById('questForm');
    if (form) form.classList.toggle('active');
  }

  function addQuest(event) {
    event.preventDefault();
    const category = document.getElementById('questCategory').value;
    const title = document.getElementById('questTitle').value.trim();
    const minutes = parseInt(document.getElementById('questMinutes').value, 10);
    const date = document.getElementById('questDate').value;
    const time = document.getElementById('questTime').value;
    const note = document.getElementById('questNote').value.trim();

    if (!title || !date || !time || isNaN(minutes) || minutes <= 0) return;

    const newQuest = {
      id: Date.now().toString(36) + Math.random().toString(36).substr(2),
      category,
      title,
      minutes,
      date,
      time,
      note,
      completed: false,
      dateCompleted: null,
      createdAt: new Date().toISOString()
    };

    GameState.tasks.push(newQuest);
    saveTasks();
    renderTasks(); // обновим список
  }

  function completeQuest(id) {
    const task = GameState.tasks.find(t => t.id === id);
    if (!task || task.completed) return;

    const today = new Date().toISOString().slice(0, 10);
    if (task.date > today) {
      alert('Этот квест запланирован на будущее, выполнить нельзя!');
      return;
    }

    task.completed = true;
    task.dateCompleted = today;

    // Начисляем XP = минуты * 0.01
    const gainedXp = task.minutes * 0.01;
    GameState.player.xp += gainedXp;
    checkLevelUp();

    // Обновляем стрик
    updateStreak(today);

    saveTasks();
    savePlayer();
    renderTasks();
  }

  function updateStreak(today) {
    const p = GameState.player;
    const lastDate = p.lastCompletedDate;

    if (lastDate === today) {
      // Уже была выполнена задача сегодня, стрик не меняем
      return;
    }

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().slice(0, 10);

    if (lastDate === yesterdayStr) {
      p.streak += 1;
    } else if (lastDate !== today) {
      p.streak = 1; // сброс или начало нового
    }

    p.lastCompletedDate = today;
    savePlayer();
  }

  function checkLevelUp() {
    const p = GameState.player;
    let neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2;
    while (p.xp >= neededForNext) {
      p.lvl++;
      neededForNext = (p.lvl + 1) * (p.lvl + 2) / 2;
    }
    savePlayer();
  }

  function getGuildColor(categoryId) {
    const guild = GUILDS.find(g => g.id === categoryId);
    return guild ? guild.color : '#9b9b9b';
  }

  // === Остальные экраны-заглушки ===
  // === Календарь ===

function renderCalendar() {
  const { currentDate, view, selectedDay, guildFilter } = CalendarState;
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  // Заголовок с навигацией
  let headerHtml = '';
  if (view === 'month') {
    headerHtml = `<h2>${currentDate.toLocaleString('ru', { month: 'long' })} ${year}</h2>`;
  } else if (view === 'week') {
    const startOfWeek = getStartOfWeek(currentDate);
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(endOfWeek.getDate() + 6);
    headerHtml = `<h2>Неделя ${startOfWeek.getDate()} – ${endOfWeek.getDate()} ${endOfWeek.toLocaleString('ru', { month: 'long' })} ${endOfWeek.getFullYear()}</h2>`;
  } else if (view === 'day') {
    const displayDate = selectedDay || currentDate;
    headerHtml = `<h2>${displayDate.toLocaleDateString('ru', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h2>`;
  }

  // Кнопки переключения вида
  const viewSwitcher = `
    <div class="view-switcher">
      <button class="${view === 'month' ? 'active' : ''}" onclick="setCalendarView('month')">Месяц</button>
      <button class="${view === 'week' ? 'active' : ''}" onclick="setCalendarView('week')">Неделя</button>
      <button class="${view === 'day' ? 'active' : ''}" onclick="setCalendarView('day')">День</button>
    </div>
  `;

  // Фильтр по гильдиям
  const filterHtml = `
    <div class="guild-filter">
      <button class="guild-filter-btn ${guildFilter === null ? 'active' : ''}" onclick="setGuildFilter(null)">Все</button>
      ${GUILDS.map(g => `
        <button class="guild-filter-btn ${guildFilter === g.id ? 'active' : ''}" onclick="setGuildFilter('${g.id}')" style="border-color: ${g.color}; color: ${g.color};">
          ${g.icon} ${g.name}
        </button>
      `).join('')}
    </div>
  `;

  // Основное содержимое в зависимости от вида
  let contentHtml = '';
  if (view === 'month') {
    contentHtml = renderMonthView(year, month, guildFilter);
  } else if (view === 'week') {
    contentHtml = renderWeekView(currentDate, guildFilter);
  } else if (view === 'day') {
    contentHtml = renderDayView(selectedDay || currentDate, guildFilter);
  }

  const html = `
    <div class="calendar-header">
      ${headerHtml}
      <div class="calendar-nav">
        <button onclick="navigateCalendar(-1)">◀</button>
        <button onclick="navigateCalendar(1)">▶</button>
        <button onclick="resetCalendarToday()">Сегодня</button>
      </div>
    </div>
    ${viewSwitcher}
    ${filterHtml}
    ${contentHtml}
  `;
  screenContainer.innerHTML = html;
}

function setCalendarView(view) {
  CalendarState.view = view;
  if (view === 'day' && !CalendarState.selectedDay) {
    CalendarState.selectedDay = new Date();
  }
  renderCalendar();
}

function setGuildFilter(guildId) {
  CalendarState.guildFilter = guildId;
  renderCalendar();
}

function navigateCalendar(delta) {
  const { view, currentDate } = CalendarState;
  if (view === 'month') {
    currentDate.setMonth(currentDate.getMonth() + delta);
  } else if (view === 'week') {
    currentDate.setDate(currentDate.getDate() + delta * 7);
  } else if (view === 'day') {
    const d = CalendarState.selectedDay || currentDate;
    d.setDate(d.getDate() + delta);
    CalendarState.selectedDay = new Date(d);
    CalendarState.currentDate = new Date(d); // синхронизируем
    renderCalendar();
    return;
  }
  CalendarState.currentDate = new Date(currentDate);
  renderCalendar();
}

function resetCalendarToday() {
  CalendarState.currentDate = new Date();
  CalendarState.selectedDay = new Date();
  renderCalendar();
}

function getStartOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0 - вс, 1 - пн ... 6 - сб
  const diff = d.getDate() - day + (day === 0 ? -6 : 1); // понедельник
  return new Date(d.setDate(diff));
}

// Получить задачи, отфильтрованные по гильдии
function getFilteredTasks(guildFilter) {
  let tasks = GameState.tasks;
  if (guildFilter) {
    tasks = tasks.filter(t => t.category === guildFilter);
  }
  return tasks;
}

// Отрисовка месяца
function renderMonthView(year, month, guildFilter) {
  const tasks = getFilteredTasks(guildFilter);
  const firstDay = new Date(year, month, 1).getDay(); // 0 вс
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDay = firstDay === 0 ? 6 : firstDay - 1; // переводим на пн=0

  const today = new Date();
  today.setHours(0,0,0,0);
  const currentMonth = today.getMonth();
  const currentYear = today.getFullYear();

  // Дни недели
  const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  let grid = '<div class="weekday-header">' + weekdays.map(d => `<div>${d}</div>`).join('') + '</div>';
  grid += '<div class="month-grid">';

  // Пустые ячейки до начала месяца
  for (let i = 0; i < startDay; i++) {
    grid += '<div class="day-cell other-month"></div>';
  }

  // Дни месяца
  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const dateStr = date.toISOString().slice(0,10);
    const isToday = date.getTime() === today.getTime() && month === currentMonth && year === currentYear;
    const cellClass = `day-cell ${isToday ? 'today' : ''}`;

    // Собираем маркеры для этого дня
    const dayTasks = tasks.filter(t => t.date === dateStr);
    const markers = dayTasks.map(task => {
      let cls = 'marker planned';
      if (task.completed) cls = 'marker completed';
      else if (task.date < today.toISOString().slice(0,10) && !task.completed) cls = 'marker overdue';
      const color = getGuildColor(task.category);
      return `<span class="${cls}" style="background: ${color};"></span>`;
    }).join('');

    grid += `
      <div class="${cellClass}" onclick="goToDay('${dateStr}')">
        <div class="day-number">${day}</div>
        <div class="markers">${markers}</div>
      </div>
    `;
  }

  grid += '</div>';
  return grid;
}

// Отрисовка недели
function renderWeekView(date, guildFilter) {
  const tasks = getFilteredTasks(guildFilter);
  const startOfWeek = getStartOfWeek(date);
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(startOfWeek);
    d.setDate(d.getDate() + i);
    weekDays.push(d);
  }

  let html = '<div class="week-list">';
  weekDays.forEach(day => {
    const dateStr = day.toISOString().slice(0,10);
    const dayTasks = tasks.filter(t => t.date === dateStr);
    const dayName = day.toLocaleDateString('ru', { weekday: 'short', day: 'numeric', month: 'short' });
    html += `<div class="week-day-block">
      <h3>${dayName}</h3>
      ${dayTasks.length === 0 ? '<p style="color:#a0a0b0; font-size:0.8rem;">Нет задач</p>' : dayTasks.map(task => {
        const guild = GUILDS.find(g => g.id === task.category) || GUILDS[7];
        return `<div class="quest-item mini" style="border-left: 4px solid ${guild.color};">
          <span class="guild-badge" style="background:${guild.color}; color:white;">${guild.icon}</span>
          ${task.title} ${task.completed ? '✅' : ''}
        </div>`;
      }).join('')}
    </div>`;
  });
  html += '</div>';
  return html;
}

// Отрисовка дня (по часам, упрощённо)
function renderDayView(date, guildFilter) {
  const tasks = getFilteredTasks(guildFilter);
  const dateStr = date.toISOString().slice(0,10);
  const dayTasks = tasks.filter(t => t.date === dateStr);
  dayTasks.sort((a, b) => a.time.localeCompare(b.time));

  let html = '<div class="day-list">';
  if (dayTasks.length === 0) {
    html += '<p style="text-align:center; margin-top:2rem;">Нет задач на этот день.</p>';
  } else {
    dayTasks.forEach(task => {
      const guild = GUILDS.find(g => g.id === task.category) || GUILDS[7];
      html += `<div class="quest-item mini" style="border-left: 4px solid ${guild.color};">
        <span class="guild-badge" style="background:${guild.color}; color:white;">${guild.icon}</span>
        <div style="flex:1;">
          <strong>${task.time}</strong> — ${task.title} ${task.completed ? '✅' : ''}
          <div style="font-size:0.7rem; color:#a0a0b0;">${task.minutes} мин</div>
        </div>
      </div>`;
    });
  }
  html += '</div>';
  return html;
}

// Переход в день из месяца
function goToDay(dateStr) {
  CalendarState.selectedDay = new Date(dateStr);
  CalendarState.view = 'day';
  renderCalendar();
}
  function renderGuilds() { 
    const guildList = GUILDS.map(g => `<p style="color:${g.color}">${g.icon} ${g.name}</p>`).join('');
    screenContainer.innerHTML = `<h2>🛡️ Гильдии</h2>${guildList}<p>Кастомизация позже.</p>`; 
  }
  function renderGoals() { screenContainer.innerHTML = '<h2>🎯 Эпик-квесты</h2><p>Цели с наградой +1 XP.</p>'; }
  function renderNotes() { screenContainer.innerHTML = '<h2>📝 Заметки</h2><p>Заметки (в разработке).</p>'; }
  function renderGallery() { screenContainer.innerHTML = '<h2>🖼️ Галерея</h2><p>Фото успехов.</p>'; }
  function renderStats() { screenContainer.innerHTML = '<h2>📊 Статистика</h2><p>Графики позже.</p>'; }
  function renderSettings() { screenContainer.innerHTML = '<h2>⚙️ Настройки</h2><p>Темы, экспорт/импорт.</p>'; }
  function renderInfo() { screenContainer.innerHTML = '<h2>ℹ️ Инфо</h2><p>Описание РПГ-системы.</p>'; }

  // === Инициализация ===
  const savedPlayer = Storage.get('player');
  if (savedPlayer) {
    GameState.player = { ...GameState.player, ...savedPlayer };
  }
  renderScreen('profile');
</script>
