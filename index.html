<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>SkillQuest — Personal Growth OS</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#f0f2f8;--text:#171827;--muted:#73768a;
  --primary:#6d5dfc;--primary2:#8f83ff;--success:#18b981;--warning:#f5a524;--danger:#ef5b6b;
  --border:rgba(25,25,45,.08);--shadow:0 14px 45px rgba(35,32,75,.09);--r:22px;--r2:15px;
  --nav:76px;--max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at 10% 0%,rgba(109,93,252,.10),transparent 28%),var(--bg);color:var(--text);
min-height:100vh;padding-bottom:calc(var(--nav) + 25px);line-height:1.45}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:var(--max);margin:auto;padding:18px 18px 0}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 10px 25px rgba(109,93,252,.28)}
.brand h1{font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px}
.top-actions{display:flex;gap:8px;align-items:center}.icon-btn,.avatar-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--text)}
.avatar-btn{overflow:hidden;font-weight:800}.avatar-btn img{width:100%;height:100%;object-fit:cover}
.page{display:none}.page.active{display:block;animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:rgba(255,255,255,.84);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.dark{--bg:#0e1018;--surface:#171a25;--surface2:#202432;--text:#f2f3f7;--muted:#9a9eb0;--border:rgba(255,255,255,.08);--shadow:0 18px 55px rgba(0,0,0,.28)}
.dark body{background:radial-gradient(circle at 10% 0%,rgba(109,93,252,.15),transparent 28%),var(--bg)}
.dark .card,.dark .icon-btn,.dark .avatar-btn{background:rgba(23,26,37,.88)}
.hero{position:relative;overflow:hidden;padding:26px;background:linear-gradient(135deg,#6253ee,#8e80ff);color:#fff;border:0}
.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-70px;top:-100px;background:rgba(255,255,255,.12)}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:1}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;opacity:.78;font-weight:800}.hero h2{font-size:32px;line-height:1.05;margin:6px 0}.hero p{opacity:.8}
.level-ring{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),rgba(255,255,255,.18) 0);position:relative}
.level-ring:before{content:"";position:absolute;inset:8px;background:#6d5dfc;border-radius:50%}.level-ring b{position:relative;font-size:24px}
.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.stat-value{font-size:28px;font-weight:850;margin-top:8px}.stat-sub{color:var(--muted);font-size:12px;margin-top:3px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:19px}.section-head p{color:var(--muted);font-size:13px}
.btn{min-height:40px;padding:0 15px;border-radius:13px;background:var(--primary);color:#fff;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.success{background:var(--success)}.btn.danger{background:var(--danger)}
.btn.sm{min-height:34px;padding:0 11px;font-size:12px;border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 11px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:750;border:1px solid var(--border)}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.progress{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:inherit}
.journal{padding:16px}.journal-head{display:flex;align-items:center;gap:10px}.journal-icon{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:21px}.journal h3{font-size:15px}.journal small{color:var(--muted)}.journal .xp{margin-left:auto;font-weight:850;font-size:13px}.journal .progress{margin-top:13px}
.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.task:last-child{border-bottom:0}.task-icon{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center}.task-main{min-width:0;flex:1}.task-title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{color:var(--muted);font-size:12px;margin-top:3px}.task-status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px}.done{background:rgba(24,185,129,.12);color:var(--success)}.pending{background:rgba(109,93,252,.11);color:var(--primary)}.missed{background:rgba(239,91,107,.12);color:var(--danger)}
.chart{height:240px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart-grid{stroke:var(--border);stroke-width:1}.chart-label{fill:var(--muted);font-size:10px}.chart-line{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-area{fill:url(#areaGrad);opacity:.25}.bar{fill:var(--primary);opacity:.82}.bar:hover{opacity:1}.donut-wrap{display:flex;align-items:center;gap:20px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--primary) 0 var(--done),var(--danger) var(--done) var(--total),var(--surface2) var(--total) 100%);display:grid;place-items:center}.donut:after{content:"";width:92px;height:92px;border-radius:50%;background:var(--surface);position:absolute}.donut-center{position:relative;z-index:1;text-align:center}.donut-center b{font-size:24px;display:block}.legend{display:grid;gap:10px;flex:1}.legend div{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--primary)}.dot.red{background:var(--danger)}.dot.gray{background:var(--surface2)}
.empty{text-align:center;padding:34px 15px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}
.list{display:grid;gap:10px}.goal{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.goal-top{display:flex;justify-content:space-between;gap:10px}.goal h3{font-size:15px}.goal p{font-size:12px;color:var(--muted);margin-top:4px}.goal .progress{margin-top:13px}.goal-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}
.table-wrap{overflow:auto}.mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table th,.mini-table td{padding:10px;border-bottom:1px solid var(--border);text-align:left}.mini-table th{color:var(--muted);font-size:11px;text-transform:uppercase}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.calendar-title{font-weight:800}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head{font-size:10px;color:var(--muted);text-align:center;padding:5px}.cal-cell{min-height:76px;border:1px solid var(--border);border-radius:12px;padding:7px;background:var(--surface2);cursor:pointer}.cal-cell.other{opacity:.35}.cal-cell.today{outline:2px solid var(--primary)}.cal-cell .day{font-weight:800;font-size:12px}.cal-dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}.cal-dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}.cal-dot.done{background:var(--success)}.cal-dot.missed{background:var(--danger)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:800}.input{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:11px 12px;outline:0}.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(109,93,252,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.58);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}.modal-bg.open{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal-head h2{font-size:19px}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:var(--nav);padding:8px max(10px,calc((100vw - var(--max))/2));background:rgba(255,255,255,.86);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:center;gap:5px}.dark .bottom-nav{background:rgba(17,20,29,.9)}.nav{width:100%;max-width:var(--max);display:flex;justify-content:space-around}.nav button{flex:1;max-width:130px;background:transparent;color:var(--muted);border-radius:14px;padding:7px 4px;font-size:11px;font-weight:750}.nav button b{display:block;font-size:19px;line-height:22px;margin-bottom:2px}.nav button.active{background:var(--primary-bg);color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translate(-50%,20px);opacity:0;z-index:100;padding:12px 16px;border-radius:14px;background:var(--text);color:var(--surface);font-size:13px;font-weight:750;transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.kpi{display:flex;align-items:center;gap:12px}.kpi-icon{width:43px;height:43px;border-radius:14px;background:var(--primary-bg);display:grid;place-items:center;font-size:20px}.kpi b{font-size:20px}.kpi span{display:block;color:var(--muted);font-size:11px}
.note{padding:15px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.note h3{font-size:14px}.note p{white-space:pre-wrap;color:var(--muted);font-size:12px;margin-top:6px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.settings-row:last-child{border-bottom:0}
@media(max-width:800px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.hero h2{font-size:27px}}
@media(max-width:560px){.app{padding:10px 12px 0}.topbar{height:60px}.brand-mark{width:38px;height:38px}.brand h1{font-size:16px}.card{padding:15px;border-radius:18px}.g4,.g3{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero-row{align-items:flex-start}.level-ring{width:82px;height:82px}.level-ring:before{inset:7px}.cal-cell{min-height:57px;padding:5px}.cal-dots{margin-top:7px}.cal-dot{width:6px;height:6px}.chart{height:210px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">⚡</div><div><h1>SkillQuest</h1><small>Personal Growth OS</small></div></div>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" title="Тема">☾</button>
    <button class="avatar-btn" id="avatarBtn" title="Аватар">Г</button>
  </div>
</header>

<section id="home" class="page active"></section>
<section id="analytics" class="page"></section>
<section id="calendar" class="page"></section>
<section id="journals" class="page"></section>
<section id="goals" class="page"></section>
<section id="notes" class="page"></section>
<section id="settings" class="page"></section>
</div>

<nav class="bottom-nav"><div class="nav">
  <button data-page="home" class="active"><b>⌂</b>Главная</button>
  <button data-page="analytics"><b>◔</b>Аналитика</button>
  <button data-page="calendar"><b>▦</b>Календарь</button>
  <button data-page="journals"><b>◉</b>Журналы</button>
  <button data-page="goals"><b>◇</b>Цели</button>
  <button data-page="notes"><b>✎</b>Заметки</button>
  <button data-page="settings"><b>⚙</b>Ещё</button>
</div></nav>

<div class="modal-bg" id="taskModal"><div class="modal">
  <div class="modal-head"><h2 id="taskModalTitle">Новая задача</h2><button class="icon-btn" data-close="taskModal">×</button></div>
  <form id="taskForm" class="form-grid">
    <div class="field full"><label>Название</label><input class="input" id="fTitle" required maxlength="100" placeholder="Например: тренировка"></div>
    <div class="field"><label>Журнал</label><select class="input" id="fJournal"></select></div>
    <div class="field"><label>Длительность, мин</label><input class="input" id="fDuration" type="number" min="1" max="1440" value="30"></div>
    <div class="field"><label>Начало</label><input class="input" id="fStart" type="date" required></div>
    <div class="field"><label>Окончание</label><input class="input" id="fEnd" type="date" required></div>
    <div class="field"><label>Время</label><input class="input" id="fTime" type="time"></div>
    <div class="field"><label>Цель</label><select class="input" id="fGoal"><option value="">Без цели</option></select></div>
    <div class="field full"><label>Дни недели (пусто = каждый день)</label><div class="chips" id="fDays"></div></div>
    <div class="field full"><label>Заметка</label><textarea class="input" id="fNote" rows="3" maxlength="500" placeholder="Необязательно"></textarea></div>
    <div class="field full" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn secondary" data-close="taskModal">Отмена</button><button class="btn" type="submit">Сохранить</button></div>
  </form>
</div></div>

<div class="modal-bg" id="noteModal"><div class="modal">
  <div class="modal-head"><h2>Новая заметка</h2><button class="icon-btn" data-close="noteModal">×</button></div>
  <form id="noteForm" class="form-grid">
    <div class="field full"><label>Текст</label><textarea class="input" id="nText" rows="7" required maxlength="5000" placeholder="Что сегодня важно?"></textarea></div>
    <div class="field full" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn secondary" data-close="noteModal">Отмена</button><button class="btn">Сохранить</button></div>
  </form>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- DATE UTILS: календарные даты без UTC-ловушек ---------- */
const Dates={
  pad:n=>String(n).padStart(2,"0"),
  localDate(d=new Date()){return `${d.getFullYear()}-${this.pad(d.getMonth()+1)}-${this.pad(d.getDate())}`},
  parse(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)},
  add(s,n){const d=this.parse(s);d.setDate(d.getDate()+n);return this.localDate(d)},
  diff(a,b){return Math.round((this.parse(b)-this.parse(a))/86400000)},
  same(a,b){return a===b},
  days(start,end,filter=[]){const out=[];let d=this.parse(start),e=this.parse(end);while(d<=e){const s=this.localDate(d);if(!filter.length||filter.includes(d.getDay()))out.push(s);d.setDate(d.getDate()+1)}return out},
  monthKey(s){return s.slice(0,7)},
  label(s,opts={day:"numeric",month:"short"}){return this.parse(s).toLocaleDateString("ru-RU",opts)}
};

const JOURNALS=[
  {name:"тело",icon:"💪"},{name:"питание",icon:"🍎"},{name:"дела",icon:"📋"},{name:"учеба",icon:"📚"},
  {name:"хобби",icon:"🎨"},{name:"путешествия",icon:"✈️"},{name:"долги",icon:"💰"},{name:"другое",icon:"📌"}
];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const Data={
  key:"skillquest_data",
  version:3,
  state:null,
  listeners:[],
  defaults(){
    return {version:this.version,profile:{name:"Герой",age:25,weight:70,height:175,avatar:null,totalExp:0,level:1,streak:0,lastActive:null},
      journals:JOURNALS.map(j=>({...j,exp:0})),tasks:[],goals:[],weightLog:[],notes:[],photos:[]};
  },
  load(){
    let raw=null;try{raw=JSON.parse(localStorage.getItem(this.key)||"null")}catch{}
    const base=this.defaults();
    if(raw&&typeof raw==="object"){
      this.state={...base,...raw,profile:{...base.profile,...raw.profile},
        journals:Array.isArray(raw.journals)?raw.journals:base.journals,tasks:Array.isArray(raw.tasks)?raw.tasks:[],
        goals:Array.isArray(raw.goals)?raw.goals:[],weightLog:Array.isArray(raw.weightLog)?raw.weightLog:[],
        notes:Array.isArray(raw.notes)?raw.notes:[],photos:Array.isArray(raw.photos)?raw.photos:[]};
    }else this.state=base;
    this.migrate();this.recalcLevel();this.notify();return this.state;
  },
  migrate(){
    this.state.version=this.version;
    this.state.journals=this.state.journals.map(j=>({...j,exp:Number(j.exp)||0}));
    this.state.tasks=this.state.tasks.map(t=>({...t,id:t.id||id(),title:t.title||"Без названия",journal:t.journal||"другое",
      duration:Number(t.duration)||1,startDate:t.startDate||t.date||Dates.localDate(),endDate:t.endDate||t.date||t.startDate||Dates.localDate(),
      daysOfWeek:Array.isArray(t.daysOfWeek)?t.daysOfWeek:[],completedDates:Array.isArray(t.completedDates)?[...new Set(t.completedDates)]:[],
      missedDates:Array.isArray(t.missedDates)?[...new Set(t.missedDates)]:[],note:t.note||"",time:t.time||"",goalId:t.goalId||null}));
  },
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.state));this.notify()}catch(e){Toast("Не удалось сохранить данные. Возможно, переполнено хранилище.","error")}},
  notify(){this.listeners.forEach(fn=>fn())},
  on(fn){this.listeners.push(fn)},
  get journals(){return this.state.journals},get tasks(){return this.state.tasks},get goals(){return this.state.goals},
  profile(){return this.state.profile},
  journal(name){return this.journals.find(j=>j.name===name)},
  occurrences(task){return Dates.days(task.startDate,task.endDate,task.daysOfWeek||[])},
  isScheduled(task,date){return this.occurrences(task).includes(date)},
  status(task,date){
    if(task.completedDates.includes(date))return"done";
    if(task.missedDates.includes(date))return"missed";
    if(date<Dates.localDate())return"missed";
    return"pending";
  },
  tasksForDate(date=Dates.localDate()){return this.tasks.filter(t=>this.isScheduled(t,date))},
  complete(taskId,date=Dates.localDate()){
    const t=this.tasks.find(x=>x.id===taskId);if(!t||!this.isScheduled(t,date))return false;
    if(date>Dates.localDate()){Toast("Будущую задачу выполнить нельзя","warning");return false}
    if(t.completedDates.includes(date))return false;
    const late=date<Dates.localDate(),mult=late?.25:1;
    const journal=this.journal(t.journal);if(journal)journal.exp+=t.duration*.01*mult;
    this.state.profile.totalExp+=t.duration*.005*mult;
    t.completedDates.push(date);t.missedDates=t.missedDates.filter(x=>x!==date);
    this.updateStreak(date);this.checkGoals();this.recalcLevel();this.save();
    Toast(`Задача выполнена · +${(t.duration*.005*mult).toFixed(2)} XP`,late?"warning":"success");return true;
  },
  updateStreak(date){
    const p=this.state.profile,last=p.lastActive;
    if(last===date)return;
    if(last===Dates.add(date,-1))p.streak=(p.streak||0)+1;else p.streak=1;
    p.lastActive=date;
  },
  autoMiss(){
    const today=Dates.localDate();let changed=false;
    this.tasks.forEach(t=>this.occurrences(t).forEach(d=>{if(d<today&&!t.completedDates.includes(d)&&!t.missedDates.includes(d)){t.missedDates.push(d);changed=true}}));
    if(changed)this.save();
  },
  recalcLevel(){let xp=Math.max(0,Number(this.state.profile.totalExp)||0),level=1,need=100;while(xp>=need){level++;need=level*100}this.state.profile.level=level;return{level,xp,need}},
  checkGoals(){
    this.goals.forEach(g=>{
      if(g.achieved)return;
      const tasks=this.tasks.filter(t=>t.goalId===g.id);if(!tasks.length)return;
      const required=tasks.flatMap(t=>this.occurrences(t));const unique=[...new Set(required)];
      if(unique.length&&unique.every(d=>tasks.some(t=>t.completedDates.includes(d)))){
        g.achieved=true;g.achievedAt=new Date().toISOString();this.state.profile.totalExp+=.05;this.recalcLevel();Toast(`🎉 Цель «${g.title}» достигнута!`,"success");
      }
    });
  },
  addTask(payload){const t={...payload,id:id(),completedDates:[],missedDates:[],createdAt:new Date().toISOString()};this.tasks.push(t);this.save();return t},
  updateTask(taskId,payload){const t=this.tasks.find(x=>x.id===taskId);if(!t)return;Object.assign(t,payload);this.save()},
  deleteTask(taskId){this.state.tasks=this.tasks.filter(t=>t.id!==taskId);this.save()},
  addGoal(title,desc){this.goals.push({id:id(),title,desc:desc||"",achieved:false,createdAt:new Date().toISOString()});this.save()},
  addNote(text){this.state.notes.push({id:id(),text,createdAt:new Date().toISOString()});this.save()},
  deleteNote(nid){this.state.notes=this.state.notes.filter(n=>n.id!==nid);this.save()},
  stats(){
    const all=this.tasks, done=all.reduce((n,t)=>n+t.completedDates.length,0),miss=all.reduce((n,t)=>n+t.missedDates.length,0);
    const scheduled=all.reduce((n,t)=>n+this.occurrences(t).length,0);
    return{tasks:all.length,done,miss,scheduled,rate:scheduled?Math.round(done/scheduled*100):0};
  },
  analytics(days=30){
    const end=Dates.localDate(), start=Dates.add(end,-(days-1));
    const labels=[],done=[],missed=[],xp=[];
    for(let i=0;i<days;i++){const d=Dates.add(start,i);labels.push(d);let dn=0,ms=0,x=0;
      this.tasks.forEach(t=>{if(this.isScheduled(t,d)){if(t.completedDates.includes(d)){dn++;x+=t.duration*.005}else if(t.missedDates.includes(d)||d<end)ms++}});
      done.push(dn);missed.push(ms);xp.push(x);
    }
    const journal=this.journals.map(j=>{let d=0,m=0,xp=0;this.tasks.filter(t=>t.journal===j.name).forEach(t=>{d+=t.completedDates.length;m+=t.missedDates.length;xp+=t.duration*.005*t.completedDates.length});return{...j,done:d,missed:m,xp}}).sort((a,b)=>b.xp-a.xp);
    return{labels,done,missed,xp,journal};
  }
};

  toggleTheme(){document.documentElement.classList.toggle("dark");localStorage.setItem("skillquest_dark",document.documentElement.classList.contains("dark")?"1":"0");this.render()},
  avatar(){const input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{Data.profile().avatar=r.result;Data.save();Toast("Аватар обновлён","success")};r.readAsDataURL(f)};input.click()},
  export(){const blob=new Blob([JSON.stringify(Data.state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`skillquest-backup-${Dates.localDate()}.json`;a.click();URL.revokeObjectURL(a.href)},
  import(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=="object"||!Array.isArray(obj.tasks)||!Array.isArray(obj.journals))throw 0;localStorage.setItem(Data.key,JSON.stringify(obj));Data.load();Toast("Данные импортированы","success")}catch{Toast("Файл не похож на резервную копию SkillQuest","error")}};r.readAsText(file)},
  reset(){if(!confirm("Удалить все данные SkillQuest? Это действие нельзя отменить."))return;localStorage.removeItem(Data.key);location.reload()},
  open(id){document.getElementById(id).classList.add("open")},close(id){document.getElementById(id).classList.remove("open")}
};

(function boot(){
  if(localStorage.getItem("skillquest_dark")==="1")document.documentElement.classList.add("dark");
  document.getElementById("avatarBtn").textContent=(Data.profile().name||"Г").charAt(0).toUpperCase();
  App.init();
})();
</script>
</body>
</html>
