    <script>
        // ============================================================
        // ========== ДАННЫЕ ==========
        // ============================================================

        const DEFAULT_GUILDS = [
            { id: 'body', name: 'Тело', color: '#FF6B6B', icon: '💪' },
            { id: 'creativity', name: 'Творчество', color: '#4ECDC4', icon: '🎨' },
            { id: 'business', name: 'Бизнес', color: '#45B7D1', icon: '💼' },
            { id: 'habits', name: 'Привычки', color: '#96CEB4', icon: '🔄' },
            { id: 'oneTime', name: 'Одноразки', color: '#FFEAA7', icon: '📌' },
            { id: 'travel', name: 'Путешествия', color: '#DDA0DD', icon: '✈️' },
            { id: 'debts', name: 'Долги', color: '#FF8A5C', icon: '💰' },
            { id: 'other', name: 'Другое', color: '#A8A8A8', icon: '📂' },
            { id: 'nutrition', name: 'Питание', color: '#7EC8E3', icon: '🥗' }
        ];

        const TITLES = [
            { min: 0, title: '⭐ Начинающий', emoji: '🧑' },
            { min: 3, title: '🌱 Исследователь', emoji: '🌱' },
            { min: 8, title: '🚀 Продвинутый', emoji: '🚀' },
            { min: 15, title: '🔥 Эксперт', emoji: '🔥' },
            { min: 25, title: '🏆 Мастер', emoji: '🏆' },
            { min: 40, title: '👑 Легенда', emoji: '👑' },
            { min: 60, title: '💫 Герой', emoji: '💫' },
            { min: 85, title: '🌟 Мифический', emoji: '🌟' },
        ];

        const MONTHS = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
        const MONTHS_FULL = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь',
            'Декабрь'
        ];
        const WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        const WEEKDAYS_FULL = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

        // ============================================================
        // ========== СОСТОЯНИЕ ==========
        // ============================================================

        let guilds = [];
        let quests = [];
        let gallery = [];
        let profile = {};
        let currentTab = 'day';
        let filterGuild = null;
        let notificationTimeout = null;
        let currentTheme = 'light';
        let currentProfile = 'default';
        let calendarDate = new Date();
        let calendarMode = 'day';

        // ============================================================
        // ========== ЗАГРУЗКА / СОХРАНЕНИЕ ==========
        // ============================================================

        function loadData() {
            try {
                guilds = JSON.parse(localStorage.getItem('guilds')) || DEFAULT_GUILDS;
                quests = JSON.parse(localStorage.getItem('quests')) || [];
                gallery = JSON.parse(localStorage.getItem('gallery')) || [];
                profile = JSON.parse(localStorage.getItem('profile')) || {
                    name: 'Игрок',
                    totalXP: 0,
                    level: 1,
                    age: '',
                    gender: 'male',
                    height: '',
                    weight: '',
                    weightJournal: [],
                    measurements: { biceps: '', chest: '', thigh: '', waist: '' },
                    cover: '',
                    avatar: ''
                };
                currentTheme = localStorage.getItem('theme') || 'light';
                currentProfile = localStorage.getItem('profile_theme') || 'default';
                applyTheme(currentTheme);
                applyProfile(currentProfile);
                updateProfileLevel();
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                guilds = DEFAULT_GUILDS;
                quests = [];
                gallery = [];
                profile = {
                    name: 'Игрок',
                    totalXP: 0,
                    level: 1,
                    age: '',
                    gender: 'male',
                    height: '',
                    weight: '',
                    weightJournal: [],
                    measurements: { biceps: '', chest: '', thigh: '', waist: '' },
                    cover: '',
                    avatar: ''
                };
            }
        }

        function saveQuests() { localStorage.setItem('quests', JSON.stringify(quests)); }

        function saveGallery() { localStorage.setItem('gallery', JSON.stringify(gallery)); }

        function saveProfile() { localStorage.setItem('profile', JSON.stringify(profile)); }

        function saveGuilds() { localStorage.setItem('guilds', JSON.stringify(guilds)); }

        function saveTheme() { localStorage.setItem('theme', currentTheme); }

        function saveProfileTheme() { localStorage.setItem('profile_theme', currentProfile); }

        // ============================================================
        // ========== XP / УРОВЕНЬ ==========
        // ============================================================

        function calculateXP(minutes) {
            return Math.round(minutes * 0.01 * 100) / 100;
        }

        function xpForLevel(level) {
            return level * (level + 1) / 2;
        }

        function getLevelFromXP(totalXP) {
            let level = 1;
            while (xpForLevel(level) <= totalXP) level++;
            level--;
            const currentXP = totalXP - xpForLevel(level);
            const nextLevelXP = xpForLevel(level + 1) - xpForLevel(level);
            return { level, currentXP, nextLevelXP };
        }

        function updateProfileLevel() {
            const { level, currentXP, nextLevelXP } = getLevelFromXP(profile.totalXP);
            profile.level = level;
            saveProfile();
            return { level, currentXP, nextLevelXP };
        }

        function getTitle(level) {
            let result = TITLES[0];
            for (const t of TITLES) {
                if (level >= t.min) result = t;
            }
            return result;
        }

        // ============================================================
        // ========== ТЕМА ==========
        // ============================================================

        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
            document.querySelectorAll('.opt[data-theme]').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === theme);
            });
            saveTheme();
        }

        function toggleTheme() {
            applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        }

        function setTheme(theme) {
            applyTheme(theme);
        }

        // ============================================================
        // ========== ПРОФИЛЬ ЦВЕТА ==========
        // ============================================================

        function applyProfile(profile) {
            currentProfile = profile;
            if (profile === 'default') {
                document.documentElement.removeAttribute('data-profile');
            } else {
                document.documentElement.setAttribute('data-profile', profile);
            }
            document.querySelectorAll('.opt[data-profile]').forEach(el => {
                el.classList.toggle('active', el.dataset.profile === profile);
            });
            saveProfileTheme();
        }

        function setProfile(profile) {
            applyProfile(profile);
        }

        // ============================================================
        // ========== УВЕДОМЛЕНИЯ ==========
        // ============================================================

        function showNotification(msg, isError = false) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.style.display = 'block';
            el.style.borderLeftColor = isError ? '#EF4444' : 'var(--primary)';
            clearTimeout(notificationTimeout);
            notificationTimeout = setTimeout(() => {
                el.style.display = 'none';
            }, 3000);
        }

        // ============================================================
        // ========== КВЕСТЫ ==========
        // ============================================================

        function createQuest(e) {
            e.preventDefault();

            const title = document.getElementById('questTitle').value.trim();
            const guildId = document.getElementById('questGuild').value;
            const duration = parseInt(document.getElementById('questDuration').value);
            const scheduledDate = document.getElementById('questDate').value;
            const scheduledTime = document.getElementById('questTime').value;
            const repeat = document.getElementById('questRepeat').value;
            const endDate = document.getElementById('questEndDate').value;
            const note = document.getElementById('questNote').value.trim();
            const isHabit = document.getElementById('questHabit').checked;
            const isOneTime = document.getElementById('questOneTime').checked;
            const hasPhoto = document.getElementById('questPhoto').checked;

            if (!title) { showNotification('Введите название!', true); return; }
            if (!guildId) { showNotification('Выберите категорию!', true); return; }
            if (!duration || duration < 1) { showNotification('Укажите длительность!', true); return; }
            if (!scheduledDate) { showNotification('Укажите дату!', true); return; }

            let repeatDays = [];
            if (repeat === 'custom') {
                document.querySelectorAll('.repeat-day:checked').forEach(cb => {
                    repeatDays.push(parseInt(cb.value));
                });
                if (repeatDays.length === 0) {
                    showNotification('Выберите хотя бы один день!', true);
                    return;
                }
            }

            let photoData = null;
            if (hasPhoto) {
                const fileInput = document.getElementById('photoFile');
                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        photoData = ev.target.result;
                        saveQuestWithPhoto(title, guildId, duration, scheduledDate, scheduledTime, repeat, repeatDays, endDate,
                            note, isHabit, isOneTime, photoData);
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                    return;
                } else {
                    showNotification('Выберите фото!', true);
                    return;
                }
            }

            saveQuestWithPhoto(title, guildId, duration, scheduledDate, scheduledTime, repeat, repeatDays, endDate, note, isHabit,
                isOneTime, null);
        }

        function saveQuestWithPhoto(title, guildId, duration, scheduledDate, scheduledTime, repeat, repeatDays, endDate, note,
            isHabit, isOneTime, photoData) {
            const quest = {
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36),
                title,
                guildId,
                duration,
                scheduledDate,
                scheduledTime: scheduledTime || '',
                repeat: repeat || 'none',
                repeatDays: repeatDays || [],
                endDate: endDate || null,
                note: note || '',
                isHabit,
                isOneTime,
                status: 'planned',
                xpEarned: calculateXP(duration),
                createdAt: Date.now(),
                updatedAt: Date.now(),
                hasPhoto: !!photoData,
                photoId: null
            };

            quests.push(quest);
            saveQuests();

            if (photoData) {
                const galleryItem = {
                    id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36),
                    questId: quest.id,
                    date: scheduledDate,
                    photo: photoData,
                    caption: title,
                    uploadedAt: Date.now()
                };
                gallery.push(galleryItem);
                saveGallery();
                quest.photoId = galleryItem.id;
                saveQuests();
                showNotification('✅ Задача и фото сохранены!');
            } else {
                showNotification(`✅ Задача создана! +${quest.xpEarned} XP`);
            }

            closeModal();
            renderAll();
        }

        function toggleQuest(id) {
            const quest = quests.find(q => q.id === id);
            if (!quest) return;

            const today = new Date().toISOString().split('T')[0];
            if (quest.scheduledDate > today) {
                showNotification('Нельзя выполнить будущую задачу!', true);
                return;
            }

            if (quest.status === 'done') {
                quest.status = 'planned';
                profile.totalXP -= quest.xpEarned;
                if (profile.totalXP < 0) profile.totalXP = 0;
                showNotification(`↩️ Возвращено ${quest.xpEarned} XP`);
            } else {
                quest.status = 'done';
                profile.totalXP += quest.xpEarned;
                showNotification(`✅ +${quest.xpEarned} XP`);
                if (quest.repeat !== 'none' && quest.endDate) {
                    createNextQuest(quest);
                }
            }

            quest.updatedAt = Date.now();
            saveQuests();
            updateProfileLevel();
            saveProfile();
            renderAll();
        }

        function createNextQuest(quest) {
            let nextDate = new Date(quest.scheduledDate + 'T00:00:00');
            let found = false;

            if (quest.repeat === 'daily') {
                nextDate.setDate(nextDate.getDate() + 1);
                found = true;
            } else if (quest.repeat === 'weekly') {
                nextDate.setDate(nextDate.getDate() + 7);
                found = true;
            } else if (quest.repeat === 'custom' && quest.repeatDays.length > 0) {
                for (let i = 1; i <= 7; i++) {
                    const checkDate = new Date(nextDate);
                    checkDate.setDate(checkDate.getDate() + i);
                    const dayOfWeek = checkDate.getDay();
                    if (quest.repeatDays.includes(dayOfWeek)) {
                        nextDate = checkDate;
                        found = true;
                        break;
                    }
                }
            }

            if (found) {
                const endDate = quest.endDate ? new Date(quest.endDate + 'T00:00:00') : null;
                if (endDate && nextDate > endDate) return;

                const newQuest = {
                    ...quest,
                    id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36),
                    scheduledDate: nextDate.toISOString().split('T')[0],
                    status: 'planned',
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
                quests.push(newQuest);
                saveQuests();
            }
        }

        function deleteQuest(id) {
            if (!confirm('Удалить задачу?')) return;

            const index = quests.findIndex(q => q.id === id);
            if (index === -1) return;

            const quest = quests[index];
            if (quest.status === 'done') {
                profile.totalXP -= quest.xpEarned;
                if (profile.totalXP < 0) profile.totalXP = 0;
                showNotification(`🗑️ Возвращено ${quest.xpEarned} XP`);
            }

            if (quest.photoId) {
                const gIndex = gallery.findIndex(g => g.id === quest.photoId);
                if (gIndex !== -1) gallery.splice(gIndex, 1);
                saveGallery();
            }

            quests.splice(index, 1);
            saveQuests();
            updateProfileLevel();
            saveProfile();
            renderAll();
        }

        // ============================================================
        // ========== СТРИКИ ==========
        // ============================================================

        function calculateStreaks() {
            if (quests.length === 0) return { current: 0, best: 0 };

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const doneDays = new Set();
            quests.forEach(q => {
                if (q.status === 'done') {
                    const date = new Date(q.scheduledDate + 'T00:00:00');
                    date.setHours(0, 0, 0, 0);
                    if (date <= today) {
                        doneDays.add(q.scheduledDate);
                    }
                }
            });

            const sortedDays = Array.from(doneDays).sort();
            if (sortedDays.length === 0) return { current: 0, best: 0 };

            let currentStreak = 0;
            const todayStr = today.toISOString().split('T')[0];
            if (doneDays.has(todayStr)) {
                currentStreak = 1;
                let checkDate = new Date(today);
                checkDate.setDate(checkDate.getDate() - 1);
                while (true) {
                    const dateStr = checkDate.toISOString().split('T')[0];
                    if (doneDays.has(dateStr)) {
                        currentStreak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else break;
                }
            }

            let bestStreak = 0;
            let tempStreak = 0;
            let prevDate = null;
            for (const dateStr of sortedDays) {
                const date = new Date(dateStr + 'T00:00:00');
                if (prevDate === null) {
                    tempStreak = 1;
                } else {
                    const diff = (date - prevDate) / (1000 * 60 * 60 * 24);
                    if (diff === 1) tempStreak++;
                    else tempStreak = 1;
                }
                prevDate = date;
                if (tempStreak > bestStreak) bestStreak = tempStreak;
            }

            return { current: currentStreak, best: bestStreak };
        }

        // ============================================================
        // ========== КАЛЕНДАРЬ ==========
        // ============================================================

        function setCalendarMode(mode) {
            calendarMode = mode;
            document.querySelectorAll('.mode-btn').forEach(el => {
                el.classList.toggle('active', el.dataset.mode === mode);
            });
            renderCalendar();
        }

        function calendarGoToday() {
            calendarDate = new Date();
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendarContent');

            switch (calendarMode) {
                case 'day':
                    renderDayView(container);
                    break;
                case 'week':
                    renderWeekView(container);
                    break;
                case 'month':
                    renderMonthView(container);
                    break;
                case 'year':
                    renderYearView(container);
                    break;
            }
        }

        function renderDayView(container) {
            const date = calendarDate;
            const dateStr = date.toISOString().split('T')[0];
            const dayQuests = quests.filter(q => q.scheduledDate === dateStr)
                .sort((a, b) => (a.scheduledTime || '00:00').localeCompare(b.scheduledTime || '00:00'));

            const dayName = WEEKDAYS_FULL[date.getDay() === 0 ? 6 : date.getDay() - 1];
            const dayLabel = `${dayName}, ${date.getDate()} ${MONTHS_FULL[date.getMonth()]} ${date.getFullYear()}`;

            let html = `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                    <button class="btn btn-ghost" onclick="calendarDate.setDate(calendarDate.getDate()-1);renderCalendar();">‹</button>
                    <span style="font-weight:600;font-size:0.95rem;">${dayLabel}</span>
                    <button class="btn btn-ghost" onclick="calendarDate.setDate(calendarDate.getDate()+1);renderCalendar();">›</button>
                </div>
                <div class="day-schedule">
            `;

            if (dayQuests.length === 0) {
                html += `
                    <div class="empty-state" style="padding:30px 20px;">
                        <div class="empty-icon">📅</div>
                        <p style="font-size:0.9rem;">Нет задач</p>
                    </div>
                `;
            } else {
                const hours = {};
                dayQuests.forEach(q => {
                    const hour = q.scheduledTime ? q.scheduledTime.split(':')[0] : '00';
                    if (!hours[hour]) hours[hour] = [];
                    hours[hour].push(q);
                });

                for (let h = 0; h < 24; h++) {
                    const hourStr = String(h).padStart(2, '0');
                    const questsInHour = hours[hourStr] || [];
                    const hasQuests = questsInHour.length > 0;

                    html += `
                        <div class="hour-block">
                            <div class="hour-label">${hourStr}:00</div>
                            <div class="hour-events">
                    `;

                    if (hasQuests) {
                        questsInHour.forEach(q => {
                            const guild = guilds.find(g => g.id === q.guildId) || { color: '#999', name: 'Без категории' };
                            html += `
                                <div class="event ${q.status === 'done' ? 'done' : ''}" 
                                     onclick="toggleQuest('${q.id}')"
                                     style="border-left:2px solid ${guild.color};">
                                    <span class="time">${q.scheduledTime || ''}</span>
                                    <span>${q.title}</span>
                                    <span class="guild">${guild.icon}</span>
                                </div>
                            `;
                        });
                    } else {
                        html += `<div style="font-size:0.6rem;color:var(--text-light);padding:2px 0;">—</div>`;
                    }

                    html += `
                            </div>
                        </div>
                    `;
                }
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderWeekView(container) {
            const date = calendarDate;
            const dayOfWeek = date.getDay();
            const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
            const monday = new Date(date);
            monday.setDate(date.getDate() - mondayOffset);

            let html = `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                    <button class="btn btn-ghost" onclick="calendarDate.setDate(calendarDate.getDate()-7);renderCalendar();">‹</button>
                    <span style="font-weight:600;font-size:0.9rem;">${monday.getDate()} ${MONTHS_FULL[monday.getMonth()]} — ${new Date(monday).setDate(monday.getDate()+6)} ${MONTHS_FULL[new Date(monday).setDate(monday.getDate())]}</span>
                    <button class="btn btn-ghost" onclick="calendarDate.setDate(calendarDate.getDate()+7);renderCalendar();">›</button>
                </div>
                <div class="week-grid">
            `;

            for (let i = 0; i < 7; i++) {
                const day = new Date(monday);
                day.setDate(monday.getDate() + i);
                const dateStr = day.toISOString().split('T')[0];
                const dayQuests = quests.filter(q => q.scheduledDate === dateStr);
                const isToday = dateStr === new Date().toISOString().split('T')[0];

                html += `
                    <div class="week-day" onclick="calendarDate=new Date('${dateStr}T00:00:00');setCalendarMode('day');renderCalendar();" style="${isToday ? 'border-color:var(--primary);' : ''}">
                        <div class="label">
                            ${WEEKDAYS[i]}
                            <div class="date">${day.getDate()} ${MONTHS[day.getMonth()]}</div>
                        </div>
                        <div class="tasks">
                `;

                if (dayQuests.length === 0) {
                    html += `<span style="font-size:0.6rem;color:var(--text-light);">—</span>`;
                } else {
                    dayQuests.slice(0, 3).forEach(q => {
                        const done = q.status === 'done';
                        const guild = guilds.find(g => g.id === q.guildId) || { color: '#999' };
                        html += `
                            <span class="tag ${done ? 'done' : ''}" style="border-left:2px solid ${guild.color};">
                                ${q.title}
                            </span>
                        `;
                    });
                    if (dayQuests.length > 3) {
                        html += `<span class="tag" style="background:var(--border);">+${dayQuests.length - 3}</span>`;
                    }
                }

                html += `
                        </div>
                        <div class="count">${dayQuests.length}</div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderMonthView(container) {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            let html = `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                    <button class="btn btn-ghost" onclick="calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar();">‹</button>
                    <span style="font-weight:600;font-size:0.95rem;">${MONTHS_FULL[month]} ${year}</span>
                    <button class="btn btn-ghost" onclick="calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar();">›</button>
                </div>
                <div class="card">
                    <div class="calendar-header">
                        <span>Пн</span><span>Вт</span><span>Ср</span>
                        <span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    <div class="calendar-days">
            `;

            const today = new Date().toISOString().split('T')[0];
            let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startOffset - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const date = new Date(year, month - 1, day);
                const dateStr = date.toISOString().split('T')[0];
                const dayQuests = quests.filter(q => q.scheduledDate === dateStr);
                const hasPhoto = gallery.some(g => g.date === dateStr);
                html += `
                    <div class="calendar-day other-month" onclick="calendarDate=new Date('${dateStr}T00:00:00');setCalendarMode('day');renderCalendar();">
                        <span>${day}</span>
                        ${dayQuests.length > 0 ? `<div class="day-dots">${dayQuests.slice(0,3).map(q => {
                            const g = guilds.find(g => g.id === q.guildId) || { color: '#999' };
                            return `<span class="dot" style="background:${g.color}"></span>`;
                        }).join('')}</div>` : ''}
                        ${hasPhoto ? '<span class="day-photo">📸</span>' : ''}
                    </div>
                `;
            }

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const dateStr = date.toISOString().split('T')[0];
                const dayQuests = quests.filter(q => q.scheduledDate === dateStr);
                const hasPhoto = gallery.some(g => g.date === dateStr);
                const isToday = dateStr === today;

                html += `
                    <div class="calendar-day ${isToday ? 'today' : ''}" 
                         onclick="calendarDate=new Date('${dateStr}T00:00:00');setCalendarMode('day');renderCalendar();">
                        <span>${day}</span>
                        ${dayQuests.length > 0 ? `<div class="day-dots">${dayQuests.slice(0,3).map(q => {
                            const g = guilds.find(g => g.id === q.guildId) || { color: '#999' };
                            return `<span class="dot" style="background:${g.color}"></span>`;
                        }).join('')}</div>` : ''}
                        ${hasPhoto ? '<span class="day-photo">📸</span>' : ''}
                    </div>
                `;
            }

            const remaining = 42 - (startOffset + lastDay.getDate());
            for (let day = 1; day <= remaining; day++) {
                const date = new Date(year, month + 1, day);
                const dateStr = date.toISOString().split('T')[0];
                const dayQuests = quests.filter(q => q.scheduledDate === dateStr);
                const hasPhoto = gallery.some(g => g.date === dateStr);
                html += `
                    <div class="calendar-day other-month" onclick="calendarDate=new Date('${dateStr}T00:00:00');setCalendarMode('day');renderCalendar();">
                        <span>${day}</span>
                        ${dayQuests.length > 0 ? `<div class="day-dots">${dayQuests.slice(0,3).map(q => {
                            const g = guilds.find(g => g.id === q.guildId) || { color: '#999' };
                            return `<span class="dot" style="background:${g.color}"></span>`;
                        }).join('')}</div>` : ''}
                        ${hasPhoto ? '<span class="day-photo">📸</span>' : ''}
                    </div>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderYearView(container) {
            const year = calendarDate.getFullYear();

            let html = `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                    <button class="btn btn-ghost" onclick="calendarDate.setFullYear(calendarDate.getFullYear()-1);renderCalendar();">‹</button>
                    <span style="font-weight:600;font-size:0.95rem;">${year}</span>
                    <button class="btn btn-ghost" onclick="calendarDate.setFullYear(calendarDate.getFullYear()+1);renderCalendar();">›</button>
                </div>
                <div class="year-grid">
            `;

            for (let month = 0; month < 12; month++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const monthQuests = quests.filter(q => {
                    const qDate = q.scheduledDate.split('-');
                    return qDate[0] == year && qDate[1] == monthStr;
                });

                const total = monthQuests.length;
                const done = monthQuests.filter(q => q.status === 'done').length;
                const planned = monthQuests.filter(q => q.status === 'planned').length;
                const xpEarned = monthQuests.filter(q => q.status === 'done').reduce((sum, q) => sum + q.xpEarned, 0);
                const completionRate = total > 0 ? Math.round((done / total) * 100) : 0;

                html += `
                    <div class="card month-card" onclick="calendarDate=new Date(${year}, ${month}, 1);setCalendarMode('month');renderCalendar();">
                        <div class="name">${MONTHS_FULL[month]}</div>
                        <div class="stats">
                            <span>✅ ${done}</span>
                            <span>📋 ${planned}</span>
                        </div>
                        <div class="xp">${xpEarned.toFixed(1)} XP</div>
                        <div class="bar">
                            <div class="fill" style="width:${completionRate}%;"></div>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.view').forEach(view => {
                view.classList.toggle('active', view.id === 'view-' + tabId);
            });
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tabId);
            });
            if (tabId === 'day') renderDay();
            if (tabId === 'calendar') renderCalendar();
            if (tabId === 'quests') renderAllQuests();
            if (tabId === 'gallery') renderGallery();
            if (tabId === 'profile') renderProfile();
            if (tabId === 'guilds') renderGuilds();
            if (tabId === 'settings') renderSettings();
        }

        // ========== МОДАЛКА ==========

        function openModal() {
            document.getElementById('modal').classList.add('open');
            document.getElementById('questDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('questEndDate').value = '';
            document.getElementById('questRepeat').value = 'none';
            document.getElementById('repeatDaysGroup').classList.add('hidden');
            document.getElementById('photoUploadGroup').classList.add('hidden');
            document.getElementById('questPhoto').checked = false;

            const select = document.getElementById('questGuild');
            select.innerHTML = '<option value="">Выберите</option>';
            guilds.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.icon + ' ' + g.name;
                select.appendChild(opt);
            });

            document.getElementById('questRepeat').onchange = function() {
                const group = document.getElementById('repeatDaysGroup');
                if (this.value === 'custom') {
                    group.classList.remove('hidden');
                } else {
                    group.classList.add('hidden');
                }

            document.getElementById('questPhoto').onchange = function() {
                const group = document.getElementById('photoUploadGroup');
                if (this.checked) {
                    group.classList.remove('hidden');

                    group.classList.add('hidden');
                }
            };

            document.getElementById('questTitle').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            document.getElementById('questTitle').value = '';
            document.getElementById('questDuration').value = '';
            document.getElementById('questTime').value = '';
            document.getElementById('questNote').value = '';
            document.getElementById('questHabit').checked = false;
            document.getElementById('questOneTime').checked = false;
            document.getElementById('questPhoto').checked = false;
            document.getElementById('photoUploadGroup').classList.add('hidden');
            document.querySelectorAll('.repeat-day').forEach(cb => cb.checked = false);
        }

        // ========== РЕНДЕР: ДЕНЬ ==========
        // ============================================================

        function renderDay() {
            const today = new Date().toISOString().split('T')[0];
            const todayQuests = quests
                .filter(q => q.scheduledDate === today)
                .sort((a, b) => (a.scheduledTime || '00:00').localeCompare(b.scheduledTime || '00:00'));

            const hour = new Date().getHours();
            let greeting = 'Доброе утро 👋';
            if (hour >= 12 && hour < 18) greeting = 'Добрый день ☀️';
            else if (hour >= 18) greeting = 'Добрый вечер 🌙';
            document.getElementById('greeting').textContent = greeting;

            const container = document.getElementById('todayQuests');

            if (todayQuests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <p>Нет задач на сегодня</p>
                        <button class="btn btn-primary" onclick="openModal()">+ Создать</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = todayQuests.map(q => {
                const guild = guilds.find(g => g.id === q.guildId) || { color: '#999', name: 'Без категории', icon: '📌' };
                const isFuture = q.scheduledDate > today;
                const done = q.status === 'done';

                return `
                    <div class="quest-item ${done ? 'done' : ''}">
                        <div class="checkbox ${done ? 'checked' : ''}" 
                             onclick="${!isFuture ? `toggleQuest('${q.id}')` : ''}"
                             style="${isFuture ? 'cursor:not-allowed;opacity:0.4;' : ''}">
                        </div>
                        <div class="quest-content">
                            <div class="quest-title">${q.title}</div>
                            <div class="quest-meta">
                                <span class="tag tag-guild">${guild.icon} ${guild.name}</span>
                                ${q.duration ? `<span class="tag">⏱ ${q.duration}мин</span>` : ''}
                                ${q.scheduledTime ? `<span class="tag">🕐 ${q.scheduledTime}</span>` : ''}
                                ${q.isHabit ? '<span class="tag" style="background:#D1FAE5;color:#059669;">🔄 привычка</span>' : ''}
                                ${isFuture ? '<span class="tag" style="background:#E0E7FF;color:#4F46E5;">🔮 будущая</span>' : ''}
                                ${q.hasPhoto ? '<span class="tag" style="background:#E0E7FF;color:#4F46E5;">📸</span>' : ''}
                            </div>
                            ${q.note ? `<div style="font-size:0.7rem;color:var(--text-secondary);margin-top:2px;">${q.note}</div>` : ''}
                        </div>
                        <div class="quest-actions">
                            ${q.hasPhoto ? `<button onclick="viewPhoto('${q.photoId}')">🖼️</button>` : ''}
                            <button class="danger" onclick="deleteQuest('${q.id}')">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Обновляем бейдж
            const badge = document.getElementById('navTotalBadge');
            if (todayQuests.filter(q => q.status !== 'done').length > 0) {
                badge.style.display = 'block';
                badge.textContent = todayQuests.filter(q => q.status !== 'done').length;
            } else {
                badge.style.display = 'none';
            }
        }

                                <span class="tag">📅 ${q.scheduledDate}</span>

                                ${q.isHabit ? '<span class="tag" style="background:#D1FAE5;color:#059669;">🔄</span>' : ''}

            document.getElementById('photoModalImg').src = item.photo;
            document.getElementById('photoModalCaption').textContent = item.caption || 'Без подписи';

                    month: 'long',
                    year: 'numeric'

        function renderProfile() {
            document.getElementById('profileName').textContent = profile.name;
            document.getElementById('profileLevelBig').textContent = profile.level;

            const titleData = getTitle(profile.level);
            document.getElementById('profileTitle').textContent = titleData.title;

            // Аватар
            const avatarEmoji = document.getElementById('avatarEmoji');
            const avatarPreview = document.getElementById('avatarPreview');
            if (profile.avatar) {
                avatarEmoji.style.display = 'none';
                avatarPreview.style.display = 'block';
                avatarPreview.src = profile.avatar;
            } else {
                avatarEmoji.style.display = 'block';
                avatarPreview.style.display = 'none';
                avatarEmoji.textContent = titleData.emoji;
            }

            // Обложка
            const coverPlaceholder = document.getElementById('coverPlaceholder');
            const coverPreview = document.getElementById('coverPreview');
            if (profile.cover) {
                coverPlaceholder.style.display = 'none';
                coverPreview.style.display = 'block';
                coverPreview.src = profile.cover;
            } else {
                coverPlaceholder.style.display = 'flex';
                coverPreview.style.display = 'none';
            }

            // Информация
            document.getElementById('profileNameInput').value = profile.name || '';
            document.getElementById('profileAge').value = profile.age || '';
            document.getElementById('profileGender').value = profile.gender || 'male';
            document.getElementById('profileHeight').value = profile.height || '';
            document.getElementById('profileWeight').value = profile.weight || '';

            // BMI
            updateBMI();

            // Журнал веса
            renderWeightJournal();

            // Мерки
            document.getElementById('measBiceps').value = profile.measurements?.biceps || '';
            document.getElementById('measChest').value = profile.measurements?.chest || '';
            document.getElementById('measThigh').value = profile.measurements?.thigh || '';
            document.getElementById('measWaist').value = profile.measurements?.waist || '';
        }

        function updateBMI() {
            const height = parseFloat(profile.height);
            const weight = parseFloat(profile.weight);
            const bmiValue = document.getElementById('bmiValue');
            const bmiStatus = document.getElementById('bmiStatus');

            if (height > 0 && weight > 0) {
                const heightM = height / 100;
                const bmi = weight / (heightM * heightM);
                bmiValue.textContent = bmi.toFixed(1);

                let status = '';
                let className = '';
                if (bmi < 18.5) {
                    status = 'Недостаточный';
                    className = 'underweight';
                } else if (bmi < 25) {
                    status = 'Норма';
                    className = 'normal';
                } else if (bmi < 30) {
                    status = 'Избыточный';
                    className = 'overweight';
                } else {
                    status = 'Ожирение';
                    className = 'obese';
                }
                bmiStatus.textContent = status;
                bmiStatus.className = 'status ' + className;
            } else {
                bmiValue.textContent = '—';
                bmiStatus.textContent = '—';
                bmiStatus.className = 'status';
            }
        }

        function renderWeightJournal() {
            const container = document.getElementById('weightJournalList');
            const entries = profile.weightJournal || [];

            if (entries.length === 0) {
                container.innerHTML = '<div style="color:var(--text-light);font-size:0.8rem;">Нет записей</div>';
                return;
            }

            const sorted = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
            container.innerHTML = sorted.slice(0, 8).map(entry => {
                const date = new Date(entry.date).toLocaleDateString('ru', { day: 'numeric', month: 'short' });
                return `
                    <div class="entry">
                        <span class="date">${date}</span>
                        <span class="val">${entry.weight} кг</span>
                    </div>
                `;
            }).join('');
        }

        function addWeight() {
            const input = document.getElementById('newWeight');
            const weight = parseFloat(input.value);
            if (!weight || weight < 20 || weight > 300) {
                showNotification('Введите корректный вес!', true);
                return;
            }

            if (!profile.weightJournal) profile.weightJournal = [];
            profile.weightJournal.push({
                date: new Date().toISOString(),
                weight: weight
            });
            profile.weight = weight;

            saveProfile();
            renderProfile();
            showNotification('✅ Вес добавлен!');
            input.value = '';
        }

        function saveProfileInfo() {
            const name = document.getElementById('profileNameInput').value.trim();
            const age = document.getElementById('profileAge').value;
            const gender = document.getElementById('profileGender').value;
            const height = parseFloat(document.getElementById('profileHeight').value);
            const weight = parseFloat(document.getElementById('profileWeight').value);

            if (name) profile.name = name;
            profile.age = age || '';
            profile.gender = gender || 'male';
            profile.height = height || '';
            profile.weight = weight || '';

            saveProfile();
            renderProfile();
            showNotification('✅ Профиль сохранён!');
        }

        function saveMeasurements() {
            profile.measurements = {
                biceps: parseFloat(document.getElementById('measBiceps').value) || '',
                chest: parseFloat(document.getElementById('measChest').value) || '',
                thigh: parseFloat(document.getElementById('measThigh').value) || '',
                waist: parseFloat(document.getElementById('measWaist').value) || ''
            };

            saveProfile();
            showNotification('✅ Мерки сохранены!');
        }

        function uploadCover(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                profile.cover = e.target.result;
                saveProfile();
                renderProfile();
                showNotification('✅ Обложка обновлена!');
            };
            reader.readAsDataURL(file);
        }

        function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                profile.avatar = e.target.result;
                saveProfile();
                renderProfile();
                showNotification('✅ Аватар обновлён!');
            };
            reader.readAsDataURL(file);
        }

        function resetData() {
            if (confirm('Точно сбросить всё? Данные не восстановить!')) {
                localStorage.clear();
                location.reload();
            }
        }

        // ============================================================
        // ========== РЕНДЕР: НАСТРОЙКИ ==========
        // ============================================================

        function renderSettings() {}

        // ============================================================
        // ========== РЕНДЕР: ГИЛЬДИИ ==========
        // ============================================================

        function renderGuilds() {
            const container = document.getElementById('guildGrid');
            container.innerHTML = guilds.map(g => {
                const count = quests.filter(q => q.guildId === g.id).length;
                return `
                    <div class="card guild-card" style="border:2px solid ${g.color}25;">
                        <div class="icon" style="background:${g.color}15;color:${g.color};">${g.icon}</div>
                        <div class="name">${g.name}</div>
                        <div class="count">${count} задач</div>
                        <div class="color-picker">
                            <input type="color" value="${g.color}" 
                                   onchange="updateGuildColor('${g.id}', this.value)" />
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateGuildColor(id, color) {
            const guild = guilds.find(g => g.id === id);
            if (guild) {
                guild.color = color;
                saveGuilds();
                renderGuilds();
                showNotification('Цвет обновлён!');
                renderAll();
            }
        }

        // ============================================================
        // ========== ЭКСПОРТ / ИМПОРТ ==========
        // ============================================================

        function exportData() {
            const data = {
                guilds,
                quests,
                gallery,
                profile,
                version: '2.0',
                exported: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `flowplan_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showNotification('📤 Данные экспортированы!');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.guilds) guilds = data.guilds;
                        if (data.quests) quests = data.quests;
                        if (data.gallery) gallery = data.gallery;
                        if (data.profile) profile = data.profile;
                        saveGuilds();
                        saveQuests();
                        saveGallery();
                        saveProfile();
                        showNotification('📥 Данные импортированы!');
                        renderAll();
                    } catch (err) {
                        showNotification('Ошибка импорта!', true);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ============================================================
        // ========== ОБЩИЙ РЕНДЕР ==========
        // ============================================================

        function renderAll() {
            if (currentTab === 'day') renderDay();
            else if (currentTab === 'calendar') renderCalendar();
            else if (currentTab === 'quests') renderAllQuests();
            else if (currentTab === 'gallery') renderGallery();
            else if (currentTab === 'profile') renderProfile();
            else if (currentTab === 'guilds') renderGuilds();
            else if (currentTab === 'settings') renderSettings();
        }

        // ============================================================
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        // ============================================================

        function init() {
            loadData();
            switchTab('day');
            renderAll();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                    closePhotoModal();
                }
            });

            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modal')) closeModal();
            });

            console.log('🚀 FlowPlan загружен!');
            console.log(`📊 Задач: ${quests.length}, Фото: ${gallery.length}, Уровень: ${profile.level}, XP: ${profile.totalXP}`);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
