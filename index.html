<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Журнал-Планировщик RPG</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0f0f1a;
            color: #eaeef2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
        }
        #app {
            max-width: 800px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 32px;
            padding: 20px 18px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            transition: 0.3s;
        }

        /* ===== КАРТОЧКА ПЕРСОНАЖА ===== */
        #character-card {
            background: linear-gradient(145deg, #222244, #1a1a33);
            border-radius: 24px;
            padding: 18px 20px 20px;
            margin-bottom: 20px;
            border: 1px solid #3a3a5a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
        }
        #character-card .avatar {
            font-size: 44px;
            line-height: 1;
        }
        .char-info {
            flex: 1;
            min-width: 140px;
        }
        .char-info input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #4a4a6a;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            width: 120px;
            padding: 4px 0;
            outline: none;
        }
        .char-info input:focus {
            border-bottom-color: #7c5cfc;
        }
        .char-info select {
            background: #2a2a44;
            color: #fff;
            border: 1px solid #4a4a6a;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 15px;
            margin-left: 6px;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-top: 6px;
            font-size: 14px;
        }
        .stats span {
            background: #2a2a44;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #3a3a5a;
        }
        .level-badge {
            background: #7c5cfc;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
        }
        .xp-bar {
            width: 100%;
            height: 6px;
            background: #2a2a44;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .xp-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c5cfc, #b47cff);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* ===== НАВИГАЦИЯ ===== */
        #nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 18px 0 14px;
        }
        #nav button {
            flex: 1;
            min-width: 60px;
            padding: 10px 0;
            border: none;
            border-radius: 40px;
            background: #2a2a44;
            color: #aab;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        #nav button.active {
            background: #7c5cfc;
            color: #fff;
            box-shadow: 0 0 16px #7c5cfc66;
        }
        #nav button:active {
            transform: scale(0.94);
        }

        /* ===== КАЛЕНДАРЬ ===== */
        #calendar-wrap {
            background: #16162e;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 18px;
            border: 1px solid #2f2f4a;
        }
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .cal-header button {
            background: #2a2a44;
            border: none;
            color: #fff;
            font-size: 22px;
            padding: 0 16px;
            border-radius: 30px;
            cursor: pointer;
            line-height: 36px;
        }
        .cal-header .month-year {
            font-weight: 700;
            font-size: 18px;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .cal-grid .weekday {
            font-weight: 600;
            color: #8888aa;
            font-size: 13px;
            padding: 6px 0;
        }
        .cal-grid .day {
            padding: 8px 0;
            border-radius: 30px;
            background: #1e1e38;
            font-size: 15px;
            transition: 0.15s;
            cursor: default;
        }
        .cal-grid .day.today {
            background: #7c5cfc;
            font-weight: 700;
            box-shadow: 0 0 12px #7c5cfc66;
        }
        .cal-grid .day.other-month {
            opacity: 0.3;
        }

        /* ===== ЖУРНАЛЫ (контент) ===== */
        .journal {
            display: none;
            background: #16162e;
            border-radius: 24px;
            padding: 18px 16px;
            border: 1px solid #2f2f4a;
            min-height: 200px;
            flex-direction: column;
            gap: 12px;
        }
        .journal.active {
            display: flex;
        }
        .journal h2 {
            font-size: 20px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .journal textarea,
        .journal input[type="text"],
        .journal input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #3a3a5a;
            background: #0f0f22;
            color: #fff;
            font-size: 15px;
            resize: vertical;
            outline: none;
        }
        .journal textarea:focus,
        .journal input:focus {
            border-color: #7c5cfc;
        }
        .journal .btn-add {
            background: #7c5cfc;
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            align-self: flex-start;
        }
        .journal .btn-add:active {
            transform: scale(0.96);
        }
        .entry-list {
            list-style: none;
            margin-top: 6px;
        }
        .entry-list li {
            background: #1f1f3a;
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #7c5cfc;
            word-break: break-word;
        }
        .entry-list li .del {
            background: #662244;
            border: none;
            color: #fff;
            border-radius: 30px;
            padding: 2px 14px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ===== ФОТОГАЛЕРЕЯ (в журнале Путешествий) ===== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            margin: 8px 0;
        }
        .photo-grid img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 16px;
            background: #2a2a44;
            border: 2px solid #3a3a5a;
        }
        .photo-upload {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .photo-upload input[type="file"] {
            color: #ccc;
            font-size: 13px;
            flex: 1;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            #app { padding: 14px 10px; }
            #character-card { flex-direction: column; align-items: stretch; }
            .char-info input { width: 100%; }
            #nav button { font-size: 12px; padding: 8px 0; min-width: 50px; }
            .cal-grid .day { padding: 6px 0; font-size: 13px; }
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ===== КАРТОЧКА ПЕРСОНАЖА ===== -->
    <div id="character-card">
        <div class="avatar">🧙</div>
        <div class="char-info">
            <div>
                <input type="text" id="charName" placeholder="Имя" value="Герой" />
                <select id="charGender"><option value="М">М</option><option value="Ж">Ж</option></select>
            </div>
            <div class="stats">
                <span>❤️ <span id="statHp">100</span></span>
                <span>💪 <span id="statStr">10</span></span>
                <span>🧠 <span id="statInt">10</span></span>
                <span>🏃 <span id="statEnd">10</span></span>
                <span class="level-badge">УРОВЕНЬ <span id="levelDisplay">1</span></span>
            </div>
            <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
            <div style="font-size:13px;color:#888;margin-top:4px;">Опыт: <span id="xpText">0</span> / 100</div>
        </div>
    </div>

    <!-- ===== НАВИГАЦИЯ ===== -->
    <div id="nav">
        <button class="nav-btn active" data-journal="train">🏋️ Тренировки</button>
        <button class="nav-btn" data-journal="health">💊 Здоровье</button>
        <button class="nav-btn" data-journal="travel">✈️ Путешествия</button>
        <button class="nav-btn" data-journal="debts">💰 Долги</button>
        <button class="nav-btn" data-journal="finance">📊 Финансы</button>
    </div>

    <!-- ===== КАЛЕНДАРЬ ===== -->
    <div id="calendar-wrap">
        <div class="cal-header">
            <button id="calPrev">◀</button>
            <span class="month-year" id="calTitle">Январь 2026</span>
            <button id="calNext">▶</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- ===== ЖУРНАЛЫ ===== -->
    <!-- Тренировки -->
    <div class="journal active" id="journal-train">
        <h2>🏋️ Тренировки</h2>
        <input type="text" id="trainInput" placeholder="Например: Приседания 3x12" />
        <button class="btn-add" data-journal="train">➕ Добавить</button>
        <ul class="entry-list" id="trainList"></ul>
    </div>

    <!-- Здоровье -->
    <div class="journal" id="journal-health">
        <h2>💊 Здоровье</h2>
        <input type="text" id="healthInput" placeholder="Например: Давление 120/80" />
        <button class="btn-add" data-journal="health">➕ Добавить</button>
        <ul class="entry-list" id="healthList"></ul>
    </div>

    <!-- Путешествия (с фотогалереей) -->
    <div class="journal" id="journal-travel">
        <h2>✈️ Путешествия</h2>
        <input type="text" id="travelInput" placeholder="Новое место или заметка" />
        <button class="btn-add" data-journal="travel">➕ Добавить</button>
        <ul class="entry-list" id="travelList"></ul>
        <div class="photo-grid" id="photoGrid"></div>
        <div class="photo-upload">
            <input type="file" id="photoUpload" accept="image/*" multiple />
            <button class="btn-add" id="addPhotosBtn">📸 Загрузить фото</button>
        </div>
    </div>

    <!-- Долги -->
    <div class="journal" id="journal-debts">
        <h2>💰 Долги</h2>
        <input type="text" id="debtsInput" placeholder="Кто и сколько должен" />
        <button class="btn-add" data-journal="debts">➕ Добавить</button>
        <ul class="entry-list" id="debtsList"></ul>
    </div>

    <!-- Финансы -->
    <div class="journal" id="journal-finance">
        <h2>📊 Финансы</h2>
        <input type="text" id="financeInput" placeholder="Доход / расход: 5000" />
        <button class="btn-add" data-journal="finance">➕ Добавить</button>
        <ul class="entry-list" id="financeList"></ul>
    </div>

</div>
<script>
    // ============================================================
    // 1. ДАННЫЕ И ХРАНИЛИЩЕ (localStorage)
    // ============================================================
    const STORAGE_KEY = 'rpg_journal_data';

    function getDefaultData() {
        return {
            character: { name: 'Герой', gender: 'М', hp: 100, str: 10, int: 10, end: 10, level: 1, xp: 0 },
            journals: {
                train: [],
                health: [],
                travel: [],
                debts: [],
                finance: []
            },
            photos: [] // массив base64
        };
    }

    let data = loadData();

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                // если чего-то не хватает — подмешиваем defaults
                const def = getDefaultData();
                for (let key in def) {
                    if (!(key in parsed)) parsed[key] = def[key];
                }
                // особо для journals
                for (let j in def.journals) {
                    if (!(j in parsed.journals)) parsed.journals[j] = [];
                }
                return parsed;
            }
        } catch (e) { /* игнор */ }
        return getDefaultData();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ============================================================
    // 2. РПГ СИСТЕМА (опыт + уровень)
    // ============================================================
    function addXP(amount) {
        data.character.xp += amount;
        const xpNeeded = 100 + data.character.level * 20;
        while (data.character.xp >= xpNeeded) {
            data.character.xp -= xpNeeded;
            data.character.level += 1;
            // +1 к случайной характеристике за уровень
            const stats = ['hp','str','int','end'];
            const s = stats[Math.floor(Math.random() * stats.length)];
            data.character[s] += 1;
        }
        saveData();
        updateCharacterUI();
    }

    // ============================================================
    // 3. ОТРИСОВКА КАРТОЧКИ ПЕРСОНАЖА
    // ============================================================
    function updateCharacterUI() {
        const c = data.character;
        document.getElementById('charName').value = c.name;
        document.getElementById('charGender').value = c.gender;
        document.getElementById('statHp').textContent = c.hp;
        document.getElementById('statStr').textContent = c.str;
        document.getElementById('statInt').textContent = c.int;
        document.getElementById('statEnd').textContent = c.end;
        document.getElementById('levelDisplay').textContent = c.level;
        const xpNeeded = 100 + c.level * 20;
        const pct = Math.min(100, (c.xp / xpNeeded) * 100);
        document.getElementById('xpFill').style.width = pct + '%';
        document.getElementById('xpText').textContent = c.xp;
    }

    // ============================================================
    // 4. КАЛЕНДАРЬ
    // ============================================================
    let calYear = 2026, calMonth = 0; // январь

    function renderCalendar() {
        const grid = document.getElementById('calGrid');
        const title = document.getElementById('calTitle');
        const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        title.textContent = months[calMonth] + ' ' + calYear;

        const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=воскр
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const daysInPrev = new Date(calYear, calMonth, 0).getDate();

        let html = '';
        // Дни недели
        const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        // корректировка firstDay (понед = 1)
        let startOffset = (firstDay === 0) ? 6 : firstDay - 1;
        for (let w of weekdays) {
            html += `<div class="weekday">${w}</div>`;
        }

        // Пустые ячейки
        for (let i = 0; i < startOffset; i++) {
            const d = daysInPrev - startOffset + i + 1;
            html += `<div class="day other-month">${d}</div>`;
        }

        // Дни месяца
        const today = new Date();
        for (let d = 1; d <= daysInMonth; d++) {
            const isToday = (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
            const cls = 'day' + (isToday ? ' today' : '');
            html += `<div class="${cls}">${d}</div>`;
        }

        grid.innerHTML = html;
    }

    document.getElementById('calPrev').addEventListener('click', ()=>{
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', ()=>{
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
    });

    // ============================================================
    // 5. НАВИГАЦИЯ (переключение журналов)
    // ============================================================
    const navBtns = document.querySelectorAll('.nav-btn');
    const journals = {
        train: document.getElementById('journal-train'),
        health: document.getElementById('journal-health'),
        travel: document.getElementById('journal-travel'),
        debts: document.getElementById('journal-debts'),
        finance: document.getElementById('journal-finance')
    };

    function switchJournal(name) {
        navBtns.forEach(b => b.classList.toggle('active', b.dataset.journal === name));
        Object.keys(journals).forEach(key => {
            journals[key].classList.toggle('active', key === name);
        });
    }

    navBtns.forEach(btn => {
        btn.addEventListener('click', ()=>{
            switchJournal(btn.dataset.journal);
        });
    });

    // ============================================================
    // 6. ОБЩАЯ ФУНКЦИЯ ДЛЯ ДОБАВЛЕНИЯ ЗАПИСЕЙ + XP
    // ============================================================
    function addEntry(journalKey, inputId, listId) {
        const input = document.getElementById(inputId);
        const text = input.value.trim();
        if (!text) return;
        data.journals[journalKey].push({ text, date: new Date().toLocaleDateString() });
        input.value = '';
        saveData();
        renderJournal(journalKey, listId);
        // Даём опыт за добавление задачи
        addXP(5);
    }

    function deleteEntry(journalKey, listId, index) {
        data.journals[journalKey].splice(index, 1);
        saveData();
        renderJournal(journalKey, listId);
    }

    function renderJournal(journalKey, listId) {
        const list = document.getElementById(listId);
        const entries = data.journals[journalKey] || [];
        list.innerHTML = entries.map((item, i) =>
            `<li>
                <span>${item.text} <span style="color:#777;font-size:13px;">${item.date || ''}</span></span>
                <button class="del" data-index="${i}">✕</button>
            </li>`
        ).join('');
        // обработчики удаления
        list.querySelectorAll('.del').forEach(btn => {
            btn.addEventListener('click', (e)=>{
                const idx = parseInt(e.target.dataset.index);
                deleteEntry(journalKey, listId, idx);
            });
        });
    }

    // ============================================================
    // 7. ПОДКЛЮЧАЕМ КНОПКИ ДОБАВЛЕНИЯ
    // ============================================================
    document.querySelectorAll('.btn-add[data-journal]').forEach(btn => {
        btn.addEventListener('click', ()=>{
            const j = btn.dataset.journal;
            const map = {
                train: ['trainInput','trainList'],
                health: ['healthInput','healthList'],
                travel: ['travelInput','travelList'],
                debts: ['debtsInput','debtsList'],
                finance: ['financeInput','financeList']
            };
            const [inpId, listId] = map[j] || [];
            if (inpId) addEntry(j, inpId, listId);
        });
    });

    // ============================================================
    // 8. ФОТОГАЛЕРЕЯ (для путешествий)
    // ============================================================
    function renderPhotos() {
        const grid = document.getElementById('photoGrid');
        grid.innerHTML = data.photos.map((src, i) =>
            `<img src="${src}" alt="фото ${i}" onclick="removePhoto(${i})" style="cursor:pointer;" />`
        ).join('');
    }

    window.removePhoto = function(index) {
        data.photos.splice(index, 1);
        saveData();
        renderPhotos();
    };

    document.getElementById('addPhotosBtn').addEventListener('click', ()=>{
        const fileInput = document.getElementById('photoUpload');
        const files = fileInput.files;
        if (!files.length) return;
        const readers = [];
        for (let f of files) {
            if (!f.type.startsWith('image/')) continue;
            const reader = new FileReader();
            readers.push(new Promise((resolve)=>{
                reader.onload = (e) => {
                    data.photos.push(e.target.result);
                    resolve();
                };
                reader.readAsDataURL(f);
            }));
        }
        Promise.all(readers).then(()=>{
            saveData();
            renderPhotos();
            fileInput.value = '';
            addXP(3); // за загрузку фото
        });
    });

    // ============================================================
    // 9. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    function init() {
        // персонаж
        updateCharacterUI();
        // календарь
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        renderCalendar();
        // журналы (все)
        renderJournal('train', 'trainList');
        renderJournal('health', 'healthList');
        renderJournal('travel', 'travelList');
        renderJournal('debts', 'debtsList');
        renderJournal('finance', 'financeList');
        // фото
        renderPhotos();

        // Сохраняем изменения в персонаже
        document.getElementById('charName').addEventListener('input', (e)=>{
            data.character.name = e.target.value;
            saveData();
        });
        document.getElementById('charGender').addEventListener('change', (e)=>{
            data.character.gender = e.target.value;
            saveData();
        });

        // переключение на первый журнал (тренировки)
        switchJournal('train');
    }

    init();

    console.log('🔥 Журнал-Планировщик RPG загружен! Данные в localStorage.');
</script>
</body>
</html>
