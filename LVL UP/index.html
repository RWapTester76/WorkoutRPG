<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SkillQuest</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="header-left">
            <div class="app-icon">
                <!-- Иконка SVG (оставляем как есть) -->
                <svg width="40" height="40" viewBox="0 0 512 512" style="display:block;">
                    <!-- ... полный SVG из оригинального файла ... -->
                </svg>
            </div>
            <div class="header-text">
                <span class="header-greeting" id="greetingText">Доброе утро 👋</span>
                <h1 class="header-title" id="userName">Герой</h1>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-help" id="helpBtn" aria-label="Помощь">?</button>
            <div class="avatar" id="avatarPreview">
                <span id="avatarInitials">Г</span>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
            </div>
        </div>
    </header>

    <!-- Контент -->
    <main id="mainContent"></main>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-item active" data-page="home"><span class="icon">🏠</span><span class="label">Главная</span></div>
        <div class="nav-item" data-page="calendar"><span class="icon">📅</span><span class="label">Календарь</span></div>
        <div class="nav-item" data-page="journals"><span class="icon">📚</span><span class="label">Журналы</span></div>
        <div class="nav-item" data-page="goals"><span class="icon">🎯</span><span class="label">Цели</span><span class="badge" id="goalsBadge">0</span></div>
        <div class="nav-item" data-page="profile"><span class="icon">👤</span><span class="label">Профиль</span></div>
        <div class="nav-item" data-page="notes"><span class="icon">📝</span><span class="label">Заметки</span></div>
        <div class="nav-item" data-page="gallery"><span class="icon">🖼</span><span class="label">Галерея</span></div>
        <div class="nav-item" data-page="settings"><span class="icon">⚙️</span><span class="label">Настройки</span></div>
    </nav>

    <!-- FAB кнопка -->
    <button class="fab-add" id="fabAdd" aria-label="Новая задача">➕</button>

    <!-- ===== МОДАЛКИ (все из оригинального файла) ===== -->
    <!-- ... все модалки остаются без изменений ... -->

    <!-- Подключаем JavaScript модули -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
